function openEditBusinessInfoModal(companyId) {
  const company = state.companies.find(c => c.id === companyId);
  if (!company) return;
  // Pihak yang bisa dipilih sebagai perusahaan: seluruh perusahaan terdaftar
  // selain perusahaan ini sendiri.
  const ownerOptions = state.companies.filter(c => c.id !== companyId);
  let rows = (Array.isArray(company.ownership) ? company.ownership : []).map(o => ({ ...o }));
  if (rows.length === 0) rows = [{ type: 'external', name: '', percentage: null }];

  const backdrop = el(`<div class="modal-backdrop"><div class="modal" style="max-width:520px;">
    <h3>Info Bisnis Perusahaan</h3>
    <div class="modal-sub">Alamat &amp; kepemilikan saham untuk <strong>${escapeHTML(company.name)}</strong>.</div>
    <div class="field">
      <label>Alamat</label>
      <textarea id="edit-business-address" placeholder="Alamat kantor / operasional perusahaan">${escapeHTML(company.address || '')}</textarea>
    </div>
    <div class="field">
      <label>Tanggal Berdiri</label>
      <input type="date" id="edit-business-founded" value="${escapeHTML(company.foundedDate || '')}">
    </div>
    <div class="field">
      <label>Kepemilikan Saham (pihak &amp; persentase kepemilikan atas perusahaan ini)</label>
      <div id="ownership-rows"></div>
      <button type="button" class="btn ghost" id="add-ownership-row" style="align-self:flex-start;font-size:12.5px;">+ Tambah Pihak</button>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" id="cancel-modal">Batal</button>
      <button class="btn primary" id="save-business-info">Simpan</button>
    </div>
  </div></div>`);
  document.body.appendChild(backdrop);
  enhanceDateInputs(backdrop);

  function paintRows() {
    backdrop.querySelector('#ownership-rows').innerHTML = rows.map((r, i) => ownershipRowFormHTML(r, i, ownerOptions)).join('');
    wireRowEvents();
  }

  function wireRowEvents() {
    const container = backdrop.querySelector('#ownership-rows');
    container.querySelectorAll('.ownership-select').forEach(sel => {
      sel.addEventListener('change', () => {
        const idx = Number(sel.dataset.idx);
        if (sel.value === '__external__') {
          rows[idx] = { type: 'external', name: rows[idx].name || '', percentage: rows[idx].percentage };
        } else {
          rows[idx] = { type: 'company', companyId: sel.value, percentage: rows[idx].percentage };
        }
        paintRows();
      });
    });
    container.querySelectorAll('.ownership-external-name').forEach(inp => {
      inp.addEventListener('input', () => {
        const idx = Number(inp.dataset.idx);
        rows[idx].name = inp.value;
      });
    });
    container.querySelectorAll('.ownership-pct').forEach(inp => {
      inp.addEventListener('input', () => {
        const idx = Number(inp.dataset.idx);
        rows[idx].percentage = inp.value === '' ? null : Number(inp.value);
      });
    });
    container.querySelectorAll('.remove-ownership').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = Number(btn.dataset.idx);
        rows.splice(idx, 1);
        if (rows.length === 0) rows.push({ type: 'external', name: '', percentage: null });
        paintRows();
      });
    });
  }

  paintRows();

  backdrop.querySelector('#add-ownership-row').addEventListener('click', () => {
    rows.push({ type: 'external', name: '', percentage: null });
    paintRows();
  });

  backdrop.querySelector('#cancel-modal').addEventListener('click', () => backdrop.remove());
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) backdrop.remove(); });

  backdrop.querySelector('#save-business-info').addEventListener('click', async () => {
    const address = backdrop.querySelector('#edit-business-address').value.trim();
    const foundedDate = backdrop.querySelector('#edit-business-founded').value || '';
    const cleaned = rows
      .filter(r => (r.type === 'company' && r.companyId) || (r.type === 'external' && r.name && r.name.trim()))
      .map(r => r.type === 'company'
        ? { type: 'company', companyId: r.companyId, percentage: Number(r.percentage) || 0 }
        : { type: 'external', name: r.name.trim(), percentage: Number(r.percentage) || 0 });
    try {
      await DB.updateCompanyBusinessInfo(companyId, { address, ownership: cleaned, foundedDate });
      company.address = address;
      company.ownership = cleaned;
      company.foundedDate = foundedDate;
      backdrop.remove();
      toast('Info bisnis perusahaan diperbarui', 'success');
      if (state.view === 'company-detail' && state.companyDetailId === companyId) renderCompanyDetail();
    } catch (err) {
      toast('Gagal menyimpan info bisnis: ' + err.message, 'error');
    }
  });
}

function humanizeKey(key) {
  const withSpaces = String(key || '').replace(/([a-z0-9])([A-Z])/g, '$1 $2');
  return withSpaces.charAt(0).toUpperCase() + withSpaces.slice(1);
}

// Label khusus untuk baris Neraca hasil turunan/tambahan (bukan field
// mentah hasil impor) — dipakai untuk menimpa label bawaan dari
// humanizeKey() supaya istilahnya sesuai maksud aslinya.
const NERACA_LABELS = {
  asetLancarLainnya: 'Aset Lancar Lainnya',
  penyesuaianSaldoAwalLabaRugi: 'Penyesuaian Saldo Awal Akun Laba Rugi (Belum Ditutup)',
  pendapatanPeriodeIni: 'Pendapatan Periode Ini (Laba Rugi Tahun Berjalan)',
  pendapatanSampaiTahunLalu: 'Pendapatan s.d. Tahun Lalu (Laba Ditahan)',
  totalEkuitasTermasukLaba: 'Total Ekuitas (Termasuk Laba/Rugi)'
};

/**
 * Menghitung akumulasi Laba/Rugi untuk melengkapi bagian Ekuitas pada
 * Neraca. Total Ekuitas yang diimpor pengguna (dari Excel maupun Buku
 * Besar) umumnya hanya berisi modal/setoran pemilik dan BELUM
 * memasukkan laba/rugi tahun berjalan maupun laba ditahan dari
 * tahun-tahun sebelumnya — akibatnya Total Aset sering tidak sama
 * dengan Total Kewajiban + Total Ekuitas. Dua komponen berikut
 * dihitung dari akumulasi Laba Bersih (labaRugi.labaBersih) seluruh
 * periode milik perusahaan yang sama untuk menutup selisih tersebut:
 *  - periodeIni: akumulasi Laba Bersih seluruh periode pada TAHUN YANG
 *    SAMA dengan periode terpilih, dari awal tahun sampai periode
 *    terpilih (laba/rugi tahun berjalan, year-to-date).
 *  - sampaiTahunLalu: akumulasi Laba Bersih seluruh periode pada
 *    tahun-tahun SEBELUM tahun periode terpilih (laba ditahan sejak
 *    awal berdiri s.d. akhir tahun lalu).
 * Diasumsikan tiap periode yang diimpor mewakili aktivitas periode itu
 * sendiri (bukan angka kumulatif year-to-date), sesuai cara Laba Bersih
 * diturunkan dari mutasi akun Buku Besar (lihat deriveStatementsFromLedgerAccounts).
 *
 * PENGECUALIAN — software akuntansi yang TIDAK menutup akun Laba Rugi
 * tiap tutup buku (lihat penyesuaianSaldoAwalLabaRugi pada
 * deriveStatementsFromLedgerAccounts): pada kasus itu, Saldo Awal akun
 * Pendapatan/Beban periode terpilih SUDAH berisi akumulasi Laba Bersih
 * seluruh tahun sebelumnya (dibawa otomatis oleh Buku Besar itu
 * sendiri), sehingga penyesuaianSaldoAwalLabaRugi periode ini SUDAH
 * setara dengan sampaiTahunLalu. Kalau keduanya dijumlahkan, hasilnya
 * dobel hitung — karena itu sampaiTahunLalu sengaja dianggap 0 saat
 * periode terpilih punya penyesuaianSaldoAwalLabaRugi sendiri.
 */
function computeRetainedEarnings(statements, selected, penyesuaianSaldoAwalLabaRugi) {
  const list = Array.isArray(statements) ? statements : [];
  const periodeIni = list
    .filter(s => s.year === selected.year && s.periodIndex <= selected.periodIndex)
    .reduce((sum, s) => sum + ((s.labaRugi && s.labaRugi.labaBersih) || 0), 0);
  if (penyesuaianSaldoAwalLabaRugi) {
    // Sudah tercakup lewat penyesuaianSaldoAwalLabaRugi periode ini sendiri
    // (lihat catatan di atas) — hindari dobel hitung.
    return { periodeIni, sampaiTahunLalu: 0 };
  }
  const sampaiTahunLalu = list
    .filter(s => s.year < selected.year)
    .reduce((sum, s) => sum + ((s.labaRugi && s.labaRugi.labaBersih) || 0), 0);
  return { periodeIni, sampaiTahunLalu };
}

// Melengkapi objek Neraca dengan baris Pendapatan Periode Ini, Pendapatan
// s.d. Tahun Lalu, dan Total Ekuitas (Termasuk Laba/Rugi) — hanya dihitung
// di sisi tampilan (tidak mengubah data tersimpan) supaya Total Aset bisa
// dicocokkan dengan Total Kewajiban + Total Ekuitas.
function withRetainedEarnings(neraca, statements, selected) {
  if (!neraca || !('totalEkuitas' in neraca)) return neraca;
  // penyesuaianSaldoAwalLabaRugi (bila ada) sudah dihitung per-periode saat
  // impor Buku Besar (lihat deriveStatementsFromLedgerAccounts) — diteruskan
  // ke computeRetainedEarnings supaya sampaiTahunLalu tidak dobel hitung
  // akumulasi yang sama (lihat catatan di atas computeRetainedEarnings).
  const penyesuaian = neraca.penyesuaianSaldoAwalLabaRugi || 0;
  const { periodeIni, sampaiTahunLalu } = computeRetainedEarnings(statements, selected, penyesuaian);
  // Baris "Penyesuaian Saldo Awal Akun Laba Rugi (Belum Ditutup)" tidak lagi
  // ditampilkan terpisah pada Neraca — nilainya digabungkan ke "Pendapatan
  // s.d. Tahun Lalu (Laba Ditahan)" (sampaiTahunLalu selalu 0 saat penyesuaian
  // ini ada, lihat computeRetainedEarnings, jadi penggabungan ini tidak
  // dobel hitung). Total Ekuitas Termasuk Laba tidak berubah nilainya.
  return {
    ...neraca,
    pendapatanPeriodeIni: periodeIni,
    pendapatanSampaiTahunLalu: sampaiTahunLalu + penyesuaian,
    totalEkuitasTermasukLaba: (neraca.totalEkuitas || 0) + periodeIni + sampaiTahunLalu + penyesuaian
  };
}

function neracaGroupedTable(neraca) {
  if (!neraca || Object.keys(neraca).length === 0) return `<div style="color:var(--slate-light);font-size:13px;padding:6px 2px;">Belum ada data.</div>`;
  const label = (key) => NERACA_LABELS[key] || humanizeKey(key);
  const row = (key) => key in neraca ? `<tr><td>${label(key)}</td><td class="num">${formatIDR(neraca[key])}</td></tr>` : '';
  const rowBold = (key) => key in neraca ? `<tr style="font-weight:600;"><td>${label(key)}</td><td class="num">${formatIDR(neraca[key])}</td></tr>` : '';
  const rowHighlight = (key) => key in neraca ? `<tr style="font-weight:700;background:var(--teal-light);"><td>${label(key)}</td><td class="num">${formatIDR(neraca[key])}</td></tr>` : '';
  const groupRow = (text) => `<tr><td colspan="2" style="font-weight:600;color:var(--slate);padding-top:10px;">${text}</td></tr>`;
  return `<table><tbody>
    ${groupRow('Aset Lancar')}
    ${row('kasSetaraKas')}${row('persediaan')}${row('asetLancarLainnya')}${rowBold('totalAsetLancar')}
    ${groupRow('Aset Tidak Lancar')}
    ${rowBold('totalAsetTidakLancar')}
    ${rowHighlight('totalAset')}
    ${groupRow('Liabilitas')}
    ${row('totalKewajibanLancar')}${row('totalKewajibanJangkaPanjang')}${rowBold('totalKewajiban')}
    ${groupRow('Ekuitas')}
    ${rowBold('totalEkuitas')}${row('pendapatanSampaiTahunLalu')}${row('pendapatanPeriodeIni')}${rowHighlight('totalEkuitasTermasukLaba')}
  </tbody></table>${neracaBalanceSummary(neraca)}`;
}

// Ringkasan Total Aktiva (= Total Aset) vs Total Pasiva (= Total Kewajiban
// + Total Ekuitas, memakai totalEkuitasTermasukLaba bila tersedia supaya
// ikut memperhitungkan Pendapatan Periode Ini & Pendapatan s.d. Tahun
// Lalu) — dipakai untuk langsung memperlihatkan apakah Neraca balance
// atau tidak, tanpa pengguna perlu menjumlahkan manual.
function neracaBalanceSummary(neraca) {
  if (!neraca || !('totalAset' in neraca)) return '';
  const totalAktiva = neraca.totalAset || 0;
  const totalEkuitasForBalance = 'totalEkuitasTermasukLaba' in neraca ? neraca.totalEkuitasTermasukLaba : (neraca.totalEkuitas || 0);
  const totalPasiva = (neraca.totalKewajiban || 0) + totalEkuitasForBalance;
  const selisih = totalAktiva - totalPasiva;
  const balanced = Math.round(Math.abs(selisih)) < 1;
  return `
    <div style="margin-top:14px;padding:10px 12px;border-radius:8px;background:${balanced ? 'var(--teal-light)' : '#FDECEC'};border:1px solid ${balanced ? 'var(--teal)' : '#D9534F'};">
      <div style="display:flex;justify-content:space-between;font-size:13px;padding:2px 0;">
        <span>Total Aktiva</span><span class="num" style="font-family:var(--font-mono);">${formatIDR(totalAktiva)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:13px;padding:2px 0;">
        <span>Total Pasiva</span><span class="num" style="font-family:var(--font-mono);">${formatIDR(totalPasiva)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;padding-top:6px;margin-top:6px;border-top:1px dashed ${balanced ? 'var(--teal)' : '#D9534F'};color:${balanced ? 'var(--teal)' : '#D9534F'};">
        <span>${balanced ? '✓ Balance' : '✗ Belum Balance'}</span>
        ${balanced ? '' : `<span class="num" style="font-family:var(--font-mono);">Selisih ${formatIDR(selisih)}</span>`}
      </div>
    </div>`;
}

function keyValueTable(obj, order, labels) {
  const entries = sortEntriesByOrder(Object.entries(obj || {}).filter(([, v]) => v !== undefined && v !== null), order);
  if (entries.length === 0) return `<div style="color:var(--slate-light);font-size:13px;padding:6px 2px;">Belum ada data.</div>`;
  return `<table><tbody>${entries.map(([k, v]) => `<tr><td>${(labels && labels[k]) || humanizeKey(k)}</td><td class="num">${formatIDR(v)}</td></tr>`).join('')}</tbody></table>`;
}

// ---------- Tampilan Arus Kas Metode Langsung (turunan Buku Besar) ----------
// Dipakai baik di pratinjau impor maupun Detail Perusahaan. Rinciannya
// berupa AKUN kontributor (tiap akun Buku Besar yang mutasinya menyusun
// pos ini — lihat deriveArusKasLangsungFromLedger), bukan transaksi kas
// individual — ditampilkan langsung inline di dalam <details>, bukan
// lewat modal.
function arusKasLangsungItemsHtml(items, syncFlags, activity, bucketIdx) {
  if (!items || !items.length) return `<div style="color:var(--slate-light);font-size:12px;padding:4px 8px;">Tidak ada akun kontributor.</div>`;
  return items.map((it, i) => {
    const syncKeyStr = (syncFlags && activity != null && bucketIdx != null) ? `arusKas__${activity}__${bucketIdx}__${i}` : null;
    return `
    <div style="display:flex;justify-content:space-between;gap:10px;padding:4px 8px;font-size:12px;color:var(--slate);align-items:center;">
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${it.tanggal ? escapeHTML(it.tanggal) + ' &middot; ' : ''}${escapeHTML(it.keterangan) || '(tanpa keterangan)'} ${it.akun ? '<span style="color:var(--slate-light);">(' + escapeHTML(it.akun) + ')</span>' : ''}</span>
      <span style="display:flex;align-items:center;flex-shrink:0;">
        <span class="num" style="font-family:var(--font-mono);">${it.debit ? formatIDR(it.debit) : '(' + formatIDR(it.kredit) + ')'}</span>
        ${syncKeyStr ? syncCheckboxHtml(syncKeyStr, syncFlags) : ''}
      </span>
    </div>`;
  }).join('');
}

function arusKasLangsungLineRow(bucket, syncFlags, activity, bucketIdx) {
  const net = bucket.masuk - bucket.keluar;
  return `
    <details style="border-bottom:1px solid var(--border);" data-details-key="arusKas__${activity}__${bucketIdx}">
      <summary style="display:flex;justify-content:space-between;align-items:center;padding:7px 2px;cursor:pointer;font-size:13px;">
        <span>${escapeHTML(bucket.label)}<span style="font-weight:400;color:var(--slate-light);margin-left:6px;">(${bucket.items.length} akun)</span></span>
        <span class="num" style="font-family:var(--font-mono);">${net < 0 ? '(' + formatIDR(Math.abs(net)) + ')' : formatIDR(net)}</span>
      </summary>
      <div style="padding:2px 2px 10px 12px;">${arusKasLangsungItemsHtml(bucket.items, syncFlags, activity, bucketIdx)}</div>
    </details>`;
}

function arusKasLangsungActivityBlock(label, buckets, total, syncFlags, activity) {
  if (!buckets || !buckets.length) return '';
  return `
    <div style="font-weight:600;color:var(--slate);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:12px 2px 4px 2px;">${label}</div>
    ${buckets.map((b, i) => arusKasLangsungLineRow(b, syncFlags, activity, i)).join('')}
    <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;padding:7px 8px;border-radius:6px;background:var(--teal-light);margin-top:4px;">
      <span>Kas Bersih dari ${label}</span>
      <span class="num" style="font-family:var(--font-mono);">${total < 0 ? '(' + formatIDR(Math.abs(total)) + ')' : formatIDR(total)}</span>
    </div>`;
}

// Laporan Arus Kas Metode Langsung — diturunkan otomatis dari transaksi
// akun Kas & Setara Kas pada Buku Besar (deriveArusKasLangsungFromLedger).
// Mendeteksi bentuk lama (hasil impor manual, field datar seperti
// kasAwal/arusKasOperasi/kasAkhir) lewat absennya `rincian` dan tetap
// menampilkannya lewat keyValueTable supaya data lama tidak rusak.
function arusKasTable(arusKas, syncFlags) {
  if (!arusKas || !arusKas.rincian) return keyValueTable(arusKas);
  const kasAwalRow = `
    <div style="display:flex;justify-content:space-between;font-size:13px;padding:5px 2px;">
      <span>Kas &amp; Setara Kas Awal Periode</span><span class="num" style="font-family:var(--font-mono);">${formatIDR(arusKas.kasAwal)}</span>
    </div>`;
  const kenaikanRow = `
    <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;padding:8px 2px;margin-top:6px;border-top:1px solid var(--border);">
      <span>Kenaikan (Penurunan) Kas Bersih</span>
      <span class="num" style="font-family:var(--font-mono);">${arusKas.kenaikanKasBersih < 0 ? '(' + formatIDR(Math.abs(arusKas.kenaikanKasBersih)) + ')' : formatIDR(arusKas.kenaikanKasBersih)}</span>
    </div>`;
  const kasAkhirRow = `
    <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;padding:7px 8px;border-radius:6px;background:var(--teal-light);margin-top:6px;">
      <span>Kas &amp; Setara Kas Akhir Periode</span><span class="num" style="font-family:var(--font-mono);">${formatIDR(arusKas.kasAkhir)}</span>
    </div>`;
  return `
    ${arusKasLangsungActivityBlock(ARUS_KAS_ACTIVITY_LABELS.operasi, arusKas.rincian.operasi, arusKas.totalOperasi, syncFlags, 'operasi')}
    ${arusKasLangsungActivityBlock(ARUS_KAS_ACTIVITY_LABELS.investasi, arusKas.rincian.investasi, arusKas.totalInvestasi, syncFlags, 'investasi')}
    ${arusKasLangsungActivityBlock(ARUS_KAS_ACTIVITY_LABELS.pendanaan, arusKas.rincian.pendanaan, arusKas.totalPendanaan, syncFlags, 'pendanaan')}
    <div style="margin-top:10px;">${kasAwalRow}${kenaikanRow}${kasAkhirRow}</div>`;
}

// Tampilan Laporan Perubahan Modal — diturunkan otomatis dari mutasi akun
// Ekuitas & klasifikasi Setoran/Penarikan Modal pada Arus Kas (lihat
// derivePerubahanModalFromLedger). Dipakai baik di pratinjau impor maupun
// Detail Perusahaan. Saat dilengkapi withPerubahanModal (tersedia riwayat
// periode), baris Laba Ditahan Awal Periode & Saldo Ekuitas termasuk laba
// ditahan ikut ditampilkan, sejalan dengan Total Ekuitas (Termasuk
// Laba/Rugi) pada Neraca.
function perubahanModalTable(modal, syncFlags) {
  if (!modal) return `<div style="color:var(--slate-light);font-size:13px;padding:6px 2px;">Belum ada data.</div>`;
  // Perubahan Modal tidak punya rincian per akun buku besar seperti Neraca/
  // Laba Rugi (baris-barisnya sudah merupakan hasil rekonsiliasi, bukan
  // agregasi langsung dari satu kelompok akun) — jadi checkbox "Sinkron"
  // dipasang langsung di tiap baris ringkasan itu sendiri (key = nama
  // field), bukan pada sub-akun di dalamnya.
  const line = (label, value, key) => `
    <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:5px 2px;">
      <span>${label}</span>
      <span style="display:flex;align-items:center;">
        <span class="num" style="font-family:var(--font-mono);">${value < 0 ? '(' + formatIDR(Math.abs(value)) + ')' : formatIDR(value)}</span>
        ${syncFlags && key ? syncCheckboxHtml(`modal__${key}`, syncFlags) : ''}
      </span>
    </div>`;
  const highlight = (label, value, key) => `
    <div style="display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;padding:7px 8px;border-radius:6px;background:var(--teal-light);margin:6px 0;">
      <span>${label}</span>
      <span style="display:flex;align-items:center;">
        <span class="num" style="font-family:var(--font-mono);">${value < 0 ? '(' + formatIDR(Math.abs(value)) + ')' : formatIDR(value)}</span>
        ${syncFlags && key ? syncCheckboxHtml(`modal__${key}`, syncFlags) : ''}
      </span>
    </div>`;
  const groupLabel = (text) => `<div style="font-weight:600;color:var(--slate);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:10px 2px 4px 2px;">${text}</div>`;
  const hasHistori = 'saldoAwalEkuitas' in modal;

  return `
    ${hasHistori
      ? line('Modal Disetor Awal Periode', modal.modalDisetorAwal, 'modalDisetorAwal') + line('Laba Ditahan Awal Periode', modal.labaDitahanAwal, 'labaDitahanAwal') + highlight('Saldo Awal Ekuitas', modal.saldoAwalEkuitas, 'saldoAwalEkuitas')
      : line('Modal Disetor Awal Periode', modal.modalDisetorAwal, 'modalDisetorAwal')}
    ${groupLabel('Penambahan')}
    ${line('Setoran Modal Pemilik', modal.setoranModal, 'setoranModal')}
    ${line('Laba Bersih Periode Berjalan', modal.labaBersihPeriode, 'labaBersihPeriode')}
    ${groupLabel('Pengurangan')}
    ${line('Penarikan Modal Pemilik/Dividen', -modal.penarikanModal, 'penarikanModal')}
    ${highlight('Modal Disetor Akhir Periode', modal.modalDisetorAkhir, 'modalDisetorAkhir')}
    ${!hasHistori && modal.penyesuaianSaldoAwalLabaRugi ? line('Penyesuaian Saldo Awal Akun Laba Rugi (Belum Ditutup)', modal.penyesuaianSaldoAwalLabaRugi, 'penyesuaianSaldoAwalLabaRugi') : ''}
    ${hasHistori
      ? highlight('Saldo Akhir Ekuitas (Termasuk Laba Ditahan)', modal.totalEkuitasAkhirTermasukLabaDitahan, 'totalEkuitasAkhirTermasukLabaDitahan')
      : highlight('Total Ekuitas Akhir Periode (Termasuk Laba Periode Ini)', modal.totalEkuitasAkhir, 'totalEkuitasAkhir')}
    ${modal.warnings && modal.warnings.length ? `<div class="ratio-note" style="margin-top:8px;">${modal.warnings.join('<br>')}</div>` : ''}`;
}

// Baris satu akun di dalam kelompok klasifikasi Buku Besar — kode akun
// (kalau ada) + nama di kiri, saldo akhir di kanan, seluruh baris bisa
// diklik (delegated listener .bb-ledger-row) untuk membuka rincian
// transaksi akun tersebut.
function ledgerAccountRow(a) {
  const codeTag = a.code
    ? `<span style="font-family:var(--font-mono);font-size:11px;color:var(--slate-light);margin-right:7px;">${a.code}</span>`
    : '';
  return `
    <div class="bb-ledger-row" data-idx="${a._idx}" title="Klik untuk melihat rincian transaksi"
         style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px;">
      <span style="color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${codeTag}${a.name || '(tanpa nama)'}</span>
      <span class="num" style="font-family:var(--font-mono);flex-shrink:0;">${formatIDR(a.saldoAkhir)}</span>
    </div>`;
}

// Tampilan Buku Besar dikelompokkan per klasifikasi akun (Kas & Setara
// Kas, Persediaan, Aset Tidak Lancar, dst — lihat LEDGER_GROUP_ORDER),
// masing-masing menampilkan total kelompok di judul lalu daftar akun
// penyusunnya di bawahnya — supaya pengguna langsung melihat akun apa
// saja yang membentuk sebuah kategori (mis. "Kas & Setara Kas" terdiri
// dari akun Kas, Bank Jatim, Bank Mandiri Sidoarjo), dan tiap akun tetap
// bisa diklik untuk melihat rincian transaksinya (sama seperti sebelumnya).
function ledgerTable(accounts) {
  if (!Array.isArray(accounts) || accounts.length === 0) return `<div style="color:var(--slate-light);font-size:13px;padding:6px 2px;">Belum ada data.</div>`;
  activeLedgerAccounts = accounts;
  const groups = groupLedgerAccountsByClassification(accounts);
  return `
    <div style="max-height:420px;overflow-y:auto;">
      ${groups.map(g => {
        const total = g.accounts.reduce((sum, a) => sum + (a.saldoAkhir || 0), 0);
        return `
        <details class="ledger-group" style="border-bottom:1px solid var(--border);">
          <summary style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 2px;cursor:pointer;font-weight:600;font-size:13.5px;">
            <span>${g.label}<span style="font-weight:400;color:var(--slate-light);margin-left:6px;">(${g.accounts.length} akun)</span></span>
            <span class="num" style="font-family:var(--font-mono);">${formatIDR(total)}</span>
          </summary>
          <div style="padding:0 2px 8px 20px;">
            ${g.accounts.map(ledgerAccountRow).join('')}
          </div>
        </details>`;
      }).join('')}
    </div>`;
}

// ---------- Rincian Akun (pratinjau impor Buku Besar) ----------
// Baris Neraca/Laba Rugi yang diturunkan otomatis dari Buku Besar bisa
// diklik untuk melihat akun-akun mana yang menyusun angka tersebut
// (untuk mengecek kesesuaian transaksi), atau formula perhitungannya
// untuk baris yang merupakan hasil turunan dari baris lain (bukan
// dijumlah langsung dari akun).
const NERACA_FORMULAS = {
  totalAsetLancar: (n) => `Kas &amp; Setara Kas (${formatIDR(n.kasSetaraKas)}) + Persediaan (${formatIDR(n.persediaan)}) + Aset Lancar Lainnya (${formatIDR(n.asetLancarLainnya)})`,
  totalAset: (n) => `Total Aset Lancar (${formatIDR(n.totalAsetLancar)}) + Total Aset Tidak Lancar (${formatIDR(n.totalAsetTidakLancar)})`,
  totalKewajiban: (n) => `Total Kewajiban Lancar (${formatIDR(n.totalKewajibanLancar)}) + Total Kewajiban Jangka Panjang (${formatIDR(n.totalKewajibanJangkaPanjang)})`,
  penyesuaianSaldoAwalLabaRugi: () => `Akun Pendapatan/Beban pada Buku Besar yang diimpor ternyata masih membawa Saldo Awal (semestinya sudah ditutup/dinolkan ke Laba Ditahan oleh software akuntansi asal setiap tutup buku). Karena nilai ini tidak masuk ke Aset/Kewajiban/Ekuitas manapun dan sengaja tidak dihitung sebagai Laba Rugi tahun berjalan, Integrida menutupnya otomatis ke Ekuitas di sini (klik baris ini untuk melihat akun sumbernya) supaya Total Aset = Total Kewajiban + Total Ekuitas persis sesuai Buku Besar yang diimpor.`,
  pendapatanPeriodeIni: () => `Akumulasi Laba Bersih seluruh periode pada tahun yang sama, dari awal tahun sampai periode ini (laba/rugi tahun berjalan).`,
  pendapatanSampaiTahunLalu: () => `Akumulasi Laba Bersih seluruh periode pada tahun-tahun sebelum tahun periode ini, sejak awal berdiri (laba ditahan s.d. akhir tahun lalu).`,
  totalEkuitasTermasukLaba: (n) => `Total Ekuitas (${formatIDR(n.totalEkuitas)}) + Penyesuaian Saldo Awal Akun Laba Rugi (${formatIDR(n.penyesuaianSaldoAwalLabaRugi || 0)}) + Pendapatan Periode Ini (${formatIDR(n.pendapatanPeriodeIni)}) + Pendapatan s.d. Tahun Lalu (${formatIDR(n.pendapatanSampaiTahunLalu)})`
};
const LABA_RUGI_FORMULAS = {
  labaKotor: (l) => `Pendapatan (${formatIDR(l.pendapatan)}) − HPP (${formatIDR(l.hpp)})`,
  labaOperasional: (l) => `Laba Kotor (${formatIDR(l.labaKotor)}) − Beban Operasional (${formatIDR(l.bebanOperasional)})`,
  labaBersih: (l) => `Laba Operasional (${formatIDR(l.labaOperasional)}) + Pendapatan Lainnya (${formatIDR(l.pendapatanLainnya)}) − Beban Lainnya (${formatIDR(l.bebanLainnya)}) − Beban Pajak (${formatIDR(l.pajakPenghasilan)})`
};

// Data klasifikasi/akun yang sedang tampil di layar (pratinjau impor ATAU
// Detail Perusahaan) — dipakai oleh delegated click handler di bawah untuk
// tahu transaksi mana yang harus ditampilkan saat sebuah baris akun diklik.
let activeContributions = null;
let activeLedgerAccounts = [];
// Cache rincian Buku Besar per periode (statementId -> accounts[] | 'loading'),
// dipakai oleh paintCompanyDetail untuk lazy-load (lihat DB.getLedgerAccounts).
let ledgerCache = {};

function openLedgerAccountModal(acc) {
  const backdrop = el(`<div class="modal-backdrop">
    <div class="modal" style="width:560px;">
      <h3>${acc.code ? acc.code + ' &mdash; ' : ''}${acc.name || '(tanpa nama)'}</h3>
      <div class="modal-sub">Saldo Awal: <strong>${formatIDR(acc.saldoAwal)}</strong> &middot; Saldo Akhir: <strong>${formatIDR(acc.saldoAkhir)}</strong></div>
      <div class="table-wrap" style="max-height:360px;overflow-y:auto;">
        <table>
          <thead><tr><th>Tanggal</th><th>Keterangan</th><th class="num">Debit</th><th class="num">Kredit</th></tr></thead>
          <tbody>
            ${(acc.transaksi && acc.transaksi.length)
              ? acc.transaksi.map(t => `<tr>
                  <td>${t.tanggal || '–'}</td>
                  <td>${t.keterangan || '–'}</td>
                  <td class="num">${t.debit ? formatIDR(t.debit) : '–'}</td>
                  <td class="num">${t.kredit ? formatIDR(t.kredit) : '–'}</td>
                </tr>`).join('')
              : `<tr><td colspan="4" style="text-align:center;color:var(--slate);">Tidak ada rincian transaksi untuk akun ini pada periode ini.</td></tr>`}
          </tbody>
        </table>
      </div>
      <div class="modal-actions"><button class="btn ghost" id="close-modal">Tutup</button></div>
    </div>
  </div>`);
  document.body.appendChild(backdrop);
  backdrop.querySelector('#close-modal').addEventListener('click', () => backdrop.remove());
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) backdrop.remove(); });
}

// Delegated listener tunggal (dipasang sekali) supaya baris akun yang
// dirender lewat innerHTML di berbagai halaman (pratinjau impor, Detail
// Perusahaan) tetap bisa diklik tanpa perlu bind ulang tiap render.
document.addEventListener('click', (e) => {
  const contribRow = e.target.closest('.bb-akun-row');
  if (contribRow) {
    const field = contribRow.dataset.field;
    const idx = Number(contribRow.dataset.idx);
    const acc = activeContributions && activeContributions[field] && activeContributions[field][idx];
    if (acc) openLedgerAccountModal(acc);
    return;
  }
  const ledgerRow = e.target.closest('.bb-ledger-row');
  if (ledgerRow) {
    const acc = activeLedgerAccounts[Number(ledgerRow.dataset.idx)];
    if (acc) openLedgerAccountModal(acc);
  }
});

// Checkbox "Sinkron" yang ditampilkan di sebelah kanan angka pada satu
// baris rincian (sub-akun, transaksi Arus Kas, atau baris Perubahan
// Modal). Hanya dirender saat `syncFlags` disediakan (obyek, boleh
// kosong {}) — ini dipakai untuk membedakan tampilan Detail Perusahaan
// (data sudah tersimpan, statementId nyata, boleh dicentang) dari
// Pratinjau Impor (data belum tersimpan, tidak ada tempat menyimpan
// centang), yang cukup memanggil fungsi ini tanpa argumen `syncFlags`.
// onclick="event.stopPropagation()" mencegah klik pada checkbox ikut
// men-trigger baris pembungkusnya (mis. .bb-akun-row) yang membuka modal
// rincian transaksi.
function syncCheckboxHtml(key, syncFlags) {
  if (!syncFlags) return '';
  const checked = !!syncFlags[key];
  return `<label class="sync-checkbox-label${checked ? ' is-synced' : ''}" title="Tandai baris ini sudah dicocokkan dengan data sistem" onclick="event.stopPropagation();">
    <input type="checkbox" data-sync-key="${key}" ${checked ? 'checked' : ''}>
    <span>${checked ? 'Sinkron' : 'Tandai sinkron'}</span>
  </label>`;
}

// Menghitung jumlah checkbox "Sinkron" (total & yang sudah dicentang) dari
// sepotong HTML hasil syncCheckboxHtml() di atas. Dipakai untuk menghitung
// persentase progres sinkronisasi satu periode secara keseluruhan (Neraca +
// Laba Rugi + Arus Kas + Perubahan Modal) tanpa perlu menduplikasi logika
// penentuan baris mana saja yang punya checkbox — cukup render ulang HTML
// keempat laporan lalu hitung kemunculan pola checkbox-nya di sini.
function countSyncCheckboxes(html) {
  const re = /<input type="checkbox" data-sync-key="[^"]*"\s*(checked)?>/g;
  let total = 0;
  let checked = 0;
  let m;
  while ((m = re.exec(html)) !== null) {
    total++;
    if (m[1]) checked++;
  }
  return { total, checked };
}

// Menghitung progres sinkronisasi satu periode (statement) untuk ditampilkan
// sebagai persentase pada kolom "Persentase Sinkron" di tabel Riwayat Impor.
// Progres dihitung dari checkbox "Sinkron" yang sama persis dengan yang
// ditampilkan pada kartu Neraca/Laba Rugi/Arus Kas/Perubahan Modal di atas
// tabel (lihat syncCheckboxHtml) — bukan hitungan terpisah — supaya kolom
// ini selalu konsisten dengan apa yang sudah dicentang pengguna di sana.
//
// Neraca & Laba Rugi butuh rincian akun Buku Besar (bbContribs) yang dimuat
// lazy per periode (lihat ledgerCache); kalau untuk periode ini belum
// dimuat, fungsi ini men-trigger pemuatannya (sama seperti untuk periode
// yang sedang aktif dipilih) dan mengembalikan null untuk sementara —
// onLoaded() akan dipanggil ulang otomatis begitu selesai dimuat (default:
// paintCompanyDetail(), dipakai oleh tabel Riwayat Impor; kartu grid
// Perusahaan/Utama mengoper refreshCompanyGridProgress() lewat
// companySyncProgress() di bawah, supaya keduanya tetap konsisten).
// activeContributions (variabel global dipakai oleh klik baris akun) sengaja
// disimpan & dikembalikan lagi supaya penghitungan ini tidak mengubah
// perilaku klik-untuk-detail pada laporan periode yang sedang tampil.
function statementSyncProgress(statement, allStatements, companyId, onLoaded) {
  const notify = onLoaded || (() => {
    if (state.view === 'company-detail' && state.companyDetailId === companyId) paintCompanyDetail(allStatements);
  });
  const savedActiveContributions = activeContributions;
  try {
    let neracaBaseS = statement.neraca;
    let labaRugiBaseS = statement.labaRugi;
    let bbContribsS = null;
    let arusKasBaseS = statement.arusKas;
    let perubahanModalBaseS = statement.perubahanModal;
    if (statement.bukuBesarCount > 0) {
      if (Array.isArray(ledgerCache[statement.id])) {
        const ledgerAccountsS = ledgerCache[statement.id];
        const derived = deriveStatementsFromLedgerAccounts(ledgerAccountsS);
        bbContribsS = derived.contributions;
        neracaBaseS = derived.neraca;
        labaRugiBaseS = derived.labaRugi;
        arusKasBaseS = deriveArusKasLangsungFromLedger(ledgerAccountsS);
        perubahanModalBaseS = derivePerubahanModalFromLedger(ledgerAccountsS, arusKasBaseS, derived.labaRugi.labaBersih, derived.neraca.penyesuaianSaldoAwalLabaRugi);
      } else {
        if (ledgerCache[statement.id] !== 'loading') {
          ledgerCache[statement.id] = 'loading';
          DB.getLedgerAccounts(companyId, statement.id)
            .then((accounts) => {
              ledgerCache[statement.id] = accounts;
              notify();
            })
            .catch((err) => {
              delete ledgerCache[statement.id];
              console.error('Gagal memuat rincian Buku Besar untuk progres sinkronisasi:', err);
            });
        }
        return null;
      }
    }
    const syncFlags = statement.syncFlags || {};
    const neracaDisplayS = withRetainedEarnings(neracaBaseS, allStatements, statement);
    const modalDisplayS = withPerubahanModal(perubahanModalBaseS, neracaDisplayS);
    let html = '';
    if (bbContribsS) {
      html += derivedNeracaGrouped(neracaDisplayS, bbContribsS, syncFlags);
      html += derivedSectionDetails(labaRugiBaseS, bbContribsS, LABA_RUGI_FORMULAS, LABA_RUGI_LABELS, LABA_RUGI_HIGHLIGHT_KEYS, LABA_RUGI_ORDER, syncFlags, 'labaRugi');
    }
    html += arusKasTable(arusKasBaseS, syncFlags);
    html += perubahanModalTable(modalDisplayS, syncFlags);
    return countSyncCheckboxes(html);
  } finally {
    activeContributions = savedActiveContributions;
  }
}

// Menghitung progres Persentase Sinkron TOTAL satu perusahaan: menjumlahkan
// checkbox "Sinkron" (checked & total) dari SELURUH periode yang pernah
// diimpor perusahaan ini, memakai statementSyncProgress() per periode —
// persis rumus yang sama dengan kolom "Persentase Sinkron" di tabel
// Riwayat Impor, hanya digabung lintas periode. Dipakai oleh kartu grid
// Perusahaan (halaman Utama/Perusahaan) supaya kedua angka selalu konsisten.
// Mengembalikan null kalau perusahaan belum punya periode sama sekali,
// atau string 'loading' kalau rincian Buku Besar sebagian periode masih
// dimuat dari server (refreshCompanyGridProgress() dipanggil ulang
// otomatis oleh statementSyncProgress() begitu pemuatan selesai).
function companySyncProgress(companyId, allStatements) {
  const own = (allStatements || []).filter(s => s.companyId === companyId);
  if (!own.length) return null;

  const notify = () => {
    if (state.view === 'companies' && state.companiesView !== 'chart') refreshCompanyGridProgress();
  };

  let total = 0, checked = 0, stillLoading = false;
  own.forEach(s => {
    const p = statementSyncProgress(s, allStatements, companyId, notify);
    if (p === null) { stillLoading = true; return; }
    total += p.total;
    checked += p.checked;
  });
  if (stillLoading) return 'loading';
  const years = own.map(s => s.year).filter(y => y != null);
  const yearFrom = Math.min(...years);
  const yearTo = Math.max(...years);
  return { checked, total, yearFrom, yearTo };
}

// Merender isi sel kolom "Persentase Sinkron" pada tabel Riwayat Impor
// berdasarkan hasil statementSyncProgress(): progress bar kecil + teks
// persentase (dan pecahan jumlah baris), berwarna teal saat 100%, kuning
// keemasan saat sebagian, abu-abu saat belum ada satupun/tidak ada yang
// bisa disinkronkan, dan "Memuat…" saat rincian Buku Besar-nya masih
// dimuat dari server.
function syncProgressCellHtml(progress) {
  if (progress === null) {
    return `<span style="color:var(--slate-light);font-size:12px;">Memuat…</span>`;
  }
  const { total, checked } = progress;
  if (total === 0) {
    return `<span style="color:var(--slate-light);font-size:12px;">– Tidak ada</span>`;
  }
  const pct = Math.round((checked / total) * 100);
  const color = pct >= 100 ? 'var(--teal)' : (pct > 0 ? '#c9970c' : 'var(--slate-light)');
  return `
    <div style="display:flex;flex-direction:column;gap:3px;min-width:110px;">
      <div style="display:flex;justify-content:space-between;font-size:12px;">
        <span style="font-weight:700;color:${color};">${pct}%${pct >= 100 ? ' ✓' : ''}</span>
        <span style="color:var(--slate-light);">${checked}/${total}</span>
      </div>
      <div style="height:5px;border-radius:999px;background:var(--border);overflow:hidden;">
        <div style="height:100%;width:${pct}%;background:${color};border-radius:999px;"></div>
      </div>
    </div>`;
}

function derivedFieldRow(key, value, contributions, formulaFn, formulaData, labelOverride, syncFlags, sectionPrefix) {
  const list = contributions && contributions[key];
  let body;
  if (list && list.length) {
    body = list.map((c, i) => {
      const codeTag = c.code
        ? `<span style="font-family:var(--font-mono);font-size:11px;color:var(--slate-light);margin-right:7px;">${c.code}</span>`
        : '';
      const syncKeyStr = sectionPrefix ? `${sectionPrefix}__${key}__${i}` : null;
      return `
        <div class="bb-akun-row" data-field="${key}" data-idx="${i}" title="Klik untuk melihat rincian transaksi"
             style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px;">
          <span style="color:var(--text);">${codeTag}${c.name || '(tanpa nama)'}</span>
          <span style="display:flex;align-items:center;flex-shrink:0;">
            <span class="num" style="font-family:var(--font-mono);">${formatIDR(c.amount)}</span>
            ${syncKeyStr ? syncCheckboxHtml(syncKeyStr, syncFlags) : ''}
          </span>
        </div>`;
    }).join('');
  } else if (formulaFn) {
    body = `<div class="ratio-note" style="margin-top:4px;">${formulaFn(formulaData)}</div>`;
  } else {
    body = `<div style="color:var(--slate-light);font-size:12px;margin-top:4px;padding-left:2px;">Tidak ada akun buku besar yang menyusun baris ini.</div>`;
  }
  return `
    <details style="border-bottom:1px solid var(--border);" data-details-key="${sectionPrefix || 'field'}__${key}">
      <summary style="display:flex;justify-content:space-between;align-items:center;padding:7px 2px;cursor:pointer;">
        <span>${labelOverride || humanizeKey(key)}</span><span class="num" style="font-family:var(--font-mono);">${formatIDR(value)}</span>
      </summary>
      <div style="padding:2px 2px 12px 12px;">${body}</div>
    </details>`;
}

// Label khusus Laba Rugi hasil turunan Buku Besar — dipakai untuk
// menimpa label bawaan (dari nama field) saat istilahnya perlu berbeda
// dari nama field internal (mis. field "pajakPenghasilan" ditampilkan
// sebagai "Beban Pajak" agar konsisten dengan susunan Pendapatan/HPP/
// Beban Operasional/Pendapatan Lainnya/Beban Lainnya/Beban Pajak).
const LABA_RUGI_LABELS = { pajakPenghasilan: 'Beban Pajak' };

// Urutan baku baris Laba Rugi (Pendapatan → HPP → Laba Kotor → Beban
// Operasional → Laba Operasional → Pendapatan Lainnya → Beban Lainnya →
// Beban Pajak → Laba Bersih). Dipakai supaya susunan di layar Detail
// Perusahaan SELALU sama dengan susunan di Pratinjau Impor — sebelumnya
// keduanya memakai Object.entries() apa adanya, dan urutan objek yang
// tersimpan/diambil dari Firestore bisa berbeda dari urutan objek yang
// baru saja diturunkan dari Buku Besar saat pratinjau.
const LABA_RUGI_ORDER = [
  'pendapatan', 'hpp', 'labaKotor',
  'bebanOperasional', 'labaOperasional',
  'pendapatanLainnya', 'bebanLainnya', 'pajakPenghasilan',
  'labaBersih'
];

// Mengurutkan entries [key, value] sesuai `order`; field yang tidak ada
// di dalam `order` tetap disertakan, ditaruh di akhir dengan urutan asli.
function sortEntriesByOrder(entries, order) {
  if (!order) return entries;
  const rank = (k) => { const i = order.indexOf(k); return i === -1 ? order.length : i; };
  return entries
    .map((entry, idx) => ({ entry, idx }))
    .sort((a, b) => (rank(a.entry[0]) - rank(b.entry[0])) || (a.idx - b.idx))
    .map(({ entry }) => entry);
}

function derivedSectionDetails(obj, contributions, formulas, labels, highlightKeys, order, syncFlags, sectionPrefix) {
  activeContributions = contributions;
  const entries = sortEntriesByOrder(Object.entries(obj || {}), order);
  if (entries.length === 0) return `<div style="color:var(--slate-light);font-size:13px;">Tidak ada data.</div>`;
  return entries.map(([k, v]) => {
    const rowHtml = derivedFieldRow(k, v, contributions, formulas[k], obj, labels && labels[k], syncFlags, sectionPrefix);
    return (highlightKeys && highlightKeys.includes(k))
      ? `<div style="background:var(--teal-light);border-radius:6px;">${rowHtml}</div>`
      : rowHtml;
  }).join('');
}

// Baris Laba Rugi hasil turunan Buku Besar yang di-highlight seperti "Total
// Aset" pada Neraca — subtotal penting yang ingin langsung terlihat menonjol.
const LABA_RUGI_HIGHLIGHT_KEYS = ['labaKotor', 'labaOperasional', 'labaBersih'];

// Pengelompokan khusus untuk pratinjau Neraca hasil turunan Buku Besar —
// mengelompokkan baris yang sama persis (kasSetaraKas, persediaan,
// totalAsetLancar, dst) ke bawah judul kategori Aset Lancar / Aset Tidak
// Lancar / Liabilitas / Ekuitas, sambil tetap memakai derivedFieldRow
// (baris tetap bisa diklik untuk melihat akun buku besar penyusunnya).
function neracaGroupHeader(label) {
  return `<div style="font-weight:600;color:var(--slate);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:12px 2px 4px 2px;">${label}</div>`;
}

function derivedNeracaGrouped(neraca, contributions, syncFlags) {
  activeContributions = contributions;
  if (!neraca || Object.keys(neraca).length === 0) return `<div style="color:var(--slate-light);font-size:13px;">Tidak ada data.</div>`;
  const row = (key) => key in neraca ? derivedFieldRow(key, neraca[key], contributions, NERACA_FORMULAS[key], neraca, NERACA_LABELS[key], syncFlags, 'neraca') : '';
  const highlight = (key) => key in neraca
    ? `<div style="background:var(--teal-light);border-radius:6px;">${derivedFieldRow(key, neraca[key], contributions, NERACA_FORMULAS[key], neraca, NERACA_LABELS[key], syncFlags, 'neraca')}</div>`
    : '';
  return `
    ${neracaGroupHeader('Aset Lancar')}
    ${row('kasSetaraKas')}${row('persediaan')}${row('asetLancarLainnya')}${row('totalAsetLancar')}
    ${neracaGroupHeader('Aset Tidak Lancar')}
    ${row('totalAsetTidakLancar')}
    ${highlight('totalAset')}
    ${neracaGroupHeader('Liabilitas')}
    ${row('totalKewajibanLancar')}${row('totalKewajibanJangkaPanjang')}${highlight('totalKewajiban')}
    ${neracaGroupHeader('Ekuitas')}
    ${row('totalEkuitas')}${row('pendapatanSampaiTahunLalu')}${row('pendapatanPeriodeIni')}${highlight('totalEkuitasTermasukLaba')}
  `;
}

function renderCompanyDetail() {
  const root = document.getElementById('view-root');
  const company = state.companies.find(c => c.id === state.companyDetailId);
  if (!company) {
    // Perusahaan sudah dihapus / tidak ditemukan — kembali ke daftar perusahaan.
    setView('companies');
    return;
  }

  root.innerHTML = `
    <div class="section-block" style="display:flex;justify-content:space-between;align-items:center;">
      <button class="btn ghost" id="back-to-companies">&larr; Kembali ke Daftar Perusahaan</button>
    </div>
    <div id="company-detail-content"><div class="card" style="color:var(--slate);">Memuat data…</div></div>
  `;
  document.getElementById('back-to-companies').addEventListener('click', () => setView('companies'));

  // Listener realtime: rincian & riwayat impor otomatis diperbarui begitu
  // ada data baru/dihapus, baik dari perangkat ini maupun perangkat lain.
  state.unsubData = DB.watchStatements(state.companyDetailId, (rawStatements, meta) => {
    Sync.report('statements', meta);
    if (state.view !== 'company-detail' || state.companyDetailId !== company.id) return;
    const statements = rawStatements.sort((a, b) => a.year - b.year || a.periodIndex - b.periodIndex);
    paintCompanyDetail(statements);
  }, (err) => toast('Gagal memuat data laporan: ' + err.message, 'error'));
}

function paintCompanyDetail(statements) {
  const content = document.getElementById('company-detail-content');
  if (!content) return;
  // Simpan panel kategori (<details>, mis. "Kas Setara Kas") mana saja yang
  // sedang TERBUKA sebelum HTML ditimpa ulang di bawah. Fungsi ini dipanggil
  // ulang setiap ada perubahan data — termasuk oleh tulisan lokal kita
  // sendiri, mis. saat mencentang checkbox "Sinkron" (listener realtime
  // watchStatements ikut terpicu oleh perubahan itu) — tanpa ini, SETIAP
  // repaint akan mengembalikan semua <details> ke keadaan tertutup
  // (default HTML), sehingga kategori yang baru saja dibuka pengguna
  // terlihat "hilang"/tertutup lagi walau baris di dalamnya sebenarnya
  // tidak disembunyikan sama sekali. Dicocokkan lewat data-details-key
  // (lihat derivedFieldRow & arusKasLangsungLineRow) dan dipulihkan lagi
  // di akhir fungsi ini setelah innerHTML yang baru terpasang.
  const openDetailsKeys = new Set(
    Array.from(content.querySelectorAll('details[data-details-key][open]'))
      .map(d => d.dataset.detailsKey)
  );
  const company = state.companies.find(c => c.id === state.companyDetailId);
  const wireBusinessInfoButton = () => {
    const btn = document.getElementById('edit-business-info');
    if (btn) btn.addEventListener('click', () => openEditBusinessInfoModal(state.companyDetailId));

    const codeLink = document.getElementById('edit-company-code');
    if (codeLink) {
      codeLink.addEventListener('click', async (e) => {
        e.preventDefault();
        const next = prompt('Kode perusahaan:', company ? (company.code || '') : '');
        if (next === null) return;
        const trimmed = next.trim();
        await DB.updateCompanyCode(state.companyDetailId, trimmed);
        if (company) company.code = trimmed;
        toast('Kode perusahaan diperbarui', 'success');
        paintCompanyDetail(statements);
      });
    }

    const categoryLink = document.getElementById('edit-company-category');
    if (categoryLink) categoryLink.addEventListener('click', (e) => { e.preventDefault(); openEditCategoryModal(state.companyDetailId); });

    const parentLink = document.getElementById('edit-company-parent');
    if (parentLink) parentLink.addEventListener('click', (e) => { e.preventDefault(); openEditParentModal(state.companyDetailId); });

    const deleteBtn = document.getElementById('delete-company-btn');
    if (deleteBtn) {
      deleteBtn.addEventListener('click', async () => {
        const id = state.companyDetailId;
        const hasChildren = state.companies.some(c => c.parentId === id);
        const msg = hasChildren
          ? 'Hapus perusahaan ini beserta seluruh data laporannya? Anak perusahaan yang terhubung akan menjadi induk tersendiri.'
          : 'Hapus perusahaan ini beserta seluruh data laporannya?';
        if (!confirm(msg)) return;
        await DB.deleteCompany(id);
        toast('Perusahaan dihapus', 'success');
        await reloadCompanies();
        setView('companies');
      });
    }

    const uploadBtn = document.getElementById('upload-logo-btn');
    const fileInput = document.getElementById('logo-file-input');
    const removeBtn = document.getElementById('remove-logo-btn');

    if (uploadBtn && fileInput) {
      uploadBtn.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', async () => {
        const file = fileInput.files && fileInput.files[0];
        if (!file) return;
        const originalLabel = uploadBtn.textContent;
        try {
          uploadBtn.disabled = true;
          uploadBtn.textContent = 'Mengunggah…';
          const dataUrl = await resizeImageFile(file, 256);
          await DB.updateCompanyLogo(state.companyDetailId, dataUrl);
          if (company) company.logoUrl = dataUrl;
          toast('Logo perusahaan diperbarui', 'success');
          paintCompanyDetail(statements);
        } catch (err) {
          toast('Gagal mengunggah logo: ' + err.message, 'error');
          uploadBtn.disabled = false;
          uploadBtn.textContent = originalLabel;
        } finally {
          fileInput.value = '';
        }
      });
    }

    if (removeBtn) {
      removeBtn.addEventListener('click', async () => {
        if (!confirm('Hapus logo perusahaan ini?')) return;
        try {
          await DB.updateCompanyLogo(state.companyDetailId, '');
          if (company) company.logoUrl = '';
          toast('Logo perusahaan dihapus', 'success');
          paintCompanyDetail(statements);
        } catch (err) {
          toast('Gagal menghapus logo: ' + err.message, 'error');
        }
      });
    }
  };

  if (statements.length === 0) {
    content.innerHTML = `
      ${company ? businessInfoHTML(company, 0) : ''}
      <div class="card" style="color:var(--slate);margin-bottom:20px;">Belum ada data laporan keuangan untuk perusahaan ini. Silakan impor data terlebih dahulu di menu <strong>Impor Data</strong>.</div>
      <div class="section-block">
        <div class="section-title">Riwayat Impor</div>
        <div class="card" style="color:var(--slate);">Belum ada riwayat impor.</div>
      </div>
    `;
    wireBusinessInfoButton();
    return;
  }

  // Pilih periode aktif: gunakan pilihan sebelumnya bila masih ada, kalau
  // tidak jatuhkan ke periode terbaru.
  let selected = statements.find(s => s.id === state.companyDetailPeriodId);
  if (!selected) selected = statements[statements.length - 1];
  state.companyDetailPeriodId = selected.id;

  // Kalau periode ini punya data Buku Besar, klasifikasi Neraca & Laba Rugi
  // direkonstruksi dari akun-akun tersimpan supaya baris-barisnya tetap bisa
  // diklik untuk melihat rincian transaksi — sama seperti di layar pratinjau
  // impor, bukan cuma tabel angka datar. Rincian Buku Besar disimpan
  // terpisah dari dokumen statement (lihat DB.getLedgerAccounts) supaya
  // dokumennya tetap kecil, jadi di sini dimuat sesuai kebutuhan (lazy) &
  // di-cache per periode; sambil menunggu, tabel tampil datar dulu (tanpa
  // bisa diklik) lalu otomatis diperbarui begitu rincian selesai dimuat.
  let bbContribs = null;
  let neracaBase = selected.neraca;
  let labaRugiBase = selected.labaRugi;
  let arusKasBase = selected.arusKas;
  let perubahanModalBase = selected.perubahanModal;
  if (selected.bukuBesarCount > 0) {
    if (Array.isArray(ledgerCache[selected.id])) {
      // Neraca & Laba Rugi periode ini SELALU diturunkan ulang langsung dari
      // akun Buku Besar tersimpan (bukan dipakai apa adanya dari snapshot
      // yang disimpan saat impor) — supaya kalau logika pengelompokan akun
      // diperbarui di kemudian hari (mis. kategori "Aset Lancar Lainnya"),
      // periode yang datanya sudah diimpor lama ikut otomatis ter-update
      // begitu dibuka lagi, tanpa perlu impor ulang file Buku Besar-nya.
      const ledgerAccounts = ledgerCache[selected.id];
      const derivedLive = deriveStatementsFromLedgerAccounts(ledgerAccounts);
      bbContribs = derivedLive.contributions;
      neracaBase = derivedLive.neraca;
      labaRugiBase = derivedLive.labaRugi;
      // Arus Kas & Perubahan Modal ikut diturunkan ulang di sini juga (dulu
      // sempat cuma dipakai dari snapshot statis `selected.arusKas`/
      // `selected.perubahanModal`, jadi basi kalau logikanya berubah — lihat
      // DERIVATION_VERSION di atas classifyLedgerAccount).
      const arusKasLive = deriveArusKasLangsungFromLedger(ledgerAccounts);
      const perubahanModalLive = derivePerubahanModalFromLedger(ledgerAccounts, arusKasLive, derivedLive.labaRugi.labaBersih, derivedLive.neraca.penyesuaianSaldoAwalLabaRugi);
      arusKasBase = arusKasLive;
      perubahanModalBase = perubahanModalLive;

      // Kalau snapshot tersimpan berasal dari versi logika turunan yang
      // lebih lama, timpa diam-diam dengan hasil hitung ulang di atas —
      // supaya halaman lain yang memakai snapshot statis (Perbandingan,
      // Analisis Rasio) ikut ter-update begitu periode ini pernah dibuka
      // sekali, tanpa perlu impor ulang. Ditandai di objek `selected` juga
      // supaya tidak berulang kali menyimpan pada render berikutnya dalam
      // sesi yang sama.
      if (selected.derivationVersion !== DERIVATION_VERSION) {
        selected.derivationVersion = DERIVATION_VERSION;
        DB.saveStatementSections(state.companyDetailId, selected, {
          neraca: neracaBase,
          labaRugi: labaRugiBase,
          arusKas: arusKasLive,
          perubahanModal: perubahanModalLive,
          bukuBesarCount: selected.bukuBesarCount,
          derivationVersion: DERIVATION_VERSION
        }).catch((err) => console.error('Gagal memperbarui otomatis snapshot Neraca/Laba Rugi/Arus Kas/Perubahan Modal:', err));
      }
    } else if (ledgerCache[selected.id] !== 'loading') {
      ledgerCache[selected.id] = 'loading';
      DB.getLedgerAccounts(state.companyDetailId, selected.id)
        .then((accounts) => {
          ledgerCache[selected.id] = accounts;
          if (state.view === 'company-detail' && state.companyDetailId === company.id) paintCompanyDetail(statements);
        })
        .catch((err) => {
          delete ledgerCache[selected.id];
          console.error('Gagal memuat rincian Buku Besar:', err);
        });
    }
  }

  // Neraca yang ditampilkan dilengkapi baris Pendapatan Periode Ini &
  // Pendapatan s.d. Tahun Lalu (lihat withRetainedEarnings) supaya Total
  // Aset bisa dicocokkan dengan Total Kewajiban + Total Ekuitas.
  const neracaDisplay = withRetainedEarnings(neracaBase, statements, selected);
  const modalDisplay = withPerubahanModal(perubahanModalBase, neracaDisplay);

  content.innerHTML = `
    ${company ? businessInfoHTML(company, statements.length) : ''}
    <div class="section-block">
      <div class="section-title">Pilih Periode</div>
      <div class="pill-row" id="detail-period-pills">
        ${statements.map(s => `<div class="pill ${s.id === selected.id ? 'active' : ''}" data-period-id="${s.id}">${s.periodLabel}</div>`).join('')}
      </div>
    </div>

    <div class="section-block grid grid-2">
      <div class="card">
        ${company ? reportTitleHTML(company, 'Neraca', selected, true) : ''}
        <div class="section-title">
          <span class="badge teal">Neraca</span>
          ${bbContribs ? '<span style="font-size:11px;color:var(--slate);font-weight:400;margin-left:8px;">klik baris untuk rincian akun</span>' : ''}
        </div>
        ${bbContribs ? derivedNeracaGrouped(neracaDisplay, bbContribs, selected.syncFlags || {}) + neracaBalanceSummary(neracaDisplay) : neracaGroupedTable(neracaDisplay)}
      </div>
      <div class="card">
        ${company ? reportTitleHTML(company, 'Laba Rugi', selected, false) : ''}
        <div class="section-title">
          <span class="badge gold">Laba Rugi</span>
          ${bbContribs ? '<span style="font-size:11px;color:var(--slate);font-weight:400;margin-left:8px;">klik baris untuk rincian akun</span>' : ''}
        </div>
        ${bbContribs ? derivedSectionDetails(labaRugiBase, bbContribs, LABA_RUGI_FORMULAS, LABA_RUGI_LABELS, LABA_RUGI_HIGHLIGHT_KEYS, LABA_RUGI_ORDER, selected.syncFlags || {}, 'labaRugi') : keyValueTable(labaRugiBase, LABA_RUGI_ORDER, LABA_RUGI_LABELS)}
      </div>
      <div class="card">
        ${company ? reportTitleHTML(company, 'Arus Kas', selected, false) : ''}
        <div class="section-title">
          <span class="badge blue">Arus Kas (Metode Langsung)</span>
          ${arusKasBase && arusKasBase.rincian ? '<span style="font-size:11px;color:var(--slate);font-weight:400;margin-left:8px;">klik pos untuk rincian akun kontributor</span>' : ''}
        </div>
        ${arusKasTable(arusKasBase, selected.syncFlags || {})}
      </div>
      <div class="card">
        ${company ? reportTitleHTML(company, 'Perubahan Modal', selected, false) : ''}
        <div class="section-title">
          <span class="badge purple">Perubahan Modal</span>
        </div>
        ${perubahanModalTable(modalDisplay, selected.syncFlags || {})}
      </div>
    </div>


    <div class="section-block">
      <div class="section-title">Riwayat Impor</div>
      <div style="font-size:12px;color:var(--slate);margin:-8px 0 12px 0;">
        Menghapus satu baris riwayat akan menghapus <strong>seluruh data periode tersebut</strong> (Neraca, Laba Rugi, Arus Kas, dan Buku Besar yang pernah diimpor untuk periode itu) secara permanen.
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Periode</th><th>Neraca</th><th>Laba Rugi</th><th>Arus Kas</th><th>Perubahan Modal</th><th>Buku Besar</th><th>Persentase Sinkron</th><th></th></tr></thead>
          <tbody>
            ${statements.slice().reverse().map(s => `<tr data-statement-id="${s.id}">
              <td data-period-cell="${s.id}">${s.periodLabel}</td>
              <td>${hasSectionData(s.neraca) ? '<span style="color:var(--teal);font-weight:600;">✓ Ada</span>' : '<span style="color:var(--slate-light);">– Belum</span>'}</td>
              <td>${hasSectionData(s.labaRugi) ? '<span style="color:var(--teal);font-weight:600;">✓ Ada</span>' : '<span style="color:var(--slate-light);">– Belum</span>'}</td>
              <td>${hasSectionData(s.arusKas) ? '<span style="color:var(--teal);font-weight:600;">✓ Ada</span>' : '<span style="color:var(--slate-light);">– Belum</span>'}</td>
              <td>${hasSectionData(s.perubahanModal) ? '<span style="color:var(--teal);font-weight:600;">✓ Ada</span>' : '<span style="color:var(--slate-light);">– Belum</span>'}</td>
              <td>${s.bukuBesarCount > 0 ? '<span style="color:var(--teal);font-weight:600;">✓ Ada</span>' : '<span style="color:var(--slate-light);">– Belum</span>'}</td>
              <td>${syncProgressCellHtml(statementSyncProgress(s, statements, state.companyDetailId))}</td>
              <td style="text-align:right;"><button class="btn danger" data-del-statement="${s.id}" data-label="${s.periodLabel}">Hapus</button></td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  // Pulihkan kembali <details> yang tadinya terbuka (lihat openDetailsKeys
  // di awal fungsi) supaya repaint akibat perubahan data (termasuk saat
  // mencentang checkbox "Sinkron" sendiri) tidak terasa seperti kategori
  // yang baru dibuka tiba-tiba tertutup/"hilang" lagi.
  if (openDetailsKeys.size) {
    content.querySelectorAll('details[data-details-key]').forEach(d => {
      if (openDetailsKeys.has(d.dataset.detailsKey)) d.setAttribute('open', '');
    });
  }

  wireBusinessInfoButton();

  document.querySelectorAll('#detail-period-pills .pill').forEach(p => {
    p.addEventListener('click', () => {
      state.companyDetailPeriodId = p.dataset.periodId;
      paintCompanyDetail(statements);
    });
  });

  // Checkbox "Sinkron" per baris rincian akun (Neraca, Laba Rugi, Arus
  // Kas) & per baris ringkasan (Perubahan Modal) — lihat syncCheckboxHtml()
  // & DB.updateStatementSyncFlag(). Ditulis ke statement yang SEDANG
  // tampil (`selected`), jadi berlaku khusus untuk periode itu.
  document.querySelectorAll('[data-sync-key]').forEach(cb => {
    cb.addEventListener('change', async () => {
      const key = cb.dataset.syncKey;
      const checked = cb.checked;
      const label = cb.nextElementSibling;
      const wrap = cb.closest('.sync-checkbox-label');
      cb.disabled = true;
      try {
        await DB.updateStatementSyncFlag(state.companyDetailId, selected.id, key, checked);
        selected.syncFlags = selected.syncFlags || {};
        selected.syncFlags[key] = checked;
        if (label) label.textContent = checked ? 'Sinkron' : 'Tandai sinkron';
        if (wrap) wrap.classList.toggle('is-synced', checked);
      } catch (err) {
        cb.checked = !checked;
        toast('Gagal menyimpan status sinkron: ' + err.message, 'error');
      } finally {
        cb.disabled = false;
      }
    });
  });

  document.querySelectorAll('[data-del-statement]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const statementId = btn.dataset.delStatement;
      const label = btn.dataset.label;
      if (!confirm(`Hapus seluruh data periode "${label}"? Data Neraca, Laba Rugi, Arus Kas, dan Buku Besar yang pernah diimpor untuk periode ini akan ikut terhapus dan tidak bisa dikembalikan.`)) return;
      try {
        await DB.deleteStatement(state.companyDetailId, statementId);
        if (state.companyDetailPeriodId === statementId) state.companyDetailPeriodId = null;
        toast(`Data periode "${label}" dihapus`, 'success');
        // Tampilan akan otomatis diperbarui lewat listener realtime.
      } catch (err) {
        toast('Gagal menghapus data: ' + err.message, 'error');
      }
    });
  });
}

// ---------- Import ----------
function selectImportCompany(companyId) {
  const company = state.companies.find(c => c.id === companyId);
  if (!company) return;
  state.importCompanyId = companyId;
  const input = document.getElementById('import-company');
  if (input) input.value = companyDisplayLabel(company);
  closeImportCompanyDropdown();
  resetPreview();
  loadImportStatus();
}

function closeImportCompanyDropdown() {
  const dd = document.getElementById('import-company-dropdown');
  if (dd) { dd.style.display = 'none'; dd.innerHTML = ''; }
}

function renderImportCompanyDropdown(query) {
  const dd = document.getElementById('import-company-dropdown');
  if (!dd) return;
  const q = query.trim().toLowerCase();
  const matches = !q ? state.companies : state.companies.filter(c =>
    String(c.code || '').toLowerCase().includes(q) ||
    String(c.name || '').toLowerCase().includes(q)
  );
  dd.innerHTML = matches.length === 0
    ? `<div class="combo-empty">Tidak ada perusahaan yang cocok.</div>`
    : matches.map(c => `<div class="combo-option" data-id="${c.id}">
        ${c.code ? `<span class="combo-code">${c.code}</span>` : ''}
        <span class="combo-name">${c.name}</span>
      </div>`).join('');
  dd.querySelectorAll('.combo-option').forEach(opt => {
    opt.addEventListener('mousedown', (e) => {
      e.preventDefault();
      selectImportCompany(opt.dataset.id);
    });
  });
  dd.style.display = '';
}

function renderImport() {
  const root = document.getElementById('view-root');
  if (state.companies.length === 0) {
    root.innerHTML = emptyState('Tambahkan perusahaan terlebih dahulu', 'Anda perlu memiliki minimal satu perusahaan sebelum mengimpor data.', 'companies', 'Tambah Perusahaan');
    bindEmptyStateNav(root);
    return;
  }
  if (state.importCompanyId && !state.companies.find(c => c.id === state.importCompanyId)) {
    state.importCompanyId = null;
  }

  root.innerHTML = `
    <div class="section-block" style="margin-bottom:16px;">
      ${companiesTabBarHTML('import')}
    </div>
    <div class="grid grid-2" style="align-items:stretch;">
      <div class="card">
        <div class="step-head"><span class="step-badge">1</span><span class="step-title">Pilih Perusahaan Tujuan</span></div>
        <div class="field combo-wrap" style="margin-top:14px;">
          <label>Perusahaan</label>
          <input type="text" id="import-company" placeholder="Ketik kode atau nama perusahaan…" autocomplete="off">
          <div id="import-company-dropdown" class="combo-dropdown" style="display:none;"></div>
        </div>

        <div class="step-head" style="margin-top:22px;"><span class="step-badge">2</span><span class="step-title">Unggah File Excel Buku Besar</span></div>
        <div style="font-size:11.5px;color:var(--slate);margin:8px 0 14px 36px;line-height:1.5;">
          Neraca, Laba Rugi, Arus Kas Metode Langsung, & Perubahan Modal untuk periode ini akan diturunkan otomatis
          dari file Buku Besar yang Anda unggah — tidak perlu diimpor terpisah.
        </div>

        <div class="dropzone" id="dropzone">
          <div class="dropzone-icon-circle">${icon('upload')}</div>
          <div>Seret file .xlsx <strong id="dropzone-type-label"></strong> ke sini, atau klik untuk memilih</div>
        </div>
        <input type="file" id="file-input" accept=".xlsx,.xls" style="display:none;">
      </div>
      <div class="card import-preview-card" id="preview-panel">
        <div class="step-head"><span class="step-badge step-badge-outline">3</span><span class="step-title">Pratinjau Data</span></div>
        ${importPreviewEmptyHTML()}
      </div>
    </div>

    <div class="section-block" style="margin-top:24px;">
      <div class="section-title">Status Data per Periode — <span id="import-status-company-name" style="color:var(--slate);font-weight:500;"></span></div>
      <div id="import-status-table"><div class="card" style="color:var(--slate);">Memuat status…</div></div>
    </div>
  `;

  updateDropzoneAndTemplate();
  loadImportStatus();
  bindCompaniesTabBar();

  const companyInput = document.getElementById('import-company');
  const initialCompany = state.companies.find(c => c.id === state.importCompanyId);
  if (companyInput && initialCompany) companyInput.value = companyDisplayLabel(initialCompany);

  companyInput.addEventListener('focus', () => renderImportCompanyDropdown(''));
  companyInput.addEventListener('input', () => renderImportCompanyDropdown(companyInput.value));
  companyInput.addEventListener('blur', () => {
    // Delay agar klik pada opsi dropdown (mousedown) sempat diproses sebelum ditutup.
    setTimeout(() => {
      closeImportCompanyDropdown();
      const current = state.companies.find(c => c.id === state.importCompanyId);
      if (current && companyInput) companyInput.value = companyDisplayLabel(current);
    }, 120);
  });
  companyInput.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') companyInput.blur();
  });

  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('file-input');
  dropzone.addEventListener('click', () => {
    if (!state.importCompanyId) { toast('Pilih perusahaan terlebih dahulu', 'error'); return; }
    fileInput.click();
  });
  ['dragenter', 'dragover'].forEach(evt => dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.add('drag'); }));
  ['dragleave', 'drop'].forEach(evt => dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.remove('drag'); }));
  dropzone.addEventListener('drop', (e) => { if (e.dataTransfer.files[0]) handleImportFile(e.dataTransfer.files[0]); });
  fileInput.addEventListener('change', (e) => { if (e.target.files[0]) handleImportFile(e.target.files[0]); });
}

function updateDropzoneAndTemplate() {
  const type = IMPORT_TYPES[state.importType];
  const label = document.getElementById('dropzone-type-label');
  if (label) label.textContent = type.label;
}

// Tampilan kosong panel Pratinjau Data (dipakai saat pertama render halaman
// Impor Data maupun saat pratinjau direset) — dibuat seimbang secara visual
// dengan kartu di sebelah kiri (ikon + judul + keterangan, memenuhi ruang).
function importPreviewEmptyHTML() {
  return `
    <div class="import-preview-empty">
      <div class="dropzone-icon-circle">${icon('upload')}</div>
      <div class="import-preview-empty-title">Belum ada file dipilih</div>
      <div class="import-preview-empty-sub">Pilih perusahaan &amp; unggah file Excel Buku Besar di sebelah kiri untuk melihat pratinjau data di sini.</div>
    </div>
  `;
}

function resetPreview() {
  pendingImport = null;
  const panel = document.getElementById('preview-panel');
  if (panel) panel.innerHTML = `<div class="step-head"><span class="step-badge step-badge-outline">3</span><span class="step-title">Pratinjau Data</span></div>${importPreviewEmptyHTML()}`;
}

function hasSectionData(v) {
  if (v === undefined || v === null) return false;
  if (Array.isArray(v)) return v.length > 0;
  if (typeof v === 'object') return Object.keys(v).length > 0;
  return true;
}

async function loadImportStatus() {
  const company = state.companies.find(c => c.id === state.importCompanyId);
  const nameEl = document.getElementById('import-status-company-name');
  if (nameEl) nameEl.textContent = company ? company.name : '';
  const tableEl = document.getElementById('import-status-table');
  if (!tableEl) return;
  if (!state.importCompanyId) {
    tableEl.innerHTML = `<div class="card" style="color:var(--slate);">Pilih perusahaan terlebih dahulu untuk melihat status data.</div>`;
    return;
  }
  const statements = (await DB.getStatements(state.importCompanyId)).sort((a, b) => a.year - b.year || a.periodIndex - b.periodIndex);
  if (statements.length === 0) {
    tableEl.innerHTML = `<div class="card" style="color:var(--slate);">Belum ada data yang diimpor untuk perusahaan ini.</div>`;
    return;
  }
  const mark = (ok) => ok ? '<span style="color:var(--teal);font-weight:600;">✓ Ada</span>' : '<span style="color:var(--slate-light);">– Belum</span>';
  tableEl.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead><tr><th>Periode</th><th>Neraca</th><th>Laba Rugi</th><th>Arus Kas</th><th>Perubahan Modal</th><th>Buku Besar</th></tr></thead>
        <tbody>
          ${statements.map(s => `<tr>
            <td>${s.periodLabel}</td>
            <td>${mark(hasSectionData(s.neraca))}</td>
            <td>${mark(hasSectionData(s.labaRugi))}</td>
            <td>${mark(hasSectionData(s.arusKas))}</td>
            <td>${mark(hasSectionData(s.perubahanModal))}</td>
            <td>${mark(s.bukuBesarCount > 0)}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

let pendingImport = null;

async function handleImportFile(file) {
  if (!state.importCompanyId) {
    toast('Pilih perusahaan terlebih dahulu sebelum mengunggah file', 'error');
    const input = document.getElementById('file-input');
    if (input) input.value = '';
    return;
  }
  const panel = document.getElementById('preview-panel');
  try {
    const buffer = await file.arrayBuffer();
    const result = parseSingleTypeExcel(buffer, state.importType);
    pendingImport = result;

    panel.innerHTML = `
      <div class="step-head" style="margin-bottom:14px;"><span class="step-badge step-badge-outline">3</span><span class="step-title">Pratinjau Data</span></div>
      <div style="font-size:13px;margin-bottom:10px;">
        ${result.companyName ? `<strong>${result.companyName}</strong><br>` : ''}
        Periode: ${result.period.periodLabel} &middot; Jenis: ${PERIOD_LABELS[result.period.periodType]} &middot; Tahun: ${result.period.year}
      </div>
      <div class="badge ${result.badge}">${result.typeLabel}</div>
      ${result.warnings.length ? `<div class="ratio-note" style="margin-top:8px;">${result.warnings.join('<br>')}</div>` : ''}
      <div class="section-title" style="margin-top:16px;font-size:14px;">Neraca (diturunkan otomatis — saldo akhir periode)</div>

async function confirmImport() {
  const companyId = state.importCompanyId;
  if (!pendingImport) return;
  const btn = document.getElementById('confirm-import');
  if (btn) { btn.disabled = true; btn.textContent = 'Menyimpan...'; }
  try {
    const accounts = pendingImport.data.ledger || [];
    const period = pendingImport.period;
    const statementId = `${period.year}_${period.periodType}_${period.periodIndex}`;
    // Buku Besar (rincian per transaksi) disimpan LEBIH DULU, terpisah &
    // dipecah otomatis jadi beberapa dokumen kecil (lihat
    // DB.saveLedgerAccounts/chunkLedgerPieces) karena bisa melebihi batas
    // ukuran 1 dokumen Firestore (1 MB) untuk perusahaan dengan banyak
    // transaksi. Neraca/Laba Rugi/Arus Kas/Perubahan Modal (data ringkas,
    // selalu kecil) baru disimpan setelahnya dalam satu write gabungan —
    // kalau langkah manapun gagal, tidak ada kondisi tersimpan sebagian.
    await DB.saveLedgerAccounts(companyId, statementId, accounts);
    await DB.saveStatementSections(companyId, period, {
      neraca: pendingImport.data.neraca,
      labaRugi: pendingImport.data.labaRugi,
      arusKas: pendingImport.data.arusKas,
      perubahanModal: pendingImport.data.perubahanModal,
      bukuBesarCount: accounts.length,
      derivationVersion: DERIVATION_VERSION
    });
    toast(`Buku Besar tersimpan — Neraca, Laba Rugi, Arus Kas & Perubahan Modal otomatis diperbarui`, 'success');
    pendingImport = null;
    renderImport();
  } catch (err) {
    console.error('Gagal menyimpan hasil impor Buku Besar:', err);
    toast(`Gagal menyimpan data: ${err.message || err}. Periksa koneksi internet Anda lalu coba lagi.`, 'error');
    if (btn) { btn.disabled = false; btn.textContent = 'Simpan ke Sistem'; }
  }
}

function subscribeCompareData() {
  teardownActiveDataListener();
  const resultEl = document.getElementById('compare-result');
  if (state.compareCompanyIds.length === 0) {
    if (resultEl) resultEl.innerHTML = `<div class="card compare-empty-state">
      <div class="compare-empty-icon">${icon('bars')}</div>
      <div class="compare-empty-title">Pilih perusahaan untuk membandingkan</div>
      <div class="compare-empty-sub">Pilih minimal satu perusahaan dari daftar di atas untuk melihat grafik dan tabel perbandingan kinerjanya.</div>
    </div>`;
    return;
  }
  // Listener realtime untuk kombinasi perusahaan yang dipilih.
  state.unsubData = DB.watchAllStatements(state.compareCompanyIds, (allStatements, meta) => {
    Sync.report('statements', meta);
    if (state.view !== 'report' || state.reportView !== 'compare') return;
    const statements = allStatements
      .filter(s => s.periodType === state.comparePeriodType)
      .sort((a, b) => a.year - b.year || a.periodIndex - b.periodIndex);
    paintCompare(statements);
  }, (err) => toast('Gagal memuat data laporan: ' + err.message, 'error'));
}

function paintCompare(statements) {
  const resultEl = document.getElementById('compare-result');
  if (!resultEl) return;
  if (statements.length === 0) {
    resultEl.innerHTML = `<div class="card" style="color:var(--slate);">Tidak ada data dengan jenis periode "${PERIOD_LABELS[state.comparePeriodType]}" untuk perusahaan terpilih.</div>`;
    return;
  }

  const periodKeys = [...new Set(statements.map(s => `${s.year}-${s.periodIndex}-${s.periodLabel}`))]
    .sort();

  resultEl.innerHTML = `
    <div class="section-block grid grid-2">
      <div class="chart-box"><div class="section-title">Total Aset per Periode</div><canvas id="cmp-aset"></canvas></div>
      <div class="chart-box"><div class="section-title">Laba Bersih per Periode</div><canvas id="cmp-laba"></canvas></div>
    </div>
    <div class="section-block">
      <div class="section-title">Tabel Perbandingan</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Perusahaan</th><th>Periode</th><th class="num">Total Aset</th><th class="num">Total Kewajiban</th><th class="num">Ekuitas</th><th class="num">Pendapatan</th><th class="num">Laba Bersih</th></tr></thead>
          <tbody>
            ${statements.map(s => `<tr>
              <td>${state.companies.find(c => c.id === s.companyId)?.name}</td>
              <td>${s.periodLabel}</td>
              <td class="num">${formatIDR(s.neraca.totalAset)}</td>
              <td class="num">${formatIDR(s.neraca.totalKewajiban)}</td>
              <td class="num">${formatIDR(s.neraca.totalEkuitas)}</td>
              <td class="num">${formatIDR(s.labaRugi.pendapatan)}</td>
              <td class="num">${formatIDR(s.labaRugi.labaBersih)}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  const datasetsAset = state.compareCompanyIds.map((id, i) => {
    const company = state.companies.find(c => c.id === id);
    const byPeriod = {};
    statements.filter(s => s.companyId === id).forEach(s => byPeriod[`${s.year}-${s.periodIndex}-${s.periodLabel}`] = s.neraca.totalAset || 0);
    return { label: company.name, data: periodKeys.map(k => byPeriod[k] ?? null), color: palette(i) };
  });
  const datasetsLaba = state.compareCompanyIds.map((id, i) => {
    const company = state.companies.find(c => c.id === id);
    const byPeriod = {};
    statements.filter(s => s.companyId === id).forEach(s => byPeriod[`${s.year}-${s.periodIndex}-${s.periodLabel}`] = s.labaRugi.labaBersih || 0);
    return { label: company.name, data: periodKeys.map(k => byPeriod[k] ?? null), color: palette(i) };
  });

  const labels = periodKeys.map(k => k.split('-').slice(2).join('-'));
  renderLineChart('cmp-aset', labels, datasetsAset);
  renderLineChart('cmp-laba', labels, datasetsLaba);
}

function palette(i) {
  const colors = ['#1B7A6B', '#C08A3E', '#B5453B', '#3B5BA5', '#7A5CC0', '#2D9CDB'];
  return colors[i % colors.length];
}

function renderRatios(rootId = 'view-root') {
  teardownActiveDataListener();
  const root = document.getElementById(rootId);
  if (state.companies.length === 0) {
    root.innerHTML = emptyState('Belum ada perusahaan', 'Tambahkan perusahaan dan data untuk melihat analisis rasio.', 'companies', 'Tambah Perusahaan');

      <div class="field" style="margin:0;min-width:220px;">
