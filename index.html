<style>
:root{
  --ink:#16213A;
  --ink-soft:#22314f;
  --teal:#1B7A6B;
  --teal-light:#e6f2f0;
  --gold:#C08A3E;
  --gold-light:#faf1e2;
  --paper:#F5F6F4;
  --card:#FFFFFF;
  --slate:#5B6472;
  --slate-light:#9aa3b2;
  --danger:#B5453B;
  --danger-light:#fbeceb;
  --border:#E4E6E9;
  --radius:10px;
  --font-body:'Inter',system-ui,sans-serif;
  --font-display:'Space Grotesk',var(--font-body);
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;}
input,select{font-family:inherit;}

/* ---------- Layout shell ---------- */
#app-shell{display:flex;min-height:100vh;}

.sidebar{
  width:250px;
  flex-shrink:0;
  background:var(--ink);
  color:#cfd6e4;
  display:flex;
  flex-direction:column;
  position:fixed;
  top:0;left:0;bottom:0;
  overflow-y:auto;
  background-image:repeating-linear-gradient(to bottom, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 1px, transparent 1px, transparent 28px);
}
.sidebar-brand{
  display:flex;align-items:center;gap:10px;
  padding:22px 20px 18px 20px;
  border-bottom:1px solid rgba(255,255,255,0.08);
}
.sidebar-brand .mark{
  width:32px;height:32px;border-radius:8px;
  background:linear-gradient(135deg,var(--teal),#0e4e44);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;color:#fff;font-size:15px;
}
.sidebar-brand .name{font-family:var(--font-display);font-weight:600;font-size:18px;color:#fff;letter-spacing:.2px;}
.sidebar-brand .tag{font-size:10.5px;color:var(--slate-light);letter-spacing:.6px;text-transform:uppercase;}

.sidebar-section{padding:16px 14px 4px 14px;}
.sidebar-section-label{
  font-size:10.5px;letter-spacing:1px;text-transform:uppercase;
  color:#6e7b93;margin:10px 10px 6px 10px;font-weight:600;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;margin:2px 0;border-radius:8px;
  color:#c4cbdb;text-decoration:none;font-size:14px;cursor:pointer;
  border:1px solid transparent;
}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
.nav-item.active{background:rgba(27,122,107,0.22);border-color:rgba(27,122,107,0.4);color:#fff;}

.sidebar-footer{margin-top:auto;padding:14px;border-top:1px solid rgba(255,255,255,0.08);}
.user-chip{display:flex;align-items:center;gap:9px;font-size:12.5px;color:#c4cbdb;}
.user-chip .dot{width:26px;height:26px;border-radius:50%;background:var(--gold);color:#3a2a0f;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;}
.logout-btn{margin-top:10px;width:100%;background:transparent;border:1px solid rgba(255,255,255,0.15);color:#c4cbdb;padding:7px;border-radius:7px;font-size:12.5px;cursor:pointer;}
.logout-btn:hover{background:rgba(255,255,255,0.08);}

.main{margin-left:250px;flex:1;display:flex;flex-direction:column;min-height:100vh;}
.topbar{
  height:62px;flex-shrink:0;background:var(--card);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:5;
}
.topbar h1{font-family:var(--font-display);font-size:19px;margin:0;font-weight:600;}
.topbar .sub{font-size:12.5px;color:var(--slate);margin-top:2px;}
.content{padding:26px;flex:1;}

/* ---------- Cards / generic ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;}
.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}

.kpi-card{display:flex;flex-direction:column;gap:6px;}
.kpi-label{font-size:12px;color:var(--slate);text-transform:uppercase;letter-spacing:.5px;}
.kpi-value{font-family:var(--font-mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;}
.kpi-delta{font-size:12.5px;font-family:var(--font-mono);}
.kpi-delta.up{color:var(--teal);}
.kpi-delta.down{color:var(--danger);}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--border);}

thead th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--slate);font-weight:600;background:#fafbfb;position:sticky;top:0;}
td.num,th.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
tbody tr:hover{background:#fafcfb;}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);}

.btn{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--ink);color:#fff;border:none;padding:9px 16px;border-radius:8px;

}
.btn:hover{background:var(--ink-soft);}
.btn.primary{background:var(--teal);}
.btn.primary:hover{background:#156357;}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--border);}
.btn.ghost:hover{background:#f2f3f4;}
.btn.danger{background:var(--danger);}
.btn:disabled{opacity:.5;cursor:not-allowed;}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.field label{font-size:12.5px;color:var(--slate);font-weight:500;}
.field input,.field select{
  padding:9px 11px;border:1px solid var(--border);border-radius:7px;font-size:13.5px;background:#fff;
}
.field input:focus,.field select:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal);}

.badge{display:inline-block;padding:3px 9px;border-radius:100px;font-size:11px;font-weight:600;}
.badge.teal{background:var(--teal-light);color:var(--teal);}
.badge.gold{background:var(--gold-light);color:#8a611f;}
.badge.danger{background:var(--danger-light);color:var(--danger);}
.badge.blue{background:#e9eef9;color:#3B5BA5;}

.pill.active{background:var(--ink);color:#fff;border-color:var(--ink);}

.empty-state .mark{font-size:32px;margin-bottom:10px;}

.modal-backdrop{

}
.modal{background:#fff;border-radius:12px;width:460px;max-width:92vw;padding:24px;max-height:88vh;overflow-y:auto;}
.modal h3{font-family:var(--font-display);margin:0 0 4px 0;}
.modal .modal-sub{font-size:12.5px;color:var(--slate);margin-bottom:16px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}

.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:80;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:8px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.18);}
.toast.error{background:var(--danger);}
.toast.success{background:var(--teal);}

.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);
  background-image:repeating-linear-gradient(to bottom, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 30px);}
.auth-card{width:380px;max-width:92vw;background:#fff;border-radius:14px;padding:32px 28px;}
.auth-brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
.auth-brand .mark{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,var(--teal),#0e4e44);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:700;}
.auth-brand .name{font-family:var(--font-display);font-weight:700;font-size:20px;}
.auth-tabs{display:flex;gap:6px;margin-bottom:18px;background:#f2f3f4;padding:4px;border-radius:9px;}
.auth-tab{flex:1;text-align:center;padding:8px;border-radius:7px;font-size:13px;cursor:pointer;color:var(--slate);}
.auth-tab.active{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.auth-error{background:var(--danger-light);color:var(--danger);font-size:12.5px;padding:9px 11px;border-radius:7px;margin-bottom:12px;}
.auth-hint{font-size:11.5px;color:var(--slate-light);margin-top:14px;line-height:1.5;}

.chart-box{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.chart-box canvas{max-height:280px;}

.ratio-note{font-size:12px;color:var(--slate);background:#fafbfb;border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-top:10px;line-height:1.5;}

.loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--slate);font-family:var(--font-display);}

/* ---------- Sync badge ---------- */
.sync-badge{
  display:flex;align-items:center;gap:7px;
  font-size:12.5px;color:var(--slate);
  background:#fafbfb;border:1px solid var(--border);
  padding:6px 12px;border-radius:100px;
  cursor:default;user-select:none;white-space:nowrap;
}
.sync-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.sync-badge.pulse .sync-dot{animation:sync-pulse 1.1s ease-in-out infinite;}
.sync-time{color:var(--slate-light);font-family:var(--font-mono);font-size:11px;}
@keyframes sync-pulse{
  0%{opacity:1;transform:scale(1);}
  50%{opacity:.35;transform:scale(.75);}
  100%{opacity:1;transform:scale(1);}
}
@media(max-width:640px){ .sync-badge .sync-time{display:none;} }

@media(max-width:900px){
  .sidebar{transform:translateX(-100%);transition:transform .2s ease;z-index:40;}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}
}

<!-- ===========================================================
     Seluruh kode aplikasi (config Firebase, akses data, parsing

<script>
// ===== firebase-config.js =====
// =============================================================
// KONFIGURASI FIREBASE - INTEGRIDA
// =============================================================
// Config di bawah ini sudah diisi sesuai project Firebase "integrida-ee3fd".

  authDomain: "integrida-ee3fd.firebaseapp.com",

  storageBucket: "integrida-ee3fd.firebasestorage.app",
  messagingSenderId: "275935470585",
  appId: "1:275935470585:web:887c427ea862ab6b8d9328"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// Aktifkan cache offline (opsional, memudahkan pemakaian saat koneksi lemah)

<script>
// ===== db.js =====
// =============================================================
// DB.JS - Lapisan akses data Firestore untuk Integrida
// Struktur data:
// companies/{companyId}            { name, ownerUid, createdAt }
// companies/{companyId}/statements/{statementId}
//   {
//     year, periodType ('bulanan'|'triwulan'|'semester'|'tahunan'),
//     periodIndex (1..12 / 1..4 / 1..2 / 1),
//     periodLabel (contoh "Maret 2025" / "Triwulan II 2025"),
//     neraca: {...}, labaRugi: {...}, uploadedAt
//   }
// =============================================================

const DB = {
  async getCompanies(uid) {
    const snap = await db.collection('companies').where('ownerUid', '==', uid).get();
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  },

  async addCompany(uid, name) {
    const ref = await db.collection('companies').add({
      name,
      ownerUid: uid,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    return ref.id;
  },

  async deleteCompany(companyId) {
    const statements = await db.collection('companies').doc(companyId).collection('statements').get();
    const batch = db.batch();
    statements.docs.forEach(d => batch.delete(d.ref));
    batch.delete(db.collection('companies').doc(companyId));
    await batch.commit();
  },

  async getStatements(companyId) {
    const snap = await db.collection('companies').doc(companyId).collection('statements')
      .orderBy('year', 'asc').get();
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  },

  async getAllStatementsForCompanies(companyIds) {
    const results = [];
    for (const id of companyIds) {
      const statements = await this.getStatements(id);
      statements.forEach(s => results.push({ ...s, companyId: id }));
    }
    return results;
  },

  async saveStatement(companyId, statement) {
    // ID unik per periode agar impor ulang menimpa data lama (bukan duplikat)
    const statementId = `${statement.year}_${statement.periodType}_${statement.periodIndex}`;
    await db.collection('companies').doc(companyId).collection('statements').doc(statementId).set({
      ...statement,
      uploadedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    return statementId;
  },

  // Menyimpan HANYA satu kategori data (neraca / labaRugi / arusKas / bukuBesar)
  // untuk suatu periode, tanpa menimpa kategori lain yang sudah tersimpan
  // sebelumnya di periode yang sama — dipakai karena tiap kategori sekarang
  // diimpor dari file Excel yang terpisah, satu per satu.
  async saveStatementSection(companyId, period, sectionKey, sectionData) {
    const statementId = `${period.year}_${period.periodType}_${period.periodIndex}`;
    await db.collection('companies').doc(companyId).collection('statements').doc(statementId).set({
      year: period.year,
      periodType: period.periodType,
      periodIndex: period.periodIndex,
      periodLabel: period.periodLabel,
      [sectionKey]: sectionData,
      uploadedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
    return statementId;
  },

  async deleteStatement(companyId, statementId) {
    await db.collection('companies').doc(companyId).collection('statements').doc(statementId).delete();
  },

  // ===========================================================
  // REALTIME WATCHERS (untuk fitur sinkronisasi multi-device)
  // Setiap watcher mengembalikan fungsi unsubscribe(), dan memanggil
  // callback(data, meta) setiap kali ada perubahan — baik dari
  // perangkat ini sendiri maupun dari perangkat/sesi lain yang login
  // dengan akun yang sama.
  //
  // meta.pendingWrites = true  -> ada perubahan lokal yang BELUM
  //                                terkirim & terkonfirmasi ke server.
  // meta.fromCache     = true  -> data yang tampil berasal dari cache
  //                                lokal (biasanya karena sedang offline),
  //                                belum tentu versi terbaru dari server.
  // ===========================================================

  watchCompanies(uid, onData, onError) {
    return db.collection('companies').where('ownerUid', '==', uid)
      .onSnapshot({ includeMetadataChanges: true }, (snap) => {
        const companies = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        onData(companies, {
          pendingWrites: snap.metadata.hasPendingWrites,
          fromCache: snap.metadata.fromCache
        });
      }, (err) => { if (onError) onError(err); else console.error('watchCompanies error', err); });
  },

  watchStatements(companyId, onData, onError) {
    return db.collection('companies').doc(companyId).collection('statements')
      .orderBy('year', 'asc')
      .onSnapshot({ includeMetadataChanges: true }, (snap) => {
        const statements = snap.docs.map(d => ({ id: d.id, companyId, ...d.data() }));
        onData(statements, {
          pendingWrites: snap.metadata.hasPendingWrites,
          fromCache: snap.metadata.fromCache
        });
      }, (err) => { if (onError) onError(err); else console.error('watchStatements error', err); });
  },

  // Menggabungkan watcher beberapa perusahaan sekaligus jadi satu
  // callback tunggal (dipakai di Dashboard & Perbandingan).
  watchAllStatements(companyIds, onData, onError) {
    const cache = {};
    const metaMap = {};
    const emit = () => {
      const merged = companyIds.flatMap(id => cache[id] || []);
      const aggMeta = {
        pendingWrites: Object.values(metaMap).some(m => m.pendingWrites),
        fromCache: Object.values(metaMap).some(m => m.fromCache)
      };
      onData(merged, aggMeta);
    };
    const unsubs = companyIds.map(id => this.watchStatements(id, (statements, meta) => {
      cache[id] = statements;
      metaMap[id] = meta;
      emit();
    }, onError));
    return () => unsubs.forEach(u => { if (typeof u === 'function') u(); });
  }
};

</script>
<script>
// ===== import-excel.js =====
// =============================================================
// IMPORT-EXCEL.JS
// Membaca file .xlsx dengan 3 sheet: Info, Neraca, Laba Rugi
// dan menormalkannya menjadi objek statement siap simpan ke Firestore.
// =============================================================

// Kunci akun standar yang dikenali sistem (nama akun di Excel dicocokkan
// tanpa memandang huruf besar/kecil & spasi berlebih)
const AKUN_NERACA = {
  'kas dan setara kas': 'kasSetaraKas',
  'piutang usaha': 'piutangUsaha',
  'persediaan': 'persediaan',
  'aset lancar lainnya': 'asetLancarLainnya',
  'total aset lancar': 'totalAsetLancar',
  'aset tetap': 'asetTetap',
  'aset tidak lancar lainnya': 'asetTidakLancarLainnya',
  'total aset tidak lancar': 'totalAsetTidakLancar',
  'total aset': 'totalAset',
  'utang usaha': 'utangUsaha',
  'utang jangka pendek lainnya': 'utangJangkaPendekLainnya',
  'total kewajiban lancar': 'totalKewajibanLancar',
  'utang jangka panjang': 'utangJangkaPanjang',
  'total kewajiban jangka panjang': 'totalKewajibanJangkaPanjang',
  'total kewajiban': 'totalKewajiban',
  'modal saham': 'modalSaham',
  'laba ditahan': 'labaDitahan',
  'total ekuitas': 'totalEkuitas'
};

const AKUN_LABA_RUGI = {
  'pendapatan': 'pendapatan',
  'harga pokok penjualan': 'hpp',
  'laba kotor': 'labaKotor',
  'beban operasional': 'bebanOperasional',
  'laba operasional': 'labaOperasional',
  'pendapatan lainnya': 'pendapatanLainnya',
  'beban lainnya': 'bebanLainnya',
  'laba sebelum pajak': 'labaSebelumPajak',
  'pajak penghasilan': 'pajakPenghasilan',
  'laba bersih': 'labaBersih'
};

// Arus Kas: sheet opsional, memakai daftar akun baku (sama seperti
// Neraca & Laba Rugi) agar nilainya bisa dibaca terstruktur.
const AKUN_ARUS_KAS = {
  'kas awal periode': 'kasAwal',
  'arus kas dari aktivitas operasi': 'arusKasOperasi',
  'arus kas dari aktivitas investasi': 'arusKasInvestasi',
  'arus kas dari aktivitas pendanaan': 'arusKasPendanaan',
  'kenaikan (penurunan) kas bersih': 'kenaikanKasBersih',
  'kas akhir periode': 'kasAkhir'
};

function normalizeKey(s) {
  return String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
}

function sheetToKeyValue(sheet, dictionary) {
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
  const out = {};
  const unrecognized = [];
  rows.forEach(row => {
    if (!row || row.length < 2) return;
    const label = normalizeKey(row[0]);
    if (!label) return;
    const value = Number(String(row[1]).toString().replace(/[^0-9.-]/g, '')) || 0;
    if (dictionary[label]) {
      out[dictionary[label]] = value;
    } else if (row[0] && row[1] !== '') {
      unrecognized.push(row[0]);
    }
  });
  return { data: out, unrecognized };
}

// Buku Besar: sheet opsional & bebas formatnya (bukan daftar akun baku).
// Setiap baris = satu akun buku besar milik perusahaan (kode, nama, saldo),
// disimpan apa adanya sebagai referensi rincian — tidak dipakai dalam
// perhitungan rasio otomatis.
function sheetToLedgerRows(sheet) {
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
  const out = [];
  rows.forEach((row, i) => {
    if (i === 0) return; // baris pertama adalah header (Kode Akun | Nama Akun | Saldo)
    if (!row || row.length < 2) return;
    const kode = String(row[0] || '').trim();
    const nama = String(row[1] || '').trim();
    if (!nama) return;
    const saldo = Number(String(row[2] ?? '').toString().replace(/[^0-9.-]/g, '')) || 0;
    out.push({ kode, nama, saldo });
  });
  return out;
}

function readInfoSheet(sheet) {
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
  const info = {};
  rows.forEach(row => {
    const key = normalizeKey(row[0]);
    const val = row[1];
    if (key.includes('perusahaan')) info.companyName = String(val).trim();
    if (key.includes('tahun')) info.year = parseInt(val, 10);
    if (key.includes('jenis periode') || key.includes('periode')) info.periodTypeRaw = normalizeKey(val);
    if (key.includes('label')) info.periodLabel = String(val).trim();
  });
  return info;
}

const PERIOD_TYPE_MAP = {
  'bulanan': 'bulanan',
  'triwulan': 'triwulan',
  'kuartal': 'triwulan',
  'semester': 'semester',
  'tahunan': 'tahunan'
};

function inferPeriodIndex(periodType, periodLabel) {
  const label = normalizeKey(periodLabel);
  if (periodType === 'tahunan') return 1;
  const romanMatch = label.match(/\b(i|ii|iii|iv)\b/);
  const roman = { i: 1, ii: 2, iii: 3, iv: 4 };
  if (romanMatch) return roman[romanMatch[1]];
  const numMatch = label.match(/(\d+)/);
  if (numMatch) return parseInt(numMatch[1], 10);
  const bulanList = ['januari', 'februari', 'maret', 'april', 'mei', 'juni', 'juli', 'agustus', 'september', 'oktober', 'november', 'desember'];
  const idxBulan = bulanList.findIndex(b => label.includes(b));
  if (idxBulan >= 0) return idxBulan + 1;
  return 1;
}

// Registri jenis data yang bisa diimpor. Setiap jenis punya file Excel
// SENDIRI (bukan lagi digabung satu file banyak sheet) — jadi Anda bisa
// mengimpor Neraca hari ini, lalu Laba Rugi menyusul di lain waktu, untuk
// periode yang sama. Data akan digabung (merge) di dokumen periode yang sama.
const IMPORT_TYPES = {
  neraca: {
    label: 'Neraca',
    badge: 'teal',
    sheetMatch: n => n.includes('neraca'),
    dictionary: AKUN_NERACA,
    statementKey: 'neraca',
    mode: 'keyvalue',
    templateFile: 'template/Template_Import_Neraca.xlsx'
  },
  labaRugi: {
    label: 'Laba Rugi',
    badge: 'gold',
    sheetMatch: n => n.includes('laba'),
    dictionary: AKUN_LABA_RUGI,
    statementKey: 'labaRugi',
    mode: 'keyvalue',
    templateFile: 'template/Template_Import_LabaRugi.xlsx'
  },
  arusKas: {
    label: 'Arus Kas',
    badge: 'blue',
    sheetMatch: n => n.includes('arus'),
    dictionary: AKUN_ARUS_KAS,
    statementKey: 'arusKas',
    mode: 'keyvalue',
    templateFile: 'template/Template_Import_ArusKas.xlsx'
  },
  bukuBesar: {
    label: 'Buku Besar',
    badge: 'purple',
    sheetMatch: n => n.includes('buku'),
    dictionary: null,
    statementKey: 'bukuBesar',
    mode: 'ledger',
    templateFile: 'template/Template_Import_BukuBesar.xlsx'
  }
};

/**
 * Parse satu file Excel (ArrayBuffer) yang berisi SATU jenis data saja
 * (Neraca, Laba Rugi, Arus Kas, atau Buku Besar — sesuai typeKey).
 * Melempar Error dengan pesan berbahasa Indonesia jika format tidak sesuai.
 */
function parseSingleTypeExcel(arrayBuffer, typeKey) {
  const type = IMPORT_TYPES[typeKey];
  if (!type) throw new Error('Jenis data impor tidak dikenali.');

  const workbook = XLSX.read(arrayBuffer, { type: 'array' });
  const sheetNames = workbook.SheetNames.map(n => n.toLowerCase());

  const infoName = workbook.SheetNames[sheetNames.findIndex(n => n.includes('info'))];
  const dataName = workbook.SheetNames[sheetNames.findIndex(n => type.sheetMatch(n))];

  if (!dataName) {
    throw new Error(`File harus memiliki sheet "${type.label}". Gunakan template impor ${type.label} yang disediakan (bukan file jenis lain).`);
  }

  const info = infoName ? readInfoSheet(workbook.Sheets[infoName]) : {};
  if (!info.year) {
    throw new Error('Sheet "Info" harus mencantumkan baris "Tahun" dengan nilai tahun laporan (contoh: 2025).');
  }
  const periodType = PERIOD_TYPE_MAP[info.periodTypeRaw] || 'tahunan';
  const periodIndex = inferPeriodIndex(periodType, info.periodLabel || '');

  let data, warnings = [];
  if (type.mode === 'ledger') {
    data = sheetToLedgerRows(workbook.Sheets[dataName]);
  } else {
    const result = sheetToKeyValue(workbook.Sheets[dataName], type.dictionary);
    data = result.data;
    warnings = result.unrecognized.map(a => `Akun tidak dikenali dan dilewati: "${a}"`);
  }

  return {
    typeKey,
    typeLabel: type.label,
    badge: type.badge,
    statementKey: type.statementKey,
    companyName: info.companyName || '',
    period: {
      year: info.year,
      periodType,
      periodIndex,
      periodLabel: info.periodLabel || `${periodType} ${periodIndex} ${info.year}`
    },
    data,
    warnings
  };
}

<script>
// ===== analysis.js =====
// =============================================================
// ANALYSIS.JS
// Perhitungan rasio keuangan dari satu objek statement
// (neraca + labaRugi). Semua fungsi aman terhadap pembagian 0.
// =============================================================

function safeDiv(a, b) {
  if (!b) return null;
  return a / b;
}

function computeRatios(statement) {
  const n = statement.neraca || {};
  const l = statement.labaRugi || {};

  const totalAsetLancar = n.totalAsetLancar || 0;
  const totalKewajibanLancar = n.totalKewajibanLancar || 0;
  const persediaan = n.persediaan || 0;
  const totalAset = n.totalAset || 0;
  const totalKewajiban = n.totalKewajiban || 0;
  const totalEkuitas = n.totalEkuitas || 0;
  const kasSetaraKas = n.kasSetaraKas || 0;

  const pendapatan = l.pendapatan || 0;
  const labaKotor = l.labaKotor || 0;
  const labaOperasional = l.labaOperasional || 0;
  const labaBersih = l.labaBersih || 0;

  return {
    likuiditas: {
      currentRatio: safeDiv(totalAsetLancar, totalKewajibanLancar),
      quickRatio: safeDiv(totalAsetLancar - persediaan, totalKewajibanLancar),
      cashRatio: safeDiv(kasSetaraKas, totalKewajibanLancar)
    },
    solvabilitas: {
      debtToAssetRatio: safeDiv(totalKewajiban, totalAset),
      debtToEquityRatio: safeDiv(totalKewajiban, totalEkuitas),
      equityMultiplier: safeDiv(totalAset, totalEkuitas)
    },
    profitabilitas: {
      grossProfitMargin: safeDiv(labaKotor, pendapatan),
      operatingMargin: safeDiv(labaOperasional, pendapatan),
      netProfitMargin: safeDiv(labaBersih, pendapatan),
      roa: safeDiv(labaBersih, totalAset),
      roe: safeDiv(labaBersih, totalEkuitas)
    }
  };
}

const RATIO_LABELS = {
  currentRatio: { label: 'Current Ratio', fmt: 'x', desc: 'Aset lancar dibagi kewajiban lancar. Idealnya > 1.5–2x.' },
  quickRatio: { label: 'Quick Ratio', fmt: 'x', desc: '(Aset lancar - persediaan) dibagi kewajiban lancar.' },
  cashRatio: { label: 'Cash Ratio', fmt: 'x', desc: 'Kas & setara kas dibagi kewajiban lancar.' },
  debtToAssetRatio: { label: 'Debt to Asset Ratio', fmt: '%', desc: 'Proporsi aset yang dibiayai utang. Makin rendah makin aman.' },
  debtToEquityRatio: { label: 'Debt to Equity Ratio', fmt: 'x', desc: 'Total kewajiban dibagi ekuitas.' },
  equityMultiplier: { label: 'Equity Multiplier', fmt: 'x', desc: 'Total aset dibagi ekuitas (tingkat leverage).' },
  grossProfitMargin: { label: 'Gross Profit Margin', fmt: '%', desc: 'Laba kotor dibagi pendapatan.' },
  operatingMargin: { label: 'Operating Margin', fmt: '%', desc: 'Laba operasional dibagi pendapatan.' },
  netProfitMargin: { label: 'Net Profit Margin', fmt: '%', desc: 'Laba bersih dibagi pendapatan.' },
  roa: { label: 'Return on Assets (ROA)', fmt: '%', desc: 'Laba bersih dibagi total aset.' },
  roe: { label: 'Return on Equity (ROE)', fmt: '%', desc: 'Laba bersih dibagi total ekuitas.' }
};

function formatRatio(value, fmt) {
  if (value === null || value === undefined || isNaN(value)) return '–';
  if (fmt === '%') return (value * 100).toFixed(1) + '%';
  return value.toFixed(2) + 'x';
}

// APP.JS - Inti aplikasi Integrida

// =============================================================
// SYNC — indikator status sinkronisasi lintas perangkat
// =============================================================
const SYNC_META = {
  connecting: { dot: '#9aa3b2', label: 'Menghubungkan…', pulse: true },
  synced:     { dot: '#1B7A6B', label: 'Tersinkron',      pulse: false },
  syncing:    { dot: '#C08A3E', label: 'Menyinkronkan…',  pulse: true },
  offline:    { dot: '#B5453B', label: 'Offline',         pulse: false }
};

const Sync = {
  sources: {},          // key -> { pendingWrites, fromCache }
  status: 'connecting',
  lastSyncedAt: null,

  report(key, meta) { this.sources[key] = meta; this.recompute(); },
  clear(key) { delete this.sources[key]; this.recompute(); },
  reset() { this.sources = {}; this.status = 'connecting'; this.lastSyncedAt = null; renderSyncBadge(); },

  recompute() {
    const metas = Object.values(this.sources);
    if (!navigator.onLine) {
      this.status = 'offline';
    } else if (metas.some(m => m.pendingWrites)) {
      this.status = 'syncing';
    } else if (metas.length > 0 && metas.every(m => m.fromCache)) {
      // Semua listener masih menyajikan data dari cache lokal
      // (misal koneksi ke server Firestore belum berhasil).
      this.status = 'offline';
    } else if (metas.length > 0) {
      this.status = 'synced';
      this.lastSyncedAt = new Date();
    }
    renderSyncBadge();
  }
};

window.addEventListener('online', () => Sync.recompute());
window.addEventListener('offline', () => Sync.recompute());

function renderSyncBadge() {
  const badge = document.getElementById('sync-badge');
  if (!badge) return;
  const m = SYNC_META[Sync.status] || SYNC_META.connecting;
  const timeStr = Sync.lastSyncedAt
    ? Sync.lastSyncedAt.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })
    : '';
  badge.className = 'sync-badge' + (m.pulse ? ' pulse' : '');
  badge.title = Sync.status === 'synced'
    ? `Semua data tersinkron ke server pukul ${timeStr}. Perangkat lain yang login dengan akun yang sama akan melihat data yang sama.`
    : Sync.status === 'syncing'
      ? 'Sedang mengirim perubahan ke server…'
      : Sync.status === 'offline'
        ? 'Tidak ada koneksi ke server. Perubahan disimpan secara lokal dan akan disinkronkan otomatis saat koneksi kembali.'
        : 'Menghubungkan ke server…';
  badge.innerHTML = `<span class="sync-dot" style="background:${m.dot}"></span><span>${m.label}</span>${Sync.status === 'synced' && timeStr ? `<span class="sync-time">${timeStr}</span>` : ''}`;
}

  bars: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/>',

  const root = document.getElementById('view-root');
  if (state.companies.length === 0) {
    root.innerHTML = emptyState('Belum ada perusahaan', 'Tambahkan perusahaan lalu impor data laporan keuangan untuk melihat ringkasan di sini.', 'companies', 'Tambah Perusahaan');
    bindEmptyStateNav(root);
    return;
  }
  root.innerHTML = `<div class="section-block"><div class="section-title">Memuat ringkasan…</div></div>`;

  const companyIds = state.companies.map(c => c.id);
  // Listener realtime: ringkasan otomatis diperbarui begitu ada data baru
  // diimpor dari perangkat manapun, tanpa perlu memuat ulang halaman.
  state.unsubData = DB.watchAllStatements(companyIds, (allStatements, meta) => {
    Sync.report('statements', meta);
    if (state.view === 'dashboard') paintDashboard(allStatements);
  }, (err) => toast('Gagal memuat data laporan: ' + err.message, 'error'));
}

function paintDashboard(allStatements) {
  const root = document.getElementById('view-root');
  const latestByCompany = {};
  allStatements.forEach(s => {
    const cur = latestByCompany[s.companyId];
    if (!cur || s.year > cur.year || (s.year === cur.year && s.periodIndex > cur.periodIndex)) {
      latestByCompany[s.companyId] = s;
    }
  });
  const latestList = Object.values(latestByCompany);
  const sumTotalAset = latestList.reduce((a, s) => a + (s.neraca.totalAset || 0), 0);
  const sumPendapatan = latestList.reduce((a, s) => a + (s.labaRugi.pendapatan || 0), 0);
  const sumLabaBersih = latestList.reduce((a, s) => a + (s.labaRugi.labaBersih || 0), 0);
  const avgCurrentRatio = latestList.length
    ? latestList.reduce((a, s) => a + (computeRatios(s).likuiditas.currentRatio || 0), 0) / latestList.length
    : 0;

  root.innerHTML = `
    <div class="section-block grid grid-4">
      <div class="card kpi-card">
        <div class="kpi-label">Total Perusahaan</div>
        <div class="kpi-value">${state.companies.length}</div>
      </div>
      <div class="card kpi-card">
        <div class="kpi-label">Total Aset (periode terbaru)</div>
        <div class="kpi-value">${formatIDR(sumTotalAset)}</div>
      </div>
      <div class="card kpi-card">
        <div class="kpi-label">Total Pendapatan (periode terbaru)</div>
        <div class="kpi-value">${formatIDR(sumPendapatan)}</div>
      </div>
      <div class="card kpi-card">
        <div class="kpi-label">Rata-rata Current Ratio</div>
        <div class="kpi-value">${avgCurrentRatio.toFixed(2)}x</div>
      </div>
    </div>

    <div class="section-block grid grid-2">
      <div class="chart-box">
        <div class="section-title">Total Aset per Perusahaan (Periode Terbaru)</div>
        <canvas id="chart-aset"></canvas>
      </div>
      <div class="chart-box">
        <div class="section-title">Laba Bersih per Perusahaan (Periode Terbaru)</div>
        <canvas id="chart-laba"></canvas>
      </div>
    </div>

    <div class="section-block">
      <div class="section-title">Ringkasan Perusahaan</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Perusahaan</th><th>Periode Terbaru</th><th class="num">Total Aset</th><th class="num">Pendapatan</th><th class="num">Laba Bersih</th><th class="num">Current Ratio</th></tr></thead>
          <tbody>
            ${state.companies.map(c => {
              const s = latestByCompany[c.id];
              if (!s) return `<tr><td>${c.name}</td><td colspan="5" style="text-align:left;color:var(--slate-light);">Belum ada data</td></tr>`;
              const r = computeRatios(s);
              return `<tr>
                <td>${c.name}</td>
                <td>${s.periodLabel}</td>
                <td class="num">${formatIDR(s.neraca.totalAset)}</td>
                <td class="num">${formatIDR(s.labaRugi.pendapatan)}</td>
                <td class="num">${formatIDR(s.labaRugi.labaBersih)}</td>
                <td class="num">${formatRatio(r.likuiditas.currentRatio, 'x')}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  const labels = latestList.map(s => state.companies.find(c => c.id === s.companyId)?.name || '?');
  renderBarChart('chart-aset', labels, [{ label: 'Total Aset', data: latestList.map(s => s.neraca.totalAset || 0), color: '#1B7A6B' }]);
  renderBarChart('chart-laba', labels, [{ label: 'Laba Bersih', data: latestList.map(s => s.labaRugi.labaBersih || 0), color: '#C08A3E' }]);
}

function emptyState(title, desc, navTarget, actionLabel) {
  return `<div class="card empty-state">
    <div class="mark">📊</div>
    <h3 style="margin:6px 0;font-family:var(--font-display);">${title}</h3>
    <p style="max-width:420px;margin:0 auto 16px auto;">${desc}</p>
    <button class="btn primary" data-nav="${navTarget}">${actionLabel}</button>
  </div>`;
}
function bindEmptyStateNav(root) {
  const btn = root.querySelector('[data-nav]');
  if (btn) btn.addEventListener('click', () => setView(btn.dataset.nav));
}

// ---------- Perusahaan ----------
function renderCompanies() {
  const root = document.getElementById('view-root');
  root.innerHTML = `
    <div class="section-block" style="display:flex;justify-content:flex-end;">
      <button class="btn primary" id="add-company-btn">+ Tambah Perusahaan</button>
    </div>
    ${state.companies.length === 0 ? emptyState('Belum ada perusahaan', 'Mulai dengan menambahkan perusahaan pertama Anda.', '', '') : `
    <div class="table-wrap">
      <table>
        <thead><tr><th>Nama Perusahaan</th><th class="num">Jumlah Periode Tersimpan</th><th></th></tr></thead>
        <tbody id="company-rows"></tbody>
      </table>
    </div>`}
  `;
  document.getElementById('add-company-btn').addEventListener('click', openAddCompanyModal);
  if (state.companies.length) fillCompanyRows();
}

async function fillCompanyRows() {
  const tbody = document.getElementById('company-rows');
  tbody.innerHTML = state.companies.map(c => `<tr data-id="${c.id}"><td>${c.name}</td><td class="num">…</td><td style="text-align:right;"><button class="btn ghost" data-del="${c.id}">Hapus</button></td></tr>`).join('');
  for (const c of state.companies) {
    const statements = await DB.getStatements(c.id);
    const row = tbody.querySelector(`tr[data-id="${c.id}"] td:nth-child(2)`);
    if (row) row.textContent = statements.length;
  }
  tbody.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Hapus perusahaan ini beserta seluruh data laporannya?')) return;
      await DB.deleteCompany(btn.dataset.del);
      toast('Perusahaan dihapus', 'success');
      await reloadCompanies();
    });
  });
}

function openAddCompanyModal() {
  const backdrop = el(`<div class="modal-backdrop"><div class="modal">
    <h3>Tambah Perusahaan</h3>
    <div class="modal-sub">Perusahaan yang akan dikonsolidasikan laporan keuangannya.</div>
    <div class="field"><label>Nama Perusahaan</label><input type="text" id="new-company-name" placeholder="Contoh: PT Sumber Makmur"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="cancel-modal">Batal</button>
      <button class="btn primary" id="save-company">Simpan</button>
    </div>
  </div></div>`);
  document.body.appendChild(backdrop);
  backdrop.querySelector('#cancel-modal').addEventListener('click', () => backdrop.remove());
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) backdrop.remove(); });
  backdrop.querySelector('#save-company').addEventListener('click', async () => {
    const name = backdrop.querySelector('#new-company-name').value.trim();
    if (!name) { toast('Nama perusahaan wajib diisi', 'error'); return; }
    await DB.addCompany(state.user.uid, name);
    backdrop.remove();
    toast('Perusahaan ditambahkan', 'success');
    await reloadCompanies();
  });
}

// ---------- Import ----------
function renderImport() {
  const root = document.getElementById('view-root');
  if (state.companies.length === 0) {
    root.innerHTML = emptyState('Tambahkan perusahaan terlebih dahulu', 'Anda perlu memiliki minimal satu perusahaan sebelum mengimpor data.', 'companies', 'Tambah Perusahaan');
    bindEmptyStateNav(root);
    return;
  }
  if (!state.importCompanyId || !state.companies.find(c => c.id === state.importCompanyId)) {
    state.importCompanyId = state.companies[0].id;
  }

  root.innerHTML = `
    <div class="grid grid-2" style="align-items:start;">
      <div class="card">
        <div class="section-title">1. Pilih Perusahaan Tujuan</div>
        <div class="field">
          <label>Perusahaan</label>
          <select id="import-company">
            ${state.companies.map(c => `<option value="${c.id}" ${c.id === state.importCompanyId ? 'selected' : ''}>${c.name}</option>`).join('')}
          </select>
        </div>

        <div class="section-title" style="margin-top:20px;">2. Pilih Jenis Data</div>
        <div class="pill-row" id="import-type-pills">
          ${Object.entries(IMPORT_TYPES).map(([key, t]) => `<div class="pill ${state.importType === key ? 'active' : ''}" data-type="${key}">${t.label}</div>`).join('')}
        </div>
        <div style="font-size:11.5px;color:var(--slate);margin:-6px 0 16px 0;line-height:1.5;">
          Setiap jenis data diimpor dari file Excel <strong>terpisah</strong> — satu file khusus untuk satu jenis data saja
          (bukan satu file berisi semua laporan). Anda bisa mengimpor tiap jenis di waktu yang berbeda untuk periode yang sama;
          data yang sudah tersimpan sebelumnya tidak akan tertimpa.
        </div>

        <div class="section-title">3. Unggah File Excel</div>
        <div class="dropzone" id="dropzone">
          ${icon('upload')}
          <div>Seret file .xlsx <strong id="dropzone-type-label"></strong> ke sini, atau klik untuk memilih</div>
          <div style="font-size:11.5px;margin-top:6px;">File harus berisi sheet "Info" dan sheet data sesuai jenis yang dipilih di atas</div>
        </div>
        <input type="file" id="file-input" accept=".xlsx,.xls" style="display:none;">
        <a href="#" download class="btn ghost" id="download-template-btn" style="margin-top:14px;width:100%;justify-content:center;"></a>
      </div>
      <div class="card" id="preview-panel">
        <div class="section-title">Pratinjau Data</div>
        <div style="color:var(--slate);font-size:13px;">Belum ada file dipilih.</div>
      </div>
    </div>

    <div class="section-block" style="margin-top:24px;">
      <div class="section-title">Status Data per Periode — <span id="import-status-company-name" style="color:var(--slate);font-weight:500;"></span></div>
      <div id="import-status-table"><div class="card" style="color:var(--slate);">Memuat status…</div></div>
    </div>
  `;

  updateDropzoneAndTemplate();
  loadImportStatus();

  document.getElementById('import-company').addEventListener('change', (e) => {
    state.importCompanyId = e.target.value;
    resetPreview();
    loadImportStatus();
  });

  document.querySelectorAll('#import-type-pills .pill').forEach(p => {
    p.addEventListener('click', () => {
      state.importType = p.dataset.type;
      document.querySelectorAll('#import-type-pills .pill').forEach(x => x.classList.toggle('active', x === p));
      updateDropzoneAndTemplate();
      resetPreview();
    });
  });

  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('file-input');
  dropzone.addEventListener('click', () => fileInput.click());
  ['dragenter', 'dragover'].forEach(evt => dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.add('drag'); }));
  ['dragleave', 'drop'].forEach(evt => dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.remove('drag'); }));
  dropzone.addEventListener('drop', (e) => { if (e.dataTransfer.files[0]) handleImportFile(e.dataTransfer.files[0]); });
  fileInput.addEventListener('change', (e) => { if (e.target.files[0]) handleImportFile(e.target.files[0]); });
}

function updateDropzoneAndTemplate() {
  const type = IMPORT_TYPES[state.importType];
  const label = document.getElementById('dropzone-type-label');
  if (label) label.textContent = type.label;
  const templateBtn = document.getElementById('download-template-btn');
  if (templateBtn) {
    templateBtn.href = type.templateFile;
    templateBtn.textContent = `Unduh Template ${type.label}`;
  }
}

function resetPreview() {
  pendingImport = null;
  const panel = document.getElementById('preview-panel');
  if (panel) panel.innerHTML = `<div class="section-title">Pratinjau Data</div><div style="color:var(--slate);font-size:13px;">Belum ada file dipilih.</div>`;
}

function hasSectionData(v) {
  if (v === undefined || v === null) return false;
  if (Array.isArray(v)) return v.length > 0;
  if (typeof v === 'object') return Object.keys(v).length > 0;
  return true;
}

async function loadImportStatus() {
  const company = state.companies.find(c => c.id === state.importCompanyId);
  const nameEl = document.getElementById('import-status-company-name');
  if (nameEl) nameEl.textContent = company ? company.name : '';
  const tableEl = document.getElementById('import-status-table');
  if (!tableEl) return;
  const statements = (await DB.getStatements(state.importCompanyId)).sort((a, b) => a.year - b.year || a.periodIndex - b.periodIndex);
  if (statements.length === 0) {
    tableEl.innerHTML = `<div class="card" style="color:var(--slate);">Belum ada data yang diimpor untuk perusahaan ini.</div>`;
    return;
  }
  const mark = (ok) => ok ? '<span style="color:var(--teal);font-weight:600;">✓ Ada</span>' : '<span style="color:var(--slate-light);">– Belum</span>';
  tableEl.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead><tr><th>Periode</th><th>Neraca</th><th>Laba Rugi</th><th>Arus Kas</th><th>Buku Besar</th></tr></thead>
        <tbody>
          ${statements.map(s => `<tr>
            <td>${s.periodLabel}</td>
            <td>${mark(hasSectionData(s.neraca))}</td>
            <td>${mark(hasSectionData(s.labaRugi))}</td>
            <td>${mark(hasSectionData(s.arusKas))}</td>
            <td>${mark(hasSectionData(s.bukuBesar))}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

let pendingImport = null;

async function handleImportFile(file) {
  const panel = document.getElementById('preview-panel');
  try {
    const buffer = await file.arrayBuffer();
    const result = parseSingleTypeExcel(buffer, state.importType);
    pendingImport = result;

    panel.innerHTML = `
      <div class="section-title">Pratinjau Data</div>
      <div style="font-size:13px;margin-bottom:10px;">
        ${result.companyName ? `<strong>${result.companyName}</strong><br>` : ''}
        Periode: ${result.period.periodLabel} &middot; Jenis: ${PERIOD_LABELS[result.period.periodType]} &middot; Tahun: ${result.period.year}
      </div>
      <div class="badge ${result.badge}">${result.typeLabel}</div>
      ${result.warnings.length ? `<div class="ratio-note" style="margin-top:8px;">${result.warnings.join('<br>')}</div>` : ''}
      <table style="margin-top:10px;">
        ${result.statementKey === 'bukuBesar'
          ? `<thead><tr><th>Kode</th><th>Nama Akun</th><th class="num">Saldo</th></tr></thead>
             <tbody>${result.data.map(r => `<tr><td>${r.kode || '–'}</td><td>${r.nama}</td><td class="num">${formatIDR(r.saldo)}</td></tr>`).join('') || '<tr><td colspan="3">Tidak ada data terbaca</td></tr>'}</tbody>`
          : `<tbody>${Object.entries(result.data).map(([k, v]) => `<tr><td>${k}</td><td class="num">${formatIDR(v)}</td></tr>`).join('') || '<tr><td colspan="2">Tidak ada data terbaca</td></tr>'}</tbody>`}
      </table>
      <div class="ratio-note" style="margin-top:12px;">
        Data ini akan disimpan sebagai bagian <strong>${result.typeLabel}</strong> untuk periode <strong>${result.period.periodLabel}</strong>.
        Jenis data lain yang sudah pernah diimpor untuk periode yang sama (jika ada) tidak akan tertimpa.
      </div>
      <button class="btn primary" id="confirm-import" style="margin-top:16px;width:100%;justify-content:center;">Simpan ke Sistem</button>
    `;
    document.getElementById('confirm-import').addEventListener('click', confirmImport);
  } catch (err) {
    panel.innerHTML = `<div class="section-title">Pratinjau Data</div><div class="auth-error">${err.message}</div>`;
  }
}

async function confirmImport() {
  const companyId = document.getElementById('import-company').value;
  if (!pendingImport) return;
  await DB.saveStatementSection(companyId, pendingImport.period, pendingImport.statementKey, pendingImport.data);
  toast(`Data ${pendingImport.typeLabel} berhasil disimpan`, 'success');
  pendingImport = null;
  renderImport();
}

// ---------- Perbandingan ----------
function renderCompare() {
  teardownActiveDataListener();
  const root = document.getElementById('view-root');
  if (state.companies.length === 0) {
    root.innerHTML = emptyState('Belum ada perusahaan', 'Tambahkan perusahaan dan data untuk mulai membandingkan.', 'companies', 'Tambah Perusahaan');
    bindEmptyStateNav(root);
    return;
  }
  root.innerHTML = `
    <div class="section-block">
      <div class="pill-row" id="company-pills">
        ${state.companies.map(c => `<div class="pill ${state.compareCompanyIds.includes(c.id) ? 'active' : ''}" data-id="${c.id}">${c.name}</div>`).join('')}
      </div>
      <div class="pill-row" id="period-pills">
        ${Object.entries(PERIOD_LABELS).map(([k, v]) => `<div class="pill ${state.comparePeriodType === k ? 'active' : ''}" data-period="${k}">${v}</div>`).join('')}
      </div>
    </div>
    <div id="compare-result"><div class="card" style="color:var(--slate);">Pilih minimal satu perusahaan untuk melihat perbandingan.</div></div>
  `;

  document.querySelectorAll('#company-pills .pill').forEach(p => {
    p.addEventListener('click', () => {
      const id = p.dataset.id;
      const idx = state.compareCompanyIds.indexOf(id);
      if (idx >= 0) state.compareCompanyIds.splice(idx, 1); else state.compareCompanyIds.push(id);
      renderCompare();
    });
  });
  document.querySelectorAll('#period-pills .pill').forEach(p => {
    p.addEventListener('click', () => { state.comparePeriodType = p.dataset.period; renderCompare(); });
  });

  if (state.compareCompanyIds.length === 0) return;

  // Listener realtime untuk kombinasi perusahaan yang dipilih.
  state.unsubData = DB.watchAllStatements(state.compareCompanyIds, (allStatements, meta) => {
    Sync.report('statements', meta);
    if (state.view !== 'compare') return;
    const statements = allStatements
      .filter(s => s.periodType === state.comparePeriodType)
      .sort((a, b) => a.year - b.year || a.periodIndex - b.periodIndex);
    paintCompare(statements);
  }, (err) => toast('Gagal memuat data laporan: ' + err.message, 'error'));
}

function paintCompare(statements) {
  const resultEl = document.getElementById('compare-result');
  if (!resultEl) return;
  if (statements.length === 0) {
    resultEl.innerHTML = `<div class="card" style="color:var(--slate);">Tidak ada data dengan jenis periode "${PERIOD_LABELS[state.comparePeriodType]}" untuk perusahaan terpilih.</div>`;
    return;
  }

  const periodKeys = [...new Set(statements.map(s => `${s.year}-${s.periodIndex}-${s.periodLabel}`))]
    .sort();

  resultEl.innerHTML = `
    <div class="section-block grid grid-2">
      <div class="chart-box"><div class="section-title">Total Aset per Periode</div><canvas id="cmp-aset"></canvas></div>
      <div class="chart-box"><div class="section-title">Laba Bersih per Periode</div><canvas id="cmp-laba"></canvas></div>
    </div>
    <div class="section-block">
      <div class="section-title">Tabel Perbandingan</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Perusahaan</th><th>Periode</th><th class="num">Total Aset</th><th class="num">Total Kewajiban</th><th class="num">Ekuitas</th><th class="num">Pendapatan</th><th class="num">Laba Bersih</th></tr></thead>
          <tbody>
            ${statements.map(s => `<tr>
              <td>${state.companies.find(c => c.id === s.companyId)?.name}</td>
              <td>${s.periodLabel}</td>
              <td class="num">${formatIDR(s.neraca.totalAset)}</td>
              <td class="num">${formatIDR(s.neraca.totalKewajiban)}</td>
              <td class="num">${formatIDR(s.neraca.totalEkuitas)}</td>
              <td class="num">${formatIDR(s.labaRugi.pendapatan)}</td>
              <td class="num">${formatIDR(s.labaRugi.labaBersih)}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  const datasetsAset = state.compareCompanyIds.map((id, i) => {
    const company = state.companies.find(c => c.id === id);
    const byPeriod = {};
    statements.filter(s => s.companyId === id).forEach(s => byPeriod[`${s.year}-${s.periodIndex}-${s.periodLabel}`] = s.neraca.totalAset || 0);
    return { label: company.name, data: periodKeys.map(k => byPeriod[k] ?? null), color: palette(i) };
  });
  const datasetsLaba = state.compareCompanyIds.map((id, i) => {
    const company = state.companies.find(c => c.id === id);
    const byPeriod = {};
    statements.filter(s => s.companyId === id).forEach(s => byPeriod[`${s.year}-${s.periodIndex}-${s.periodLabel}`] = s.labaRugi.labaBersih || 0);
    return { label: company.name, data: periodKeys.map(k => byPeriod[k] ?? null), color: palette(i) };
  });

  const labels = periodKeys.map(k => k.split('-').slice(2).join('-'));
  renderLineChart('cmp-aset', labels, datasetsAset);
  renderLineChart('cmp-laba', labels, datasetsLaba);
}

function palette(i) {
  const colors = ['#1B7A6B', '#C08A3E', '#B5453B', '#3B5BA5', '#7A5CC0', '#2D9CDB'];
  return colors[i % colors.length];
}

// ---------- Rasio ----------
function renderRatios() {
  teardownActiveDataListener();
  const root = document.getElementById('view-root');
  if (state.companies.length === 0) {
    root.innerHTML = emptyState('Belum ada perusahaan', 'Tambahkan perusahaan dan data untuk melihat analisis rasio.', 'companies', 'Tambah Perusahaan');
    bindEmptyStateNav(root);
    return;
  }
  if (!state.ratioCompanyId) state.ratioCompanyId = state.companies[0].id;

  root.innerHTML = `
    <div class="section-block" style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;">
      <div class="field" style="margin:0;min-width:220px;">
        <label>Perusahaan</label>
        <select id="ratio-company">
          ${state.companies.map(c => `<option value="${c.id}" ${c.id === state.ratioCompanyId ? 'selected' : ''}>${c.name}</option>`).join('')}
        </select>
      </div>
    </div>
    <div id="ratio-content"></div>
  `;
  document.getElementById('ratio-company').addEventListener('change', (e) => {
    state.ratioCompanyId = e.target.value;
    renderRatios();
  });

  // Listener realtime: analisis rasio otomatis diperbarui saat ada
  // periode baru yang diimpor dari perangkat manapun.
  state.unsubData = DB.watchStatements(state.ratioCompanyId, (rawStatements, meta) => {
    Sync.report('statements', meta);
    if (state.view !== 'ratios') return;
    const statements = rawStatements.sort((a, b) => a.year - b.year || a.periodIndex - b.periodIndex);
    paintRatios(statements);
  }, (err) => toast('Gagal memuat data laporan: ' + err.message, 'error'));
}

function paintRatios(statements) {
  const content = document.getElementById('ratio-content');
  if (!content) return;
  if (statements.length === 0) {
    content.innerHTML = `<div class="card" style="color:var(--slate);margin-top:16px;">Belum ada data laporan keuangan untuk perusahaan ini.</div>`;
    return;
  }
  const latest = statements[statements.length - 1];
  const ratios = computeRatios(latest);

  function ratioGroup(title, groupKey, badgeClass) {
    return `<div class="section-block">
      <div class="section-title"><span class="badge ${badgeClass}">${title}</span></div>
      <div class="grid grid-3">
        ${Object.entries(ratios[groupKey]).map(([key, val]) => `
          <div class="card kpi-card">
            <div class="kpi-label">${RATIO_LABELS[key].label}</div>
            <div class="kpi-value">${formatRatio(val, RATIO_LABELS[key].fmt)}</div>
            <div class="ratio-note" style="margin-top:2px;">${RATIO_LABELS[key].desc}</div>
          </div>
        `).join('')}
      </div>
    </div>`;
  }

  content.innerHTML = `
    <div style="margin:14px 0;color:var(--slate);font-size:13px;">Data periode terbaru: <strong>${latest.periodLabel}</strong></div>
    ${ratioGroup('Likuiditas', 'likuiditas', 'teal')}
    ${ratioGroup('Solvabilitas', 'solvabilitas', 'gold')}
    ${ratioGroup('Profitabilitas', 'profitabilitas', 'danger')}
    <div class="section-block">
      <div class="section-title">Tren Rasio Utama Antar Periode</div>
      <div class="chart-box"><canvas id="ratio-trend"></canvas></div>
    </div>
  `;

  const trendLabels = statements.map(s => s.periodLabel);
  const trendData = statements.map(s => computeRatios(s));
  renderLineChart('ratio-trend', trendLabels, [
    { label: 'Current Ratio', data: trendData.map(r => r.likuiditas.currentRatio), color: '#1B7A6B' },
    { label: 'Debt to Equity', data: trendData.map(r => r.solvabilitas.debtToEquityRatio), color: '#C08A3E' },
    { label: 'Net Profit Margin', data: trendData.map(r => r.profitabilitas.netProfitMargin), color: '#B5453B' }
  ]);
}

// ---------- Pengaturan ----------
function renderSettings() {
  const root = document.getElementById('view-root');
  root.innerHTML = `
    <div class="card" style="max-width:520px;">
      <div class="section-title">Akun</div>
      <p style="font-size:13.5px;color:var(--slate);">Masuk sebagai <strong>${state.user.email}</strong></p>
      <div class="section-title" style="margin-top:20px;">Tentang Integrida</div>
      <p style="font-size:13.5px;color:var(--slate);line-height:1.6;">
        Integrida adalah aplikasi konsolidasi laporan keuangan untuk beberapa perusahaan.
        Data neraca dan laba rugi diimpor dari Excel, kemudian dibandingkan per bulan, triwulan,
        semester, maupun tahunan, lengkap dengan analisis likuiditas, solvabilitas, dan profitabilitas.
        Seluruh data tersimpan pada Firebase project yang Anda konfigurasikan sendiri.
      </p>
      <button class="btn ghost" id="logout-btn-2">Keluar dari akun</button>
    </div>
  `;
  document.getElementById('logout-btn-2').addEventListener('click', () => auth.signOut());
}

// ---------- Charts ----------
function destroyChart(id) {
  if (state.chartInstances[id]) { state.chartInstances[id].destroy(); delete state.chartInstances[id]; }
}

function renderBarChart(canvasId, labels, datasets) {
  destroyChart(canvasId);
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;
  state.chartInstances[canvasId] = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: datasets.map(d => ({ label: d.label, data: d.data, backgroundColor: d.color, borderRadius: 5 })) },
    options: { responsive: true, plugins: { legend: { display: datasets.length > 1 } }, scales: { y: { beginAtZero: true } } }
  });
}

function renderLineChart(canvasId, labels, datasets) {
  destroyChart(canvasId);
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;
  state.chartInstances[canvasId] = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets: datasets.map(d => ({ label: d.label, data: d.data, borderColor: d.color, backgroundColor: d.color, tension: 0.3, spanGaps: true })) },
    options: { responsive: true, plugins: { legend: { display: true } } }
  });
}

// ---------- Bootstrap ----------
auth.onAuthStateChanged(async (user) => {
  if (state.unsubCompanies) { state.unsubCompanies(); state.unsubCompanies = null; }
  teardownActiveDataListener();
  Sync.reset();

  if (user) {
    state.user = user;
    renderShell();
    // Listener realtime: daftar perusahaan otomatis ter-update begitu ada
    // perubahan — baik dari tab/perangkat ini maupun dari perangkat lain
    // yang login dengan akun yang sama. Ini juga memberi tahu status
    // sinkronisasi (badge di topbar).
    state.unsubCompanies = DB.watchCompanies(user.uid, (companies, meta) => {
      state.companies = companies;
      Sync.report('companies', meta);
      const safeToRerender = ['dashboard', 'companies', 'compare', 'ratios'].includes(state.view)
        && !document.querySelector('.modal-backdrop');
      if (safeToRerender) renderCurrentView();
    }, (err) => toast('Gagal memuat data perusahaan: ' + err.message, 'error'));
    setView('dashboard');
  } else {
    state.user = null;
    renderAuthScreen('login');
  }
});

</script>

if ('serviceWorker' in navigator) {

  });
