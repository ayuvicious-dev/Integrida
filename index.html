<meta name="theme-color" content="#16213A">
<script>
// Anti-FOUC: terapkan tema tersimpan (atau preferensi sistem) SEBELUM CSS
// & body dirender, supaya tidak ada kedipan terang sesaat pada dark mode.
(function () {
  try {
    var saved = localStorage.getItem('integrida-theme');
    var theme = saved === 'dark' || saved === 'light'
      ? saved
      : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  } catch (e) {}
})();
// Anti-FOUC: terapkan ukuran font tersimpan SEBELUM halaman dirender,
// supaya tidak ada "lompatan" ukuran sesaat setelah load (lihat fungsi
// applyFontSize() di bagian JS untuk penjelasan lengkap). Nilainya
// dipasang sbg CSS custom property --app-zoom, BUKAN langsung ke
// document.documentElement.style.zoom — supaya elemen position:fixed
// (sidebar, bottom-nav, FAB, modal, toast) tidak ikut ter-zoom & jadi
// salah posisi/terpotong di sebagian browser mobile (lihat komentar
// pada aturan CSS ".main{zoom:...}" / ".modal{zoom:...}").
(function () {
  try {
    var FONT_SIZE_ZOOM = { kecil: '90%', normal: '100%', besar: '112%', 'sangat-besar': '125%' };
    var saved = localStorage.getItem('integrida-font-size');
    document.documentElement.style.setProperty('--app-zoom', FONT_SIZE_ZOOM[saved] || FONT_SIZE_ZOOM.normal);
  } catch (e) {}
})();
</script>

  /* Warna aksen brand (tetap sama di light & dark mode, dipakai untuk
     tombol utama, badge sinkron, toast, dsb — bukan warna teks/latar
     konten yang perlu berganti antar tema). */
  --ink:#16213A;
  --ink-soft:#22314f;
  --teal:#2F6FE4;
  --teal-light:#e8f0fe;
  --gold:#C08A3E;
  --gold-light:#faf1e2;
  --danger:#B5453B;
  --danger-light:#fbeceb;
  --success:#3F8F5F;
  --success-light:#e7f5ec;

  /* Warna yang berganti antara light & dark mode. */
  --paper:#F5F6F4;
  --card:#FFFFFF;
  --surface-2:#fafbfb;
  --text:#16213A;
  --slate:#5B6472;
  --slate-light:#9aa3b2;
  --border:#E4E6E9;
  --grid-line:rgba(20,30,50,.045);

  /* Latar kotak logo perusahaan (mis. di Grid Perusahaan & Bagan
     Struktur) — di light mode putih penuh senada dengan kartu, di dark
     mode memakai off-white lembut (bukan putih terang) supaya logo tetap
     kontras/terbaca namun tidak menyilaukan di atas latar gelap. */
  --logo-box-bg:#FFFFFF;
  --logo-box-border:rgba(0,0,0,0.08);

  /* Warna khusus sidebar — di light mode memakai palet terang senada
     dengan latar aplikasi (bukan lagi navy gelap), di dark mode memakai
     palet gelap senada dengan latar gelap (lihat override
     [data-theme="dark"] di bawah). --sidebar-text-strong dipakai untuk
     teks yang butuh kontras lebih (nama brand, item nav yang di-hover/
     aktif). */
  --sidebar-bg:#FFFFFF;
  --sidebar-border:var(--border);
  --sidebar-hover-bg:rgba(20,30,50,0.05);
  --sidebar-active-bg:var(--teal-light);
  --sidebar-active-border:rgba(47,111,228,0.35);
  --sidebar-text:var(--slate);
  --sidebar-text-muted:var(--slate-light);
  --sidebar-text-strong:var(--text);

  --radius:10px;
  /* Satu keluarga font untuk seluruh aplikasi (body & display) — sans
     geometris/rounded yang lebih "friendly" & modern dibanding Inter,
     dibedakan lewat bobot (weight), bukan lewat typeface terpisah.
     Font mono tetap dipakai khusus untuk tabel akun/rincian angka padat
     yang butuh perataan kolom presisi (bukan untuk angka besar/KPI). */
  --font-body:'Plus Jakarta Sans',system-ui,sans-serif;
  --font-display:'Plus Jakarta Sans',var(--font-body);
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
}

/* ---------- Dark mode ---------- */
/* Diaktifkan lewat atribut data-theme="dark" pada <html> (lihat script
   anti-FOUC di <head> & applyTheme()/toggleTheme() pada bagian JS). */
[data-theme="dark"]{
  --paper:#0F1420;
  --card:#161D2E;
  --surface-2:#1B2338;
  --text:#E7EAF2;
  --slate:#A9B2C7;
  --slate-light:#6E7890;
  --border:#2A3450;
  --grid-line:rgba(255,255,255,.05);

  --logo-box-bg:#C7CCD8;
  --logo-box-border:rgba(255,255,255,0.10);

  --ink:#2A3C63;
  --ink-soft:#38507f;
  --teal:#5B93FF;
  --teal-light:#16223f;
  --gold:#D9A65D;
  --gold-light:#3A2C14;
  --danger:#E2695D;
  --danger-light:#3A1F1C;
  --success:#6FBF8B;
  --success-light:#1B3327;

  /* Sidebar dark mode: sedikit lebih gelap dari --card supaya tetap
     terasa sebagai panel navigasi tersendiri, tapi senada/menyatu dengan
     latar gelap di sekelilingnya (bukan lagi navy terang di atas panel
     terang seperti light mode). */
  --sidebar-bg:#0B0F1C;
  --sidebar-border:rgba(255,255,255,0.07);
  --sidebar-hover-bg:rgba(255,255,255,0.05);
  --sidebar-active-bg:rgba(91,147,255,0.2);
  --sidebar-active-border:rgba(91,147,255,0.38);
  --sidebar-text:#b7c0d6;
  --sidebar-text-muted:#5c6785;
  --sidebar-text-strong:#ffffff;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  transition:background-color .15s ease,color .15s ease;
}
button{font-family:inherit;}
input,select{font-family:inherit;}

/* ---------- Layout shell ---------- */
#app-shell{display:flex;min-height:100vh;}

.sidebar{
  width:250px;
  flex-shrink:0;
  background:var(--sidebar-bg);
  color:var(--sidebar-text);
  display:flex;
  flex-direction:column;
  position:fixed;
  top:0;left:0;bottom:0;
  overflow-y:auto;
  border-right:1px solid var(--sidebar-border);
  background-image:repeating-linear-gradient(to bottom, rgba(120,130,160,0.035) 0px, rgba(120,130,160,0.035) 1px, transparent 1px, transparent 28px);
  transition:background-color .15s ease;
  /* z-index didefinisikan langsung di sini (bukan hanya di dalam media
     query mobile) supaya sidebar SELALU dijamin berada di atas topbar
     (yang punya position:sticky + z-index:5), di semua ukuran layar.
     Sebelumnya z-index hanya di-set di dalam @media(max-width:900px),
     sehingga urutan tumpukan sidebar vs topbar jadi ambigu di sebagian
     browser mobile (terutama WebKit) — elemen position:sticky kadang
     dirender di atas elemen position:fixed lain walau z-index-nya lebih
     rendah, sebelum ia pernah "aktif" oleh event scroll. Ini yang
     menyebabkan judul topbar terlihat menabrak/menimpa header sidebar
     saat drawer mobile dibuka.
  */
  z-index:40;
}
.sidebar-brand{
  display:flex;align-items:center;gap:10px;
  padding:22px 20px 18px 20px;
  border-bottom:1px solid var(--sidebar-border);
}
/* Logo Integrida sbg CSS mask (lihat --logo-mask-image di :root) —
   warnanya otomatis mengikuti var(--...) yang dipasang di tiap konteks
   pemakaian (sidebar/login/loading), supaya kontras di light & dark
   mode tanpa perlu 2 file gambar terpisah. */
.logo-mark{
  -webkit-mask-image:var(--logo-mask-image);mask-image:var(--logo-mask-image);
  -webkit-mask-size:contain;mask-size:contain;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-position:center;mask-position:center;
  display:inline-block;
}
.sidebar-brand .mark{
  width:32px;height:32px;flex-shrink:0;
  background-color:var(--sidebar-text-strong);
}
.sidebar-brand .name{font-family:var(--font-display);font-weight:600;font-size:18px;color:var(--sidebar-text-strong);letter-spacing:.2px;}
.sidebar-brand .tag{font-size:10.5px;color:var(--sidebar-text-muted);letter-spacing:.6px;text-transform:uppercase;}

.sidebar-section{padding:16px 14px 4px 14px;}
.sidebar-section-label{
  font-size:10.5px;letter-spacing:1px;text-transform:uppercase;
  color:var(--sidebar-text-muted);margin:10px 10px 6px 10px;font-weight:600;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;margin:2px 0;border-radius:8px;
  color:var(--sidebar-text);text-decoration:none;font-size:14px;cursor:pointer;
  border:1px solid transparent;
}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.85;}
.nav-item:hover{background:var(--sidebar-hover-bg);color:var(--sidebar-text-strong);}
.nav-item.active{background:var(--sidebar-active-bg);border-color:var(--sidebar-active-border);color:var(--sidebar-text-strong);}

.sidebar-footer{margin-top:auto;padding:14px;border-top:1px solid var(--sidebar-border);}
.user-chip{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--sidebar-text);}
.user-chip .dot{width:26px;height:26px;border-radius:50%;background:var(--gold);color:#3a2a0f;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;}
.theme-toggle-topbar{
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  width:34px;height:34px;border-radius:50%;
  border:1px solid var(--border);background:var(--surface-2);color:var(--slate);
  cursor:pointer;
}
.theme-toggle-topbar:hover{background:var(--border);color:var(--text);}
.theme-toggle-topbar svg{width:16px;height:16px;flex-shrink:0;}
.logout-btn{margin-top:10px;width:100%;background:transparent;border:1px solid var(--sidebar-border);color:var(--sidebar-text);padding:7px;border-radius:7px;font-size:12.5px;cursor:pointer;}
.logout-btn:hover{background:var(--sidebar-hover-bg);}

.sidebar{display:none;}
/* Fitur "Ukuran Font" (menu Setting) diterapkan di sini, di-scope HANYA
   ke .main (topbar + konten tiap halaman: Dashboard, tabel, kartu KPI,
   dst.) & .modal (isi dialog, lihat aturan .modal di bawah) — SENGAJA
   tidak di seluruh <html>, supaya elemen position:fixed (sidebar,
   bottom-nav mobile, tombol FAB, overlay modal, toast) tetap dihitung
   relatif ke viewport asli & tidak ikut ter-zoom. Kalau zoom dipasang
   di leluhur elemen fixed, sebagian browser mobile (terutama WebKit)
   salah menghitung posisinya — bikin bagian tsb tampak terpotong atau
   seperti halaman auto-zoom-in saat dibuka. */
.main{margin-left:0;flex:1;display:flex;flex-direction:column;min-height:100vh;zoom:var(--app-zoom,100%);}
.topbar{
  height:62px;flex-shrink:0;background:var(--card);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:5;
}
.topbar h1{font-family:var(--font-display);font-size:19px;margin:0;font-weight:600;}
.topbar .sub{font-size:12.5px;color:var(--slate);margin-top:2px;}
.topbar-brand{
  width:32px;height:32px;border-radius:8px;flex-shrink:0;
  object-fit:contain;
}
.content{padding:26px;flex:1;padding-bottom:100px;}

/* ---------- Cards / generic ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;}
.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}

/* ---------- Grid Perusahaan (tampilan "folder") ---------- */
.company-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
@media(max-width:900px){.company-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.company-grid{grid-template-columns:1fr;}}
.company-card{
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;
  padding:26px 16px 20px;border:1px solid var(--border);border-radius:16px;background:var(--card);
  cursor:grab;transition:border-color .15s ease,box-shadow .15s ease,transform .15s ease,opacity .15s ease;
  position:relative;
}
.company-card:active{cursor:grabbing;}
.company-card.dragging{opacity:.35;}
.company-card.drag-hover{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal-light) inset;}
.company-card:hover{border-color:var(--teal);box-shadow:0 6px 18px rgba(22,33,58,0.08);transform:translateY(-2px);}
.company-card-name{font-weight:600;font-size:14px;color:var(--text);line-height:1.35;word-break:break-word;}
.company-card-code{font-size:12px;color:var(--slate);font-family:var(--font-mono);}
.company-card-progress{width:100%;display:flex;flex-direction:column;gap:4px;margin-top:2px;}
.company-card-progress-bar{height:5px;border-radius:999px;background:var(--border);overflow:hidden;width:100%;}
.company-card-progress-fill{height:100%;border-radius:999px;}
.company-card-progress-label{font-size:11px;color:var(--slate-light);display:flex;justify-content:space-between;width:100%;gap:6px;}

/* ---------- Judul laporan (kop laporan keuangan) ---------- */
.report-title{margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border);text-align:center;}
.report-title-line{font-weight:700;font-size:13px;color:var(--text);line-height:1.55;letter-spacing:.2px;}
.report-title-line.muted{font-weight:500;color:var(--slate);font-size:12px;}
.verify-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:#fff;background:var(--teal);padding:2px 9px;border-radius:999px;margin-left:8px;vertical-align:middle;white-space:nowrap;}
.verify-checkbox-label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12.5px;color:var(--slate);user-select:none;}
.verify-checkbox-label input{width:16px;height:16px;accent-color:var(--teal);cursor:pointer;}

/* Checkbox "Sinkron" pada rincian akun (per sub-akun/transaksi/baris) —
   menandai bahwa angka di Integrida sudah dicocokkan manual dengan data
   sistem/sumber aslinya (mis. mutasi rekening bank). Berbeda dari
   verify-checkbox-label (yang menandai satu PERIODE penuh), ini menandai
   satu BARIS rincian secara individual. */
.sync-checkbox-label{display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-size:11px;color:var(--slate-light);user-select:none;white-space:nowrap;margin-left:12px;flex-shrink:0;}
.sync-checkbox-label:hover{color:var(--teal);}
.sync-checkbox-label input{width:14px;height:14px;accent-color:var(--teal);cursor:pointer;}
.sync-checkbox-label.is-synced{color:var(--teal);font-weight:600;}

.kpi-card{display:flex;flex-direction:column;gap:6px;}
.kpi-label{font-size:12px;color:var(--slate);letter-spacing:.2px;}
.kpi-value{font-family:var(--font-display);font-size:25px;font-weight:800;letter-spacing:-.01em;font-variant-numeric:tabular-nums;overflow-wrap:break-word;word-break:break-word;}
.kpi-delta{font-size:12.5px;font-family:var(--font-display);font-weight:600;}
.kpi-delta.up{color:var(--teal);}
.kpi-delta.down{color:var(--danger);}

.section-title{font-family:var(--font-display);font-size:16px;font-weight:600;margin:0 0 14px 0;}
.section-block{margin-bottom:26px;}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--border);}
th:first-child,td:first-child{text-align:left;}
thead th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--slate);font-weight:600;background:var(--surface-2);position:sticky;top:0;}
td.num,th.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
tbody tr:hover{background:var(--surface-2);}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);}

.btn{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--ink);color:#fff;border:none;padding:9px 16px;border-radius:8px;
  font-size:13.5px;font-weight:500;cursor:pointer;
}
.btn:hover{background:var(--ink-soft);}
.btn.primary{background:var(--teal);}
.btn.primary:hover{background:#1f56c9;}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--border);}
.btn.ghost:hover{background:var(--surface-2);}
.btn.danger{background:var(--danger);}
.btn:disabled{opacity:.5;cursor:not-allowed;}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.field label{font-size:12.5px;color:var(--slate);font-weight:500;}
.field input,.field select,.field textarea{
  padding:9px 11px;border:1px solid var(--border);border-radius:7px;font-size:16px;background:var(--card);color:var(--text);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal);}
.field input:disabled{opacity:.5;cursor:not-allowed;background:var(--surface-2);}
.field textarea{font-family:inherit;resize:vertical;min-height:56px;}
.date-field-wrap{position:relative;}
.date-field-wrap input[type="date"]{width:100%;color:transparent;}
.date-field-wrap input[type="date"]::-webkit-datetime-edit,
.date-field-wrap input[type="date"]::-webkit-datetime-edit-fields-wrapper,
.date-field-wrap input[type="date"]::-webkit-datetime-edit-text,
.date-field-wrap input[type="date"]::-webkit-datetime-edit-day-field,
.date-field-wrap input[type="date"]::-webkit-datetime-edit-month-field,
.date-field-wrap input[type="date"]::-webkit-datetime-edit-year-field{color:transparent;}
.date-field-overlay{
  position:absolute;left:0;top:0;right:0;bottom:0;
  display:flex;align-items:center;
  padding:9px 30px 9px 11px;
  font-size:13.5px;color:var(--text);
  pointer-events:none;white-space:nowrap;overflow:hidden;
}
.date-field-overlay.is-empty{color:var(--slate-light);}
.reminder-pending-check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text);cursor:pointer;user-select:none;}
.reminder-pending-check input[type="checkbox"]{width:17px;height:17px;cursor:pointer;accent-color:var(--teal);flex-shrink:0;}
.reminder-pending-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px;}
.reminder-priority-group{display:none;align-items:center;gap:14px;}
.reminder-priority-group.show{display:flex;}
.reminder-priority-group label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--slate);cursor:pointer;user-select:none;}
.reminder-priority-group input[type="radio"]{width:15px;height:15px;cursor:pointer;accent-color:var(--danger);}
.reminder-table td{text-align:left;vertical-align:top;}
.reminder-table td.reminder-col-check{width:34px;padding-right:0;}
.reminder-table td.reminder-col-actions{width:74px;text-align:right;white-space:nowrap;}
.reminder-table tr.reminder-group-row td{background:var(--surface-2);font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--slate);font-weight:700;padding:6px 12px;border-bottom:1px solid var(--border);}
.reminder-table tr.reminder-group-row.is-priority td{color:var(--danger);}
.reminder-table tr.analisis-unscheduled-row td{background:var(--danger-light);color:var(--danger);}
.analisis-unscheduled-wrap{margin-top:10px;}
.analisis-unscheduled-note{font-size:11.5px;color:var(--slate);line-height:1.5;margin:6px 2px 4px;}
.reminder-table tr.reminder-row-done td{color:var(--slate-light);}
.reminder-table .reminder-item-actions{justify-content:flex-end;}
.ownership-row{display:grid;grid-template-columns:1fr 110px 34px;gap:8px;align-items:center;margin-bottom:8px;}
.ownership-row input[type="text"],.ownership-row select{padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-size:16px;background:var(--card);color:var(--text);width:100%;}
.ownership-row .pct-wrap{position:relative;}
.ownership-row .pct-wrap input{padding:8px 22px 8px 10px;border:1px solid var(--border);border-radius:7px;font-size:16px;width:100%;text-align:right;}
.ownership-row .pct-wrap span{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--slate);pointer-events:none;}

.upgrade-progress-wrap{margin:2px 0 18px 0;}
.upgrade-progress-bar{height:8px;border-radius:999px;background:var(--border);overflow:hidden;width:100%;}
.upgrade-progress-fill{height:100%;border-radius:999px;background:var(--teal);transition:width .25s ease;}
.upgrade-progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--slate);margin-top:6px;}
.upgrade-progress-label strong{color:var(--text);font-size:13px;}
.upgrade-list{display:flex;flex-direction:column;gap:10px;}
.upgrade-item{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--border);border-radius:9px;padding:12px 13px;background:var(--surface-2);}
.upgrade-item input[type="checkbox"]{width:19px;height:19px;flex-shrink:0;margin-top:1px;cursor:pointer;accent-color:var(--teal);}
.upgrade-item-body{flex:1;min-width:0;}
.upgrade-item-title{font-size:14px;font-weight:600;color:var(--text);word-break:break-word;}
.upgrade-item-desc{font-size:12.5px;color:var(--slate);line-height:1.55;margin-top:4px;white-space:pre-wrap;word-break:break-word;}
.upgrade-item-more{font-size:12px;color:var(--teal);cursor:pointer;font-weight:600;margin-top:4px;display:inline-block;}
.upgrade-item-actions{display:flex;gap:6px;flex-shrink:0;margin-top:1px;}
.upgrade-item-actions button{
  width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:transparent;color:var(--slate);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
}
.upgrade-item-actions button:hover{background:var(--surface-3,rgba(0,0,0,.05));color:var(--text);}
.upgrade-item-actions button.danger-action:hover{color:var(--danger);border-color:var(--danger);}
.upgrade-item-actions svg{width:14px;height:14px;}
.upgrade-empty{font-size:13px;color:var(--slate-light);padding:14px 2px;text-align:center;}
.upgrade-toggle-done{font-size:12px;color:var(--teal);cursor:pointer;font-weight:600;background:none;border:none;padding:0;margin-bottom:12px;display:inline-block;}

.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap;}
.cal-nav{display:flex;align-items:center;gap:6px;}
.cal-nav button{background:transparent;border:1px solid var(--border);border-radius:8px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);}
.cal-nav button:hover{background:var(--surface-2);}
.cal-nav button svg{width:16px;height:16px;}
.cal-month-label{font-family:var(--font-display);font-weight:600;font-size:15.5px;min-width:150px;text-align:center;}
.cal-pending-btn{position:relative;font-size:12px;font-weight:600;color:var(--teal);background:none;border:1px solid var(--teal);border-radius:7px;padding:5px 10px;cursor:pointer;}
.cal-pending-btn:hover{background:var(--teal-light);}
.cal-pending-btn.active{background:var(--teal);color:#fff;}
.cal-pending-badge{display:inline-flex;width:8px;height:8px;border-radius:50%;background:var(--danger);margin-left:6px;}
.cal-pending-btn.active .cal-pending-badge{background:#fff;}
.cal-analisis-btn{color:var(--gold);border-color:var(--gold);}
.cal-analisis-btn:hover{background:var(--gold-light);}
.cal-analisis-btn.active{background:var(--gold);color:#fff;}
.cal-agenda-btn{display:inline-flex;align-items:center;gap:6px;}
.cal-agenda-btn svg{width:13px;height:13px;}
.cal-agenda-btn:disabled{opacity:.55;cursor:default;}
.analisis-day-label{font-size:11.5px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.03em;padding:10px 4px 4px;}
.analisis-tier-heading{font-size:13px;font-weight:700;color:var(--ink);margin:14px 0 6px;padding-bottom:5px;border-bottom:1px solid var(--border);}
.analisis-tier-heading:first-of-type{margin-top:2px;}
.cal-grid-scroll{overflow-x:auto;overflow-y:visible;-webkit-overflow-scrolling:touch;}
.cal-dow-sticky{position:sticky;top:62px;z-index:4;background:var(--card);padding-top:6px;margin-bottom:5px;}
.cal-dow-clip{overflow:hidden;}
.cal-dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;min-width:1160px;will-change:transform;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:auto;gap:5px;min-width:1160px;}
.cal-dow{font-size:11px;font-weight:600;color:var(--slate-light);text-align:center;padding:6px 0 4px 0;text-transform:uppercase;letter-spacing:.4px;background:var(--card);}
.cal-cell{position:relative;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);cursor:pointer;display:flex;flex-direction:column;align-items:stretch;gap:3px;font-size:13px;color:var(--text);height:140px;padding:8px 0 6px 0;overflow:hidden;}
.cal-cell:hover{background:var(--teal-light);}
.cal-cell.cal-outside{background:transparent!important;}
.cal-cell.cal-saturday{background:var(--success-light);}
.cal-cell.cal-sunday-holiday{background:var(--danger-light);}
.cal-cell.cal-dayoff{background:var(--danger-light);}
.cal-cell-dayoff-check{position:absolute;top:4px;left:6px;width:13px;height:13px;margin:0;padding:0;cursor:pointer;z-index:2;appearance:none;-webkit-appearance:none;border:1.6px solid var(--danger);border-radius:50%;background:transparent;}
.cal-cell-dayoff-check:checked{background:var(--danger);}
.cal-cell.cal-today{border-color:var(--teal);font-weight:700;}
.cal-cell.cal-selected{background:var(--teal);color:#fff;border-color:var(--teal);}
.cal-cell.cal-selected:hover{background:var(--teal);}
.cal-cell-date{text-align:center;flex-shrink:0;}
.cal-cell-copy-btn{position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:transparent;color:var(--danger);border:none;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;z-index:2;}
.cal-cell-copy-btn svg{width:11px;height:11px;}
.cal-cell-copy-btn:hover{opacity:.7;}
.cal-cell.cal-selected .cal-cell-copy-btn{color:#fff;}
.cal-cell-reminders{display:flex;flex-direction:column;gap:2px;margin-top:3px;padding:0 4px;flex:1;min-height:0;overflow-y:auto;}
.cal-cell-reminder{display:flex;align-items:baseline;gap:3px;font-size:10px;line-height:1.3;border-radius:4px;padding:1px 3px;cursor:pointer;}
.cal-cell-reminder-done-check{flex-shrink:0;width:11px;height:11px;margin:0;cursor:pointer;accent-color:var(--teal);align-self:center;}
.cal-cell.cal-selected .cal-cell-reminder-done-check{accent-color:#fff;}
.cal-cell-reminder:hover{background:rgba(0,0,0,.08);}
.cal-cell.cal-selected .cal-cell-reminder:hover{background:rgba(255,255,255,.2);}
.cal-cell-reminder.dragging{opacity:.35;}
.cal-cell-reminder-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;text-align:left;color:var(--text);}
.cal-cell.cal-selected .cal-cell-reminder-title{color:#fff;}
.cal-cell-reminder.cal-cell-reminder-done .cal-cell-reminder-title{text-decoration:line-through;color:var(--slate-light);}
.cal-dot{width:5px;height:5px;border-radius:50%;background:var(--gold);}
.cal-cell.cal-selected .cal-dot{background:#fff;}
.reminder-item{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--border);border-radius:9px;padding:12px 13px;background:var(--surface-2);}
.reminder-item + .reminder-item{margin-top:10px;}
.reminder-item input[type="checkbox"]{width:19px;height:19px;flex-shrink:0;margin-top:1px;cursor:pointer;accent-color:var(--teal);}
.reminder-item-body{flex:1;min-width:0;}
.reminder-item-title{font-size:14px;font-weight:600;color:var(--text);word-break:break-word;}
.reminder-item-time{color:var(--teal);font-weight:700;}
.reminder-item-repeat{color:var(--gold);font-weight:600;font-size:11.5px;}
.reminder-item-priority-badge{background:var(--danger);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;letter-spacing:.2px;}
.reminder-item.reminder-item-priority{border-color:var(--danger);background:var(--danger-light);}
.reminder-item-desc{font-size:12.5px;color:var(--slate);line-height:1.55;margin-top:4px;white-space:pre-wrap;word-break:break-word;}
.reminder-item-actions{display:flex;gap:6px;flex-shrink:0;margin-top:1px;}
.reminder-item-actions button{background:transparent;border:1px solid var(--border);border-radius:7px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--slate);}
.reminder-item-actions button:hover{background:var(--surface-3,rgba(0,0,0,.05));color:var(--text);}
.reminder-item-actions button.danger-action:hover{color:var(--danger);border-color:var(--danger);}
.reminder-item-actions svg{width:14px;height:14px;}
.cal-fab{
  position:fixed;right:24px;bottom:24px;width:56px;height:56px;border-radius:50%;
  background:var(--teal);color:#fff;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 24px rgba(47,111,228,0.45);z-index:46;
  transition:background-color .15s ease,transform .15s ease;
}
.cal-fab:hover{background:#1f56c9;transform:translateY(-1px);}
.cal-fab svg{width:24px;height:24px;}
@media(max-width:900px){
  .cal-fab{bottom:calc(96px + env(safe-area-inset-bottom));right:18px;}
}
.ownership-row .remove-ownership{background:transparent;border:1px solid var(--border);border-radius:7px;color:var(--slate);cursor:pointer;height:34px;}
.ownership-row .remove-ownership:hover{color:#c0392b;border-color:#c0392b;}

.combo-wrap{position:relative;}
.combo-dropdown{
  position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:30;
  background:var(--card);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);
  max-height:220px;overflow-y:auto;
}
.combo-option{padding:9px 12px;cursor:pointer;font-size:13.5px;display:flex;gap:8px;align-items:baseline;}
.combo-option:hover,.combo-option.active{background:var(--teal-light);}
.combo-option .combo-code{font-weight:600;color:var(--teal);min-width:20px;}
.combo-option .combo-name{color:var(--text);}
.combo-empty{padding:10px 12px;font-size:13px;color:var(--slate);}

/* ---------- Bagan Struktur Perusahaan (Induk / Anak / Cucu) ---------- */
.org-chart-toolbar-hint{font-size:11.5px;color:var(--slate);line-height:1.6;}
.org-chart-legend-dot{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin:0 4px 0 8px;}
.org-chart-viewport{
  position:relative;width:100%;height:560px;overflow:hidden;
  border:1px solid var(--border);border-radius:var(--radius);
  background:
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0/26px 26px,
    linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0/26px 26px,
    var(--surface-2);
  cursor:grab;touch-action:none;
}
.org-chart-viewport.dragging{cursor:grabbing;}
.org-chart-canvas{position:absolute;top:0;left:0;transform-origin:0 0;padding:36px;will-change:transform;width:max-content;}

.org-tree{text-align:center;}
.org-tree, .org-tree ul{list-style:none;margin:0;padding:0;}
.org-tree ul{padding-top:24px;position:relative;}
.org-tree ul::after{content:'';display:table;clear:both;}
.org-tree li{
  float:left;text-align:center;list-style-type:none;position:relative;
  padding:24px 5px 0 5px;transition:all .2s;
}
.org-tree li::before,.org-tree li::after{
  content:'';position:absolute;top:0;right:50%;
  border-top:2px solid var(--border);width:50%;height:24px;
}
.org-tree li::after{right:auto;left:50%;border-left:2px solid var(--border);}
.org-tree li:only-child::after,.org-tree li:only-child::before{display:none;}
.org-tree li:only-child{padding-top:0;}
.org-tree li:first-child::before,.org-tree li:last-child::after{border:0 none;}
.org-tree li:last-child::before{border-right:2px solid var(--border);border-radius:0 6px 0 0;}
.org-tree li:first-child::after{border-radius:6px 0 0 0;}
.org-tree ul ul::before{
  content:'';position:absolute;top:0;left:50%;
  border-left:2px solid var(--border);width:0;height:24px;
}
.org-node{
  border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;
  display:inline-flex;flex-direction:column;gap:6px;
  background:var(--card);font-size:13px;line-height:1.45;
  box-shadow:0 1px 3px rgba(0,0,0,.12);white-space:normal;cursor:pointer;
  transition:box-shadow .15s,transform .15s;width:max-content;min-width:210px;max-width:340px;text-align:left;
}
.org-node:hover{box-shadow:0 4px 10px rgba(20,30,50,.12);transform:translateY(-1px);}
.org-node.level-0{background:var(--card);color:var(--text);border-color:var(--border);}
.org-node.level-1{background:var(--card);color:var(--text);border-color:var(--border);}
.org-node.level-2{background:var(--card);color:var(--text);border-color:var(--border);}
.org-node-name{font-weight:700;font-size:14px;white-space:normal;text-align:center;width:100%;}
.org-node-header{display:flex;flex-direction:column;gap:6px;}
.org-node-logo-wrap{display:flex;justify-content:center;width:100%;}
.org-node-sub{display:flex;align-items:center;flex-wrap:wrap;gap:5px;justify-content:center;}
.org-node-sub .org-code{font-size:11px;color:var(--slate);font-family:var(--font-mono);}
.org-node-divider{border-top:1px solid currentColor;opacity:.14;margin:1px 0;}
.org-node-label{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;opacity:.6;font-weight:700;margin-bottom:3px;}
.org-node-ownership{display:flex;flex-direction:column;gap:2px;}
.org-node-ownership-row{font-size:11.5px;opacity:.9;white-space:nowrap;}
.org-node-founded{font-size:11px;opacity:.7;font-weight:400;white-space:normal;}

.badge{display:inline-block;padding:3px 9px;border-radius:100px;font-size:11px;font-weight:600;}
.badge.teal{background:var(--teal-light);color:var(--teal);}
.badge.gold{background:var(--gold-light);color:#8a611f;}
.badge.danger{background:var(--danger-light);color:var(--danger);}
.badge.blue{background:#e9eef9;color:#3B5BA5;}
.badge.purple{background:#f1ecfa;color:#6b46c1;}
[data-theme="dark"] .badge.blue{background:#1c2a4a;color:#8fa8e8;}
[data-theme="dark"] .badge.purple{background:#2c2247;color:#c3a6f2;}

.pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.pill{
  padding:7px 14px;border-radius:100px;border:1px solid var(--border);background:var(--card);
  font-size:13px;cursor:pointer;color:var(--slate);
}
.pill.active{background:var(--ink);color:#fff;border-color:var(--ink);}

/* ---------- Filter halaman Perbandingan (kartu, chip, search, segmented) ---------- */
.compare-filter-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px 22px 22px;}
.compare-filter-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
.compare-filter-label{font-family:var(--font-display);font-weight:600;font-size:13.5px;color:var(--text);}
.compare-filter-actions{display:flex;gap:16px;}
.compare-filter-action{background:none;border:none;padding:0;color:var(--teal);font-size:12.5px;font-weight:600;cursor:pointer;}
.compare-filter-action:hover{text-decoration:underline;}
.compare-search-wrap{position:relative;max-width:320px;margin-bottom:14px;}
.compare-search-wrap .compare-search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--slate-light);pointer-events:none;}
.compare-search-wrap .compare-search-icon svg{width:100%;height:100%;}
.compare-search-input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--border);border-radius:8px;font-size:16px;background:var(--surface-2);color:var(--text);}
.compare-search-input:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal);}
.chip-row{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  display:inline-flex;align-items:center;gap:7px;padding:7px 14px 7px 10px;border-radius:100px;
  border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:13px;
  cursor:pointer;user-select:none;transition:background-color .15s,border-color .15s,color .15s;
}
.chip:hover{border-color:var(--teal);}
.chip.hidden{display:none;}
.chip-check{
  width:15px;height:15px;border-radius:50%;border:1.5px solid var(--slate-light);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;transition:background-color .15s,border-color .15s;
}
.chip-check svg{width:9px;height:9px;color:#fff;display:none;}
.chip.active{background:var(--teal-light);border-color:var(--teal);color:var(--teal);font-weight:600;}
.chip.active .chip-check{background:var(--teal);border-color:var(--teal);}
.chip.active .chip-check svg{display:block;}
.segmented{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px;}
.seg-item{padding:7px 15px;border-radius:7px;font-size:13px;color:var(--slate);cursor:pointer;}
.seg-item.active{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(20,30,50,.14);}
.compare-empty-state{text-align:center;padding:46px 20px;color:var(--slate);}
.compare-empty-icon{width:44px;height:44px;margin:0 auto 14px;color:var(--teal);background:var(--teal-light);border-radius:12px;display:flex;align-items:center;justify-content:center;padding:10px;box-sizing:border-box;}
.compare-empty-icon svg{width:100%;height:100%;}
.compare-empty-title{font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--text);margin-bottom:5px;}
.compare-empty-sub{font-size:13px;max-width:380px;margin:0 auto;line-height:1.6;}

.empty-state{
  text-align:center;padding:50px 20px;color:var(--slate);
}
.empty-state .mark{font-size:32px;margin-bottom:10px;}

.modal-backdrop{
  position:fixed;inset:0;background:rgba(15,20,30,0.55);display:flex;align-items:center;justify-content:center;z-index:50;
}
.modal{background:var(--card);color:var(--text);border-radius:12px;width:460px;max-width:92vw;padding:24px;max-height:88vh;overflow-y:auto;position:relative;zoom:var(--app-zoom,100%);}
.modal-close{position:absolute;top:16px;right:16px;width:28px;height:28px;border-radius:50%;background:transparent;border:none;cursor:pointer;color:var(--slate);display:flex;align-items:center;justify-content:center;}
.modal-close:hover{background:var(--surface-2);color:var(--text);}
.modal-close svg{width:16px;height:16px;}
.modal h3{font-family:var(--font-display);margin:0 0 4px 0;}
.modal .modal-sub{font-size:12.5px;color:var(--slate);margin-bottom:16px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}

.info-popover-wrap{position:relative;display:inline-flex;vertical-align:middle;}
.info-icon-btn{width:19px;height:19px;border-radius:50%;background:var(--surface-2);border:none;cursor:pointer;color:var(--slate);display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;}
.info-icon-btn:hover{background:var(--border);color:var(--text);}
.info-icon-btn svg{width:13px;height:13px;}
.info-popover{position:absolute;top:24px;left:0;z-index:5;display:none;width:280px;max-width:75vw;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);padding:10px 12px;font-size:11.5px;line-height:1.5;color:var(--slate);font-weight:400;}
.info-popover.is-open{display:block;}

.dropzone{
  border:2px dashed var(--border);border-radius:var(--radius);padding:34px 20px;text-align:center;
  cursor:pointer;color:var(--slate);background:var(--surface-2);transition:border-color .15s,background .15s;
}
.dropzone:hover{border-color:var(--teal);}
.dropzone.drag{border-color:var(--teal);background:var(--teal-light);color:var(--teal);}
.dropzone svg{width:30px;height:30px;margin-bottom:8px;opacity:.6;}
.dropzone-icon-circle{
  width:52px;height:52px;border-radius:50%;background:var(--teal-light);color:var(--teal);
  display:flex;align-items:center;justify-content:center;margin:0 auto 12px auto;
}
.dropzone-icon-circle svg{width:24px;height:24px;margin-bottom:0;opacity:1;}

/* ---------- Header langkah bernomor (mis. halaman Impor Data) ---------- */
.step-head{display:flex;align-items:center;gap:10px;}
.step-head .step-badge{
  width:26px;height:26px;border-radius:50%;background:var(--teal);color:#fff;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;font-family:var(--font-display);
}
.step-head .step-badge.step-badge-outline{background:transparent;border:2px solid var(--teal);color:var(--teal);}
.step-head .step-title{font-family:var(--font-display);font-size:15.5px;font-weight:600;color:var(--text);}
.import-preview-card{display:flex;flex-direction:column;}
.import-preview-empty{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  color:var(--slate-light);padding:30px 16px;gap:12px;
}
.import-preview-empty .dropzone-icon-circle{margin-bottom:0;}
.import-preview-empty .import-preview-empty-title{font-size:13.5px;font-weight:600;color:var(--slate);}
.import-preview-empty .import-preview-empty-sub{font-size:12px;line-height:1.5;max-width:260px;}

.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:80;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:8px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.18);}
.toast.error{background:var(--danger);}
.toast.success{background:var(--teal);}

.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);
  background-image:repeating-linear-gradient(to bottom, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 30px);}
.auth-card{width:380px;max-width:92vw;background:#fff;border-radius:14px;padding:32px 28px;}
.auth-brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
/* Kartu login (.auth-card) selalu berlatar putih di kedua tema (lihat
   komentar pada .auth-card), jadi warna logo di sini SENGAJA dikunci ke
   navy tetap (bukan var(--text) yang ikut berganti terang/gelap) supaya
   kontrasnya tetap terjaga di kedua tema. */
.auth-brand .mark{width:36px;height:36px;flex-shrink:0;background-color:#16213A;}
.auth-brand .name{font-family:var(--font-display);font-weight:700;font-size:20px;color:#16213A;}
.auth-tabs{display:flex;gap:6px;margin-bottom:18px;background:#f2f3f4;padding:4px;border-radius:9px;}
.auth-tab{flex:1;text-align:center;padding:8px;border-radius:7px;font-size:13px;cursor:pointer;color:var(--slate);}
.auth-tab.active{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.auth-error{background:var(--danger-light);color:var(--danger);font-size:12.5px;padding:9px 11px;border-radius:7px;margin-bottom:12px;}
.auth-hint{font-size:11.5px;color:var(--slate-light);margin-top:14px;line-height:1.5;}

.chart-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.chart-box canvas{max-height:280px;}

/* ---------- Dashboard: kartu "melayang" & widget ringkas ---------- */
.dash-hero{
  position:relative;background:var(--card);border:1px solid var(--border);
  border-radius:22px;padding:24px 24px 14px 24px;
  box-shadow:0 22px 44px -18px rgba(22,33,58,.28),0 4px 14px rgba(22,33,58,.06);
}
[data-theme="dark"] .dash-hero{box-shadow:0 22px 44px -18px rgba(0,0,0,.6),0 4px 14px rgba(0,0,0,.3);}
.dash-hero-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:6px;}
.dash-hero-title{font-family:var(--font-display);font-weight:700;font-size:16.5px;}
.dash-hero-sub{font-size:12.5px;color:var(--slate);margin-top:2px;}
.dash-hero-stats{display:flex;gap:26px;flex-wrap:wrap;}
.dash-hero-stat-label{font-size:12px;color:var(--slate);}
.dash-hero-stat-value{font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:-.01em;margin-top:2px;font-variant-numeric:tabular-nums;overflow-wrap:break-word;word-break:break-word;}
.dash-hero-chart-wrap{position:relative;height:270px;margin-top:10px;}

.dash-widgets{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px;}
@media(max-width:1100px){.dash-widgets{grid-template-columns:1fr 1fr;}}
@media(max-width:640px){.dash-widgets{grid-template-columns:1fr;}}
.dash-widget-card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px 18px;}
.dash-widget-title{font-family:var(--font-display);font-weight:600;font-size:13px;color:var(--text);margin-bottom:10px;}
.dash-widget-chart-wrap{position:relative;height:150px;}
.dash-donut-wrap{display:flex;align-items:center;gap:14px;}
.dash-donut-canvas{position:relative;width:104px;height:104px;flex-shrink:0;}
.dash-donut-legend{display:flex;flex-direction:column;gap:7px;flex:1;min-width:0;}
.dash-donut-legend-row{display:flex;align-items:center;gap:7px;font-size:12px;}
.dash-donut-legend-dot{width:8px;height:8px;border-radius:2.5px;flex-shrink:0;}
.dash-donut-legend-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);}
.dash-donut-legend-pct{font-family:var(--font-display);font-weight:700;color:var(--slate);}

.ratio-note{font-size:12px;color:var(--slate);background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-top:10px;line-height:1.5;}
.bb-akun-row:hover{background:var(--teal-light);}
.bb-ledger-row:hover{background:var(--teal-light);}
.ledger-group summary::-webkit-details-marker{display:none;}
.ledger-group summary{list-style:none;}
.ledger-group summary::before{content:'▾';display:inline-block;width:14px;color:var(--slate-light);font-size:11px;transition:transform .15s;}
.ledger-group:not([open]) summary::before{transform:rotate(-90deg);}

.loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--slate);font-family:var(--font-display);}
.loading-screen-inner{display:flex;flex-direction:column;align-items:center;gap:14px;}
.loading-screen .mark{width:52px;height:52px;background-color:var(--text);}

/* ---------- Sync badge ---------- */
.sync-badge{
  display:flex;align-items:center;gap:7px;
  font-size:12.5px;color:var(--slate);
  background:var(--surface-2);border:1px solid var(--border);
  padding:6px 12px;border-radius:100px;
  cursor:default;user-select:none;white-space:nowrap;
}
.sync-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.sync-badge.pulse .sync-dot{animation:sync-pulse 1.1s ease-in-out infinite;}
.sync-time{color:var(--slate-light);font-family:var(--font-mono);font-size:11px;}
@keyframes sync-pulse{
  0%{opacity:1;transform:scale(1);}
  50%{opacity:.35;transform:scale(.75);}
  100%{opacity:1;transform:scale(1);}
}
@media(max-width:640px){ .sync-badge .sync-time{display:none;} }

@media(max-width:900px){
  .grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}
  .content{padding:16px;padding-bottom:100px;}
  .topbar{padding:0 16px;}
  .dash-hero{padding:18px 16px 14px 16px;border-radius:16px;}
  .dash-hero-head{flex-direction:column;align-items:flex-start;gap:12px;}
  .dash-hero-stats{width:100%;gap:16px;}
  .dash-hero-stats>div{flex:1 1 0;min-width:0;}
  .dash-hero-chart-wrap{height:220px;}
  .dash-widget-card{padding:14px 16px;}
  .dash-donut-wrap{flex-direction:column;align-items:stretch;gap:12px;}
  .dash-donut-canvas{align-self:center;}
}
@media(max-width:480px){
  .content{padding:12px;padding-bottom:96px;}
  .topbar{padding:0 12px;}
  .card{padding:14px 16px;}
  .kpi-value{font-size:20px;}
  .dash-hero-stat-value{font-size:16.5px;}
  .dash-hero-title{font-size:15px;}
  th,td{padding:8px 8px;font-size:12.5px;}
}

  position:fixed;left:50%;bottom:14px;transform:translateX(-50%);
