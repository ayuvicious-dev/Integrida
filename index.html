<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Integrida — Konsolidasi Laporan Keuangan</title>
<meta name="description" content="Aplikasi konsolidasi laporan keuangan multi-perusahaan: impor Excel, perbandingan antar periode, dan analisis rasio likuiditas, solvabilitas, profitabilitas.">
<meta name="theme-color" content="#16213A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" crossorigin="anonymous">
<style>
:root{
  --ink:#16213A;
  --ink-soft:#22314f;
  --teal:#1B7A6B;
  --teal-light:#e6f2f0;
  --gold:#C08A3E;
  --gold-light:#faf1e2;
  --paper:#F5F6F4;
  --card:#FFFFFF;
  --slate:#5B6472;
  --slate-light:#9aa3b2;
  --danger:#B5453B;
  --danger-light:#fbeceb;
  --border:#E4E6E9;
  --radius:10px;
  --font-body:'Inter',system-ui,sans-serif;
  --font-display:'Space Grotesk',var(--font-body);
  --font-mono:'IBM Plex Mono',ui-monospace,monospace;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;}
input,select{font-family:inherit;}

/* ---------- Layout shell ---------- */
#app-shell{display:flex;min-height:100vh;}

.sidebar{
  width:250px;
  flex-shrink:0;
  background:var(--ink);
  color:#cfd6e4;
  display:flex;
  flex-direction:column;
  position:fixed;
  top:0;left:0;bottom:0;
  overflow-y:auto;
  background-image:repeating-linear-gradient(to bottom, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 1px, transparent 1px, transparent 28px);
}
.sidebar-brand{
  display:flex;align-items:center;gap:10px;
  padding:22px 20px 18px 20px;
  border-bottom:1px solid rgba(255,255,255,0.08);
}
.sidebar-brand .mark{
  width:32px;height:32px;border-radius:8px;
  background:linear-gradient(135deg,var(--teal),#0e4e44);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;color:#fff;font-size:15px;
}
.sidebar-brand .name{font-family:var(--font-display);font-weight:600;font-size:18px;color:#fff;letter-spacing:.2px;}
.sidebar-brand .tag{font-size:10.5px;color:var(--slate-light);letter-spacing:.6px;text-transform:uppercase;}

.sidebar-section{padding:16px 14px 4px 14px;}
.sidebar-section-label{
  font-size:10.5px;letter-spacing:1px;text-transform:uppercase;
  color:#6e7b93;margin:10px 10px 6px 10px;font-weight:600;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;margin:2px 0;border-radius:8px;
  color:#c4cbdb;text-decoration:none;font-size:14px;cursor:pointer;
  border:1px solid transparent;
}
.nav-item svg{width:17px;height:17px;flex-shrink:0;opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,0.06);color:#fff;}
.nav-item.active{background:rgba(27,122,107,0.22);border-color:rgba(27,122,107,0.4);color:#fff;}

.sidebar-footer{margin-top:auto;padding:14px;border-top:1px solid rgba(255,255,255,0.08);}
.user-chip{display:flex;align-items:center;gap:9px;font-size:12.5px;color:#c4cbdb;}
.user-chip .dot{width:26px;height:26px;border-radius:50%;background:var(--gold);color:#3a2a0f;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;}
.logout-btn{margin-top:10px;width:100%;background:transparent;border:1px solid rgba(255,255,255,0.15);color:#c4cbdb;padding:7px;border-radius:7px;font-size:12.5px;cursor:pointer;}
.logout-btn:hover{background:rgba(255,255,255,0.08);}

.main{margin-left:250px;flex:1;display:flex;flex-direction:column;min-height:100vh;}
.topbar{
  height:62px;flex-shrink:0;background:var(--card);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:5;
}
.topbar h1{font-family:var(--font-display);font-size:19px;margin:0;font-weight:600;}
.topbar .sub{font-size:12.5px;color:var(--slate);margin-top:2px;}
.content{padding:26px;flex:1;}

/* ---------- Cards / generic ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;}
.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}

/* ---------- Grid Perusahaan (tampilan "folder") ---------- */
.company-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
@media(max-width:900px){.company-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.company-grid{grid-template-columns:1fr;}}
.company-card{
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;
  padding:26px 16px 20px;border:1px solid var(--border);border-radius:16px;background:var(--card);
  cursor:grab;transition:border-color .15s ease,box-shadow .15s ease,transform .15s ease,opacity .15s ease;
  position:relative;
}
.company-card:active{cursor:grabbing;}
.company-card.dragging{opacity:.35;}
.company-card.drag-hover{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal-light) inset;}
.company-card:hover{border-color:var(--teal);box-shadow:0 6px 18px rgba(22,33,58,0.08);transform:translateY(-2px);}
.company-card-name{font-weight:600;font-size:14px;color:var(--ink);line-height:1.35;word-break:break-word;}
.company-card-code{font-size:12px;color:var(--slate);font-family:var(--font-mono);}

/* ---------- Judul laporan (kop laporan keuangan) ---------- */
.report-title{margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border);text-align:center;}
.report-title-line{font-weight:700;font-size:13px;color:var(--ink);line-height:1.55;letter-spacing:.2px;}
.report-title-line.muted{font-weight:500;color:var(--slate);font-size:12px;}
.verify-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:#fff;background:var(--teal);padding:2px 9px;border-radius:999px;margin-left:8px;vertical-align:middle;white-space:nowrap;}
.verify-checkbox-label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12.5px;color:var(--slate);user-select:none;}
.verify-checkbox-label input{width:16px;height:16px;accent-color:var(--teal);cursor:pointer;}

/* Checkbox "Sinkron" pada rincian akun (per sub-akun/transaksi/baris) —
   menandai bahwa angka di Integrida sudah dicocokkan manual dengan data
   sistem/sumber aslinya (mis. mutasi rekening bank). Berbeda dari
   verify-checkbox-label (yang menandai satu PERIODE penuh), ini menandai
   satu BARIS rincian secara individual. */
.sync-checkbox-label{display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-size:11px;color:var(--slate-light);user-select:none;white-space:nowrap;margin-left:12px;flex-shrink:0;}
.sync-checkbox-label:hover{color:var(--teal);}
.sync-checkbox-label input{width:14px;height:14px;accent-color:var(--teal);cursor:pointer;}
.sync-checkbox-label.is-synced{color:var(--teal);font-weight:600;}

.kpi-card{display:flex;flex-direction:column;gap:6px;}
.kpi-label{font-size:12px;color:var(--slate);text-transform:uppercase;letter-spacing:.5px;}
.kpi-value{font-family:var(--font-mono);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;}
.kpi-delta{font-size:12.5px;font-family:var(--font-mono);}
.kpi-delta.up{color:var(--teal);}
.kpi-delta.down{color:var(--danger);}

.section-title{font-family:var(--font-display);font-size:16px;font-weight:600;margin:0 0 14px 0;}
.section-block{margin-bottom:26px;}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--border);}
th:first-child,td:first-child{text-align:left;}
thead th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--slate);font-weight:600;background:#fafbfb;position:sticky;top:0;}
td.num,th.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
tbody tr:hover{background:#fafcfb;}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);}

.btn{
  display:inline-flex;align-items:center;gap:7px;
  background:var(--ink);color:#fff;border:none;padding:9px 16px;border-radius:8px;
  font-size:13.5px;font-weight:500;cursor:pointer;
}
.btn:hover{background:var(--ink-soft);}
.btn.primary{background:var(--teal);}
.btn.primary:hover{background:#156357;}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--border);}
.btn.ghost:hover{background:#f2f3f4;}
.btn.danger{background:var(--danger);}
.btn:disabled{opacity:.5;cursor:not-allowed;}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.field label{font-size:12.5px;color:var(--slate);font-weight:500;}
.field input,.field select,.field textarea{
  padding:9px 11px;border:1px solid var(--border);border-radius:7px;font-size:13.5px;background:#fff;
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal);}
.field textarea{font-family:inherit;resize:vertical;min-height:56px;}
.ownership-row{display:grid;grid-template-columns:1fr 110px 34px;gap:8px;align-items:center;margin-bottom:8px;}
.ownership-row input[type="text"],.ownership-row select{padding:8px 10px;border:1px solid var(--border);border-radius:7px;font-size:13px;background:#fff;width:100%;}
.ownership-row .pct-wrap{position:relative;}
.ownership-row .pct-wrap input{padding:8px 22px 8px 10px;border:1px solid var(--border);border-radius:7px;font-size:13px;width:100%;text-align:right;}
.ownership-row .pct-wrap span{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--slate);pointer-events:none;}
.ownership-row .remove-ownership{background:transparent;border:1px solid var(--border);border-radius:7px;color:var(--slate);cursor:pointer;height:34px;}
.ownership-row .remove-ownership:hover{color:#c0392b;border-color:#c0392b;}

.combo-wrap{position:relative;}
.combo-dropdown{
  position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:30;
  background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(20,30,50,.12);
  max-height:220px;overflow-y:auto;
}
.combo-option{padding:9px 12px;cursor:pointer;font-size:13.5px;display:flex;gap:8px;align-items:baseline;}
.combo-option:hover,.combo-option.active{background:var(--teal-light);}
.combo-option .combo-code{font-weight:600;color:var(--teal);min-width:20px;}
.combo-option .combo-name{color:var(--ink);}
.combo-empty{padding:10px 12px;font-size:13px;color:var(--slate);}

/* ---------- Bagan Struktur Perusahaan (Induk / Anak / Cucu) ---------- */
.org-chart-toolbar-hint{font-size:11.5px;color:var(--slate);line-height:1.6;}
.org-chart-legend-dot{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin:0 4px 0 8px;}
.org-chart-viewport{
  position:relative;width:100%;height:560px;overflow:hidden;
  border:1px solid var(--border);border-radius:var(--radius);
  background:
    linear-gradient(90deg, rgba(20,30,50,.045) 1px, transparent 1px) 0 0/26px 26px,
    linear-gradient(rgba(20,30,50,.045) 1px, transparent 1px) 0 0/26px 26px,
    #fafbfb;
  cursor:grab;touch-action:none;
}
.org-chart-viewport.dragging{cursor:grabbing;}
.org-chart-canvas{position:absolute;top:0;left:0;transform-origin:0 0;padding:36px;will-change:transform;width:max-content;}

.org-tree{text-align:center;}
.org-tree, .org-tree ul{list-style:none;margin:0;padding:0;}
.org-tree ul{padding-top:24px;position:relative;}
.org-tree ul::after{content:'';display:table;clear:both;}
.org-tree li{
  float:left;text-align:center;list-style-type:none;position:relative;
  padding:24px 5px 0 5px;transition:all .2s;
}
.org-tree li::before,.org-tree li::after{
  content:'';position:absolute;top:0;right:50%;
  border-top:2px solid var(--border);width:50%;height:24px;
}
.org-tree li::after{right:auto;left:50%;border-left:2px solid var(--border);}
.org-tree li:only-child::after,.org-tree li:only-child::before{display:none;}
.org-tree li:only-child{padding-top:0;}
.org-tree li:first-child::before,.org-tree li:last-child::after{border:0 none;}
.org-tree li:last-child::before{border-right:2px solid var(--border);border-radius:0 6px 0 0;}
.org-tree li:first-child::after{border-radius:6px 0 0 0;}
.org-tree ul ul::before{
  content:'';position:absolute;top:0;left:50%;
  border-left:2px solid var(--border);width:0;height:24px;
}
.org-node{
  border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;
  display:inline-flex;flex-direction:column;gap:6px;
  background:#fff;font-size:13px;line-height:1.45;
  box-shadow:0 1px 3px rgba(20,30,50,.06);white-space:normal;cursor:pointer;
  transition:box-shadow .15s,transform .15s;width:max-content;min-width:210px;max-width:340px;text-align:left;
}
.org-node:hover{box-shadow:0 4px 10px rgba(20,30,50,.12);transform:translateY(-1px);}
.org-node.level-0{background:#fff;color:var(--ink);border-color:var(--border);}
.org-node.level-1{background:#fff;color:var(--ink);border-color:var(--border);}
.org-node.level-2{background:#fff;color:var(--ink);border-color:var(--border);}
.org-node-name{font-weight:700;font-size:14px;white-space:normal;text-align:center;width:100%;}
.org-node-header{display:flex;flex-direction:column;gap:6px;}
.org-node-logo-wrap{display:flex;justify-content:center;width:100%;}
.org-node-sub{display:flex;align-items:center;flex-wrap:wrap;gap:5px;justify-content:center;}
.org-node-sub .org-code{font-size:11px;color:var(--slate);font-family:var(--font-mono);}
.org-node-divider{border-top:1px solid currentColor;opacity:.14;margin:1px 0;}
.org-node-label{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;opacity:.6;font-weight:700;margin-bottom:3px;}
.org-node-ownership{display:flex;flex-direction:column;gap:2px;}
.org-node-ownership-row{font-size:11.5px;opacity:.9;white-space:nowrap;}
.org-node-founded{font-size:11px;opacity:.7;font-weight:400;white-space:normal;}

.badge{display:inline-block;padding:3px 9px;border-radius:100px;font-size:11px;font-weight:600;}
.badge.teal{background:var(--teal-light);color:var(--teal);}
.badge.gold{background:var(--gold-light);color:#8a611f;}
.badge.danger{background:var(--danger-light);color:var(--danger);}
.badge.blue{background:#e9eef9;color:#3B5BA5;}
.badge.purple{background:#f1ecfa;color:#6b46c1;}

.pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.pill{
  padding:7px 14px;border-radius:100px;border:1px solid var(--border);background:#fff;
  font-size:13px;cursor:pointer;color:var(--slate);
}
.pill.active{background:var(--ink);color:#fff;border-color:var(--ink);}

.empty-state{
  text-align:center;padding:50px 20px;color:var(--slate);
}
.empty-state .mark{font-size:32px;margin-bottom:10px;}

.modal-backdrop{
  position:fixed;inset:0;background:rgba(15,20,30,0.55);display:flex;align-items:center;justify-content:center;z-index:50;
}
.modal{background:#fff;border-radius:12px;width:460px;max-width:92vw;padding:24px;max-height:88vh;overflow-y:auto;}
.modal h3{font-family:var(--font-display);margin:0 0 4px 0;}
.modal .modal-sub{font-size:12.5px;color:var(--slate);margin-bottom:16px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}

.dropzone{
  border:2px dashed var(--border);border-radius:var(--radius);padding:34px 20px;text-align:center;
  cursor:pointer;color:var(--slate);background:#fafbfb;
}
.dropzone.drag{border-color:var(--teal);background:var(--teal-light);color:var(--teal);}
.dropzone svg{width:30px;height:30px;margin-bottom:8px;opacity:.6;}

.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:80;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:8px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.18);}
.toast.error{background:var(--danger);}
.toast.success{background:var(--teal);}

.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);
  background-image:repeating-linear-gradient(to bottom, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 30px);}
.auth-card{width:380px;max-width:92vw;background:#fff;border-radius:14px;padding:32px 28px;}
.auth-brand{display:flex;align-items:center;gap:10px;margin-bottom:22px;}
.auth-brand .mark{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,var(--teal),#0e4e44);display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:700;}
.auth-brand .name{font-family:var(--font-display);font-weight:700;font-size:20px;}
.auth-tabs{display:flex;gap:6px;margin-bottom:18px;background:#f2f3f4;padding:4px;border-radius:9px;}
.auth-tab{flex:1;text-align:center;padding:8px;border-radius:7px;font-size:13px;cursor:pointer;color:var(--slate);}
.auth-tab.active{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.auth-error{background:var(--danger-light);color:var(--danger);font-size:12.5px;padding:9px 11px;border-radius:7px;margin-bottom:12px;}
.auth-hint{font-size:11.5px;color:var(--slate-light);margin-top:14px;line-height:1.5;}

.chart-box{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.chart-box canvas{max-height:280px;}

.ratio-note{font-size:12px;color:var(--slate);background:#fafbfb;border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-top:10px;line-height:1.5;}
.bb-akun-row:hover{background:var(--teal-light);}
.bb-ledger-row:hover{background:var(--teal-light);}
.ledger-group summary::-webkit-details-marker{display:none;}
.ledger-group summary{list-style:none;}
.ledger-group summary::before{content:'▾';display:inline-block;width:14px;color:var(--slate-light);font-size:11px;transition:transform .15s;}
.ledger-group:not([open]) summary::before{transform:rotate(-90deg);}

.loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--slate);font-family:var(--font-display);}

/* ---------- Sync badge ---------- */
.sync-badge{
  display:flex;align-items:center;gap:7px;
  font-size:12.5px;color:var(--slate);
  background:#fafbfb;border:1px solid var(--border);
  padding:6px 12px;border-radius:100px;
  cursor:default;user-select:none;white-space:nowrap;
}
.sync-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.sync-badge.pulse .sync-dot{animation:sync-pulse 1.1s ease-in-out infinite;}
.sync-time{color:var(--slate-light);font-family:var(--font-mono);font-size:11px;}
@keyframes sync-pulse{
  0%{opacity:1;transform:scale(1);}
  50%{opacity:.35;transform:scale(.75);}
  100%{opacity:1;transform:scale(1);}
}
@media(max-width:640px){ .sync-badge .sync-time{display:none;} }

@media(max-width:900px){
  .sidebar{transform:translateX(-100%);transition:transform .2s ease;z-index:40;}
  .sidebar.open{transform:translateX(0);}
  .main{margin-left:0;}
  .grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}
}

</style>
</head>
<body>

<div id="root">
  <div class="loading-screen">Memuat Integrida…</div>
</div>

<!-- Firebase (compat SDK, tanpa perlu bundler) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<!-- Utilitas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
