// ---------- Perusahaan ----------
function renderCompanies() {
  const root = document.getElementById('view-root');
  root.innerHTML = `
    <div class="section-block" style="display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;">
      <input type="text" id="company-search" placeholder="Cari kode atau nama perusahaan…" style="flex:1;min-width:220px;max-width:360px;" ${state.companies.length === 0 ? 'disabled' : ''}>
      <button class="btn primary" id="add-company-btn">+ Tambah Perusahaan</button>
    </div>
    ${state.companies.length === 0 ? emptyState('Belum ada perusahaan', 'Mulai dengan menambahkan perusahaan pertama Anda.', '', '') : `
    <div class="table-wrap">
      <table>
        <thead><tr><th>Kode</th><th>Nama Perusahaan</th><th class="num">Jumlah Periode Tersimpan</th><th></th></tr></thead>
        <tbody id="company-rows"></tbody>
      </table>
    </div>
    <div id="company-search-empty" class="card" style="display:none;color:var(--slate);margin-top:10px;">Tidak ada perusahaan yang cocok dengan pencarian.</div>`}
  `;
  document.getElementById('add-company-btn').addEventListener('click', openAddCompanyModal);
  if (state.companies.length) {
    fillCompanyRows(state.companies);
    const searchInput = document.getElementById('company-search');
    searchInput.addEventListener('input', () => {
      const q = searchInput.value.trim().toLowerCase();
      const filtered = !q ? state.companies : state.companies.filter(c =>
        String(c.code || '').toLowerCase().includes(q) ||
        String(c.name || '').toLowerCase().includes(q)
      );
      document.getElementById('company-search-empty').style.display = filtered.length === 0 ? '' : 'none';
      fillCompanyRows(filtered);
    });
  }
}

async function fillCompanyRows(list) {
  const companies = list || state.companies;
  const tbody = document.getElementById('company-rows');
  tbody.innerHTML = companies.map(c => `<tr data-id="${c.id}">
    <td><a href="#" class="company-code-edit" data-code="${c.id}" style="color:var(--slate);text-decoration:none;" title="Klik untuk mengubah kode">${c.code ? c.code : '<span style="color:var(--slate-light);font-style:italic;">+ kode</span>'}</a></td>
    <td><a href="#" class="company-link" data-open="${c.id}" style="color:var(--ink);font-weight:600;text-decoration:none;">${c.name}</a></td>
    <td class="num">…</td>
    <td style="text-align:right;"><button class="btn ghost" data-del="${c.id}">Hapus</button></td>
  </tr>`).join('');
  for (const c of companies) {
    const statements = await DB.getStatements(c.id);
    const row = tbody.querySelector(`tr[data-id="${c.id}"] td:nth-child(3)`);
    if (row) row.textContent = statements.length;
  }
  tbody.querySelectorAll('[data-open]').forEach(link => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      openCompanyDetail(link.dataset.open);
    });
  });
  tbody.querySelectorAll('[data-code]').forEach(link => {
    link.addEventListener('click', async (e) => {
      e.preventDefault();
      e.stopPropagation();
      const id = link.dataset.code;
      const current = companies.find(c => c.id === id);
      const next = prompt('Kode perusahaan:', current ? (current.code || '') : '');
      if (next === null) return;
      const trimmed = next.trim();
      await DB.updateCompanyCode(id, trimmed);
      if (current) current.code = trimmed;
      link.innerHTML = trimmed ? trimmed : '<span style="color:var(--slate-light);font-style:italic;">+ kode</span>';
      toast('Kode perusahaan diperbarui', 'success');
    });
  });
  tbody.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!confirm('Hapus perusahaan ini beserta seluruh data laporannya?')) return;
      await DB.deleteCompany(btn.dataset.del);
      toast('Perusahaan dihapus', 'success');
      await reloadCompanies();
    });
  });
}

function openAddCompanyModal() {
  const backdrop = el(`<div class="modal-backdrop"><div class="modal">
    <h3>Tambah Perusahaan</h3>
    <div class="modal-sub">Perusahaan yang akan dikonsolidasikan laporan keuangannya.</div>
    <div class="field"><label>Nama Perusahaan</label><input type="text" id="new-company-name" placeholder="Contoh: PT Sumber Makmur"></div>
    <div class="field"><label>Kode Perusahaan (opsional)</label><input type="text" id="new-company-code" placeholder="Contoh: PSM"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="cancel-modal">Batal</button>
      <button class="btn primary" id="save-company">Simpan</button>
    </div>
  </div></div>`);
  document.body.appendChild(backdrop);
  backdrop.querySelector('#cancel-modal').addEventListener('click', () => backdrop.remove());
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) backdrop.remove(); });
  backdrop.querySelector('#save-company').addEventListener('click', async () => {
    const name = backdrop.querySelector('#new-company-name').value.trim();
    const code = backdrop.querySelector('#new-company-code').value.trim();
    if (!name) { toast('Nama perusahaan wajib diisi', 'error'); return; }
    await DB.addCompany(state.user.uid, name, code);
    backdrop.remove();
    toast('Perusahaan ditambahkan', 'success');
    await reloadCompanies();
  });
}

// ---------- Rincian Perusahaan ----------
function openCompanyDetail(companyId) {
  teardownActiveDataListener();
  state.view = 'company-detail';
  state.companyDetailId = companyId;
  state.companyDetailPeriodId = null;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const company = state.companies.find(c => c.id === companyId);
  document.getElementById('topbar-title').textContent = company ? company.name : 'Detail Perusahaan';
  document.getElementById('topbar-sub').textContent = 'Rincian laporan & riwayat impor';
  renderCompanyDetail();
}

function humanizeKey(key) {
  const withSpaces = String(key || '').replace(/([a-z0-9])([A-Z])/g, '$1 $2');
  return withSpaces.charAt(0).toUpperCase() + withSpaces.slice(1);
}

function neracaGroupedTable(neraca) {
  if (!neraca || Object.keys(neraca).length === 0) return `<div style="color:var(--slate-light);font-size:13px;padding:6px 2px;">Belum ada data.</div>`;
  const row = (key) => key in neraca ? `<tr><td>${humanizeKey(key)}</td><td class="num">${formatIDR(neraca[key])}</td></tr>` : '';
  const rowBold = (key) => key in neraca ? `<tr style="font-weight:600;"><td>${humanizeKey(key)}</td><td class="num">${formatIDR(neraca[key])}</td></tr>` : '';
  const rowHighlight = (key) => key in neraca ? `<tr style="font-weight:700;background:var(--teal-light);"><td>${humanizeKey(key)}</td><td class="num">${formatIDR(neraca[key])}</td></tr>` : '';
  const groupRow = (label) => `<tr><td colspan="2" style="font-weight:600;color:var(--slate);padding-top:10px;">${label}</td></tr>`;
  return `<table><tbody>
    ${groupRow('Aset Lancar')}
    ${row('kasSetaraKas')}${row('persediaan')}${rowBold('totalAsetLancar')}
    ${groupRow('Aset Tidak Lancar')}
    ${rowBold('totalAsetTidakLancar')}
    ${rowHighlight('totalAset')}
    ${groupRow('Liabilitas')}
    ${row('totalKewajibanLancar')}${row('totalKewajibanJangkaPanjang')}${rowBold('totalKewajiban')}
    ${groupRow('Ekuitas')}
    ${rowBold('totalEkuitas')}
  </tbody></table>`;
}

function keyValueTable(obj) {
  const entries = Object.entries(obj || {}).filter(([, v]) => v !== undefined && v !== null);
  if (entries.length === 0) return `<div style="color:var(--slate-light);font-size:13px;padding:6px 2px;">Belum ada data.</div>`;
  return `<table><tbody>${entries.map(([k, v]) => `<tr><td>${humanizeKey(k)}</td><td class="num">${formatIDR(v)}</td></tr>`).join('')}</tbody></table>`;
}

// Baris satu akun di dalam kelompok klasifikasi Buku Besar — kode akun
// (kalau ada) + nama di kiri, saldo akhir di kanan, seluruh baris bisa
// diklik (delegated listener .bb-ledger-row) untuk membuka rincian
// transaksi akun tersebut.
function ledgerAccountRow(a) {
  const codeTag = a.code
    ? `<span style="font-family:var(--font-mono);font-size:11px;color:var(--slate-light);margin-right:7px;">${a.code}</span>`
    : '';
  return `
    <div class="bb-ledger-row" data-idx="${a._idx}" title="Klik untuk melihat rincian transaksi"
         style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px;">
      <span style="color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${codeTag}${a.name || '(tanpa nama)'}</span>
      <span class="num" style="font-family:var(--font-mono);flex-shrink:0;">${formatIDR(a.saldoAkhir)}</span>
    </div>`;
}

// Tampilan Buku Besar dikelompokkan per klasifikasi akun (Kas & Setara
// Kas, Persediaan, Aset Tidak Lancar, dst — lihat LEDGER_GROUP_ORDER),
// masing-masing menampilkan total kelompok di judul lalu daftar akun
// penyusunnya di bawahnya — supaya pengguna langsung melihat akun apa
// saja yang membentuk sebuah kategori (mis. "Kas & Setara Kas" terdiri
// dari akun Kas, Bank Jatim, Bank Mandiri Sidoarjo), dan tiap akun tetap
// bisa diklik untuk melihat rincian transaksinya (sama seperti sebelumnya).
function ledgerTable(accounts) {
  if (!Array.isArray(accounts) || accounts.length === 0) return `<div style="color:var(--slate-light);font-size:13px;padding:6px 2px;">Belum ada data.</div>`;
  activeLedgerAccounts = accounts;
  const groups = groupLedgerAccountsByClassification(accounts);
  return `
    <div style="max-height:420px;overflow-y:auto;">
      ${groups.map(g => {
        const total = g.accounts.reduce((sum, a) => sum + (a.saldoAkhir || 0), 0);
        return `
        <details class="ledger-group" style="border-bottom:1px solid var(--border);">
          <summary style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 2px;cursor:pointer;font-weight:600;font-size:13.5px;">
            <span>${g.label}<span style="font-weight:400;color:var(--slate-light);margin-left:6px;">(${g.accounts.length} akun)</span></span>
            <span class="num" style="font-family:var(--font-mono);">${formatIDR(total)}</span>
          </summary>
          <div style="padding:0 2px 8px 20px;">
            ${g.accounts.map(ledgerAccountRow).join('')}
          </div>
        </details>`;
      }).join('')}
    </div>`;
}

// ---------- Rincian Akun (pratinjau impor Buku Besar) ----------
// Baris Neraca/Laba Rugi yang diturunkan otomatis dari Buku Besar bisa
// diklik untuk melihat akun-akun mana yang menyusun angka tersebut
// (untuk mengecek kesesuaian transaksi), atau formula perhitungannya
// untuk baris yang merupakan hasil turunan dari baris lain (bukan
// dijumlah langsung dari akun).
const NERACA_FORMULAS = {
  totalAset: (n) => `Total Aset Lancar (${formatIDR(n.totalAsetLancar)}) + Total Aset Tidak Lancar (${formatIDR(n.totalAsetTidakLancar)})`,
  totalKewajiban: (n) => `Total Kewajiban Lancar (${formatIDR(n.totalKewajibanLancar)}) + Total Kewajiban Jangka Panjang (${formatIDR(n.totalKewajibanJangkaPanjang)})`
};
const LABA_RUGI_FORMULAS = {
  labaKotor: (l) => `Pendapatan (${formatIDR(l.pendapatan)}) − HPP (${formatIDR(l.hpp)})`,
  labaOperasional: (l) => `Laba Kotor (${formatIDR(l.labaKotor)}) − Beban Operasional (${formatIDR(l.bebanOperasional)})`,
  labaBersih: (l) => `Laba Operasional (${formatIDR(l.labaOperasional)}) + Pendapatan Lainnya (${formatIDR(l.pendapatanLainnya)}) − Beban Lainnya (${formatIDR(l.bebanLainnya)}) − Beban Pajak (${formatIDR(l.pajakPenghasilan)})`
};

// Data klasifikasi/akun yang sedang tampil di layar (pratinjau impor ATAU
// Detail Perusahaan) — dipakai oleh delegated click handler di bawah untuk
// tahu transaksi mana yang harus ditampilkan saat sebuah baris akun diklik.
let activeContributions = null;
let activeLedgerAccounts = [];

function openLedgerAccountModal(acc) {
  const backdrop = el(`<div class="modal-backdrop">
    <div class="modal" style="width:560px;">
      <h3>${acc.code ? acc.code + ' &mdash; ' : ''}${acc.name || '(tanpa nama)'}</h3>
      <div class="modal-sub">Saldo Awal: <strong>${formatIDR(acc.saldoAwal)}</strong> &middot; Saldo Akhir: <strong>${formatIDR(acc.saldoAkhir)}</strong></div>
      <div class="table-wrap" style="max-height:360px;overflow-y:auto;">
        <table>
          <thead><tr><th>Tanggal</th><th>Keterangan</th><th class="num">Debit</th><th class="num">Kredit</th></tr></thead>
          <tbody>
            ${(acc.transaksi && acc.transaksi.length)
              ? acc.transaksi.map(t => `<tr>
                  <td>${t.tanggal || '–'}</td>
                  <td>${t.keterangan || '–'}</td>
                  <td class="num">${t.debit ? formatIDR(t.debit) : '–'}</td>
                  <td class="num">${t.kredit ? formatIDR(t.kredit) : '–'}</td>
                </tr>`).join('')
              : `<tr><td colspan="4" style="text-align:center;color:var(--slate);">Tidak ada rincian transaksi untuk akun ini pada periode ini.</td></tr>`}
          </tbody>
        </table>
      </div>
      <div class="modal-actions"><button class="btn ghost" id="close-modal">Tutup</button></div>
    </div>
  </div>`);
  document.body.appendChild(backdrop);
  backdrop.querySelector('#close-modal').addEventListener('click', () => backdrop.remove());
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) backdrop.remove(); });
}

// Delegated listener tunggal (dipasang sekali) supaya baris akun yang
// dirender lewat innerHTML di berbagai halaman (pratinjau impor, Detail
// Perusahaan) tetap bisa diklik tanpa perlu bind ulang tiap render.
document.addEventListener('click', (e) => {
  const contribRow = e.target.closest('.bb-akun-row');
  if (contribRow) {
    const field = contribRow.dataset.field;
    const idx = Number(contribRow.dataset.idx);
    const acc = activeContributions && activeContributions[field] && activeContributions[field][idx];
    if (acc) openLedgerAccountModal(acc);
    return;
  }
  const ledgerRow = e.target.closest('.bb-ledger-row');
  if (ledgerRow) {
    const acc = activeLedgerAccounts[Number(ledgerRow.dataset.idx)];
    if (acc) openLedgerAccountModal(acc);
  }
});

function derivedFieldRow(key, value, contributions, formulaFn, formulaData, labelOverride) {
  const list = contributions && contributions[key];
  let body;
  if (list && list.length) {
    body = list.map((c, i) => {
      const codeTag = c.code
        ? `<span style="font-family:var(--font-mono);font-size:11px;color:var(--slate-light);margin-right:7px;">${c.code}</span>`
        : '';
      return `
        <div class="bb-akun-row" data-field="${key}" data-idx="${i}" title="Klik untuk melihat rincian transaksi"
             style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px;">
          <span style="color:var(--ink);">${codeTag}${c.name || '(tanpa nama)'}</span>
          <span class="num" style="font-family:var(--font-mono);flex-shrink:0;">${formatIDR(c.amount)}</span>
        </div>`;
    }).join('');
  } else if (formulaFn) {
    body = `<div class="ratio-note" style="margin-top:4px;">${formulaFn(formulaData)}</div>`;
  } else {
    body = `<div style="color:var(--slate-light);font-size:12px;margin-top:4px;padding-left:2px;">Tidak ada akun buku besar yang menyusun baris ini.</div>`;
  }
  return `
    <details style="border-bottom:1px solid var(--border);">
      <summary style="display:flex;justify-content:space-between;align-items:center;padding:7px 2px;cursor:pointer;">
        <span>${labelOverride || humanizeKey(key)}</span><span class="num" style="font-family:var(--font-mono);">${formatIDR(value)}</span>
      </summary>
      <div style="padding:2px 2px 12px 12px;">${body}</div>
    </details>`;
}

// Label khusus Laba Rugi hasil turunan Buku Besar — dipakai untuk
// menimpa label bawaan (dari nama field) saat istilahnya perlu berbeda
// dari nama field internal (mis. field "pajakPenghasilan" ditampilkan
// sebagai "Beban Pajak" agar konsisten dengan susunan Pendapatan/HPP/
// Beban Operasional/Pendapatan Lainnya/Beban Lainnya/Beban Pajak).
const LABA_RUGI_LABELS = { pajakPenghasilan: 'Beban Pajak' };

function derivedSectionDetails(obj, contributions, formulas, labels) {
  activeContributions = contributions;
  const entries = Object.entries(obj || {});
  if (entries.length === 0) return `<div style="color:var(--slate-light);font-size:13px;">Tidak ada data.</div>`;
  return entries.map(([k, v]) => derivedFieldRow(k, v, contributions, formulas[k], obj, labels && labels[k])).join('');
}

// Pengelompokan khusus untuk pratinjau Neraca hasil turunan Buku Besar —
// mengelompokkan baris yang sama persis (kasSetaraKas, persediaan,
// totalAsetLancar, dst) ke bawah judul kategori Aset Lancar / Aset Tidak
// Lancar / Liabilitas / Ekuitas, sambil tetap memakai derivedFieldRow
// (baris tetap bisa diklik untuk melihat akun buku besar penyusunnya).
function neracaGroupHeader(label) {
  return `<div style="font-weight:600;color:var(--slate);font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:12px 2px 4px 2px;">${label}</div>`;
}

function derivedNeracaGrouped(neraca, contributions) {
  activeContributions = contributions;
  if (!neraca || Object.keys(neraca).length === 0) return `<div style="color:var(--slate-light);font-size:13px;">Tidak ada data.</div>`;
  const row = (key) => key in neraca ? derivedFieldRow(key, neraca[key], contributions, NERACA_FORMULAS[key], neraca) : '';
  const highlight = (key) => key in neraca
    ? `<div style="background:var(--teal-light);border-radius:6px;">${derivedFieldRow(key, neraca[key], contributions, NERACA_FORMULAS[key], neraca)}</div>`
    : '';
  return `
    ${neracaGroupHeader('Aset Lancar')}
    ${row('kasSetaraKas')}${row('persediaan')}${row('totalAsetLancar')}
    ${neracaGroupHeader('Aset Tidak Lancar')}
    ${row('totalAsetTidakLancar')}
    ${highlight('totalAset')}
    ${neracaGroupHeader('Liabilitas')}
    ${row('totalKewajibanLancar')}${row('totalKewajibanJangkaPanjang')}${row('totalKewajiban')}
    ${neracaGroupHeader('Ekuitas')}
    ${row('totalEkuitas')}
  `;
}

function renderCompanyDetail() {
  const root = document.getElementById('view-root');
  const company = state.companies.find(c => c.id === state.companyDetailId);
  if (!company) {
    // Perusahaan sudah dihapus / tidak ditemukan — kembali ke daftar perusahaan.
    setView('companies');
    return;
  }

  root.innerHTML = `
    <div class="section-block" style="display:flex;justify-content:space-between;align-items:center;">
      <button class="btn ghost" id="back-to-companies">&larr; Kembali ke Daftar Perusahaan</button>
    </div>
    <div id="company-detail-content"><div class="card" style="color:var(--slate);">Memuat data…</div></div>
  `;
  document.getElementById('back-to-companies').addEventListener('click', () => setView('companies'));

  // Listener realtime: rincian & riwayat impor otomatis diperbarui begitu
  // ada data baru/dihapus, baik dari perangkat ini maupun perangkat lain.
  state.unsubData = DB.watchStatements(state.companyDetailId, (rawStatements, meta) => {
    Sync.report('statements', meta);
    if (state.view !== 'company-detail' || state.companyDetailId !== company.id) return;
    const statements = rawStatements.sort((a, b) => a.year - b.year || a.periodIndex - b.periodIndex);
    paintCompanyDetail(statements);
  }, (err) => toast('Gagal memuat data laporan: ' + err.message, 'error'));
}

function paintCompanyDetail(statements) {
  const content = document.getElementById('company-detail-content');
  if (!content) return;

  if (statements.length === 0) {
    content.innerHTML = `
      <div class="card" style="color:var(--slate);margin-bottom:20px;">Belum ada data laporan keuangan untuk perusahaan ini. Silakan impor data terlebih dahulu di menu <strong>Impor Data</strong>.</div>
      <div class="section-block">
        <div class="section-title">Riwayat Impor</div>
        <div class="card" style="color:var(--slate);">Belum ada riwayat impor.</div>
      </div>
    `;
    return;
  }

  // Pilih periode aktif: gunakan pilihan sebelumnya bila masih ada, kalau
  // tidak jatuhkan ke periode terbaru.
  let selected = statements.find(s => s.id === state.companyDetailPeriodId);
  if (!selected) selected = statements[statements.length - 1];
  state.companyDetailPeriodId = selected.id;

  // Kalau periode ini punya data Buku Besar, klasifikasi Neraca & Laba Rugi
  // direkonstruksi dari akun-akun tersimpan supaya baris-barisnya tetap bisa
  // diklik untuk melihat rincian transaksi — sama seperti di layar pratinjau
  // impor, bukan cuma tabel angka datar.
  const bbContribs = contributionsFromLedger(selected.bukuBesar);

  content.innerHTML = `
    <div class="section-block">
      <div class="section-title">Pilih Periode</div>
      <div class="pill-row" id="detail-period-pills">
        ${statements.map(s => `<div class="pill ${s.id === selected.id ? 'active' : ''}" data-period-id="${s.id}">${s.periodLabel}</div>`).join('')}
      </div>
    </div>

    <div class="section-block grid grid-2">
      <div class="card">
        <div class="section-title">
          <span class="badge teal">Neraca</span>
          ${bbContribs ? '<span style="font-size:11px;color:var(--slate);font-weight:400;margin-left:8px;">klik baris untuk rincian akun</span>' : ''}
        </div>
        ${bbContribs ? derivedNeracaGrouped(selected.neraca, bbContribs) : neracaGroupedTable(selected.neraca)}
      </div>
      <div class="card">
        <div class="section-title">
          <span class="badge gold">Laba Rugi</span>
          ${bbContribs ? '<span style="font-size:11px;color:var(--slate);font-weight:400;margin-left:8px;">klik baris untuk rincian akun</span>' : ''}
        </div>
        ${bbContribs ? derivedSectionDetails(selected.labaRugi, bbContribs, LABA_RUGI_FORMULAS, LABA_RUGI_LABELS) : keyValueTable(selected.labaRugi)}
      </div>
      <div class="card">
        <div class="section-title"><span class="badge blue">Arus Kas</span></div>
        ${keyValueTable(selected.arusKas)}
      </div>
    </div>

    <div class="section-block">
      <div class="section-title">Riwayat Impor</div>
      <div style="font-size:12px;color:var(--slate);margin:-8px 0 12px 0;">
        Menghapus satu baris riwayat akan menghapus <strong>seluruh data periode tersebut</strong> (Neraca, Laba Rugi, Arus Kas, dan Buku Besar yang pernah diimpor untuk periode itu) secara permanen.
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Periode</th><th>Neraca</th><th>Laba Rugi</th><th>Arus Kas</th><th>Buku Besar</th><th></th></tr></thead>
          <tbody>
            ${statements.slice().reverse().map(s => `<tr data-statement-id="${s.id}">
              <td>${s.periodLabel}</td>
              <td>${hasSectionData(s.neraca) ? '<span style="color:var(--teal);font-weight:600;">✓ Ada</span>' : '<span style="color:var(--slate-light);">– Belum</span>'}</td>
              <td>${hasSectionData(s.labaRugi) ? '<span style="color:var(--teal);font-weight:600;">✓ Ada</span>' : '<span style="color:var(--slate-light);">– Belum</span>'}</td>
              <td>${hasSectionData(s.arusKas) ? '<span style="color:var(--teal);font-weight:600;">✓ Ada</span>' : '<span style="color:var(--slate-light);">– Belum</span>'}</td>
              <td>${hasSectionData(s.bukuBesar) ? '<span style="color:var(--teal);font-weight:600;">✓ Ada</span>' : '<span style="color:var(--slate-light);">– Belum</span>'}</td>
              <td style="text-align:right;"><button class="btn danger" data-del-statement="${s.id}" data-label="${s.periodLabel}">Hapus</button></td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  document.querySelectorAll('#detail-period-pills .pill').forEach(p => {
    p.addEventListener('click', () => {
      state.companyDetailPeriodId = p.dataset.periodId;
      paintCompanyDetail(statements);
    });
  });

  document.querySelectorAll('[data-del-statement]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const statementId = btn.dataset.delStatement;
      const label = btn.dataset.label;
      if (!confirm(`Hapus seluruh data periode "${label}"? Data Neraca, Laba Rugi, Arus Kas, dan Buku Besar yang pernah diimpor untuk periode ini akan ikut terhapus dan tidak bisa dikembalikan.`)) return;
      try {
        await DB.deleteStatement(state.companyDetailId, statementId);
        if (state.companyDetailPeriodId === statementId) state.companyDetailPeriodId = null;
        toast(`Data periode "${label}" dihapus`, 'success');
        // Tampilan akan otomatis diperbarui lewat listener realtime.
      } catch (err) {
        toast('Gagal menghapus data: ' + err.message, 'error');
      }
    });
  });
}

// ---------- Import ----------
function companyDisplayLabel(c) {
  return c.code ? `${c.code} — ${c.name}` : c.name;
}

function selectImportCompany(companyId) {
  const company = state.companies.find(c => c.id === companyId);
  if (!company) return;
  state.importCompanyId = companyId;
  const input = document.getElementById('import-company');
  if (input) input.value = companyDisplayLabel(company);
  closeImportCompanyDropdown();
  resetPreview();
  loadImportStatus();
}

function closeImportCompanyDropdown() {
  const dd = document.getElementById('import-company-dropdown');
  if (dd) { dd.style.display = 'none'; dd.innerHTML = ''; }
}

function renderImportCompanyDropdown(query) {
  const dd = document.getElementById('import-company-dropdown');
  if (!dd) return;
  const q = query.trim().toLowerCase();
  const matches = !q ? state.companies : state.companies.filter(c =>
    String(c.code || '').toLowerCase().includes(q) ||
    String(c.name || '').toLowerCase().includes(q)
  );
  dd.innerHTML = matches.length === 0
    ? `<div class="combo-empty">Tidak ada perusahaan yang cocok.</div>`
    : matches.map(c => `<div class="combo-option" data-id="${c.id}">
        ${c.code ? `<span class="combo-code">${c.code}</span>` : ''}
        <span class="combo-name">${c.name}</span>
      </div>`).join('');
  dd.querySelectorAll('.combo-option').forEach(opt => {
    opt.addEventListener('mousedown', (e) => {
      e.preventDefault();
      selectImportCompany(opt.dataset.id);
    });
  });
  dd.style.display = '';
}

function renderImport() {
  const root = document.getElementById('view-root');
  if (state.companies.length === 0) {
    root.innerHTML = emptyState('Tambahkan perusahaan terlebih dahulu', 'Anda perlu memiliki minimal satu perusahaan sebelum mengimpor data.', 'companies', 'Tambah Perusahaan');
    bindEmptyStateNav(root);
    return;
  }
  if (state.importCompanyId && !state.companies.find(c => c.id === state.importCompanyId)) {
    state.importCompanyId = null;
  }

  root.innerHTML = `
    <div class="grid grid-2" style="align-items:start;">
      <div class="card">
        <div class="section-title">1. Pilih Perusahaan Tujuan</div>
        <div class="field combo-wrap">
          <label>Perusahaan</label>
          <input type="text" id="import-company" placeholder="Ketik kode atau nama perusahaan…" autocomplete="off">
          <div id="import-company-dropdown" class="combo-dropdown" style="display:none;"></div>
        </div>

        <div class="section-title" style="margin-top:20px;">2. Pilih Jenis Data</div>
        <div class="pill-row" id="import-type-pills">
          ${Object.entries(IMPORT_TYPES).map(([key, t]) => `<div class="pill ${state.importType === key ? 'active' : ''}" data-type="${key}">${t.label}</div>`).join('')}
        </div>
        <div style="font-size:11.5px;color:var(--slate);margin:-6px 0 16px 0;line-height:1.5;">
          Setiap jenis data diimpor dari file Excel <strong>terpisah</strong> — satu file khusus untuk satu jenis data saja
          (bukan satu file berisi semua laporan). Anda bisa mengimpor tiap jenis di waktu yang berbeda untuk periode yang sama;
          data yang sudah tersimpan sebelumnya tidak akan tertimpa.
        </div>

        <div class="section-title">3. Unggah File Excel</div>
        <div class="dropzone" id="dropzone">
          ${icon('upload')}
          <div>Seret file .xlsx <strong id="dropzone-type-label"></strong> ke sini, atau klik untuk memilih</div>
          <div style="font-size:11.5px;margin-top:6px;" id="dropzone-hint"></div>
        </div>
        <input type="file" id="file-input" accept=".xlsx,.xls" style="display:none;">
        <a href="#" download class="btn ghost" id="download-template-btn" style="margin-top:14px;width:100%;justify-content:center;"></a>
      </div>
      <div class="card" id="preview-panel">
        <div class="section-title">Pratinjau Data</div>
        <div style="color:var(--slate);font-size:13px;">Belum ada file dipilih.</div>
      </div>
    </div>

    <div class="section-block" style="margin-top:24px;">
      <div class="section-title">Status Data per Periode — <span id="import-status-company-name" style="color:var(--slate);font-weight:500;"></span></div>
      <div id="import-status-table"><div class="card" style="color:var(--slate);">Memuat status…</div></div>
    </div>
  `;

  updateDropzoneAndTemplate();
  loadImportStatus();

  const companyInput = document.getElementById('import-company');
  const initialCompany = state.companies.find(c => c.id === state.importCompanyId);
  if (companyInput && initialCompany) companyInput.value = companyDisplayLabel(initialCompany);

  companyInput.addEventListener('focus', () => renderImportCompanyDropdown(''));
  companyInput.addEventListener('input', () => renderImportCompanyDropdown(companyInput.value));
  companyInput.addEventListener('blur', () => {
    // Delay agar klik pada opsi dropdown (mousedown) sempat diproses sebelum ditutup.
    setTimeout(() => {
      closeImportCompanyDropdown();
      const current = state.companies.find(c => c.id === state.importCompanyId);
      if (current && companyInput) companyInput.value = companyDisplayLabel(current);
    }, 120);
  });
  companyInput.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') companyInput.blur();
  });

  document.querySelectorAll('#import-type-pills .pill').forEach(p => {
    p.addEventListener('click', () => {
      state.importType = p.dataset.type;
      document.querySelectorAll('#import-type-pills .pill').forEach(x => x.classList.toggle('active', x === p));
      updateDropzoneAndTemplate();
      resetPreview();
    });
  });

  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('file-input');
  dropzone.addEventListener('click', () => {
    if (!state.importCompanyId) { toast('Pilih perusahaan terlebih dahulu', 'error'); return; }
    fileInput.click();
  });
  ['dragenter', 'dragover'].forEach(evt => dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.add('drag'); }));
  ['dragleave', 'drop'].forEach(evt => dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.remove('drag'); }));
  dropzone.addEventListener('drop', (e) => { if (e.dataTransfer.files[0]) handleImportFile(e.dataTransfer.files[0]); });
  fileInput.addEventListener('change', (e) => { if (e.target.files[0]) handleImportFile(e.target.files[0]); });
}

function updateDropzoneAndTemplate() {
  const type = IMPORT_TYPES[state.importType];
  const label = document.getElementById('dropzone-type-label');
  if (label) label.textContent = type.label;
  const hint = document.getElementById('dropzone-hint');
  const templateBtn = document.getElementById('download-template-btn');
  if (type.mode === 'accountingReport') {
    if (hint) hint.textContent = `Unggah laporan ${type.label} apa adanya, hasil export langsung dari software akuntansi Anda — kode & nama akun boleh berbeda-beda per perusahaan, sistem membacanya dari struktur laporan (akun header, sub-akun, dan baris total).`;
    if (templateBtn) templateBtn.style.display = 'none';
  } else if (type.mode === 'bukuBesarLedger') {
    if (hint) hint.textContent = `Unggah Buku Besar apa adanya, hasil export langsung dari software akuntansi Anda (per akun: Saldo Awal, daftar transaksi, Ending Balance). Neraca & Laba Rugi periode ini akan dihitung & diisi otomatis dari kode akun (1=Aset, 2=Kewajiban, 3=Ekuitas, 4=Pendapatan, 5=HPP, 6=Beban Operasional, 7=Pendapatan Lainnya, 8=Beban Lainnya, 9=Beban Pajak).`;
    if (templateBtn) templateBtn.style.display = 'none';
  } else {
    if (hint) hint.textContent = `File harus berisi sheet "Info" dan sheet data sesuai jenis yang dipilih di atas`;
    if (templateBtn) {
      templateBtn.style.display = '';
      templateBtn.href = type.templateFile;
      templateBtn.textContent = `Unduh Template ${type.label}`;
    }
  }
}

function resetPreview() {
  pendingImport = null;
  const panel = document.getElementById('preview-panel');
  if (panel) panel.innerHTML = `<div class="section-title">Pratinjau Data</div><div style="color:var(--slate);font-size:13px;">Belum ada file dipilih.</div>`;
}

function hasSectionData(v) {
  if (v === undefined || v === null) return false;
  if (Array.isArray(v)) return v.length > 0;
  if (typeof v === 'object') return Object.keys(v).length > 0;
  return true;
}

async function loadImportStatus() {
  const company = state.companies.find(c => c.id === state.importCompanyId);
  const nameEl = document.getElementById('import-status-company-name');
  if (nameEl) nameEl.textContent = company ? company.name : '';
  const tableEl = document.getElementById('import-status-table');
  if (!tableEl) return;
  if (!state.importCompanyId) {
    tableEl.innerHTML = `<div class="card" style="color:var(--slate);">Pilih perusahaan terlebih dahulu untuk melihat status data.</div>`;
    return;
  }
  const statements = (await DB.getStatements(state.importCompanyId)).sort((a, b) => a.year - b.year || a.periodIndex - b.periodIndex);
  if (statements.length === 0) {
    tableEl.innerHTML = `<div class="card" style="color:var(--slate);">Belum ada data yang diimpor untuk perusahaan ini.</div>`;
    return;
  }
  const mark = (ok) => ok ? '<span style="color:var(--teal);font-weight:600;">✓ Ada</span>' : '<span style="color:var(--slate-light);">– Belum</span>';
  tableEl.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead><tr><th>Periode</th><th>Neraca</th><th>Laba Rugi</th><th>Arus Kas</th><th>Buku Besar</th></tr></thead>
        <tbody>
          ${statements.map(s => `<tr>
            <td>${s.periodLabel}</td>
            <td>${mark(hasSectionData(s.neraca))}</td>
            <td>${mark(hasSectionData(s.labaRugi))}</td>
            <td>${mark(hasSectionData(s.arusKas))}</td>
            <td>${mark(hasSectionData(s.bukuBesar))}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

let pendingImport = null;

async function handleImportFile(file) {
  if (!state.importCompanyId) {
    toast('Pilih perusahaan terlebih dahulu sebelum mengunggah file', 'error');
    const input = document.getElementById('file-input');
    if (input) input.value = '';
    return;
  }
  const panel = document.getElementById('preview-panel');
  try {
    const buffer = await file.arrayBuffer();
    const result = parseSingleTypeExcel(buffer, state.importType);
    pendingImport = result;

    const isLedger = result.statementKey === 'bukuBesar';

    panel.innerHTML = `
      <div class="section-title">Pratinjau Data</div>
      <div style="font-size:13px;margin-bottom:10px;">
        ${result.companyName ? `<strong>${result.companyName}</strong><br>` : ''}
        Periode: ${result.period.periodLabel} &middot; Jenis: ${PERIOD_LABELS[result.period.periodType]} &middot; Tahun: ${result.period.year}
      </div>
      <div class="badge ${result.badge}">${result.typeLabel}</div>
      ${result.warnings.length ? `<div class="ratio-note" style="margin-top:8px;">${result.warnings.join('<br>')}</div>` : ''}
      ${isLedger ? `
        <div class="section-title" style="margin-top:16px;font-size:14px;">Neraca (diturunkan otomatis — saldo akhir periode)</div>
        <div style="font-size:11.5px;color:var(--slate);margin:-6px 0 4px 0;">Klik salah satu baris untuk melihat akun buku besar yang menyusun angka tersebut.</div>
        <div class="card" style="padding:2px 12px;">${derivedNeracaGrouped(result.data.neraca, result.data.contributions)}</div>
        <div class="section-title" style="margin-top:16px;font-size:14px;">Laba Rugi (diturunkan otomatis — mutasi periode)</div>
        <div style="font-size:11.5px;color:var(--slate);margin:-6px 0 4px 0;">Klik salah satu baris untuk melihat akun buku besar yang menyusun angka tersebut.</div>
        <div class="card" style="padding:2px 12px;">${derivedSectionDetails(result.data.labaRugi, result.data.contributions, LABA_RUGI_FORMULAS, LABA_RUGI_LABELS)}</div>
      ` : `
        <table style="margin-top:10px;">
          <tbody>${Object.entries(result.data).map(([k, v]) => `<tr><td>${k}</td><td class="num">${formatIDR(v)}</td></tr>`).join('') || '<tr><td colspan="2">Tidak ada data terbaca</td></tr>'}</tbody>
        </table>
      `}
      <div class="ratio-note" style="margin-top:12px;">
        ${isLedger
          ? `Data ini akan disimpan sebagai <strong>Buku Besar</strong>, dan otomatis mengisi bagian <strong>Neraca</strong> &amp; <strong>Laba Rugi</strong> untuk periode <strong>${result.period.periodLabel}</strong>. Neraca/Laba Rugi periode ini yang sudah pernah diimpor manual sebelumnya (jika ada) akan tertimpa oleh hasil turunan Buku Besar ini.`
          : `Data ini akan disimpan sebagai bagian <strong>${result.typeLabel}</strong> untuk periode <strong>${result.period.periodLabel}</strong>. Jenis data lain yang sudah pernah diimpor untuk periode yang sama (jika ada) tidak akan tertimpa.`}
      </div>
      <button class="btn primary" id="confirm-import" style="margin-top:16px;width:100%;justify-content:center;">Simpan ke Sistem</button>
    `;
    document.getElementById('confirm-import').addEventListener('click', confirmImport);
  } catch (err) {
    panel.innerHTML = `<div class="section-title">Pratinjau Data</div><div class="auth-error">${err.message}</div>`;
  }
}

async function confirmImport() {
  const companyId = state.importCompanyId;
  if (!pendingImport) return;
  if (pendingImport.statementKey === 'bukuBesar') {
    await DB.saveStatementSection(companyId, pendingImport.period, 'bukuBesar', pendingImport.data.ledger);
    await DB.saveStatementSection(companyId, pendingImport.period, 'neraca', pendingImport.data.neraca);
    await DB.saveStatementSection(companyId, pendingImport.period, 'labaRugi', pendingImport.data.labaRugi);
    toast(`Buku Besar tersimpan — Neraca & Laba Rugi otomatis diperbarui`, 'success');
  } else {
    await DB.saveStatementSection(companyId, pendingImport.period, pendingImport.statementKey, pendingImport.data);
    toast(`Data ${pendingImport.typeLabel} berhasil disimpan`, 'success');
  }
  pendingImport = null;
  renderImport();
}

// ---------- Perbandingan ----------
function renderCompare() {
  teardownActiveDataListener();
  const root = document.getElementById('view-root');
  if (state.companies.length === 0) {
    root.innerHTML = emptyState('Belum ada perusahaan', 'Tambahkan perusahaan dan data untuk mulai membandingkan.', 'companies', 'Tambah Perusahaan');
    bindEmptyStateNav(root);
    return;
  }
  root.innerHTML = `
    <div class="section-block">
      <div class="pill-row" id="company-pills">
        ${state.companies.map(c => `<div class="pill ${state.compareCompanyIds.includes(c.id) ? 'active' : ''}" data-id="${c.id}">${c.name}</div>`).join('')}
      </div>
      <div class="pill-row" id="period-pills">
        ${Object.entries(PERIOD_LABELS).map(([k, v]) => `<div class="pill ${state.comparePeriodType === k ? 'active' : ''}" data-period="${k}">${v}</div>`).join('')}
      </div>
    </div>
    <div id="compare-result"><div class="card" style="color:var(--slate);">Pilih minimal satu perusahaan untuk melihat perbandingan.</div></div>
  `;

  document.querySelectorAll('#company-pills .pill').forEach(p => {
    p.addEventListener('click', () => {
      const id = p.dataset.id;
      const idx = state.compareCompanyIds.indexOf(id);
      if (idx >= 0) state.compareCompanyIds.splice(idx, 1); else state.compareCompanyIds.push(id);
      renderCompare();
    });
  });
  document.querySelectorAll('#period-pills .pill').forEach(p => {
    p.addEventListener('click', () => { state.comparePeriodType = p.dataset.period; renderCompare(); });
  });

  if (state.compareCompanyIds.length === 0) return;

  // Listener realtime untuk kombinasi perusahaan yang dipilih.
  state.unsubData = DB.watchAllStatements(state.compareCompanyIds, (allStatements, meta) => {
    Sync.report('statements', meta);
    if (state.view !== 'compare') return;
    const statements = allStatements
      .filter(s => s.periodType === state.comparePeriodType)
      .sort((a, b) => a.year - b.year || a.periodIndex - b.periodIndex);
    paintCompare(statements);
  }, (err) => toast('Gagal memuat data laporan: ' + err.message, 'error'));
}

function paintCompare(statements) {
  const resultEl = document.getElementById('compare-result');
  if (!resultEl) return;
  if (statements.length === 0) {
    resultEl.innerHTML = `<div class="card" style="color:var(--slate);">Tidak ada data dengan jenis periode "${PERIOD_LABELS[state.comparePeriodType]}" untuk perusahaan terpilih.</div>`;
    return;
  }

  const periodKeys = [...new Set(statements.map(s => `${s.year}-${s.periodIndex}-${s.periodLabel}`))]
    .sort();

  resultEl.innerHTML = `
    <div class="section-block grid grid-2">
      <div class="chart-box"><div class="section-title">Total Aset per Periode</div><canvas id="cmp-aset"></canvas></div>
      <div class="chart-box"><div class="section-title">Laba Bersih per Periode</div><canvas id="cmp-laba"></canvas></div>
    </div>
    <div class="section-block">
      <div class="section-title">Tabel Perbandingan</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Perusahaan</th><th>Periode</th><th class="num">Total Aset</th><th class="num">Total Kewajiban</th><th class="num">Ekuitas</th><th class="num">Pendapatan</th><th class="num">Laba Bersih</th></tr></thead>
          <tbody>
            ${statements.map(s => `<tr>
              <td>${state.companies.find(c => c.id === s.companyId)?.name}</td>
              <td>${s.periodLabel}</td>
              <td class="num">${formatIDR(s.neraca.totalAset)}</td>
              <td class="num">${formatIDR(s.neraca.totalKewajiban)}</td>
              <td class="num">${formatIDR(s.neraca.totalEkuitas)}</td>
              <td class="num">${formatIDR(s.labaRugi.pendapatan)}</td>
              <td class="num">${formatIDR(s.labaRugi.labaBersih)}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  const datasetsAset = state.compareCompanyIds.map((id, i) => {
    const company = state.companies.find(c => c.id === id);
    const byPeriod = {};
    statements.filter(s => s.companyId === id).forEach(s => byPeriod[`${s.year}-${s.periodIndex}-${s.periodLabel}`] = s.neraca.totalAset || 0);
    return { label: company.name, data: periodKeys.map(k => byPeriod[k] ?? null), color: palette(i) };
  });
  const datasetsLaba = state.compareCompanyIds.map((id, i) => {
    const company = state.companies.find(c => c.id === id);
    const byPeriod = {};
    statements.filter(s => s.companyId === id).forEach(s => byPeriod[`${s.year}-${s.periodIndex}-${s.periodLabel}`] = s.labaRugi.labaBersih || 0);
    return { label: company.name, data: periodKeys.map(k => byPeriod[k] ?? null), color: palette(i) };
  });

  const labels = periodKeys.map(k => k.split('-').slice(2).join('-'));
  renderLineChart('cmp-aset', labels, datasetsAset);
  renderLineChart('cmp-laba', labels, datasetsLaba);
}

function palette(i) {
  const colors = ['#1B7A6B', '#C08A3E', '#B5453B', '#3B5BA5', '#7A5CC0', '#2D9CDB'];
  return colors[i % colors.length];
}

// ---------- Rasio ----------
function renderRatios() {
  teardownActiveDataListener();
  const root = document.getElementById('view-root');
  if (state.companies.length === 0) {
    root.innerHTML = emptyState('Belum ada perusahaan', 'Tambahkan perusahaan dan data untuk melihat analisis rasio.', 'companies', 'Tambah Perusahaan');
    bindEmptyStateNav(root);
    return;
  }
  if (!state.ratioCompanyId) state.ratioCompanyId = state.companies[0].id;

  root.innerHTML = `
    <div class="section-block" style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;">
      <div class="field" style="margin:0;min-width:220px;">
        <label>Perusahaan</label>
        <select id="ratio-company">
          ${state.companies.map(c => `<option value="${c.id}" ${c.id === state.ratioCompanyId ? 'selected' : ''}>${c.name}</option>`).join('')}
        </select>
      </div>
    </div>
    <div id="ratio-content"></div>
  `;
  document.getElementById('ratio-company').addEventListener('change', (e) => {
    state.ratioCompanyId = e.target.value;
    renderRatios();
  });

  // Listener realtime: analisis rasio otomatis diperbarui saat ada
  // periode baru yang diimpor dari perangkat manapun.
  state.unsubData = DB.watchStatements(state.ratioCompanyId, (rawStatements, meta) => {
    Sync.report('statements', meta);
    if (state.view !== 'ratios') return;
    const statements = rawStatements.sort((a, b) => a.year - b.year || a.periodIndex - b.periodIndex);
    paintRatios(statements);
  }, (err) => toast('Gagal memuat data laporan: ' + err.message, 'error'));
}

function paintRatios(statements) {
  const content = document.getElementById('ratio-content');
  if (!content) return;
  if (statements.length === 0) {
    content.innerHTML = `<div class="card" style="color:var(--slate);margin-top:16px;">Belum ada data laporan keuangan untuk perusahaan ini.</div>`;
    return;
  }
  const latest = statements[statements.length - 1];
  const ratios = computeRatios(latest);

  function ratioGroup(title, groupKey, badgeClass) {
    return `<div class="section-block">
      <div class="section-title"><span class="badge ${badgeClass}">${title}</span></div>
      <div class="grid grid-3">
        ${Object.entries(ratios[groupKey]).map(([key, val]) => `
          <div class="card kpi-card">
            <div class="kpi-label">${RATIO_LABELS[key].label}</div>
            <div class="kpi-value">${formatRatio(val, RATIO_LABELS[key].fmt)}</div>
            <div class="ratio-note" style="margin-top:2px;">${RATIO_LABELS[key].desc}</div>
          </div>
        `).join('')}
      </div>
    </div>`;
  }

  content.innerHTML = `
    <div style="margin:14px 0;color:var(--slate);font-size:13px;">Data periode terbaru: <strong>${latest.periodLabel}</strong></div>
    ${ratioGroup('Likuiditas', 'likuiditas', 'teal')}
    ${ratioGroup('Solvabilitas', 'solvabilitas', 'gold')}
    ${ratioGroup('Profitabilitas', 'profitabilitas', 'danger')}
    <div class="section-block">
      <div class="section-title">Tren Rasio Utama Antar Periode</div>
      <div class="chart-box"><canvas id="ratio-trend"></canvas></div>
    </div>
  `;

  const trendLabels = statements.map(s => s.periodLabel);
  const trendData = statements.map(s => computeRatios(s));
  renderLineChart('ratio-trend', trendLabels, [
    { label: 'Current Ratio', data: trendData.map(r => r.likuiditas.currentRatio), color: '#1B7A6B' },
    { label: 'Debt to Equity', data: trendData.map(r => r.solvabilitas.debtToEquityRatio), color: '#C08A3E' },
    { label: 'Net Profit Margin', data: trendData.map(r => r.profitabilitas.netProfitMargin), color: '#B5453B' }
  ]);
}

// ---------- Pengaturan ----------
function renderSettings() {
  const root = document.getElementById('view-root');
  root.innerHTML = `
    <div class="card" style="max-width:520px;">
      <div class="section-title">Akun</div>
      <p style="font-size:13.5px;color:var(--slate);">Masuk sebagai <strong>${state.user.email}</strong></p>
      <div class="section-title" style="margin-top:20px;">Tentang Integrida</div>
      <p style="font-size:13.5px;color:var(--slate);line-height:1.6;">
        Integrida adalah aplikasi konsolidasi laporan keuangan untuk beberapa perusahaan.
        Data neraca dan laba rugi diimpor dari Excel, kemudian dibandingkan per bulan, triwulan,
        semester, maupun tahunan, lengkap dengan analisis likuiditas, solvabilitas, dan profitabilitas.
        Seluruh data tersimpan pada Firebase project yang Anda konfigurasikan sendiri.
      </p>
      <button class="btn ghost" id="logout-btn-2">Keluar dari akun</button>
    </div>
  `;
  document.getElementById('logout-btn-2').addEventListener('click', () => auth.signOut());
}

// ---------- Charts ----------
function destroyChart(id) {
  if (state.chartInstances[id]) { state.chartInstances[id].destroy(); delete state.chartInstances[id]; }
}

function renderBarChart(canvasId, labels, datasets) {
  destroyChart(canvasId);
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;
  state.chartInstances[canvasId] = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: datasets.map(d => ({ label: d.label, data: d.data, backgroundColor: d.color, borderRadius: 5 })) },
    options: { responsive: true, plugins: { legend: { display: datasets.length > 1 } }, scales: { y: { beginAtZero: true } } }
  });
}

function renderLineChart(canvasId, labels, datasets) {
  destroyChart(canvasId);
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;
  state.chartInstances[canvasId] = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets: datasets.map(d => ({ label: d.label, data: d.data, borderColor: d.color, backgroundColor: d.color, tension: 0.3, spanGaps: true })) },
    options: { responsive: true, plugins: { legend: { display: true } } }
  });
}

// ---------- Bootstrap ----------
auth.onAuthStateChanged(async (user) => {
  if (state.unsubCompanies) { state.unsubCompanies(); state.unsubCompanies = null; }
  teardownActiveDataListener();
  Sync.reset();

  if (user) {
    state.user = user;
    renderShell();
    // Listener realtime: daftar perusahaan otomatis ter-update begitu ada
    // perubahan — baik dari tab/perangkat ini maupun dari perangkat lain
    // yang login dengan akun yang sama. Ini juga memberi tahu status
    // sinkronisasi (badge di topbar).
    state.unsubCompanies = DB.watchCompanies(user.uid, (companies, meta) => {
      state.companies = companies;
      Sync.report('companies', meta);
      const safeToRerender = ['dashboard', 'companies', 'company-detail', 'compare', 'ratios'].includes(state.view)
        && !document.querySelector('.modal-backdrop');
      if (safeToRerender) renderCurrentView();
    }, (err) => toast('Gagal memuat data perusahaan: ' + err.message, 'error'));
    setView('dashboard');
  } else {
    state.user = null;
    renderAuthScreen('login');
  }
});
