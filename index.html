        Menghapus satu baris riwayat akan menghapus <strong>seluruh data periode tersebut</strong> (Neraca, Laba Rugi, Arus Kas, dan Buku Besar yang pernah diimpor untuk periode itu) secara permanen.
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Periode</th><th>Neraca</th><th>Laba Rugi</th><th>Arus Kas</th><th>Perubahan Modal</th><th>Buku Besar</th><th>Verifikasi</th><th></th></tr></thead>
          <tbody>
            ${statements.slice().reverse().map(s => `<tr data-statement-id="${s.id}">
              <td data-period-cell="${s.id}">${s.periodLabel}${s.verified ? '<span class="verify-badge">✓ Terverifikasi</span>' : ''}</td>
              <td>${hasSectionData(s.neraca) ? '<span style="color:var(--teal);font-weight:600;">✓ Ada</span>' : '<span style="color:var(--slate-light);">– Belum</span>'}</td>
              <td>${hasSectionData(s.labaRugi) ? '<span style="color:var(--teal);font-weight:600;">✓ Ada</span>' : '<span style="color:var(--slate-light);">– Belum</span>'}</td>
              <td>${hasSectionData(s.arusKas) ? '<span style="color:var(--teal);font-weight:600;">✓ Ada</span>' : '<span style="color:var(--slate-light);">– Belum</span>'}</td>
              <td>${hasSectionData(s.perubahanModal) ? '<span style="color:var(--teal);font-weight:600;">✓ Ada</span>' : '<span style="color:var(--slate-light);">– Belum</span>'}</td>
              <td>${s.bukuBesarCount > 0 ? '<span style="color:var(--teal);font-weight:600;">✓ Ada</span>' : '<span style="color:var(--slate-light);">– Belum</span>'}</td>
              <td><label class="verify-checkbox-label"><input type="checkbox" data-verify-statement="${s.id}" data-label="${s.periodLabel}" ${s.verified ? 'checked' : ''}>${s.verified ? 'Terverifikasi' : 'Tandai valid'}</label></td>
              <td style="text-align:right;"><button class="btn danger" data-del-statement="${s.id}" data-label="${s.periodLabel}">Hapus</button></td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  wireBusinessInfoButton();

  document.querySelectorAll('#detail-period-pills .pill').forEach(p => {
    p.addEventListener('click', () => {
      state.companyDetailPeriodId = p.dataset.periodId;
      paintCompanyDetail(statements);
    });
  });

  document.querySelectorAll('[data-verify-statement]').forEach(cb => {
    cb.addEventListener('change', async () => {
      const statementId = cb.dataset.verifyStatement;
      const label = cb.dataset.label;
      const verified = cb.checked;
      cb.disabled = true;
      try {
        await DB.updateStatementVerified(state.companyDetailId, statementId, verified);
        const s = statements.find(x => x.id === statementId);
        if (s) s.verified = verified;
        toast(verified ? `Periode "${label}" ditandai terverifikasi` : `Verifikasi periode "${label}" dibatalkan`, 'success');
        // Tampilan akan otomatis diperbarui lewat listener realtime, tapi
        // update juga secara langsung supaya badge & label terasa instan.
        const cell = document.querySelector(`[data-period-cell="${statementId}"]`);
        if (cell) cell.innerHTML = `${escapeHTML(label)}${verified ? '<span class="verify-badge">✓ Terverifikasi</span>' : ''}`;
        const wrapLabel = cb.closest('.verify-checkbox-label');
        if (wrapLabel) wrapLabel.lastChild.textContent = verified ? 'Terverifikasi' : 'Tandai valid';
      } catch (err) {
        cb.checked = !verified;
        toast('Gagal memperbarui status verifikasi: ' + err.message, 'error');
      } finally {
        cb.disabled = false;
      }
    });
  });

  // Checkbox "Sinkron" per baris rincian akun (Neraca, Laba Rugi, Arus
  // Kas) & per baris ringkasan (Perubahan Modal) — lihat syncCheckboxHtml()
  // & DB.updateStatementSyncFlag(). Ditulis ke statement yang SEDANG
  // tampil (`selected`), jadi berlaku khusus untuk periode itu.
  document.querySelectorAll('[data-sync-key]').forEach(cb => {
    cb.addEventListener('change', async () => {
      const key = cb.dataset.syncKey;
      const checked = cb.checked;
      const label = cb.nextElementSibling;
      const wrap = cb.closest('.sync-checkbox-label');
      cb.disabled = true;
      try {
        await DB.updateStatementSyncFlag(state.companyDetailId, selected.id, key, checked);
        selected.syncFlags = selected.syncFlags || {};
        selected.syncFlags[key] = checked;
        if (label) label.textContent = checked ? 'Sinkron' : 'Tandai sinkron';
        if (wrap) wrap.classList.toggle('is-synced', checked);
      } catch (err) {
        cb.checked = !checked;
        toast('Gagal menyimpan status sinkron: ' + err.message, 'error');
      } finally {
        cb.disabled = false;
      }
    });
  });

  document.querySelectorAll('[data-del-statement]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const statementId = btn.dataset.delStatement;
      const label = btn.dataset.label;
      if (!confirm(`Hapus seluruh data periode "${label}"? Data Neraca, Laba Rugi, Arus Kas, dan Buku Besar yang pernah diimpor untuk periode ini akan ikut terhapus dan tidak bisa dikembalikan.`)) return;
      try {
        await DB.deleteStatement(state.companyDetailId, statementId);
        if (state.companyDetailPeriodId === statementId) state.companyDetailPeriodId = null;
        toast(`Data periode "${label}" dihapus`, 'success');
        // Tampilan akan otomatis diperbarui lewat listener realtime.
      } catch (err) {
        toast('Gagal menghapus data: ' + err.message, 'error');
      }
    });
  });
}

// ---------- Import ----------
function selectImportCompany(companyId) {
  const company = state.companies.find(c => c.id === companyId);
  if (!company) return;
  state.importCompanyId = companyId;
  const input = document.getElementById('import-company');
  if (input) input.value = companyDisplayLabel(company);
  closeImportCompanyDropdown();
  resetPreview();
  loadImportStatus();
}

function closeImportCompanyDropdown() {
  const dd = document.getElementById('import-company-dropdown');
  if (dd) { dd.style.display = 'none'; dd.innerHTML = ''; }
}

function renderImportCompanyDropdown(query) {
  const dd = document.getElementById('import-company-dropdown');
  if (!dd) return;
  const q = query.trim().toLowerCase();
  const matches = !q ? state.companies : state.companies.filter(c =>
    String(c.code || '').toLowerCase().includes(q) ||
    String(c.name || '').toLowerCase().includes(q)
  );
  dd.innerHTML = matches.length === 0
    ? `<div class="combo-empty">Tidak ada perusahaan yang cocok.</div>`
    : matches.map(c => `<div class="combo-option" data-id="${c.id}">
        ${c.code ? `<span class="combo-code">${c.code}</span>` : ''}
        <span class="combo-name">${c.name}</span>
      </div>`).join('');
  dd.querySelectorAll('.combo-option').forEach(opt => {
    opt.addEventListener('mousedown', (e) => {
      e.preventDefault();
      selectImportCompany(opt.dataset.id);
    });
  });
  dd.style.display = '';
}

function renderImport() {
  const root = document.getElementById('view-root');
  if (state.companies.length === 0) {
    root.innerHTML = emptyState('Tambahkan perusahaan terlebih dahulu', 'Anda perlu memiliki minimal satu perusahaan sebelum mengimpor data.', 'companies', 'Tambah Perusahaan');
    bindEmptyStateNav(root);
    return;
  }
  if (state.importCompanyId && !state.companies.find(c => c.id === state.importCompanyId)) {
    state.importCompanyId = null;
  }

  root.innerHTML = `
    <div class="grid grid-2" style="align-items:start;">
      <div class="card">
        <div class="section-title">1. Pilih Perusahaan Tujuan</div>
        <div class="field combo-wrap">
          <label>Perusahaan</label>
          <input type="text" id="import-company" placeholder="Ketik kode atau nama perusahaan…" autocomplete="off">
          <div id="import-company-dropdown" class="combo-dropdown" style="display:none;"></div>
        </div>

        <div class="section-title" style="margin-top:20px;">2. Unggah File Excel Buku Besar</div>
        <div style="font-size:11.5px;color:var(--slate);margin:-6px 0 16px 0;line-height:1.5;">
          Neraca, Laba Rugi, Arus Kas Metode Langsung, & Perubahan Modal untuk periode ini akan diturunkan otomatis
          dari file Buku Besar yang Anda unggah — tidak perlu diimpor terpisah.
        </div>

        <div class="dropzone" id="dropzone">
          ${icon('upload')}
          <div>Seret file .xlsx <strong id="dropzone-type-label"></strong> ke sini, atau klik untuk memilih</div>
          <div style="font-size:11.5px;margin-top:6px;" id="dropzone-hint"></div>
        </div>
        <input type="file" id="file-input" accept=".xlsx,.xls" style="display:none;">
      </div>
      <div class="card" id="preview-panel">
        <div class="section-title">Pratinjau Data</div>
        <div style="color:var(--slate);font-size:13px;">Belum ada file dipilih.</div>
      </div>
    </div>

    <div class="section-block" style="margin-top:24px;">
      <div class="section-title">Status Data per Periode — <span id="import-status-company-name" style="color:var(--slate);font-weight:500;"></span></div>
      <div id="import-status-table"><div class="card" style="color:var(--slate);">Memuat status…</div></div>
    </div>
  `;

  updateDropzoneAndTemplate();
  loadImportStatus();

  const companyInput = document.getElementById('import-company');
  const initialCompany = state.companies.find(c => c.id === state.importCompanyId);
  if (companyInput && initialCompany) companyInput.value = companyDisplayLabel(initialCompany);

  companyInput.addEventListener('focus', () => renderImportCompanyDropdown(''));
  companyInput.addEventListener('input', () => renderImportCompanyDropdown(companyInput.value));
  companyInput.addEventListener('blur', () => {
    // Delay agar klik pada opsi dropdown (mousedown) sempat diproses sebelum ditutup.
    setTimeout(() => {
      closeImportCompanyDropdown();
      const current = state.companies.find(c => c.id === state.importCompanyId);
      if (current && companyInput) companyInput.value = companyDisplayLabel(current);
    }, 120);
  });
  companyInput.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') companyInput.blur();
  });

  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('file-input');
  dropzone.addEventListener('click', () => {
    if (!state.importCompanyId) { toast('Pilih perusahaan terlebih dahulu', 'error'); return; }
    fileInput.click();
  });
  ['dragenter', 'dragover'].forEach(evt => dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.add('drag'); }));
  ['dragleave', 'drop'].forEach(evt => dropzone.addEventListener(evt, (e) => { e.preventDefault(); dropzone.classList.remove('drag'); }));
  dropzone.addEventListener('drop', (e) => { if (e.dataTransfer.files[0]) handleImportFile(e.dataTransfer.files[0]); });
  fileInput.addEventListener('change', (e) => { if (e.target.files[0]) handleImportFile(e.target.files[0]); });
}

function updateDropzoneAndTemplate() {
  const type = IMPORT_TYPES[state.importType];
  const label = document.getElementById('dropzone-type-label');
  if (label) label.textContent = type.label;
  const hint = document.getElementById('dropzone-hint');
  if (hint) hint.textContent = `Unggah Buku Besar apa adanya, hasil export langsung dari software akuntansi Anda (per akun: Saldo Awal, daftar transaksi, Ending Balance). Neraca, Laba Rugi, Arus Kas Metode Langsung, & Perubahan Modal periode ini akan dihitung & diisi otomatis dari kode akun (1=Aset, 2=Kewajiban, 3=Ekuitas, 4=Pendapatan, 5=HPP, 6=Beban Operasional, 7=Pendapatan Lainnya, 8=Beban Lainnya, 9=Beban Pajak) & transaksi akun Kas/Bank.`;
}

function resetPreview() {
  pendingImport = null;
  const panel = document.getElementById('preview-panel');
  if (panel) panel.innerHTML = `<div class="section-title">Pratinjau Data</div><div style="color:var(--slate);font-size:13px;">Belum ada file dipilih.</div>`;
}

function hasSectionData(v) {
  if (v === undefined || v === null) return false;
  if (Array.isArray(v)) return v.length > 0;
  if (typeof v === 'object') return Object.keys(v).length > 0;
  return true;
}

async function loadImportStatus() {
  const company = state.companies.find(c => c.id === state.importCompanyId);
  const nameEl = document.getElementById('import-status-company-name');
  if (nameEl) nameEl.textContent = company ? company.name : '';
  const tableEl = document.getElementById('import-status-table');
  if (!tableEl) return;
  if (!state.importCompanyId) {
    tableEl.innerHTML = `<div class="card" style="color:var(--slate);">Pilih perusahaan terlebih dahulu untuk melihat status data.</div>`;
    return;
  }
  const statements = (await DB.getStatements(state.importCompanyId)).sort((a, b) => a.year - b.year || a.periodIndex - b.periodIndex);
  if (statements.length === 0) {
    tableEl.innerHTML = `<div class="card" style="color:var(--slate);">Belum ada data yang diimpor untuk perusahaan ini.</div>`;
    return;
  }
  const mark = (ok) => ok ? '<span style="color:var(--teal);font-weight:600;">✓ Ada</span>' : '<span style="color:var(--slate-light);">– Belum</span>';
  tableEl.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead><tr><th>Periode</th><th>Neraca</th><th>Laba Rugi</th><th>Arus Kas</th><th>Perubahan Modal</th><th>Buku Besar</th></tr></thead>
        <tbody>
          ${statements.map(s => `<tr>
            <td>${s.periodLabel}</td>
            <td>${mark(hasSectionData(s.neraca))}</td>
            <td>${mark(hasSectionData(s.labaRugi))}</td>
            <td>${mark(hasSectionData(s.arusKas))}</td>
            <td>${mark(hasSectionData(s.perubahanModal))}</td>
            <td>${mark(s.bukuBesarCount > 0)}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}

let pendingImport = null;

async function handleImportFile(file) {
  if (!state.importCompanyId) {
    toast('Pilih perusahaan terlebih dahulu sebelum mengunggah file', 'error');
    const input = document.getElementById('file-input');
    if (input) input.value = '';
    return;
  }
  const panel = document.getElementById('preview-panel');
  try {
    const buffer = await file.arrayBuffer();
    const result = parseSingleTypeExcel(buffer, state.importType);
    pendingImport = result;

    panel.innerHTML = `
      <div class="section-title">Pratinjau Data</div>
      <div style="font-size:13px;margin-bottom:10px;">
        ${result.companyName ? `<strong>${result.companyName}</strong><br>` : ''}
        Periode: ${result.period.periodLabel} &middot; Jenis: ${PERIOD_LABELS[result.period.periodType]} &middot; Tahun: ${result.period.year}
      </div>
      <div class="badge ${result.badge}">${result.typeLabel}</div>
      ${result.warnings.length ? `<div class="ratio-note" style="margin-top:8px;">${result.warnings.join('<br>')}</div>` : ''}
      <div class="section-title" style="margin-top:16px;font-size:14px;">Neraca (diturunkan otomatis — saldo akhir periode)</div>
      <div style="font-size:11.5px;color:var(--slate);margin:-6px 0 4px 0;">Klik salah satu baris untuk melihat akun buku besar yang menyusun angka tersebut.</div>
      <div class="card" style="padding:2px 12px;">${derivedNeracaGrouped(result.data.neraca, result.data.contributions)}</div>
      <div class="section-title" style="margin-top:16px;font-size:14px;">Laba Rugi (diturunkan otomatis — mutasi periode)</div>
      <div style="font-size:11.5px;color:var(--slate);margin:-6px 0 4px 0;">Klik salah satu baris untuk melihat akun buku besar yang menyusun angka tersebut.</div>
      <div class="card" style="padding:2px 12px;">${derivedSectionDetails(result.data.labaRugi, result.data.contributions, LABA_RUGI_FORMULAS, LABA_RUGI_LABELS, LABA_RUGI_HIGHLIGHT_KEYS, LABA_RUGI_ORDER)}</div>
      <div class="section-title" style="margin-top:16px;font-size:14px;">Arus Kas Metode Langsung (diturunkan otomatis — transaksi akun Kas/Bank)</div>
      <div style="font-size:11.5px;color:var(--slate);margin:-6px 0 4px 0;">Klik salah satu pos untuk melihat transaksi kas yang menyusun angka tersebut.</div>
      <div class="card" style="padding:2px 12px;">${arusKasTable(result.data.arusKas)}</div>
      <div class="section-title" style="margin-top:16px;font-size:14px;">Perubahan Modal (diturunkan otomatis — mutasi akun Ekuitas &amp; Arus Kas Pendanaan)</div>
      <div style="font-size:11.5px;color:var(--slate);margin:-6px 0 4px 0;">Baris Laba Ditahan Awal Periode baru muncul di Detail Perusahaan (butuh riwayat periode sebelumnya).</div>
      <div class="card" style="padding:2px 12px;">${perubahanModalTable(result.data.perubahanModal)}</div>
      <div class="ratio-note" style="margin-top:12px;">
        Data ini akan disimpan sebagai <strong>Buku Besar</strong>, dan otomatis mengisi bagian <strong>Neraca</strong>, <strong>Laba Rugi</strong>, <strong>Arus Kas</strong>, &amp; <strong>Perubahan Modal</strong> untuk periode <strong>${result.period.periodLabel}</strong>. Data periode ini yang sudah pernah diimpor sebelumnya (jika ada) akan tertimpa oleh hasil turunan Buku Besar ini.
      </div>
      <button class="btn primary" id="confirm-import" style="margin-top:16px;width:100%;justify-content:center;">Simpan ke Sistem</button>
    `;
    document.getElementById('confirm-import').addEventListener('click', confirmImport);
  } catch (err) {
    panel.innerHTML = `<div class="section-title">Pratinjau Data</div><div class="auth-error">${err.message}</div>`;
  }
}

async function confirmImport() {
  const companyId = state.importCompanyId;
  if (!pendingImport) return;
  const btn = document.getElementById('confirm-import');
  if (btn) { btn.disabled = true; btn.textContent = 'Menyimpan...'; }
  try {
    const accounts = pendingImport.data.ledger || [];
    const period = pendingImport.period;
    const statementId = `${period.year}_${period.periodType}_${period.periodIndex}`;
    // Buku Besar (rincian per transaksi) disimpan LEBIH DULU, terpisah &
    // dipecah otomatis jadi beberapa dokumen kecil (lihat
    // DB.saveLedgerAccounts/chunkLedgerPieces) karena bisa melebihi batas
    // ukuran 1 dokumen Firestore (1 MB) untuk perusahaan dengan banyak
    // transaksi. Neraca/Laba Rugi/Arus Kas/Perubahan Modal (data ringkas,
    // selalu kecil) baru disimpan setelahnya dalam satu write gabungan —
    // kalau langkah manapun gagal, tidak ada kondisi tersimpan sebagian.
    await DB.saveLedgerAccounts(companyId, statementId, accounts);
    await DB.saveStatementSections(companyId, period, {
      neraca: pendingImport.data.neraca,
      labaRugi: pendingImport.data.labaRugi,
      arusKas: pendingImport.data.arusKas,
      perubahanModal: pendingImport.data.perubahanModal,
      bukuBesarCount: accounts.length
    });
    toast(`Buku Besar tersimpan — Neraca, Laba Rugi, Arus Kas & Perubahan Modal otomatis diperbarui`, 'success');
    pendingImport = null;
    renderImport();
  } catch (err) {
    console.error('Gagal menyimpan hasil impor Buku Besar:', err);
    toast(`Gagal menyimpan data: ${err.message || err}. Periksa koneksi internet Anda lalu coba lagi.`, 'error');
    if (btn) { btn.disabled = false; btn.textContent = 'Simpan ke Sistem'; }
  }
}

// ---------- Perbandingan ----------
function renderCompare() {
  teardownActiveDataListener();
  const root = document.getElementById('view-root');
  if (state.companies.length === 0) {
    root.innerHTML = emptyState('Belum ada perusahaan', 'Tambahkan perusahaan dan data untuk mulai membandingkan.', 'companies', 'Tambah Perusahaan');
    bindEmptyStateNav(root);
    return;
  }
  root.innerHTML = `
    <div class="section-block">
      <div class="pill-row" id="company-pills">
        ${state.companies.map(c => `<div class="pill ${state.compareCompanyIds.includes(c.id) ? 'active' : ''}" data-id="${c.id}">${c.name}</div>`).join('')}
      </div>
      <div class="pill-row" id="period-pills">
        ${Object.entries(PERIOD_LABELS).map(([k, v]) => `<div class="pill ${state.comparePeriodType === k ? 'active' : ''}" data-period="${k}">${v}</div>`).join('')}
      </div>
    </div>
    <div id="compare-result"><div class="card" style="color:var(--slate);">Pilih minimal satu perusahaan untuk melihat perbandingan.</div></div>
  `;

  document.querySelectorAll('#company-pills .pill').forEach(p => {
    p.addEventListener('click', () => {
      const id = p.dataset.id;
      const idx = state.compareCompanyIds.indexOf(id);
      if (idx >= 0) state.compareCompanyIds.splice(idx, 1); else state.compareCompanyIds.push(id);
      renderCompare();
    });
  });
  document.querySelectorAll('#period-pills .pill').forEach(p => {
    p.addEventListener('click', () => { state.comparePeriodType = p.dataset.period; renderCompare(); });
  });

  if (state.compareCompanyIds.length === 0) return;

  // Listener realtime untuk kombinasi perusahaan yang dipilih.
  state.unsubData = DB.watchAllStatements(state.compareCompanyIds, (allStatements, meta) => {
    Sync.report('statements', meta);
    if (state.view !== 'compare') return;
    const statements = allStatements
      .filter(s => s.periodType === state.comparePeriodType)
      .sort((a, b) => a.year - b.year || a.periodIndex - b.periodIndex);
    paintCompare(statements);
  }, (err) => toast('Gagal memuat data laporan: ' + err.message, 'error'));
}

function paintCompare(statements) {
  const resultEl = document.getElementById('compare-result');
  if (!resultEl) return;
  if (statements.length === 0) {
    resultEl.innerHTML = `<div class="card" style="color:var(--slate);">Tidak ada data dengan jenis periode "${PERIOD_LABELS[state.comparePeriodType]}" untuk perusahaan terpilih.</div>`;
    return;
  }

  const periodKeys = [...new Set(statements.map(s => `${s.year}-${s.periodIndex}-${s.periodLabel}`))]
    .sort();

  resultEl.innerHTML = `
    <div class="section-block grid grid-2">
      <div class="chart-box"><div class="section-title">Total Aset per Periode</div><canvas id="cmp-aset"></canvas></div>
      <div class="chart-box"><div class="section-title">Laba Bersih per Periode</div><canvas id="cmp-laba"></canvas></div>
    </div>
    <div class="section-block">
      <div class="section-title">Tabel Perbandingan</div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Perusahaan</th><th>Periode</th><th class="num">Total Aset</th><th class="num">Total Kewajiban</th><th class="num">Ekuitas</th><th class="num">Pendapatan</th><th class="num">Laba Bersih</th></tr></thead>
          <tbody>
            ${statements.map(s => `<tr>
              <td>${state.companies.find(c => c.id === s.companyId)?.name}</td>
              <td>${s.periodLabel}</td>
              <td class="num">${formatIDR(s.neraca.totalAset)}</td>
              <td class="num">${formatIDR(s.neraca.totalKewajiban)}</td>
              <td class="num">${formatIDR(s.neraca.totalEkuitas)}</td>
              <td class="num">${formatIDR(s.labaRugi.pendapatan)}</td>
              <td class="num">${formatIDR(s.labaRugi.labaBersih)}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  const datasetsAset = state.compareCompanyIds.map((id, i) => {
    const company = state.companies.find(c => c.id === id);
    const byPeriod = {};
    statements.filter(s => s.companyId === id).forEach(s => byPeriod[`${s.year}-${s.periodIndex}-${s.periodLabel}`] = s.neraca.totalAset || 0);
    return { label: company.name, data: periodKeys.map(k => byPeriod[k] ?? null), color: palette(i) };
  });
  const datasetsLaba = state.compareCompanyIds.map((id, i) => {
    const company = state.companies.find(c => c.id === id);
    const byPeriod = {};
    statements.filter(s => s.companyId === id).forEach(s => byPeriod[`${s.year}-${s.periodIndex}-${s.periodLabel}`] = s.labaRugi.labaBersih || 0);
    return { label: company.name, data: periodKeys.map(k => byPeriod[k] ?? null), color: palette(i) };
  });

  const labels = periodKeys.map(k => k.split('-').slice(2).join('-'));
  renderLineChart('cmp-aset', labels, datasetsAset);
  renderLineChart('cmp-laba', labels, datasetsLaba);
}

function palette(i) {
  const colors = ['#1B7A6B', '#C08A3E', '#B5453B', '#3B5BA5', '#7A5CC0', '#2D9CDB'];
  return colors[i % colors.length];
}

// ---------- Rasio ----------
function renderRatios() {
  teardownActiveDataListener();
  const root = document.getElementById('view-root');
  if (state.companies.length === 0) {
    root.innerHTML = emptyState('Belum ada perusahaan', 'Tambahkan perusahaan dan data untuk melihat analisis rasio.', 'companies', 'Tambah Perusahaan');
    bindEmptyStateNav(root);
    return;
  }
  if (!state.ratioCompanyId) state.ratioCompanyId = state.companies[0].id;

  root.innerHTML = `
    <div class="section-block" style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;">
      <div class="field" style="margin:0;min-width:220px;">
        <label>Perusahaan</label>
        <select id="ratio-company">
          ${state.companies.map(c => `<option value="${c.id}" ${c.id === state.ratioCompanyId ? 'selected' : ''}>${c.name}</option>`).join('')}
        </select>
      </div>
    </div>
    <div id="ratio-content"></div>
  `;
  document.getElementById('ratio-company').addEventListener('change', (e) => {
    state.ratioCompanyId = e.target.value;
    renderRatios();
  });

  // Listener realtime: analisis rasio otomatis diperbarui saat ada
  // periode baru yang diimpor dari perangkat manapun.
  state.unsubData = DB.watchStatements(state.ratioCompanyId, (rawStatements, meta) => {
    Sync.report('statements', meta);
    if (state.view !== 'ratios') return;
    const statements = rawStatements.sort((a, b) => a.year - b.year || a.periodIndex - b.periodIndex);
    paintRatios(statements);
  }, (err) => toast('Gagal memuat data laporan: ' + err.message, 'error'));
}

function paintRatios(statements) {
  const content = document.getElementById('ratio-content');
  if (!content) return;
  if (statements.length === 0) {
    content.innerHTML = `<div class="card" style="color:var(--slate);margin-top:16px;">Belum ada data laporan keuangan untuk perusahaan ini.</div>`;
    return;
  }
  const latest = statements[statements.length - 1];
  const ratios = computeRatios(latest);

  function ratioGroup(title, groupKey, badgeClass) {
    return `<div class="section-block">
      <div class="section-title"><span class="badge ${badgeClass}">${title}</span></div>
      <div class="grid grid-3">
        ${Object.entries(ratios[groupKey]).map(([key, val]) => `
          <div class="card kpi-card">
            <div class="kpi-label">${RATIO_LABELS[key].label}</div>
            <div class="kpi-value">${formatRatio(val, RATIO_LABELS[key].fmt)}</div>
            <div class="ratio-note" style="margin-top:2px;">${RATIO_LABELS[key].desc}</div>
          </div>
        `).join('')}
      </div>
    </div>`;
  }

  content.innerHTML = `
    <div style="margin:14px 0;color:var(--slate);font-size:13px;">Data periode terbaru: <strong>${latest.periodLabel}</strong></div>
    ${ratioGroup('Likuiditas', 'likuiditas', 'teal')}
    ${ratioGroup('Solvabilitas', 'solvabilitas', 'gold')}
    ${ratioGroup('Profitabilitas', 'profitabilitas', 'danger')}
    <div class="section-block">
      <div class="section-title">Tren Rasio Utama Antar Periode</div>
      <div class="chart-box"><canvas id="ratio-trend"></canvas></div>
    </div>
  `;

  const trendLabels = statements.map(s => s.periodLabel);
  const trendData = statements.map(s => computeRatios(s));
  renderLineChart('ratio-trend', trendLabels, [
    { label: 'Current Ratio', data: trendData.map(r => r.likuiditas.currentRatio), color: '#1B7A6B' },
    { label: 'Debt to Equity', data: trendData.map(r => r.solvabilitas.debtToEquityRatio), color: '#C08A3E' },
    { label: 'Net Profit Margin', data: trendData.map(r => r.profitabilitas.netProfitMargin), color: '#B5453B' }
  ]);
}

// ---------- Pengaturan ----------
function renderSettings() {
  const root = document.getElementById('view-root');
  root.innerHTML = `
    <div class="card" style="max-width:520px;">
      <div class="section-title">Akun</div>
      <p style="font-size:13.5px;color:var(--slate);">Masuk sebagai <strong>${state.user.email}</strong></p>
      <div class="section-title" style="margin-top:20px;">Tentang Integrida</div>
      <p style="font-size:13.5px;color:var(--slate);line-height:1.6;">
        Integrida adalah aplikasi konsolidasi laporan keuangan untuk beberapa perusahaan.
        Data neraca dan laba rugi diimpor dari Excel, kemudian dibandingkan per bulan, triwulan,
        semester, maupun tahunan, lengkap dengan analisis likuiditas, solvabilitas, dan profitabilitas.
        Seluruh data tersimpan pada Firebase project yang Anda konfigurasikan sendiri.
      </p>
      <button class="btn ghost" id="logout-btn-2">Keluar dari akun</button>
    </div>
  `;
  document.getElementById('logout-btn-2').addEventListener('click', () => auth.signOut());
}

// ---------- Charts ----------
function destroyChart(id) {
  if (state.chartInstances[id]) { state.chartInstances[id].destroy(); delete state.chartInstances[id]; }
}

function renderBarChart(canvasId, labels, datasets) {
  destroyChart(canvasId);
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;
  state.chartInstances[canvasId] = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: datasets.map(d => ({ label: d.label, data: d.data, backgroundColor: d.color, borderRadius: 5 })) },
    options: { responsive: true, plugins: { legend: { display: datasets.length > 1 } }, scales: { y: { beginAtZero: true } } }
  });
}

function renderLineChart(canvasId, labels, datasets) {
  destroyChart(canvasId);
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;
  state.chartInstances[canvasId] = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets: datasets.map(d => ({ label: d.label, data: d.data, borderColor: d.color, backgroundColor: d.color, tension: 0.3, spanGaps: true })) },
    options: { responsive: true, plugins: { legend: { display: true } } }
  });
}

// ---------- Bootstrap ----------
auth.onAuthStateChanged(async (user) => {
  if (state.unsubCompanies) { state.unsubCompanies(); state.unsubCompanies = null; }
  teardownActiveDataListener();
  Sync.reset();

  if (user) {
    state.user = user;
    renderShell();
    // Listener realtime: daftar perusahaan otomatis ter-update begitu ada
    // perubahan — baik dari tab/perangkat ini maupun dari perangkat lain
    // yang login dengan akun yang sama. Ini juga memberi tahu status
    // sinkronisasi (badge di topbar).
    state.unsubCompanies = DB.watchCompanies(user.uid, (companies, meta) => {
      state.companies = companies;
      Sync.report('companies', meta);
      const safeToRerender = ['dashboard', 'companies', 'company-detail', 'compare', 'ratios'].includes(state.view)
        && !document.querySelector('.modal-backdrop');
      if (safeToRerender) renderCurrentView();
    }, (err) => toast('Gagal memuat data perusahaan: ' + err.message, 'error'));
    setView('dashboard');
  } else {
    state.user = null;
    renderAuthScreen('login');
  }
});

</script>

  });
}
