    </div>
    <div style="display:flex;gap:12px;" id="reminder-datetime-row">
      <div class="field" style="flex:1;">
        <label>Tanggal (opsional)</label>
        <div style="display:flex;gap:8px;align-items:center;">
          <input type="date" id="reminder-date-input" value="${item ? item.date : (defaultDate || '')}" style="flex:1;min-width:0;">
          <label id="reminder-daterange-label" style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--slate);cursor:pointer;user-select:none;white-space:nowrap;flex-shrink:0;" title="Pengingat berlaku untuk rentang tanggal, mis. tgl 1 s.d. tgl 3"><input type="checkbox" id="reminder-daterange-input" ${item && item.endDate ? 'checked' : ''}><span>s.d. tgl lain</span></label>
        </div>
      </div>
      <div class="field" style="flex:1;"><label>Jam (opsional)</label><input type="time" id="reminder-time-input" value="${item && item.time ? item.time : ''}"></div>
    </div>
    <div class="field" id="reminder-enddate-row" style="display:none;">
      <label>s.d. Tanggal</label>
      <input type="date" id="reminder-enddate-input" value="${item && item.endDate ? item.endDate : ''}">
    </div>
    <div class="field" id="reminder-repeat-row"><label>Ulangi</label>
      <select id="reminder-repeat-input">
        <option value="none" ${(!item || !item.repeat || item.repeat === 'none') ? 'selected' : ''}>Tidak berulang</option>
        <option value="daily" ${item && item.repeat === 'daily' ? 'selected' : ''}>Harian</option>
        <option value="weekday" ${item && item.repeat === 'weekday' ? 'selected' : ''}>Weekday (Senin–Jumat)</option>
        <option value="weekly" ${item && item.repeat === 'weekly' ? 'selected' : ''}>Mingguan</option>
        <option value="weeklyCustom" ${item && item.repeat === 'weeklyCustom' ? 'selected' : ''}>Mingguan, Hari Tertentu</option>
        <option value="monthly" ${item && item.repeat === 'monthly' ? 'selected' : ''}>Bulanan</option>
        <option value="custom" ${item && item.repeat === 'custom' ? 'selected' : ''}>Bulanan, Hari Tertentu</option>
      </select>
    </div>
    <div class="field" id="reminder-shiftweekend-row" style="display:none;">
      <label style="font-size:12.5px;color:var(--slate);font-weight:500;display:block;margin-bottom:6px;" title="Kalau tanggal jatuh di hari yang dicentang, pengingat otomatis digeser maju ke hari kerja berikutnya. Cocok utk hal seperti 'finalisasi laporan tgl 4 tiap bulan, kalau tgl 4 libur akhir pekan geser ke hari kerja setelahnya'. Kalau hanya salah satu yang dicentang, hari yang tidak dicentang tetap muncul apa adanya.">Geser ke hari kerja berikutnya kalau jatuh:</label>
      <div style="display:flex;gap:14px;">
        <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--slate);cursor:pointer;user-select:none;border:1px solid var(--border);border-radius:7px;padding:6px 10px;">
          <input type="checkbox" id="reminder-shiftsaturday-input" ${item && (item.shiftSaturday || (item.shiftWeekend && item.shiftSaturday === undefined && item.shiftSunday === undefined)) ? 'checked' : ''}><span>Sabtu</span>
        </label>
        <label style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--slate);cursor:pointer;user-select:none;border:1px solid var(--border);border-radius:7px;padding:6px 10px;">
          <input type="checkbox" id="reminder-shiftsunday-input" ${item && (item.shiftSunday || (item.shiftWeekend && item.shiftSaturday === undefined && item.shiftSunday === undefined)) ? 'checked' : ''}><span>Minggu</span>
        </label>
      </div>
    </div>
    <div class="field" id="reminder-customdays-row" style="display:none;">
      <label id="reminder-customdays-label">Ulangi di hari (centang hari yang dipilih)</label>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">
        ${CAL_DOW.map((label, idx) => {
          const jsDow = CAL_DOW_JSDOW[idx];
          const checked = item && Array.isArray(item.customDays) && item.customDays.includes(jsDow);
          return `<label style="display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--slate);cursor:pointer;user-select:none;border:1px solid var(--border);border-radius:7px;padding:6px 10px;"><input type="checkbox" class="reminder-customday-checkbox" value="${jsDow}" ${checked ? 'checked' : ''}><span>${label}</span></label>`;
        }).join('')}
      </div>
    </div>
    <div class="field"><label>Keterangan (opsional)</label><textarea id="reminder-desc-input" rows="4" placeholder="Detail tambahan...">${escapeHTML(item ? item.description : '')}</textarea></div>
    <div class="modal-actions" style="justify-content:${isEdit ? 'space-between' : 'flex-end'};">
      ${isEdit ? `<div style="display:flex;gap:8px;">
        <button class="btn ghost danger-action" id="delete-reminder" title="Hapus" style="color:var(--danger);border-color:var(--danger);width:40px;padding:0;display:flex;align-items:center;justify-content:center;"><svg viewBox="0 0 24 24" fill="none" style="width:17px;height:17px;">${ICONS.trash}</svg></button>
        ${(item.repeat && item.repeat !== 'none') ? `<button class="btn ghost" id="stop-repeat-reminder" title="Hentikan Pengulangan mulai tanggal berikutnya" style="color:var(--slate);border-color:var(--border);width:40px;padding:0;display:flex;align-items:center;justify-content:center;"><svg viewBox="0 0 24 24" fill="none" style="width:17px;height:17px;">${ICONS.stopRepeat}</svg></button>` : ''}
      </div>` : ''}
      <button class="btn primary" id="save-reminder" title="Simpan" style="width:40px;padding:0;display:flex;align-items:center;justify-content:center;"><svg viewBox="0 0 24 24" fill="none" style="width:18px;height:18px;">${ICONS.check}</svg></button>
    </div>
  </div></div>`);
  document.body.appendChild(backdrop);
  backdrop.querySelector('#close-modal').addEventListener('click', () => backdrop.remove());
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) backdrop.remove(); });
  backdrop.querySelector('#reminder-title-input').focus();
  enhanceDateInputs(backdrop);

  if (isEdit) {
    backdrop.querySelector('#delete-reminder').addEventListener('click', async () => {
      if (!confirm(`Hapus pengingat "${item.title}"?`)) return;
      try {
        await DB.deleteReminder(item.id);
        toast('Pengingat dihapus', 'success');
        backdrop.remove();
      } catch (err) {
        toast('Gagal menghapus: ' + err.message, 'error');
      }
    });
    const stopRepeatBtn = backdrop.querySelector('#stop-repeat-reminder');
    if (stopRepeatBtn) {
      stopRepeatBtn.addEventListener('click', async () => {
        // Tanggal setelah mana pengulangan dihentikan: tanggal kemunculan
        // yang sedang dilihat (occurrenceDate, dari sel kalender yang
        // diklik) kalau ada, kalau tidak jatuh balik ke tanggal dasar
        // (item.date). Kemunculan pada tanggal ini SENDIRI tetap muncul;
        // hanya kemunculan SETELAHNYA yang disembunyikan (lihat
        // occursOnDate: reminder.repeatUntil).
        const stopDate = occurrenceDate || item.date;
        if (!stopDate) { toast('Tidak ada tanggal acuan untuk menghentikan pengulangan', 'error'); return; }
        if (!confirm(`Hentikan pengulangan "${item.title}" mulai setelah tgl ${formatDateID(stopDate)}? Pengingat masih muncul di tgl ${formatDateID(stopDate)}, tapi tidak lagi di tanggal-tanggal sesudahnya.`)) return;
        try {
          await DB.updateReminder(item.id, {
            title: item.title, description: item.description, date: item.date, time: item.time,
            repeat: item.repeat, priority: item.priority, order: item.order,
            customDays: item.customDays, endDate: item.endDate,
            shiftSaturday: item.shiftSaturday, shiftSunday: item.shiftSunday,
            repeatUntil: stopDate, analisis: item.analisis, pending: item.pending
          });
          toast('Pengulangan dihentikan', 'success');
          backdrop.remove();
        } catch (err) {
          toast('Gagal menghentikan pengulangan: ' + err.message, 'error');
        }
      });
    }
  }

  const pendingCheckbox = backdrop.querySelector('#reminder-pending-input');
  const analisisCheckbox = backdrop.querySelector('#reminder-analisis-input');
  const dateInput = backdrop.querySelector('#reminder-date-input');
  const timeInput = backdrop.querySelector('#reminder-time-input');
  const repeatSelect = backdrop.querySelector('#reminder-repeat-input');
  const datetimeRow = backdrop.querySelector('#reminder-datetime-row');
  const repeatRow = backdrop.querySelector('#reminder-repeat-row');
  const customDaysRow = backdrop.querySelector('#reminder-customdays-row');
  const customDaysLabel = backdrop.querySelector('#reminder-customdays-label');
  const shiftWeekendRow = backdrop.querySelector('#reminder-shiftweekend-row');
  const shiftSaturdayInput = backdrop.querySelector('#reminder-shiftsaturday-input');
  const shiftSundayInput = backdrop.querySelector('#reminder-shiftsunday-input');
  const priorityGroup = backdrop.querySelector('#reminder-priority-group');
  const analisisDayRow = backdrop.querySelector('#reminder-analisis-day-row');
  const analisisDaySelect = backdrop.querySelector('#reminder-analisis-day-input');
  // Opsi tanggal menyesuaikan tier yang dipilih: Prioritas dari
  // ANALISIS_PRIORITY_DATES, Standar dari ANALISIS_FALLBACK_DATES.
  // Kalau item yang diedit sudah punya analisisDay yang masih cocok
  // dengan tier saat ini, itu yang dipilih; kalau tidak, default ke
  // opsi pertama di daftar.
  const populateAnalisisDayOptions = () => {
    const tierInput = backdrop.querySelector('input[name="reminder-priority"]:checked');
    const tier = tierInput ? tierInput.value : 'standard';
    const list = tier === 'priority' ? ANALISIS_PRIORITY_DATES : ANALISIS_FALLBACK_DATES;
    const keepValue = (item && item.analisisDay && list.includes(Number(item.analisisDay))) ? Number(item.analisisDay) : null;
    analisisDaySelect.innerHTML = list.map(d => `<option value="${d}">Tanggal ${d}</option>`).join('');
    if (keepValue !== null) analisisDaySelect.value = String(keepValue);
  };
  const dateRangeCheckbox = backdrop.querySelector('#reminder-daterange-input');
  const dateRangeLabel = backdrop.querySelector('#reminder-daterange-label');
  const enddateRow = backdrop.querySelector('#reminder-enddate-row');
  const enddateInput = backdrop.querySelector('#reminder-enddate-input');
  const applyRepeatState = () => {
    const notPending = repeatRow.style.display !== 'none';
    const isCustomRepeat = repeatSelect.value === 'custom';
    const isWeeklyCustom = repeatSelect.value === 'weeklyCustom';
    // "s.d. tgl lain" tetap bisa dipakai walau repeat = "Bulanan, Hari
    // Tertentu": kalau diaktifkan, tanggal tunggalnya melebar jadi
    // rentang tanggal tiap bulan (lihat occursOnDate), sementara filter
    // hari yang dicentang tetap berlaku. Tidak berlaku utk "Mingguan,
    // Hari Tertentu" (repeat tiap minggu di hari tsb, konsep rentang
    // tanggal tidak relevan di sini), jadi checkbox-nya disembunyikan.
    dateRangeLabel.style.display = (notPending && !isWeeklyCustom) ? 'flex' : 'none';
    if (isWeeklyCustom) dateRangeCheckbox.checked = false;
    const isRange = !isWeeklyCustom && dateRangeCheckbox.checked;
    enddateRow.style.display = (notPending && isRange) ? '' : 'none';
    if (!isRange) enddateInput.value = '';
    customDaysRow.style.display = (notPending && (isCustomRepeat || isWeeklyCustom || isRange)) ? '' : 'none';
    customDaysLabel.textContent = isCustomRepeat
      ? 'Hanya jika tanggal ini jatuh di hari (centang hari yang dipilih)'
      : isWeeklyCustom
      ? 'Ulangi tiap minggu di hari (centang hari yang dipilih)'
      : 'Hanya muncul di hari berikut (opsional, kosongkan utk semua hari)';
    // "Geser jika Sabtu/Minggu" hanya berlaku utk repeat "Bulanan" tanpa
    // rentang tanggal (satu tanggal tunggal tiap bulan).
    const isPlainMonthly = repeatSelect.value === 'monthly' && !isRange;
    shiftWeekendRow.style.display = (notPending && isPlainMonthly) ? '' : 'none';
    if (!isPlainMonthly) { shiftSaturdayInput.checked = false; shiftSundayInput.checked = false; }
  };
  const applyPendingState = () => {
    // Tanggal/jam/ulangi disembunyikan kalau salah satu (atau keduanya)
    // dari "Pending" atau "Analisis" dicentang — keduanya sama-sama
    // berarti pengingat ini tidak punya tanggal tetap sendiri (Analisis
    // nanti dijadwalkan otomatis ke hari kerja lewat fitur Reminder
    // Analisis, jadi tanggal manual tidak relevan).
    const isPending = pendingCheckbox.checked;
    const isAnalisis = analisisCheckbox.checked;
    const hideSchedule = isPending || isAnalisis;
    datetimeRow.style.display = hideSchedule ? 'none' : 'flex';
    repeatRow.style.display = hideSchedule ? 'none' : '';
    if (hideSchedule) { dateInput.value = ''; timeInput.value = ''; repeatSelect.value = 'none'; dateRangeCheckbox.checked = false; enddateInput.value = ''; }
    priorityGroup.classList.toggle('show', hideSchedule);
    analisisDayRow.style.display = isAnalisis ? '' : 'none';
    if (isAnalisis) populateAnalisisDayOptions();
    applyRepeatState();
  };
  pendingCheckbox.addEventListener('change', applyPendingState);
  analisisCheckbox.addEventListener('change', applyPendingState);
  backdrop.querySelectorAll('input[name="reminder-priority"]').forEach(r => r.addEventListener('change', () => { if (analisisCheckbox.checked) populateAnalisisDayOptions(); }));
  repeatSelect.addEventListener('change', applyRepeatState);
  dateRangeCheckbox.addEventListener('change', applyRepeatState);
  applyPendingState();

  backdrop.querySelector('#save-reminder').addEventListener('click', async () => {
    const title = backdrop.querySelector('#reminder-title-input').value.trim();
    // Urutan tidak lagi diisi manual — sekarang diatur lewat drag & drop
    // langsung di sel kalender (lihat wiring drag di renderCalendarGrid).
    // Pengingat yang sudah ada mempertahankan order-nya; pengingat baru
    // mulai tanpa order (null) sehingga otomatis muncul paling akhir di
    // tanggalnya sampai digeser manual.
    const order = item ? (item.order === undefined ? null : item.order) : null;
    const isPending = pendingCheckbox.checked;
    const isAnalisis = analisisCheckbox.checked;
    const hideSchedule = isPending || isAnalisis;
    const date = hideSchedule ? '' : dateInput.value;
    const time = hideSchedule ? '' : timeInput.value;
    const repeat = hideSchedule ? 'none' : repeatSelect.value;
    const isCustomRepeat = repeat === 'custom';
    const isWeeklyCustom = repeat === 'weeklyCustom';
    const isRange = !hideSchedule && !isWeeklyCustom && dateRangeCheckbox.checked;
    const endDate = isRange ? enddateInput.value : '';
    const customDays = (isCustomRepeat || isWeeklyCustom || isRange)
      ? Array.from(backdrop.querySelectorAll('.reminder-customday-checkbox:checked')).map(cb => Number(cb.value))
      : [];
    const shiftSaturday = (repeat === 'monthly' && !isRange) ? shiftSaturdayInput.checked : false;
    const shiftSunday = (repeat === 'monthly' && !isRange) ? shiftSundayInput.checked : false;
    const priority = hideSchedule ? (backdrop.querySelector('input[name="reminder-priority"]:checked').value) : 'standard';
    const analisis = isAnalisis;
    const analisisDay = isAnalisis ? Number(analisisDaySelect.value) : null;
    const description = backdrop.querySelector('#reminder-desc-input').value.trim();
    if (!title) { toast('Judul wajib diisi', 'error'); return; }
    if (title.length > 22) { toast('Judul maksimal 22 karakter', 'error'); return; }
    if (isAnalisis && !analisisDay) { toast('Pilih Tanggal Analisis', 'error'); return; }
    if (isCustomRepeat && customDays.length === 0) { toast('Pilih minimal satu hari untuk repeat "Bulanan, Hari Tertentu"', 'error'); return; }
    if (isCustomRepeat && !date) { toast('Isi Tanggal untuk repeat "Bulanan, Hari Tertentu" (menentukan tanggal yang diulang tiap bulan)', 'error'); return; }
    if (isWeeklyCustom && customDays.length === 0) { toast('Pilih minimal satu hari untuk repeat "Mingguan, Hari Tertentu"', 'error'); return; }
    if (isWeeklyCustom && !date) { toast('Isi Tanggal (tanggal mulai berlaku) untuk repeat "Mingguan, Hari Tertentu"', 'error'); return; }
    if (isRange) {
      if (!date) { toast('Isi tanggal awal untuk rentang tanggal', 'error'); return; }
      if (!endDate) { toast('Isi tanggal akhir ("s.d. Tanggal") untuk rentang tanggal', 'error'); return; }
      if (endDate < date) { toast('Tanggal akhir tidak boleh sebelum tanggal awal', 'error'); return; }
    }
    try {
      if (isEdit) {
        await DB.updateReminder(item.id, { title, description, date, time, repeat, priority, order, customDays, endDate, shiftSaturday, shiftSunday, repeatUntil: item.repeatUntil || '', analisis, analisisDay, pending: isPending });
        toast('Pengingat diperbarui', 'success');
      } else {
        await DB.addReminder(state.user.uid, { title, description, date, time, repeat, priority, order, customDays, endDate, shiftSaturday, shiftSunday, analisis, analisisDay, pending: isPending });
        toast('Pengingat ditambahkan', 'success');
      }
      backdrop.remove();
    } catch (err) {
      toast('Gagal menyimpan: ' + err.message, 'error');
    }
  });
}

function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text)
      .then(() => toast('Disalin ke clipboard', 'success'))
      .catch(() => toast('Gagal menyalin', 'error'));
    return;
  }
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand('copy');
    ta.remove();
    toast('Disalin ke clipboard', 'success');
  } catch (err) {
    toast('Gagal menyalin', 'error');
  }
}

// ---------- Charts ----------
function destroyChart(id) {
  if (state.chartInstances[id]) { state.chartInstances[id].destroy(); delete state.chartInstances[id]; }
}

function renderBarChart(canvasId, labels, datasets) {
  destroyChart(canvasId);
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;
  state.chartInstances[canvasId] = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: datasets.map(d => ({ label: d.label, data: d.data, backgroundColor: d.color, borderRadius: 5 })) },
    options: { responsive: true, plugins: { legend: { display: datasets.length > 1 } }, scales: { y: { beginAtZero: true } } }
  });
}

function renderLineChart(canvasId, labels, datasets) {
  destroyChart(canvasId);
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;
  state.chartInstances[canvasId] = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets: datasets.map(d => ({ label: d.label, data: d.data, borderColor: d.color, backgroundColor: d.color, tension: 0.3, spanGaps: true })) },
    options: { responsive: true, plugins: { legend: { display: true } } }
  });
}

// Kartu utama dashboard: batang Total Aset (gradasi navy → teal, sudut
// membulat) berdampingan dengan garis Laba Bersih pada sumbu kedua.
function renderHeroChart(canvasId, labels, asetData, labaData) {
  destroyChart(canvasId);
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const gridColor = isDark ? 'rgba(255,255,255,.06)' : 'rgba(20,30,50,.06)';
  const tickColor = isDark ? '#A9B2C7' : '#5B6472';
  state.chartInstances[canvasId] = new Chart(ctx, {
    data: {
      labels,
      datasets: [
        {
          type: 'bar',
          label: 'Total Aset',
          data: asetData,
          borderRadius: 8,
          borderSkipped: false,
          maxBarThickness: 38,
          order: 2,
          backgroundColor: (c) => {
            const { ctx: cctx, chartArea } = c.chart;
            if (!chartArea) return '#2F6FE4';
            const g = cctx.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
            g.addColorStop(0, isDark ? '#8FB6FF' : '#5B93FF');
            g.addColorStop(1, isDark ? '#1E3E7A' : '#16213A');
            return g;
          }
        },
        {
          type: 'line',
          label: 'Laba Bersih',
          data: labaData,
          borderColor: '#C08A3E',
          backgroundColor: '#C08A3E',
          borderWidth: 2.5,
          tension: 0.35,
          pointRadius: 4,
          pointHoverRadius: 5,
          pointBackgroundColor: isDark ? '#161D2E' : '#FFFFFF',
          pointBorderColor: '#C08A3E',
          pointBorderWidth: 2,
          yAxisID: 'y1',
          order: 1
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          display: true, position: 'top', align: 'end',
          labels: { boxWidth: 9, boxHeight: 9, usePointStyle: true, pointStyle: 'circle', color: tickColor, font: { family: "'Plus Jakarta Sans'", size: 11.5, weight: '600' } }
        },
        tooltip: {
          callbacks: {
            label: (item) => `${item.dataset.label}: ${formatIDR(item.raw)}`
          }
        }
      },
      scales: {
        x: { grid: { display: false }, ticks: { color: tickColor, font: { family: "'Plus Jakarta Sans'", size: 11.5 } } },
        y: { grid: { color: gridColor }, border: { display: false }, ticks: { color: tickColor, font: { family: "'Plus Jakarta Sans'", size: 11 }, callback: v => formatIDRShort(v) } },
        y1: { position: 'right', grid: { display: false }, border: { display: false }, ticks: { color: tickColor, font: { family: "'Plus Jakarta Sans'", size: 11 }, callback: v => formatIDRShort(v) } }
      }
    }
  });
}

// Kartu widget kecil di dashboard: batang tunggal, sudut membulat,
// tanpa sumbu/label berlebih supaya tetap ringkas.
function renderMiniBarChart(canvasId, labels, data, color) {
  destroyChart(canvasId);
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const gridColor = isDark ? 'rgba(255,255,255,.06)' : 'rgba(20,30,50,.06)';
  const tickColor = isDark ? '#A9B2C7' : '#5B6472';
  state.chartInstances[canvasId] = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [{ data, backgroundColor: color, borderRadius: 6, borderSkipped: false, maxBarThickness: 30 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: { callbacks: { label: (item) => formatIDR(item.raw) } } },
      scales: {
        x: { grid: { display: false }, ticks: { color: tickColor, font: { family: "'Plus Jakarta Sans'", size: 10.5 }, maxRotation: 0, autoSkip: true } },
        y: { grid: { color: gridColor }, border: { display: false }, ticks: { color: tickColor, font: { family: "'Plus Jakarta Sans'", size: 10 }, callback: v => formatIDRShort(v) } }
      }
    }
  });
}

// Donut komposisi (mis. total aset per perusahaan) — legendanya dirender
// terpisah sebagai HTML di sebelah kanvas, bukan legend bawaan Chart.js.
function renderDonutChart(canvasId, labels, data, palette) {
  destroyChart(canvasId);
  const ctx = document.getElementById(canvasId);
  if (!ctx) return;
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  state.chartInstances[canvasId] = new Chart(ctx, {
    type: 'doughnut',

    options: {
      responsive: true, maintainAspectRatio: false, cutout: '68%',
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: (item) => `${item.label}: ${formatIDR(item.raw)}` } }

// ---------- Bootstrap ----------
auth.onAuthStateChanged(async (user) => {
  if (state.unsubCompanies) { state.unsubCompanies(); state.unsubCompanies = null; }
  teardownActiveDataListener();
  Sync.reset();

  if (user) {
    state.user = user;
    renderShell();
    // Listener realtime: daftar perusahaan otomatis ter-update begitu ada
    // perubahan — baik dari tab/perangkat ini maupun dari perangkat lain
    // yang login dengan akun yang sama. Ini juga memberi tahu status
    // sinkronisasi (badge di topbar).
    state.unsubCompanies = DB.watchCompanies(user.uid, (companies, meta) => {
      state.companies = companies;
      Sync.report('companies', meta);
      const safeToRerender = ['dashboard', 'companies', 'company-detail', 'report'].includes(state.view)
        && !document.querySelector('.modal-backdrop');
      if (safeToRerender) renderCurrentView();
    }, (err) => toast('Gagal memuat data perusahaan: ' + err.message, 'error'));
    setView('dashboard');
  } else {
    state.user = null;
    renderAuthScreen('login');
  }
});

</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body>
</html>
