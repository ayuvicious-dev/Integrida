<script>
// ===== db.js =====
// =============================================================
// DB.JS - Lapisan akses data Firestore untuk Integrida
// Struktur data:
// companies/{companyId}            { name, code, parentId, ownerUid, createdAt }
// companies/{companyId}/statements/{statementId}
//   {
//     year, periodType ('bulanan'|'triwulan'|'semester'|'tahunan'),
//     periodIndex (1..12 / 1..4 / 1..2 / 1),
//     periodLabel (contoh "Maret 2025" / "Triwulan II 2025"),
//     neraca: {...}, labaRugi: {...}, uploadedAt
//   }
// =============================================================

const DB = {
  async getCompanies(uid) {
    const snap = await db.collection('companies').where('ownerUid', '==', uid).get();
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  },

  async addCompany(uid, name, code, parentId, category) {
    const ref = await db.collection('companies').add({
      name,
      code: code || '',
      parentId: parentId || null,
      category: category || '',
      ownerUid: uid,
      sortOrder: Date.now(),
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    return ref.id;
  },

  async updateCompanyCode(companyId, code) {
    await db.collection('companies').doc(companyId).update({ code: code || '' });
  },

  async updateCompanyCategory(companyId, category) {
    await db.collection('companies').doc(companyId).update({ category: category || '' });
  },

  async updateCompanyParent(companyId, parentId) {
    await db.collection('companies').doc(companyId).update({ parentId: parentId || null });
  },

  // Menyimpan urutan tampilan kartu perusahaan di menu Perusahaan (drag &
  // drop) — orderedIds adalah seluruh id perusahaan sesuai urutan barunya,
  // disimpan sebagai indeks 0..n-1 per dokumen lewat satu batch write.
  async reorderCompanies(orderedIds) {
    const batch = db.batch();
    orderedIds.forEach((id, idx) => {
      batch.update(db.collection('companies').doc(id), { sortOrder: idx });
    });
    await batch.commit();
  },

  // ownership: array of { type: 'company'|'external', companyId (utk 'company'),
  // name (utk 'external'), percentage (number) } — kepemilikan saham perusahaan
  // ini oleh pihak lain (bisa perusahaan lain yang terdaftar, bisa pihak luar).
  // foundedDate: string tanggal berdiri perusahaan format 'YYYY-MM-DD' (opsional).
  async updateCompanyBusinessInfo(companyId, { address, ownership, foundedDate }) {
    await db.collection('companies').doc(companyId).update({
      address: address || '',
      ownership: Array.isArray(ownership) ? ownership : [],
      foundedDate: foundedDate || ''
    });
  },

  // logoUrl: data URL gambar logo perusahaan (sudah diperkecil di sisi
  // browser oleh resizeImageFile sebelum dipanggil) — atau '' untuk
  // menghapus logo yang tersimpan.
  async updateCompanyLogo(companyId, logoUrl) {
    await db.collection('companies').doc(companyId).update({ logoUrl: logoUrl || '' });
  },

  async deleteCompany(companyId) {
    const statements = await db.collection('companies').doc(companyId).collection('statements').get();
    const batch = db.batch();
    statements.docs.forEach(d => batch.delete(d.ref));
    batch.delete(db.collection('companies').doc(companyId));
    // Anak perusahaan yang induknya dihapus otomatis menjadi induk tersendiri
    // (parentId dikosongkan) alih-alih menunjuk ke perusahaan yang sudah tidak ada.
    const children = await db.collection('companies').where('parentId', '==', companyId).get();
    children.docs.forEach(d => batch.update(d.ref, { parentId: null }));
    await batch.commit();
  },

  async getStatements(companyId) {
    const snap = await db.collection('companies').doc(companyId).collection('statements')
      .orderBy('year', 'asc').get();
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  },

  async getAllStatementsForCompanies(companyIds) {
    const results = [];
    for (const id of companyIds) {
      const statements = await this.getStatements(id);
      statements.forEach(s => results.push({ ...s, companyId: id }));
    }
    return results;
  },

  async saveStatement(companyId, statement) {
    // ID unik per periode agar impor ulang menimpa data lama (bukan duplikat)
    const statementId = `${statement.year}_${statement.periodType}_${statement.periodIndex}`;
    await db.collection('companies').doc(companyId).collection('statements').doc(statementId).set({
      ...statement,
      uploadedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    return statementId;
  },

  // Menyimpan BEBERAPA kategori data (mis. neraca + labaRugi + arusKas +
  // perubahanModal hasil satu kali impor Buku Besar) dalam SATU panggilan
  // set() Firestore, bukan beberapa saveStatementSection terpisah
  // berurutan. Ini memastikan penyimpanan bersifat "semua-atau-tidak-sama-
  // sekali": kalau terjadi gangguan (mis. jaringan terputus), tidak akan
  // ada kondisi sebagian kategori tersimpan dan sebagian lagi tidak untuk
  // periode yang sama.
  // CATATAN: rincian mentah Buku Besar (per transaksi) TIDAK dititipkan
  // di sini karena ukurannya bisa melebihi batas 1 dokumen Firestore
  // (1 MB) — lihat saveLedgerAccounts/getLedgerAccounts di bawah.
  async saveStatementSections(companyId, period, sections) {
    const statementId = `${period.year}_${period.periodType}_${period.periodIndex}`;
    await db.collection('companies').doc(companyId).collection('statements').doc(statementId).set({
      year: period.year,
      periodType: period.periodType,
      periodIndex: period.periodIndex,
      periodLabel: period.periodLabel,
      ...sections,
      uploadedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
    return statementId;
  },

  // ---- Buku Besar mentah (rincian per transaksi) ----
  // Dokumen Firestore dibatasi maksimal 1.048.576 byte. Perusahaan dengan
  // banyak transaksi (mis. impor Buku Besar tahunan) bisa menghasilkan
  // rincian yang jauh melebihi itu kalau disimpan sebagai satu field di
  // dokumen statement. Karena itu disimpan terpisah di subcollection
  // `ledgerChunks`, dipecah otomatis oleh chunkLedgerPieces() jadi
  // beberapa dokumen kecil yang masing-masing jauh di bawah batas itu.
  async saveLedgerAccounts(companyId, statementId, accounts) {
    const colRef = db.collection('companies').doc(companyId).collection('statements').doc(statementId).collection('ledgerChunks');
    const existing = await colRef.get();
    if (!existing.empty) {
      const delBatch = db.batch();
      existing.docs.forEach((d) => delBatch.delete(d.ref));
      await delBatch.commit();
    }
    const chunks = chunkLedgerPieces(accounts || []);
    for (let i = 0; i < chunks.length; i++) {
      await colRef.doc(String(i)).set({ chunkIndex: i, items: chunks[i] });
    }
    return chunks.length;
  },

  async getLedgerAccounts(companyId, statementId) {
    const snap = await db.collection('companies').doc(companyId).collection('statements').doc(statementId).collection('ledgerChunks').orderBy('chunkIndex', 'asc').get();
    const pieces = snap.docs.flatMap((d) => (d.data().items || []));
    return mergeLedgerPieces(pieces);
  },

  async deleteStatement(companyId, statementId) {
    const chunksRef = db.collection('companies').doc(companyId).collection('statements').doc(statementId).collection('ledgerChunks');
    const chunkSnap = await chunksRef.get();
    if (!chunkSnap.empty) {
      const delBatch = db.batch();
      chunkSnap.docs.forEach((d) => delBatch.delete(d.ref));
      await delBatch.commit();
    }
    await db.collection('companies').doc(companyId).collection('statements').doc(statementId).delete();
  },

  // verified: true/false — menandai laporan keuangan periode ini sudah
  // diverifikasi/divalidasi kebenarannya (mis. oleh akuntan/pemilik).
  async updateStatementVerified(companyId, statementId, verified) {
    await db.collection('companies').doc(companyId).collection('statements').doc(statementId).update({ verified: !!verified });
  },

  // syncFlags: map (di dalam dokumen statement) yang menandai baris rincian
  // akun mana saja (per kategori/sub-akun, per transaksi Arus Kas, atau per
  // baris Perubahan Modal) yang sudah dicocokkan manual oleh pengguna
  // dengan data sistem/sumber aslinya (mis. rekening koran bank). Berbeda
  // dari `verified` (menandai satu periode penuh sekaligus), ini menandai
  // satu baris rincian secara individual — lihat syncCheckboxHtml() &
  // fungsi-fungsi derivedFieldRow/arusKasLangsungItemsHtml/
  // perubahanModalTable di bawah untuk cara key-nya dibentuk. `key` dikirim
  // sebagai path bertitik (mis. "neraca__kasSetaraKas__0") supaya tersimpan
  // sebagai field bertingkat di dalam map syncFlags, bukan menimpa seluruh
  // map setiap kali satu baris dicentang.
  async updateStatementSyncFlag(companyId, statementId, key, value) {
    await db.collection('companies').doc(companyId).collection('statements').doc(statementId).update({ [`syncFlags.${key}`]: !!value });
  },

  // ===========================================================
  // REALTIME WATCHERS (untuk fitur sinkronisasi multi-device)
  // Setiap watcher mengembalikan fungsi unsubscribe(), dan memanggil
  // callback(data, meta) setiap kali ada perubahan — baik dari
  // perangkat ini sendiri maupun dari perangkat/sesi lain yang login
  // dengan akun yang sama.
  //
  // meta.pendingWrites = true  -> ada perubahan lokal yang BELUM
  //                                terkirim & terkonfirmasi ke server.
  // meta.fromCache     = true  -> data yang tampil berasal dari cache
  //                                lokal (biasanya karena sedang offline),
  //                                belum tentu versi terbaru dari server.
  // ===========================================================

  watchCompanies(uid, onData, onError) {
    return db.collection('companies').where('ownerUid', '==', uid)
      .onSnapshot({ includeMetadataChanges: true }, (snap) => {
        const companies = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        onData(companies, {
          pendingWrites: snap.metadata.hasPendingWrites,
          fromCache: snap.metadata.fromCache
        });
      }, (err) => { if (onError) onError(err); else console.error('watchCompanies error', err); });
  },

  watchStatements(companyId, onData, onError) {
    return db.collection('companies').doc(companyId).collection('statements')
      .orderBy('year', 'asc')
      .onSnapshot({ includeMetadataChanges: true }, (snap) => {
        const statements = snap.docs.map(d => ({ id: d.id, companyId, ...d.data() }));
        onData(statements, {
          pendingWrites: snap.metadata.hasPendingWrites,
          fromCache: snap.metadata.fromCache
        });
      }, (err) => { if (onError) onError(err); else console.error('watchStatements error', err); });
  },

  // Menggabungkan watcher beberapa perusahaan sekaligus jadi satu
  // callback tunggal (dipakai di Dashboard & Perbandingan). Di-DEBOUNCE
  // (150ms) supaya saat pemuatan awal — tiap perusahaan punya listener
  // Firestore SENDIRI-SENDIRI dan snapshot pertamanya datang satu-satu,
  // bukan sekaligus — callback (onData) TIDAK dipanggil berkali-kali
  // berturut-turut (yang sebelumnya memicu Dashboard render ulang total
  // + destroy/buat-ulang 4 chart Chart.js tiap kali satu perusahaan
  // selesai dimuat, terasa berat/lambat terutama di HP). Update
  // berikutnya (realtime, setelah pemuatan awal selesai) tetap terasa
  // instan karena delay-nya sangat singkat.
  watchAllStatements(companyIds, onData, onError) {
    const cache = {};
    const metaMap = {};
    let debounceTimer = null;
    const emit = () => {
      if (debounceTimer) clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        debounceTimer = null;
        const merged = companyIds.flatMap(id => cache[id] || []);
        const aggMeta = {
          pendingWrites: Object.values(metaMap).some(m => m.pendingWrites),
          fromCache: Object.values(metaMap).some(m => m.fromCache)
        };
        onData(merged, aggMeta);
      }, 150);
    };
    const unsubs = companyIds.map(id => this.watchStatements(id, (statements, meta) => {
      cache[id] = statements;
      metaMap[id] = meta;
      emit();
    }, onError));
    return () => {
      if (debounceTimer) clearTimeout(debounceTimer);
      unsubs.forEach(u => { if (typeof u === 'function') u(); });
    };
  },

  // ---- Setting → Upgrade Aplikasi (checklist poin rencana/progres upgrade) ----
  watchUpgradeItems(uid, onData, onError) {
    return db.collection('upgradeItems').where('ownerUid', '==', uid)
      .onSnapshot({ includeMetadataChanges: true }, (snap) => {
        const items = snap.docs.map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => (a.createdAtMs || 0) - (b.createdAtMs || 0));
        onData(items, {
          pendingWrites: snap.metadata.hasPendingWrites,
          fromCache: snap.metadata.fromCache
        });
      }, (err) => { if (onError) onError(err); else console.error('watchUpgradeItems error', err); });
  },

  async addUpgradeItem(uid, title, description) {
    await db.collection('upgradeItems').add({
      title: title || '',
      description: description || '',
      checked: false,
      ownerUid: uid,
      createdAtMs: Date.now(),
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  },

  async updateUpgradeItem(itemId, { title, description }) {
    await db.collection('upgradeItems').doc(itemId).update({
      title: title || '',
      description: description || ''
    });
  },

  async setUpgradeItemChecked(itemId, checked) {
    await db.collection('upgradeItems').doc(itemId).update({ checked: !!checked });
  },

  async deleteUpgradeItem(itemId) {
    await db.collection('upgradeItems').doc(itemId).delete();
  },

  // ---- Kalender → Pengingat (catatan/reminder tugas bebas per tanggal) ----
  watchReminders(uid, onData, onError) {
    return db.collection('reminders').where('ownerUid', '==', uid)
      .onSnapshot({ includeMetadataChanges: true }, (snap) => {
        const items = snap.docs.map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => (a.date || '').localeCompare(b.date || '') || (a.time || '').localeCompare(b.time || '') || (a.createdAtMs || 0) - (b.createdAtMs || 0));
        onData(items, {
          pendingWrites: snap.metadata.hasPendingWrites,
          fromCache: snap.metadata.fromCache
        });
      }, (err) => { if (onError) onError(err); else console.error('watchReminders error', err); });
  },

  async addReminder(uid, { title, description, date, time, repeat, priority, order, customDays, endDate, shiftSaturday, shiftSunday, repeatUntil, analisis, analisisDay, pending }) {
    await db.collection('reminders').add({
      title: title || '',
      description: description || '',
      date: date || '',
      time: time || '',
      repeat: repeat || 'none',
      customDays: Array.isArray(customDays) ? customDays : [],
      endDate: endDate || '',
      shiftSaturday: !!shiftSaturday,
      shiftSunday: !!shiftSunday,
      repeatUntil: repeatUntil || '',
      priority: priority || 'standard',
      order: (order === '' || order === null || order === undefined) ? null : Number(order),
      analisis: !!analisis,
      analisisDay: (analisis && analisisDay) ? Number(analisisDay) : null,
      pending: !!pending,
      done: false,
      ownerUid: uid,
      createdAtMs: Date.now(),
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  },

  async updateReminder(id, { title, description, date, time, repeat, priority, order, customDays, endDate, shiftSaturday, shiftSunday, repeatUntil, analisis, analisisDay, pending }) {
    await db.collection('reminders').doc(id).update({
      title: title || '',
      description: description || '',
      date: date || '',
      time: time || '',
      repeat: repeat || 'none',
      customDays: Array.isArray(customDays) ? customDays : [],
      endDate: endDate || '',
      shiftSaturday: !!shiftSaturday,
      shiftSunday: !!shiftSunday,
      repeatUntil: repeatUntil || '',
      priority: priority || 'standard',
      order: (order === '' || order === null || order === undefined) ? null : Number(order),
      analisis: !!analisis,
      analisisDay: (analisis && analisisDay) ? Number(analisisDay) : null,
      pending: !!pending
    });
  },

  async setReminderDone(id, done) {
    await db.collection('reminders').doc(id).update({ done: !!done });
  },

  // Status "selesai" pengingat berulang PER TANGGAL kemunculan — disimpan
  // di map bersarang `doneDates.<dateKeyStr>` (dot-path Firestore), pola
  // sama seperti orderOverrides. Supaya mencentang "selesai" pada satu
  // tanggal TIDAK ikut menandai kemunculan yang sama di tanggal lain.
  async setReminderDoneForDate(id, dateKeyStr, done) {
    await db.collection('reminders').doc(id).update({ [`doneDates.${dateKeyStr}`]: !!done });
  },

  // Menyimpan urutan pengingat hasil drag & drop di SATU sel tanggal
  // kalender — orderedIds adalah id pengingat pada tanggal (dateKeyStr)
  // itu sesuai urutan barunya, disimpan sebagai indeks 0..n-1 per
  // dokumen ke dalam map bersarang `orderOverrides.<dateKeyStr>` (lewat
  // dot-path Firestore, satu batch write). Sengaja per-tanggal (bukan
  // menimpa field `order` global dokumen) supaya pengingat berulang yang
  // digeser di satu tanggal TIDAK ikut mengubah urutannya di tanggal
  // kemunculan lain — lihat reminderOrderForDate() utk cara bacanya.
  async reorderRemindersForDate(dateKeyStr, orderedIds) {
    const batch = db.batch();
    orderedIds.forEach((id, idx) => {
      batch.update(db.collection('reminders').doc(id), { [`orderOverrides.${dateKeyStr}`]: idx });
    });
    await batch.commit();
  },

  async deleteReminder(id) {
    await db.collection('reminders').doc(id).delete();
  },

  // ---- Kalender → Libur/Cuti/Sakit (tanggal tidak masuk kerja) ----
  // Disimpan sebagai 1 dokumen per tanggal per pengguna (id dokumen
  // "<uid>_<yyyy-mm-dd>") supaya idempotent — toggle ulang tanggal yang
  // sama cukup timpa/hapus dokumen yang sama, tidak membuat duplikat.
  watchDayOffDates(uid, onData, onError) {
    return db.collection('dayOff').where('ownerUid', '==', uid)
      .onSnapshot({ includeMetadataChanges: true }, (snap) => {
        const dates = snap.docs.map(d => d.data().date).filter(Boolean);
        onData(dates, {
          pendingWrites: snap.metadata.hasPendingWrites,
          fromCache: snap.metadata.fromCache
        });
      }, (err) => { if (onError) onError(err); else console.error('watchDayOffDates error', err); });
  },

  async setDayOff(uid, dateKeyStr, isOff) {
    const docId = `${uid}_${dateKeyStr}`;
    if (isOff) {
      await db.collection('dayOff').doc(docId).set({ ownerUid: uid, date: dateKeyStr });
    } else {
      await db.collection('dayOff').doc(docId).delete();
    }
  }
};

</script>
<script>
// ===== import-excel.js =====
// =============================================================
// IMPORT-EXCEL.JS
//
// Neraca, Laba Rugi & Arus Kas diimpor LANGSUNG dari file laporan hasil
// export software akuntansi (Jurnal, Accurate, Zahir, dll) — bukan lagi
// dari template Excel kustom. Setiap perusahaan bisa punya kode & nama
// akun yang berbeda-beda; formatnya dikenali dari STRUKTUR laporan,
// bukan dari daftar nama akun baku.
//
// Format yang dikenali (satu sheet = satu laporan):
//   Baris 1  : Nama Perusahaan
//   Baris 2  : "Neraca" / "Laba Rugi" / "Arus Kas"
//   Baris ...: baris "Tanggal" — satu tanggal (mis. Neraca, laporan "per
//              tanggal") atau rentang "dd/mm/yyyy - dd/mm/yyyy" (Laba
//              Rugi & Arus Kas, laporan satu periode). Bila laporan
//              tidak punya baris "Tanggal" tersendiri (mis. beberapa
//              export Arus Kas), tanggal/rentang di baris ke-3 (persis
//              di bawah baris jenis laporan) dipakai sebagai cadangan.
//   Baris akun: kolom A = kode akun, kolom B = nama akun, kolom C = nilai
//
// Tiga jenis baris akun dikenali dari kolom A:
//   1. Baris TEBAL tanpa kode & tanpa nilai      -> judul seksi
//      (mis. "Aset Lancar", "Aktivitas Operasional").
//   2. Baris berlabel diawali "Total" (atau "Laba Kotor" / "Laba
//      Operasional" / "Laba (Rugi)" / "Saldo kas awal" / "Kas bersih
//      yang diperoleh dari Aktivitas ...", dst) -> baris total/metrik
//      kunci yang dipetakan lewat pola kata kunci (lihat TOTAL_MATCHERS).
//   3. Baris kode akun yang TIDAK menjorok ke kanan, diikuti satu atau
//      lebih baris kode akun yang MENJOROK ke kanan -> baris pertama
//      adalah akun HEADER (nilainya sudah berupa akumulasi dari
//      akun-akun di bawahnya / sub-akun), baris menjorok di bawahnya
//      adalah SUB-AKUN (akun rincian yang sungguhan punya transaksi).
//      Kode akun yang tidak diikuti baris menjorok = akun berdiri
//      sendiri (bukan header). Pola ini dipakai pada Neraca; pada Arus
//      Kas setiap baris akun sudah rincian (tidak berjenjang) sehingga
//      cukup dibaca apa adanya per kategori.
// Karena nilai akun header sudah merupakan akumulasi sub-akunnya,
// sub-akun TIDAK dijumlahkan ulang — supaya tidak dobel hitung.
// =============================================================

function normalizeKey(s) {
  return String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
}

// Dipertahankan untuk kompatibilitas: dipakai bila suatu saat ada jenis
// data impor lain yang formatnya label,nilai dua kolom sederhana (bukan
// laporan berjenjang akun seperti Neraca/Laba Rugi/Arus Kas).
function sheetToKeyValue(sheet, dictionary) {
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
  const out = {};
  const unrecognized = [];
  rows.forEach(row => {
    if (!row || row.length < 2) return;
    const label = normalizeKey(row[0]);
    if (!label) return;
    const value = Number(String(row[1]).toString().replace(/[^0-9.-]/g, '')) || 0;
    if (dictionary[label]) {
      out[dictionary[label]] = value;
    } else if (row[0] && row[1] !== '') {
      unrecognized.push(row[0]);
    }
  });
  return { data: out, unrecognized };
}

// Buku Besar: sheet opsional & bebas formatnya (bukan daftar akun baku).
// Setiap baris = satu akun buku besar milik perusahaan (kode, nama, saldo),
// disimpan apa adanya sebagai referensi rincian — tidak dipakai dalam
// perhitungan rasio otomatis.
function sheetToLedgerRows(sheet) {
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
  const out = [];
  rows.forEach((row, i) => {
    if (i === 0) return; // baris pertama adalah header (Kode Akun | Nama Akun | Saldo)
    if (!row || row.length < 2) return;
    const kode = String(row[0] || '').trim();
    const nama = String(row[1] || '').trim();
    if (!nama) return;
    const saldo = Number(String(row[2] ?? '').toString().replace(/[^0-9.-]/g, '')) || 0;
    out.push({ kode, nama, saldo });
  });
  return out;
}

function readInfoSheet(sheet) {
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
  const info = {};
  rows.forEach(row => {
    const key = normalizeKey(row[0]);
    const val = row[1];
    if (key.includes('perusahaan')) info.companyName = String(val).trim();
    if (key.includes('tahun')) info.year = parseInt(val, 10);
    if (key.includes('jenis periode') || key.includes('periode')) info.periodTypeRaw = normalizeKey(val);
    if (key.includes('label')) info.periodLabel = String(val).trim();
  });
  return info;
}

const PERIOD_TYPE_MAP = {
  'bulanan': 'bulanan',
  'triwulan': 'triwulan',
  'kuartal': 'triwulan',
  'semester': 'semester',
  'tahunan': 'tahunan'
};

function inferPeriodIndex(periodType, periodLabel) {
  const label = normalizeKey(periodLabel);
  if (periodType === 'tahunan') return 1;
  const romanMatch = label.match(/\b(i|ii|iii|iv)\b/);
  const roman = { i: 1, ii: 2, iii: 3, iv: 4 };
  if (romanMatch) return roman[romanMatch[1]];
  const numMatch = label.match(/(\d+)/);
  if (numMatch) return parseInt(numMatch[1], 10);
  const bulanList = ['januari', 'februari', 'maret', 'april', 'mei', 'juni', 'juli', 'agustus', 'september', 'oktober', 'november', 'desember'];
  const idxBulan = bulanList.findIndex(b => label.includes(b));
  if (idxBulan >= 0) return idxBulan + 1;
  return 1;
}

// ---------- Parser baru: laporan hasil export software akuntansi ----------

const BULAN_ID = ['januari', 'februari', 'maret', 'april', 'mei', 'juni', 'juli', 'agustus', 'september', 'oktober', 'november', 'desember'];

function cap(s) { return s ? s.replace(/\b\w/g, c => c.toUpperCase()) : s; }

function toNumberOrNull(v) {
  if (v === '' || v === null || v === undefined) return null;
  const n = Number(String(v).replace(/[^0-9.-]/g, ''));
  return isNaN(n) ? null : n;
}

// Menghitung lebar indentasi (jumlah spasi/nbsp) di depan teks kolom A —
// inilah penanda apakah sebuah baris akun adalah sub-akun (menjorok) atau
// bukan.
function leadingIndentWidth(raw) {
  const m = String(raw || '').match(/^[ \t\u00A0]+/);
  return m ? m[0].length : 0;
}

function parseIndoDate(str) {
  const m = String(str || '').trim().match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if (!m) return null;
  let day = parseInt(m[1], 10), month = parseInt(m[2], 10), year = parseInt(m[3], 10);
  if (year < 100) year += 2000;
  if (month < 1 || month > 12) return null;
  return { day, month, year };
}

function isLastDayOfMonth(d) {
  return d.day === new Date(d.year, d.month, 0).getDate();
}

// Menentukan year/periodType/periodIndex/periodLabel dari teks tanggal
// pada laporan: satu tanggal ("per tanggal", umum pada Neraca) atau
// rentang "dd/mm/yyyy - dd/mm/yyyy" (umum pada Laba Rugi).
function derivePeriodFromDateText(dateText) {
  const parts = String(dateText || '').split(/\s*-\s*/).filter(Boolean);
  const start = parseIndoDate(parts[0]);
  const end = parts.length > 1 ? parseIndoDate(parts[1]) : start;
  if (!start || !end) return null;

  const monthSpan = (end.year - start.year) * 12 + (end.month - start.month) + 1;
  const isFullMonthsRange = start.day === 1 && isLastDayOfMonth(end);

  if (isFullMonthsRange && start.month === 1 && end.month === 12 && end.year === start.year) {
    return { year: start.year, periodType: 'tahunan', periodIndex: 1, periodLabel: `Tahun ${start.year}` };
  }
  if (isFullMonthsRange && monthSpan === 1) {
    return { year: start.year, periodType: 'bulanan', periodIndex: start.month, periodLabel: `${cap(BULAN_ID[start.month - 1])} ${start.year}` };
  }
  if (isFullMonthsRange && monthSpan === 3 && start.month % 3 === 1) {
    const q = Math.ceil(start.month / 3);
    return { year: start.year, periodType: 'triwulan', periodIndex: q, periodLabel: `Triwulan ${['I', 'II', 'III', 'IV'][q - 1]} ${start.year}` };
  }
  if (isFullMonthsRange && monthSpan === 6 && (start.month === 1 || start.month === 7)) {
    const s = start.month === 1 ? 1 : 2;
    return { year: start.year, periodType: 'semester', periodIndex: s, periodLabel: `Semester ${s === 1 ? 'I' : 'II'} ${start.year}` };
  }
  // Titik waktu tunggal (mis. Neraca "per tanggal X") -> dianggap mewakili
  // bulan berjalan pada tanggal tersebut.
  return { year: end.year, periodType: 'bulanan', periodIndex: end.month, periodLabel: `${cap(BULAN_ID[end.month - 1])} ${end.year}` };
}

// Kata kunci yang dipakai mengenali baris TOTAL / metrik kunci pada
// laporan, supaya tetap terbaca meski nama & kode akun berbeda-beda
// antar perusahaan / software akuntansi.
const TOTAL_MATCHERS = {
  neraca: {
    totalAsetLancar: l => /^total\b.*aset lancar$/.test(l),
    totalAset: l => l === 'total aset',
    totalKewajibanLancar: l => /^total\b.*(kewajiban|liabilitas) jangka pendek$/.test(l) || /^total\b.*(kewajiban|liabilitas) lancar$/.test(l),
    totalKewajiban: l => l === 'total kewajiban' || l === 'total liabilitas',
    totalEkuitas: l => /^total\b.*(ekuitas|modal)/.test(l) && !/jangka/.test(l)
  },
  labaRugi: {
    pendapatan: l => l === 'total dari pendapatan' || l === 'total pendapatan',
    labaKotor: l => l === 'laba kotor',
    labaOperasional: l => l === 'laba operasional' || l === 'laba usaha',
    labaBersih: l => l === 'laba (rugi)' || l === 'laba bersih' || l === 'laba/rugi bersih'
  },
  arusKas: {
    kasAwal: l => /^saldo kas awal\b/.test(l) || l === 'kas awal periode',
    arusKasOperasi: l => /kas bersih/.test(l) && /aktivitas operasional/.test(l),
    arusKasInvestasi: l => /kas bersih/.test(l) && /aktivitas investasi/.test(l),
    arusKasPendanaan: l => /kas bersih/.test(l) && /aktivitas pendanaan/.test(l),
    kenaikanKasBersih: l => /^kenaikan\b.*kas/.test(l),
    kasAkhir: l => /^saldo kas akhir\b/.test(l) || l === 'kas akhir periode'
  }
};

// Label baris "jenis laporan" (baris ke-2) yang dikenali per statementKey.
const REPORT_TYPE_LABELS = { neraca: 'neraca', labaRugi: 'laba rugi', arusKas: 'arus kas' };

// ---------- Klasifikasi Perusahaan ----------
const CATEGORY_OPTIONS = [
  { value: 'FnB', label: 'FnB', badge: 'gold' },
  { value: 'Jasa', label: 'Jasa', badge: 'blue' },
  { value: 'Manufaktur', label: 'Manufaktur', badge: 'purple' },
  { value: 'Dagang', label: 'Dagang', badge: 'teal' },
];
function categoryMeta(value) {
  return CATEGORY_OPTIONS.find(c => c.value === value) || null;
}
function categoryBadgeHTML(value) {
  const meta = categoryMeta(value);
  if (!meta) return '<span style="color:var(--slate-light);font-style:italic;">+ klasifikasi</span>';
  return `<span class="badge ${meta.badge}">${meta.label}</span>`;
}

const CASH_NAME_RE = /\b(kas|bank|cash)\b/i;
const INVENTORY_NAME_RE = /\b(persediaan|inventory|stok|stock)\b/i;

// ---------- Parser Buku Besar: export general ledger asli ----------
// Format yang dikenali (hasil export software akuntansi seperti QuickBooks):
//   Baris 1 : Nama Perusahaan
//   Baris 2 : "Buku Besar"
//   Baris 3 : rentang tanggal "dd/mm/yyyy - dd/mm/yyyy"
//   Baris header kolom: "Nama Akun / Tanggal | Transaksi | Nomor |
//   Keterangan | Debit | Kredit | Saldo | Tags"
//   Lalu per akun: baris nama akun (hanya kolom A terisi), baris "Saldo
//   Awal" (kolom B, nilai di kolom G), baris-baris transaksi, dan baris
//   "Ending Balance" (kolom D berisi "(nama akun) | Ending Balance", total
//   debit/kredit di kolom E/F, saldo akhir di kolom G).
//
// Neraca & Laba Rugi diturunkan OTOMATIS dari akun-akun ini: Neraca
// memakai SALDO AKHIR per akun (posisi akhir periode), Laba Rugi memakai
// MUTASI periode (saldo akhir - saldo awal) supaya hanya aktivitas
// periode berjalan yang terhitung (bukan akumulasi sejak akun dibuka).
// Kategori akun (Aset/Kewajiban/Ekuitas/Pendapatan/Beban) dikenali dari
// digit pertama KODE AKUN sebelum tanda "-": 1=Aset, 2=Kewajiban,
// 3=Ekuitas, 4=Pendapatan, 5=HPP, 6=Beban Operasional, 7=Pendapatan
// Lainnya, 8=Beban Lainnya, 9=Beban Pajak (Pajak Penghasilan) — asumsi
// konvensi penomoran akun yang umum dipakai; bisa disesuaikan bila
// konvensi perusahaan Anda berbeda. Untuk akun Aset (kode 1), kata kunci
// pada nama akun mempertajam sub-kategori (mis. "tetap"/"penyusutan" ->
// aset tidak lancar, nama mengandung "kas"/"bank" -> Kas & Setara Kas,
// "persediaan" -> Persediaan); untuk akun Kewajiban (kode 2), "jangka
// panjang" -> kewajiban jangka panjang. Sub-kategori Pendapatan & Beban
// (kode 4-9) murni dari digit kode akun, tidak lagi bergantung nama akun.
// Akun dengan kode non-angka di luar 1-9 dilewati & dilaporkan sebagai
// peringatan.

function parseLedgerAccountLabel(raw) {
  const text = String(raw || '').trim();
  const m = text.match(/^\(([^)]+)\)\s*(.*)$/); // "(1-10001) Kas" -> code "1-10001", name "Kas"
  if (m) return { code: m[1].trim(), name: m[2].trim() || text };
  return { code: '', name: text };
}

// ---------- Versi logika turunan (Neraca/Laba Rugi/Arus Kas/Perubahan
// Modal) dari Buku Besar ----------
// PENTING: naikkan angka ini setiap kali logika klasifikasi/perhitungan
// berubah (classifyLedgerAccount, arusKasPosForAccount,
// deriveArusKasLangsungFromLedger, derivePerubahanModalFromLedger, dsb.).
// Setiap statement tersimpan membawa derivationVersion saat itu disimpan;
// begitu company-detail dibuka & Buku Besar-nya sudah ter-load, kalau
// derivationVersion tersimpan < DERIVATION_VERSION saat ini, Neraca/Laba
// Rugi/Arus Kas/Perubahan Modal dihitung ulang dari Buku Besar mentah dan
// snapshot-nya ditimpa otomatis (lihat paintCompanyDetail) — TANPA perlu
// impor ulang file Excel-nya. Ini membuat pembaruan logika turunan
// otomatis berlaku ke data yang sudah pernah diimpor, satu periode setiap
// kali periode itu dibuka.
const DERIVATION_VERSION = 3;

function classifyLedgerAccount(code, name) {
  const n = normalizeKey(name);
  const prefixStr = String(code || '').split('-')[0].trim();
  const prefix = parseInt(prefixStr, 10);
  if (isNaN(prefix)) return { group: null, bucket: null, field: null };

  if (prefix === 1) {
    const nonCurrent = /(aset tetap|tidak lancar|jangka panjang|penyusutan|akumulasi)/.test(n);
    if (CASH_NAME_RE.test(n)) return { group: 'aset', bucket: nonCurrent ? 'tidakLancar' : 'lancar', field: 'kasSetaraKas' };
    if (INVENTORY_NAME_RE.test(n)) return { group: 'aset', bucket: nonCurrent ? 'tidakLancar' : 'lancar', field: 'persediaan' };
    return { group: 'aset', bucket: nonCurrent ? 'tidakLancar' : 'lancar', field: null };
  }
  if (prefix === 2) {
    const nonCurrent = /jangka panjang/.test(n);
    return { group: 'kewajiban', bucket: nonCurrent ? 'jangkaPanjang' : 'lancar', field: null };
  }
  if (prefix === 3) return { group: 'ekuitas', bucket: null, field: null };
  // Laba Rugi: klasifikasi murni dari digit pertama kode akun, bukan dari
  // kata kunci nama akun — supaya hasilnya konsisten & dapat diprediksi:
  //   4 = Pendapatan          7 = Pendapatan Lainnya
  //   5 = HPP                 8 = Beban Lainnya
  //   6 = Beban Operasional   9 = Beban Pajak (Pajak Penghasilan)
  if (prefix === 4) return { group: 'pendapatan', bucket: 'inti', field: null };
  if (prefix === 5) return { group: 'beban', bucket: 'hpp', field: null };
  if (prefix === 6) return { group: 'beban', bucket: 'operasional', field: null };
  if (prefix === 7) return { group: 'pendapatan', bucket: 'lainnya', field: null };
  if (prefix === 8) return { group: 'beban', bucket: 'lainnya', field: null };
  if (prefix === 9) return { group: 'beban', bucket: 'pajak', field: null };
  return { group: null, bucket: null, field: null };
}

// Urutan & label kelompok akun untuk pratinjau/rincian Buku Besar —
// dipakai supaya daftar akun mentah tidak tampil datar tanpa konteks,
// melainkan dikelompokkan seperti pada laporan akuntansi (mis. "Kas &
// Setara Kas" berisi akun Kas, Bank Jatim, Bank Mandiri Sidoarjo, dst).
const LEDGER_GROUP_ORDER = [
  { key: 'kasSetaraKas', label: 'Kas & Setara Kas' },
  { key: 'persediaan', label: 'Persediaan' },
  { key: 'asetLancarLainnya', label: 'Aset Lancar Lainnya' },
  { key: 'asetTidakLancar', label: 'Aset Tidak Lancar' },
  { key: 'kewajibanLancar', label: 'Kewajiban Lancar' },
  { key: 'kewajibanJangkaPanjang', label: 'Kewajiban Jangka Panjang' },
  { key: 'ekuitas', label: 'Ekuitas' },
  { key: 'pendapatan', label: 'Pendapatan' },
  { key: 'pendapatanLainnya', label: 'Pendapatan Lainnya' },
  { key: 'hpp', label: 'Harga Pokok Penjualan (HPP)' },
  { key: 'bebanOperasional', label: 'Beban Operasional' },
  { key: 'bebanLainnya', label: 'Beban Lainnya' },
  { key: 'pajakPenghasilan', label: 'Pajak Penghasilan' },
  { key: 'takDikenali', label: 'Tidak Dikenali' }
];

// Memetakan hasil classifyLedgerAccount (group/bucket/field) ke satu
// kunci kelompok pada LEDGER_GROUP_ORDER di atas.
function ledgerGroupKey(code, name) {
  const c = classifyLedgerAccount(code, name);
  if (c.group === 'aset') {
    if (c.field === 'kasSetaraKas') return 'kasSetaraKas';
    if (c.field === 'persediaan') return 'persediaan';
    return c.bucket === 'lancar' ? 'asetLancarLainnya' : 'asetTidakLancar';
  }
  if (c.group === 'kewajiban') return c.bucket === 'lancar' ? 'kewajibanLancar' : 'kewajibanJangkaPanjang';
  if (c.group === 'ekuitas') return 'ekuitas';
  if (c.group === 'pendapatan') return c.bucket === 'inti' ? 'pendapatan' : 'pendapatanLainnya';
  if (c.group === 'beban') {
    if (c.bucket === 'hpp') return 'hpp';
    if (c.bucket === 'pajak') return 'pajakPenghasilan';
    if (c.bucket === 'lainnya') return 'bebanLainnya';
    return 'bebanOperasional';
  }
  return 'takDikenali';
}

/**
 * Mengelompokkan daftar akun mentah Buku Besar berdasarkan klasifikasi
 * yang sama dipakai untuk menurunkan Neraca/Laba Rugi. Tiap akun tetap
 * menyimpan indeks aslinya (_idx) di array accounts supaya baris yang
 * diklik pada tampilan berkelompok ini tetap bisa dicocokkan ke
 * activeLedgerAccounts untuk menampilkan rincian transaksinya.
 */
function groupLedgerAccountsByClassification(accounts) {
  const groups = {};
  accounts.forEach((a, idx) => {
    const key = ledgerGroupKey(a.code, a.name);
    if (!groups[key]) groups[key] = [];
    groups[key].push({ ...a, _idx: idx });
  });
  return LEDGER_GROUP_ORDER
    .map(g => ({ ...g, accounts: groups[g.key] || [] }))
    .filter(g => g.accounts.length > 0);
}

/**
 * Mengubah daftar akun Buku Besar menjadi objek Neraca & Laba Rugi siap
 * pakai untuk perhitungan rasio, memakai kategori dari
 * classifyLedgerAccount di atas.
 */
// ---------- Pemecahan Buku Besar untuk penyimpanan (chunking) ----------
// Dokumen Firestore dibatasi maksimal 1.048.576 byte. Daftar akun mentah
// Buku Besar (lengkap dengan rincian tiap transaksi per akun) untuk
// perusahaan dengan banyak transaksi (mis. impor tahunan) bisa jauh
// melebihi itu kalau disimpan sebagai satu field. Fungsi-fungsi di bawah
// memecah daftar akun jadi beberapa "potongan" (dokumen) yang masing-
// masing tetap jauh di bawah batas tersebut — dan bila satu akun SAJA
// sudah melebihi budget (akun dengan transaksi sangat banyak, mis. akun
// Kas), akun itu ikut dipecah jadi beberapa bagian, ditandai _acctIdx
// (indeks akun asli) & _partIdx (urutan bagian) supaya bisa disatukan
// kembali persis seperti semula saat dibaca (lihat mergeLedgerPieces).
const LEDGER_CHUNK_BYTE_BUDGET = 700000; // jauh di bawah batas 1.048.576 byte/dokumen Firestore

function byteSizeOf(value) {
  return new Blob([JSON.stringify(value)]).size;
}

function splitLedgerAccountForStorage(account, acctIdx) {
  const base = { code: account.code, name: account.name, saldoAwal: account.saldoAwal || 0, saldoAkhir: account.saldoAkhir || 0 };
  const whole = { ...base, transaksi: account.transaksi || [], _acctIdx: acctIdx, _partIdx: 0 };
  if (byteSizeOf(whole) <= LEDGER_CHUNK_BYTE_BUDGET) return [whole];

  // Akun ini sendirian sudah melebihi budget -> pecah daftar transaksinya
  // jadi beberapa bagian, masing-masing tetap membawa data akun (kode,
  // nama, saldo) supaya tiap bagian tetap bisa berdiri sendiri.
  const parts = [];
  let current = [];
  (account.transaksi || []).forEach((t) => {
    current.push(t);
    if (byteSizeOf({ ...base, transaksi: current }) > LEDGER_CHUNK_BYTE_BUDGET) {
      const last = current.pop();
      if (current.length) parts.push(current);
      current = last ? [last] : [];
    }
  });
  if (current.length) parts.push(current);
  if (parts.length === 0) parts.push([]); // akun tanpa transaksi tapi field lain tetap besar (jarang terjadi)
  return parts.map((transaksi, i) => ({ ...base, transaksi, _acctIdx: acctIdx, _partIdx: i }));
}

/** Mengelompokkan seluruh akun jadi beberapa dokumen (chunk) untuk disimpan. */
function chunkLedgerPieces(accounts) {
  const allPieces = (accounts || []).flatMap((a, idx) => splitLedgerAccountForStorage(a, idx));
  const chunks = [];
  let current = [];
  allPieces.forEach((piece) => {
    current.push(piece);
    if (byteSizeOf(current) > LEDGER_CHUNK_BYTE_BUDGET) {
      const last = current.pop();
      if (current.length) chunks.push(current);
      current = [last];
    }
  });
  if (current.length) chunks.push(current);
  return chunks;
}

/** Menyatukan kembali potongan-potongan akun (dari beberapa dokumen chunk) menjadi daftar akun utuh seperti semula. */
function mergeLedgerPieces(pieces) {
  const byAccount = {};
  (pieces || []).forEach((p) => {
    if (!byAccount[p._acctIdx]) byAccount[p._acctIdx] = [];
    byAccount[p._acctIdx].push(p);
  });
  return Object.keys(byAccount)
    .map(Number)
    .sort((a, b) => a - b)
    .map((idx) => {
      const parts = byAccount[idx].sort((a, b) => a._partIdx - b._partIdx);
      const first = parts[0];
      return {
        code: first.code,
        name: first.name,
        saldoAwal: first.saldoAwal,
        saldoAkhir: parts[parts.length - 1].saldoAkhir,
        transaksi: parts.flatMap((p) => p.transaksi)
      };
    });
}

function deriveStatementsFromLedgerAccounts(accounts) {
  const neraca = {
    kasSetaraKas: 0, persediaan: 0, asetLancarLainnya: 0,
    totalAsetLancar: 0, totalAsetTidakLancar: 0, totalAset: 0,
    totalKewajibanLancar: 0, totalKewajibanJangkaPanjang: 0, totalKewajiban: 0,
    totalEkuitas: 0
  };
  const labaRugi = {
    pendapatan: 0, hpp: 0, labaKotor: 0,
    bebanOperasional: 0, labaOperasional: 0,
    pendapatanLainnya: 0, bebanLainnya: 0, pajakPenghasilan: 0,
    labaBersih: 0
  };
  // Melacak akun-akun buku besar mana saja yang menyusun tiap baris
  // Neraca/Laba Rugi di atas — dipakai di pratinjau impor supaya pengguna
  // bisa mengecek kesesuaian transaksi per baris (bukan hanya angka akhir).
  const contributions = {};
  const addContribution = (field, account, amount) => {
    if (!contributions[field]) contributions[field] = [];
    contributions[field].push({
      code: account.code,
      name: account.name,
      saldoAwal: account.saldoAwal || 0,
      saldoAkhir: account.saldoAkhir || 0,
      amount,
      transaksi: account.transaksi || []
    });
  };
  const unrecognized = [];
  // Akumulasi Saldo Awal akun Pendapatan/Beban yang seharusnya sudah
  // "ditutup" (dinolkan) ke Ekuitas/Laba Ditahan pada akhir periode
  // sebelumnya oleh software akuntansi asal, tapi ternyata masih terbawa
  // di Buku Besar yang diimpor (lihat catatan panjang di atas
  // penyesuaianSaldoAwalLabaRugi di bawah).
  let penyesuaianSaldoAwalLabaRugi = 0;

  accounts.forEach(a => {
    const c = classifyLedgerAccount(a.code, a.name);
    const akhir = a.saldoAkhir || 0;
    const mutasi = (a.saldoAkhir || 0) - (a.saldoAwal || 0);

    if (c.group === 'aset') {
      if (c.field === 'kasSetaraKas') { neraca.kasSetaraKas += akhir; addContribution('kasSetaraKas', a, akhir); }
      else if (c.field === 'persediaan') { neraca.persediaan += akhir; addContribution('persediaan', a, akhir); }
      else if (c.bucket === 'lancar') { neraca.asetLancarLainnya += akhir; addContribution('asetLancarLainnya', a, akhir); }
      if (c.bucket === 'lancar') { neraca.totalAsetLancar += akhir; }
      else { neraca.totalAsetTidakLancar += akhir; addContribution('totalAsetTidakLancar', a, akhir); }
    } else if (c.group === 'kewajiban') {
      if (c.bucket === 'lancar') { neraca.totalKewajibanLancar += akhir; addContribution('totalKewajibanLancar', a, akhir); }
      else { neraca.totalKewajibanJangkaPanjang += akhir; addContribution('totalKewajibanJangkaPanjang', a, akhir); }
    } else if (c.group === 'ekuitas') {
      neraca.totalEkuitas += akhir;
      addContribution('totalEkuitas', a, akhir);
    } else if (c.group === 'pendapatan') {
      if (c.bucket === 'inti') { labaRugi.pendapatan += mutasi; addContribution('pendapatan', a, mutasi); }
      else { labaRugi.pendapatanLainnya += mutasi; addContribution('pendapatanLainnya', a, mutasi); }
      if (a.saldoAwal) {
        // Saldo Awal akun Pendapatan (kredit) yang belum ditutup -> menambah Ekuitas.
        penyesuaianSaldoAwalLabaRugi += a.saldoAwal;
        addContribution('penyesuaianSaldoAwalLabaRugi', a, a.saldoAwal);
      }
    } else if (c.group === 'beban') {
      if (c.bucket === 'hpp') { labaRugi.hpp += mutasi; addContribution('hpp', a, mutasi); }
      else if (c.bucket === 'operasional') { labaRugi.bebanOperasional += mutasi; addContribution('bebanOperasional', a, mutasi); }
      else if (c.bucket === 'lainnya') { labaRugi.bebanLainnya += mutasi; addContribution('bebanLainnya', a, mutasi); }
      else if (c.bucket === 'pajak') { labaRugi.pajakPenghasilan += mutasi; addContribution('pajakPenghasilan', a, mutasi); }
      if (a.saldoAwal) {
        // Saldo Awal akun Beban (debit) yang belum ditutup -> mengurangi Ekuitas.
        penyesuaianSaldoAwalLabaRugi -= a.saldoAwal;
        addContribution('penyesuaianSaldoAwalLabaRugi', a, -a.saldoAwal);
      }
    } else {
      unrecognized.push(`${a.code ? '(' + a.code + ') ' : ''}${a.name}`);
    }
  });

  neraca.totalAset = neraca.totalAsetLancar + neraca.totalAsetTidakLancar;
  neraca.totalKewajiban = neraca.totalKewajibanLancar + neraca.totalKewajibanJangkaPanjang;

  labaRugi.labaKotor = labaRugi.pendapatan - labaRugi.hpp;
  labaRugi.labaOperasional = labaRugi.labaKotor - labaRugi.bebanOperasional;
  labaRugi.labaBersih = labaRugi.labaOperasional + labaRugi.pendapatanLainnya - labaRugi.bebanLainnya - labaRugi.pajakPenghasilan;

  const warnings = [];
  if (unrecognized.length) {
    warnings.push(`Kode akun berikut tidak dikenali kategorinya sehingga dilewati dari Neraca/Laba Rugi (kode akun harus diawali 1-9): ${unrecognized.join(', ')}.`);
  }
  // Akun Pendapatan/Beban seharusnya bersaldo 0 di awal periode (akun
  // sementara yang ditutup ke Laba Ditahan tiap tutup buku). Kalau Buku
  // Besar yang diimpor ternyata masih membawa Saldo Awal pada akun
  // semacam itu (biasanya karena belum sempat ditutup di software
  // akuntansi asal pada periode sebelumnya), angka itu tidak pernah
  // masuk ke Neraca sama sekali (bukan Aset/Kewajiban/Ekuitas, dan
  // Laba Rugi periode ini sengaja hanya menghitung MUTASI-nya supaya
  // tidak dobel-hitung) — akibatnya Total Aset jadi tidak sama dengan
  // Total Kewajiban + Total Ekuitas. Di sinilah otomatis "ditutup" ke
  // Ekuitas (baris "Penyesuaian Saldo Awal Akun Laba Rugi") supaya
  // Neraca balance persis sesuai data yang diimpor, tanpa mengubah
  // angka Laba Rugi tahun berjalan.
  if (penyesuaianSaldoAwalLabaRugi !== 0) {
    neraca.penyesuaianSaldoAwalLabaRugi = penyesuaianSaldoAwalLabaRugi;
    warnings.push(`Ditemukan akun Pendapatan/Beban dengan Saldo Awal yang belum ditutup ke Ekuitas di software akuntansi asal (lihat baris "Penyesuaian Saldo Awal Akun Laba Rugi" pada Neraca) — otomatis disesuaikan sebesar ${formatIDR(penyesuaianSaldoAwalLabaRugi)} ke Ekuitas supaya Total Aset tetap sama dengan Total Kewajiban + Total Ekuitas.`);
  }

  return { neraca, labaRugi, warnings, contributions };
}

// ---------- Arus Kas Metode Langsung (diturunkan dari Buku Besar) ----------
// v30 — PERBAIKAN STRUKTURAL: pendekatan v11-v29 menebak kategori Arus
// Kas dari KATA KUNCI pada kolom Keterangan transaksi akun Kas & Setara
// Kas (mis. kata "peralatan" -> dianggap Investasi), karena Buku Besar
// tidak membawa info akun lawan per transaksi. Pendekatan itu gampang
// salah tebak (mis. kata "peralatan" vs "perlengkapan" — mirip tapi beda
// makna akuntansi) sehingga hasilnya bisa beda dari Laporan Arus Kas asli
// software akuntansi sumber Buku Besar.
//
// Pendekatan baru TIDAK PERLU menebak sama sekali dan TIDAK PERLU data
// tambahan apa pun di luar yang sudah ada di Buku Besar: karena pembukuan
// berpasangan (double-entry), identitas akuntansi dasar (Total Debit =
// Total Kredit di seluruh Buku Besar) memastikan MUTASI (Saldo Akhir -
// Saldo Awal) SELURUH akun SELAIN Kas & Setara Kas — dijumlahkan dengan
// tanda sesuai posisi normalnya masing-masing (lihat arusKasPosForAccount
// & debitNormal di bawah) — SELALU persis sama dengan mutasi akun Kas &
// Setara Kas itu sendiri. Ini otomatis balance TANPA SISA, dan hasilnya
// cocok 1:1 dengan Laporan Arus Kas asli software akuntansi sumber (jenis
// akun 1=Aset, 2=Kewajiban, 3=Ekuitas, 4=Pendapatan, 5=HPP,
// 6=Beban Operasional, 7=Pendapatan Lainnya, 8=Beban Lainnya,
// 9=Beban Pajak, sesuai skema kode akun yang sama dipakai
// classifyLedgerAccount untuk Neraca & Laba Rugi).
const ARUS_KAS_ACTIVITY_LABELS = {
  operasi: 'Aktivitas Operasi', investasi: 'Aktivitas Investasi', pendanaan: 'Aktivitas Pendanaan'
};

// Memetakan hasil classifyLedgerAccount ke satu pos Arus Kas: `key` unik
// dalam aktivitas terkait, `label` tampilan, `activity` kelompoknya, dan
// `debitNormal` — true untuk akun bersaldo normal Debit (Aset & Beban:
// mutasi NAIK berarti kas KELUAR, jadi tandanya dibalik saat dijadikan
// dampak kas), false untuk akun bersaldo normal Kredit (Kewajiban,
// Ekuitas & Pendapatan: mutasi NAIK berarti kas MASUK, tanda dipakai apa
// adanya). Return null untuk akun Kas & Setara Kas sendiri (bukan pos
// Arus Kas, karena itu yang dihitung dampaknya) atau kode akun di luar
// 1-9 (tidak dikenali — sudah diperingatkan terpisah di
// deriveStatementsFromLedgerAccounts).
// Pengecualian khusus: akun (Laba)/Rugi Pelepasan Aset Tetap pada
// kelompok Pendapatan Lainnya/Beban Lainnya (kode 7/8) secara substansi
// akuntansi (PSAK 2/IAS 7) termasuk Aktivitas Investasi, bukan Operasi
// — karena satu paket dengan transaksi pelepasan aset tetap itu sendiri.
// Deteksi berdasarkan nama akun "pelepasan aset tetap" saja (pola yang
// tidak ambigu), BUKAN pendekatan tebak-tebakan kata kunci umum seperti
// pada versi lama (lihat catatan panjang soal itu di atas
// deriveArusKasLangsungFromLedger).
const PELEPASAN_ASET_TETAP_RE = /pelepasan aset tetap/;

// Pengecualian khusus: akun Kewajiban yang namanya berpola "Hutang
// Pendanaan - ..." (mis. "Hutang Pendanaan - PT", "Hutang Pendanaan -
// Pak", "Hutang Pendanaan - Bank") adalah utang berbunga/pinjaman untuk
// pendanaan (dari pemegang saham, pihak berelasi, PT lain, atau bank) —
// BUKAN hutang usaha/dagang biasa — sehingga secara akuntansi termasuk
// Aktivitas Pendanaan pada Arus Kas, TERLEPAS dari jangka waktunya
// (pendek/panjang). Sengaja HANYA memengaruhi klasifikasi Arus Kas di
// sini, TIDAK mengubah bucket 'lancar'/'jangkaPanjang' pada
// classifyLedgerAccount — supaya penyajian Kewajiban Lancar vs Jangka
// Panjang di Neraca (dan Current Ratio) tetap mengikuti jangka waktu
// aslinya, bukan ikut disamakan jadi Jangka Panjang.
const HUTANG_PENDANAAN_RE = /hutang pendanaan/;

function arusKasPosForAccount(code, name) {
  const c = classifyLedgerAccount(code, name);
  if (c.group === 'aset') {
    if (c.field === 'kasSetaraKas') return null;
    if (c.bucket === 'tidakLancar') return { key: 'asetTetap', label: 'Perolehan/Penjualan Aset Tetap', activity: 'investasi', debitNormal: true };
    return { key: 'asetLancarLainnya', label: 'Perubahan Aset Lancar Lainnya (Piutang, Persediaan, dsb.)', activity: 'operasi', debitNormal: true };
  }
  if (c.group === 'kewajiban') {
    if (c.bucket === 'jangkaPanjang' || HUTANG_PENDANAAN_RE.test(normalizeKey(name))) return { key: 'pinjaman', label: 'Penerimaan/Pembayaran Pinjaman', activity: 'pendanaan', debitNormal: false };
    return { key: 'hutangLancar', label: 'Perubahan Hutang & Liabilitas Jangka Pendek', activity: 'operasi', debitNormal: false };
  }
  if (c.group === 'ekuitas') return { key: 'modal', label: 'Setoran/Penarikan Modal Pemilik', activity: 'pendanaan', debitNormal: false };
  if (c.group === 'pendapatan') {
    if (c.bucket === 'inti') return { key: 'pendapatan', label: 'Penerimaan dari Pelanggan', activity: 'operasi', debitNormal: false };
    if (PELEPASAN_ASET_TETAP_RE.test(normalizeKey(name))) return { key: 'asetTetap', label: 'Perolehan/Penjualan Aset Tetap', activity: 'investasi', debitNormal: false };
    return { key: 'pendapatanLainnya', label: 'Pendapatan Lainnya', activity: 'operasi', debitNormal: false };
  }
  if (c.group === 'beban') {
    if (c.bucket === 'hpp') return { key: 'hpp', label: 'Pembayaran Harga Pokok Penjualan (HPP)', activity: 'operasi', debitNormal: true };
    if (c.bucket === 'lainnya') {
      if (PELEPASAN_ASET_TETAP_RE.test(normalizeKey(name))) return { key: 'asetTetap', label: 'Perolehan/Penjualan Aset Tetap', activity: 'investasi', debitNormal: true };
      return { key: 'bebanLainnya', label: 'Pembayaran Beban Lainnya', activity: 'operasi', debitNormal: true };
    }
    if (c.bucket === 'pajak') return { key: 'pajak', label: 'Pembayaran Pajak Penghasilan', activity: 'operasi', debitNormal: true };
    return { key: 'bebanOperasional', label: 'Pembayaran Beban Operasional', activity: 'operasi', debitNormal: true };
  }
  return null;
}

// Urutan tampilan pos Arus Kas dalam tiap kelompok aktivitas.
const ARUS_KAS_POS_ORDER = ['pendapatan', 'pendapatanLainnya', 'hutangLancar', 'asetLancarLainnya', 'hpp', 'bebanOperasional', 'bebanLainnya', 'pajak', 'asetTetap', 'pinjaman', 'modal'];

/**
 * Menurunkan Laporan Arus Kas Metode Langsung dari mutasi (Saldo Akhir -
 * Saldo Awal) seluruh akun Buku Besar SELAIN Kas & Setara Kas. Lihat
 * catatan panjang di atas untuk penjelasan pendekatannya.
 */
function deriveArusKasLangsungFromLedger(accounts) {
  const cashAccounts = (accounts || []).filter(a => classifyLedgerAccount(a.code, a.name).field === 'kasSetaraKas');
  const otherAccounts = (accounts || []).filter(a => classifyLedgerAccount(a.code, a.name).field !== 'kasSetaraKas');

  const buckets = {};
  const ensureBucket = (pos) => {
    if (!buckets[pos.key]) buckets[pos.key] = { key: pos.key, label: pos.label, activity: pos.activity, masuk: 0, keluar: 0, items: [] };
    return buckets[pos.key];
  };

  otherAccounts.forEach(acc => {
    const pos = arusKasPosForAccount(acc.code, acc.name);
    if (!pos) return;
    const mutasi = (acc.saldoAkhir || 0) - (acc.saldoAwal || 0);
    if (!mutasi) return; // tidak ada perubahan saldo -> tidak ada dampak kas dari akun ini
    const dampakKas = pos.debitNormal ? -mutasi : mutasi;
    if (!dampakKas) return;

    const bucket = ensureBucket(pos);
    if (dampakKas > 0) bucket.masuk += dampakKas; else bucket.keluar += -dampakKas;
    // Rincian per pos di sini berupa AKUN kontributor (bukan transaksi kas
    // individual seperti pendekatan lama), karena angkanya berasal dari
    // mutasi Saldo Awal -> Saldo Akhir akun tsb, bukan baris transaksi
    // tunggal. Field debit/kredit dipakai ulang di tampilan (lihat
    // arusKasLangsungItemsHtml) supaya kartu UI yang sudah ada tetap
    // bekerja tanpa perubahan.
    bucket.items.push({
      tanggal: null,
      keterangan: acc.name,
      akun: acc.code || '',
      debit: dampakKas > 0 ? dampakKas : 0,
      kredit: dampakKas < 0 ? -dampakKas : 0
    });
  });

  const byActivity = (activity) => {
    const list = Object.entries(buckets).filter(([, b]) => b.activity === activity);
    return sortEntriesByOrder(list, ARUS_KAS_POS_ORDER).map(([, b]) => b);
  };

  const kasAwal = cashAccounts.reduce((s, a) => s + (a.saldoAwal || 0), 0);
  const kasAkhir = cashAccounts.reduce((s, a) => s + (a.saldoAkhir || 0), 0);
  const netOf = (activity) => Object.values(buckets).filter(b => b.activity === activity).reduce((s, b) => s + b.masuk - b.keluar, 0);
  const totalOperasi = netOf('operasi'), totalInvestasi = netOf('investasi'), totalPendanaan = netOf('pendanaan');
  const kenaikanKasBersih = totalOperasi + totalInvestasi + totalPendanaan;

  const warnings = [];
  if (cashAccounts.length === 0) {
    warnings.push('Tidak ditemukan akun Kas/Bank (kode akun 1, nama mengandung "kas"/"bank") pada Buku Besar, sehingga Laporan Arus Kas Metode Langsung tidak dapat diturunkan.');
  } else {
    const selisih = (kasAwal + kenaikanKasBersih) - kasAkhir;
    if (Math.abs(selisih) > 1) {
      warnings.push(`Terdapat selisih ${formatIDR(selisih)} antara hasil perhitungan Kas Akhir pada Arus Kas dan saldo akhir akun Kas/Bank — kemungkinan ada kode akun pada Buku Besar yang tidak dikenali (di luar awalan 1-9) sehingga mutasinya tidak ikut dihitung.`);
    }
  }

  return {
    kasAwal, kasAkhir, kenaikanKasBersih,
    totalOperasi, totalInvestasi, totalPendanaan,
    rincian: { operasi: byActivity('operasi'), investasi: byActivity('investasi'), pendanaan: byActivity('pendanaan') },
    warnings
  };
}

// ---------- Laporan Perubahan Modal (diturunkan dari Buku Besar) ----------
// Akun Ekuitas pada Buku Besar (kode akun 3) umumnya hanya berisi
// modal/setoran pemilik — BELUM termasuk laba/rugi periode berjalan
// (lihat catatan di atas withRetainedEarnings untuk Neraca). Laporan
// Perubahan Modal berikut merekonsiliasi mutasi Modal Disetor selama
// periode (Saldo Awal -> Saldo Akhir akun Ekuitas) dengan Setoran Modal
// Pemilik & Penarikan Modal Pemilik/Dividen yang sudah diklasifikasikan
// dari mutasi akun Ekuitas (pos "modal" pada arusKasPosForAccount /
// deriveArusKasLangsungFromLedger), lalu menambahkan Laba Bersih periode
// berjalan supaya diperoleh Total Ekuitas Akhir Periode.
function derivePerubahanModalFromLedger(accounts, arusKas, labaBersih, penyesuaianSaldoAwalLabaRugi) {
  const equityAccounts = (accounts || []).filter(a => classifyLedgerAccount(a.code, a.name).group === 'ekuitas');
  const modalDisetorAwal = equityAccounts.reduce((s, a) => s + (a.saldoAwal || 0), 0);
  const modalDisetorAkhir = equityAccounts.reduce((s, a) => s + (a.saldoAkhir || 0), 0);

  const pendanaan = (arusKas && arusKas.rincian && arusKas.rincian.pendanaan) || [];
  const modalBucket = pendanaan.find(b => b.key === 'modal');
  const setoranModal = modalBucket ? modalBucket.masuk : 0;
  const penarikanModal = modalBucket ? modalBucket.keluar : 0;

  const labaBersihPeriode = labaBersih || 0;
  // Ikut memasukkan penyesuaian Saldo Awal akun Laba Rugi yang belum
  // ditutup (lihat deriveStatementsFromLedgerAccounts) supaya Total
  // Ekuitas Akhir di sini konsisten dengan Total Ekuitas pada Neraca.
  const penyesuaian = penyesuaianSaldoAwalLabaRugi || 0;
  const totalEkuitasAkhir = modalDisetorAkhir + labaBersihPeriode + penyesuaian;

  const warnings = [];
  if (equityAccounts.length === 0) {
    warnings.push('Tidak ditemukan akun Ekuitas (kode akun 3) pada Buku Besar, sehingga Laporan Perubahan Modal tidak dapat diturunkan.');
  } else {
    const selisih = (modalDisetorAwal + setoranModal - penarikanModal) - modalDisetorAkhir;
    if (Math.abs(selisih) > 1) {
      warnings.push(`Terdapat selisih ${formatIDR(selisih)} antara mutasi akun Ekuitas dan hasil klasifikasi Setoran/Penarikan Modal pada Arus Kas — kemungkinan ada mutasi akun Ekuitas yang tidak melalui kas (mis. penyesuaian non-kas).`);
    }
  }

  return { modalDisetorAwal, setoranModal, penarikanModal, modalDisetorAkhir, labaBersihPeriode, penyesuaianSaldoAwalLabaRugi: penyesuaian, totalEkuitasAkhir, warnings };
}

// Melengkapi Laporan Perubahan Modal dengan Laba Ditahan Awal Periode &
// Saldo Ekuitas termasuk laba ditahan — sama seperti withRetainedEarnings
// untuk Neraca, dipakai di Detail Perusahaan yang punya akses ke seluruh
// riwayat periode (tidak tersedia di layar Pratinjau Impor satu periode).
function withPerubahanModal(modal, neracaDisplay) {
  if (!modal || !neracaDisplay) return modal;
  const periodeIni = neracaDisplay.pendapatanPeriodeIni || 0;
  // neracaDisplay.pendapatanSampaiTahunLalu SUDAH menggabungkan
  // penyesuaianSaldoAwalLabaRugi (lihat withRetainedEarnings pada Neraca) —
  // jadi di sini TIDAK perlu menambahkan modal.penyesuaianSaldoAwalLabaRugi
  // lagi, supaya tidak dobel hitung. labaDitahanAwal & totalEkuitasAkhir
  // otomatis ikut memasukkan penyesuaian tsb lewat sampaiTahunLalu.
  const sampaiTahunLalu = neracaDisplay.pendapatanSampaiTahunLalu || 0;
  const labaDitahanAwal = sampaiTahunLalu + (periodeIni - modal.labaBersihPeriode);
  return {
    ...modal,
    labaDitahanAwal,
    saldoAwalEkuitas: modal.modalDisetorAwal + labaDitahanAwal,
    totalEkuitasAkhirTermasukLabaDitahan: modal.modalDisetorAkhir + periodeIni + sampaiTahunLalu
  };
}

/**
 * Merekonstruksi klasifikasi (contributions) dari daftar akun Buku Besar
 * yang SUDAH tersimpan di Firestore (statement.bukuBesar) — dipakai di
 * halaman Detail Perusahaan supaya tampilan klasifikasi + rincian transaksi
 * yang bisa diklik tetap tersedia setelah data disimpan, bukan cuma sesaat
 * di layar pratinjau impor.
 */
function contributionsFromLedger(accounts) {
  if (!Array.isArray(accounts) || accounts.length === 0) return null;
  return deriveStatementsFromLedgerAccounts(accounts).contributions;
}

/**
 * Membaca satu sheet Buku Besar hasil export software akuntansi (format
 * per akun: baris nama akun, baris "Saldo Awal", baris-baris transaksi,
 * baris "Ending Balance") dan mengembalikan nama perusahaan, periode,
 * daftar akun mentah (untuk referensi/audit), serta Neraca & Laba Rugi
 * yang sudah diturunkan otomatis.
 */
function parseBukuBesarSheet(sheet) {
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });

  let companyName = '';
  let dateText = '';
  let headerRowIdx = -1;
  for (let i = 0; i < Math.min(rows.length, 15); i++) {
    const label = normalizeKey(rows[i][0]);
    if (i === 0 && rows[i][0]) companyName = String(rows[i][0]).trim();
    if (!dateText && parseIndoDate(String(rows[i][0]).split(/\s*-\s*/)[0])) dateText = String(rows[i][0]).trim();
    if (label === 'nama akun / tanggal') { headerRowIdx = i; break; }
  }
  if (headerRowIdx === -1) {
    throw new Error('File tidak dikenali sebagai Buku Besar. Pastikan file adalah hasil export Buku Besar apa adanya (berkolom "Nama Akun / Tanggal, Transaksi, Nomor, Keterangan, Debit, Kredit, Saldo").');
  }
  if (!dateText) {
    throw new Error('Tidak menemukan rentang tanggal periode pada Buku Besar.');
  }
  const period = derivePeriodFromDateText(dateText);
  if (!period) {
    throw new Error(`Format tanggal "${dateText}" pada Buku Besar tidak dikenali.`);
  }

  const accounts = [];
  let current = null;
  for (let i = headerRowIdx + 1; i < rows.length; i++) {
    const row = rows[i];
    const a = row[0], b = row[1], d = row[3], g = row[6];
    const isBlank = (v) => v === '' || v === null || v === undefined;

    if (!isBlank(a) && isBlank(b) && isBlank(row[2]) && isBlank(d) && isBlank(row[4]) && isBlank(row[5]) && isBlank(g)) {
      // Baris nama akun -> mulai akun baru
      const { code, name } = parseLedgerAccountLabel(a);
      current = { code, name, saldoAwal: null, saldoAkhir: null, transaksi: [] };
      accounts.push(current);
      continue;
    }
    if (!current) continue;
    if (isBlank(a) && !isBlank(d) && normalizeKey(d).includes('ending balance')) {
      current.saldoAkhir = toNumberOrNull(g) || 0;
      continue;
    }
    if (!isBlank(b) && normalizeKey(b) === 'saldo awal') {
      current.saldoAwal = toNumberOrNull(g) || 0;
      continue;
    }
    // Baris transaksi individual milik akun yang sedang berjalan (current) —
    // disimpan supaya bisa ditampilkan sebagai rincian saat akun diklik.
    if (!isBlank(a)) {
      current.transaksi.push({
        tanggal: String(a).trim(),
        keterangan: String(d || b || '').trim(),
        debit: toNumberOrNull(row[4]) || 0,
        kredit: toNumberOrNull(row[5]) || 0
      });
    }
  }
  // Akun tanpa baris "Saldo Awal" eksplisit (baru dibuka periode ini) -> 0.
  accounts.forEach(acc => {
    if (acc.saldoAwal === null) acc.saldoAwal = 0;
    if (acc.saldoAkhir === null) acc.saldoAkhir = acc.saldoAwal;
  });

  const derived = deriveStatementsFromLedgerAccounts(accounts);
  const arusKas = deriveArusKasLangsungFromLedger(accounts);
  const perubahanModal = derivePerubahanModalFromLedger(accounts, arusKas, derived.labaRugi.labaBersih, derived.neraca.penyesuaianSaldoAwalLabaRugi);

  return {
    companyName,
    period,
    accounts,
    neraca: derived.neraca,
    labaRugi: derived.labaRugi,
    arusKas,
    perubahanModal,
    warnings: derived.warnings.concat(arusKas.warnings, perubahanModal.warnings),
    contributions: derived.contributions
  };
}

/**
 * Membaca satu sheet laporan (Neraca atau Laba Rugi) hasil export
 * software akuntansi: mengenali nama perusahaan, tanggal/periode, judul
 * seksi, akun header/sub-akun (dari indentasi kolom A), dan baris total —
 * lalu memetakannya ke field standar yang dipakai perhitungan rasio.
 */
function parseAccountingReportSheet(sheet, statementKey) {
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
  const expected = REPORT_TYPE_LABELS[statementKey] || statementKey;
  const knownLabels = Object.values(REPORT_TYPE_LABELS);

  // Guard: file ini sebenarnya hasil export Buku Besar (General Ledger),
  // bukan laporan ringkas Neraca/Laba Rugi/Arus Kas. Tanpa pemeriksaan ini,
  // parser di bawah bisa "berhasil" membaca sebagian kolom (mis. kolom
  // "Nomor" transaksi salah terbaca sebagai nilai akun) dan menghasilkan
  // angka yang keliru tanpa peringatan — jadi lebih aman ditolak sejak awal.
  for (let i = 0; i < Math.min(rows.length, 10); i++) {
    const label = normalizeKey(rows[i][0]);
    if (label === 'buku besar' || label === 'nama akun / tanggal') {
      throw new Error('File ini terdeteksi sebagai hasil export Buku Besar (General Ledger), bukan laporan ringkas. Pilih jenis data "Buku Besar" pada langkah 2 di atas, lalu unggah ulang file ini.');
    }
  }

  let companyName = '';
  let reportTypeText = '';
  let dateText = '';
  for (let i = 0; i < Math.min(rows.length, 10); i++) {
    const label = normalizeKey(rows[i][0]);
    if (i === 0 && rows[i][0]) companyName = String(rows[i][0]).trim();
    if (!reportTypeText && knownLabels.includes(label)) reportTypeText = label;
    if (label === 'tanggal') {
      const vals = rows[i].slice(1).filter(v => v !== '' && v !== null && v !== undefined);
      if (vals.length) dateText = String(vals[vals.length - 1]).trim();
    }
  }
  // Sebagian laporan (mis. Arus Kas) tidak punya baris berlabel "Tanggal"
  // — tanggal/rentangnya tertulis langsung di baris ke-3 (persis di bawah
  // baris jenis laporan). Dipakai sebagai cadangan bila baris "Tanggal"
  // tidak ditemukan.
  if (!dateText && rows[2] && rows[2][0] && parseIndoDate(String(rows[2][0]).split(/\s*-\s*/)[0])) {
    dateText = String(rows[2][0]).trim();
  }
  if (reportTypeText && reportTypeText !== expected) {
    throw new Error(`File ini terbaca sebagai laporan "${cap(reportTypeText)}", bukan "${cap(expected)}". Pastikan Anda mengunggah laporan yang sesuai jenis data yang dipilih.`);
  }
  if (!dateText) {
    throw new Error('Tidak menemukan tanggal/periode pada laporan. Pastikan file adalah hasil export laporan apa adanya (strukturnya tidak diubah).');
  }
  const period = derivePeriodFromDateText(dateText);
  if (!period) {
    throw new Error(`Format tanggal "${dateText}" pada laporan tidak dikenali.`);
  }

  // Bangun daftar baris akun rata (flat) beserta level indentasinya.
  const entries = [];
  rows.forEach(row => {
    const rawCode = row[0];
    const name = row[1] !== undefined ? String(row[1]).trim() : '';
    const label = normalizeKey(rawCode);
    if (!label && !name) return;
    if (label === 'tanggal' || label === '(dalam idr)' || label === expected) return;
    entries.push({
      label,
      name,
      value: toNumberOrNull(row[2]),
      indent: leadingIndentWidth(rawCode),
      hasCode: /[0-9]/.test(label) && !!name
    });
  });

  // Tandai akun header: indent 0, diikuti baris akun dengan indent > 0.
  for (let i = 0; i < entries.length; i++) {
    const e = entries[i];
    if (!e.hasCode || e.indent > 0) continue;
    const next = entries[i + 1];
    e.isHeaderAccount = !!(next && next.hasCode && next.indent > e.indent);
  }

  const data = {};
  const matchers = TOTAL_MATCHERS[statementKey] || {};
  entries.forEach(e => {
    if (e.value === null) return;
    for (const field of Object.keys(matchers)) {
      if (!(field in data) && matchers[field](e.label)) data[field] = e.value;
    }
    // Kas/Bank & Persediaan (Neraca): hanya akun tingkat atas (indent 0)
    // yang diambil — bila akun itu adalah akun header, sub-akun di
    // bawahnya sudah termasuk di dalam nilainya (tidak dijumlah lagi).
    if (statementKey === 'neraca' && e.hasCode && e.indent === 0) {
      if (CASH_NAME_RE.test(e.name)) data.kasSetaraKas = (data.kasSetaraKas || 0) + e.value;
      else if (INVENTORY_NAME_RE.test(e.name) && !('persediaan' in data)) data.persediaan = e.value;
    }
  });

  const warnings = [];
  const missingTotals = Object.keys(matchers).filter(f => !(f in data));
  if (missingTotals.length) {
    warnings.push(`Baris berikut tidak ditemukan pada laporan sehingga sebagian rasio mungkin tidak akurat: ${missingTotals.join(', ')}.`);
  }
  if (statementKey === 'neraca' && !('kasSetaraKas' in data)) {
    warnings.push('Tidak menemukan akun kas/bank pada Aset Lancar — Cash Ratio mungkin tidak akurat.');
  }

  return { companyName, period, data, warnings };
}

// Registri jenis data yang bisa diimpor. Neraca, Laba Rugi, Arus Kas,
// & Perubahan Modal TIDAK diimpor terpisah lagi — keempatnya diturunkan
// otomatis dari satu-satunya jenis impor yang tersisa, Buku Besar (lihat
// deriveStatementsFromLedgerAccounts, deriveArusKasLangsungFromLedger,
// derivePerubahanModalFromLedger), supaya tidak ada dua sumber data yang
// bisa saling tidak sinkron untuk periode yang sama.
const IMPORT_TYPES = {
  bukuBesar: {
    label: 'Buku Besar',
    badge: 'purple',
    statementKey: 'bukuBesar',
    mode: 'bukuBesarLedger'
  }
};

/**
 * Parse satu file Excel (ArrayBuffer) yang berisi SATU jenis data saja
 * (Neraca, Laba Rugi, Arus Kas, atau Buku Besar — sesuai typeKey).
 * Melempar Error dengan pesan berbahasa Indonesia jika format tidak sesuai.
 */
function parseSingleTypeExcel(arrayBuffer, typeKey) {
  const type = IMPORT_TYPES[typeKey];
  if (!type) throw new Error('Jenis data impor tidak dikenali.');

  const workbook = XLSX.read(arrayBuffer, { type: 'array' });

  // ---- Neraca & Laba Rugi: laporan hasil export software akuntansi ----
  if (type.mode === 'accountingReport') {
    let lastError = null;
    for (const sheetName of workbook.SheetNames) {
      try {
        const parsed = parseAccountingReportSheet(workbook.Sheets[sheetName], type.statementKey);
        return {
          typeKey,
          typeLabel: type.label,
          badge: type.badge,
          statementKey: type.statementKey,
          companyName: parsed.companyName,
          period: parsed.period,
          data: parsed.data,
          warnings: parsed.warnings
        };
      } catch (err) {
        lastError = err;
      }
    }
    throw lastError || new Error(`File tidak dapat dibaca sebagai laporan ${type.label}.`);
  }

  // ---- Buku Besar: langsung dari hasil export software akuntansi ----
  if (type.mode === 'bukuBesarLedger') {
    let lastError = null;
    for (const sheetName of workbook.SheetNames) {
      try {
        const parsed = parseBukuBesarSheet(workbook.Sheets[sheetName]);
        return {
          typeKey,
          typeLabel: type.label,
          badge: type.badge,
          statementKey: type.statementKey,
          companyName: parsed.companyName,
          period: parsed.period,
          data: { ledger: parsed.accounts, neraca: parsed.neraca, labaRugi: parsed.labaRugi, arusKas: parsed.arusKas, perubahanModal: parsed.perubahanModal, contributions: parsed.contributions },
          warnings: parsed.warnings
        };
      } catch (err) {
        lastError = err;
      }
    }
    throw lastError || new Error('File tidak dapat dibaca sebagai Buku Besar.');
  }

  // ---- Arus Kas: masih memakai template Info + sheet khusus ----
  const sheetNames = workbook.SheetNames.map(n => n.toLowerCase());
  const infoName = workbook.SheetNames[sheetNames.findIndex(n => n.includes('info'))];
  const dataName = workbook.SheetNames[sheetNames.findIndex(n => type.sheetMatch(n))];

  if (!dataName) {
    throw new Error(`File harus memiliki sheet "${type.label}". Gunakan template impor ${type.label} yang disediakan (bukan file jenis lain).`);
  }

  const info = infoName ? readInfoSheet(workbook.Sheets[infoName]) : {};
  if (!info.year) {
    throw new Error('Sheet "Info" harus mencantumkan baris "Tahun" dengan nilai tahun laporan (contoh: 2025).');
  }
  const periodType = PERIOD_TYPE_MAP[info.periodTypeRaw] || 'tahunan';
  const periodIndex = inferPeriodIndex(periodType, info.periodLabel || '');

  let data, warnings = [];
  if (type.mode === 'ledger') {
    data = sheetToLedgerRows(workbook.Sheets[dataName]);
  } else {
    const result = sheetToKeyValue(workbook.Sheets[dataName], type.dictionary);
    data = result.data;
    warnings = result.unrecognized.map(a => `Akun tidak dikenali dan dilewati: "${a}"`);
  }

  return {
    typeKey,
    typeLabel: type.label,
    badge: type.badge,
    statementKey: type.statementKey,
    companyName: info.companyName || '',
    period: {
      year: info.year,
      periodType,
      periodIndex,
      periodLabel: info.periodLabel || `${periodType} ${periodIndex} ${info.year}`
    },
    data,
    warnings
  };
}


</script>
<script>
// ===== analysis.js =====
// =============================================================
// ANALYSIS.JS
// Perhitungan rasio keuangan dari satu objek statement
// (neraca + labaRugi). Semua fungsi aman terhadap pembagian 0.
// =============================================================

function safeDiv(a, b) {
  if (!b) return null;
  return a / b;
}

function computeRatios(statement) {
  const n = statement.neraca || {};
  const l = statement.labaRugi || {};

  const totalAsetLancar = n.totalAsetLancar || 0;
  const totalKewajibanLancar = n.totalKewajibanLancar || 0;
  const persediaan = n.persediaan || 0;
  const totalAset = n.totalAset || 0;
  const totalKewajiban = n.totalKewajiban || 0;
  const totalEkuitas = n.totalEkuitas || 0;
  const kasSetaraKas = n.kasSetaraKas || 0;

  const pendapatan = l.pendapatan || 0;
  const labaKotor = l.labaKotor || 0;
  const labaOperasional = l.labaOperasional || 0;
  const labaBersih = l.labaBersih || 0;

  return {
    likuiditas: {
      currentRatio: safeDiv(totalAsetLancar, totalKewajibanLancar),
      quickRatio: safeDiv(totalAsetLancar - persediaan, totalKewajibanLancar),
      cashRatio: safeDiv(kasSetaraKas, totalKewajibanLancar)
    },
    solvabilitas: {
      debtToAssetRatio: safeDiv(totalKewajiban, totalAset),
      debtToEquityRatio: safeDiv(totalKewajiban, totalEkuitas),
      equityMultiplier: safeDiv(totalAset, totalEkuitas)
    },
    profitabilitas: {
      grossProfitMargin: safeDiv(labaKotor, pendapatan),
      operatingMargin: safeDiv(labaOperasional, pendapatan),
      netProfitMargin: safeDiv(labaBersih, pendapatan),
      roa: safeDiv(labaBersih, totalAset),
      roe: safeDiv(labaBersih, totalEkuitas)
    }
  };
}

const RATIO_LABELS = {
  currentRatio: { label: 'Current Ratio', fmt: 'x', desc: 'Aset lancar dibagi kewajiban lancar. Idealnya > 1.5–2x.' },
  quickRatio: { label: 'Quick Ratio', fmt: 'x', desc: '(Aset lancar - persediaan) dibagi kewajiban lancar.' },
  cashRatio: { label: 'Cash Ratio', fmt: 'x', desc: 'Kas & setara kas dibagi kewajiban lancar.' },
  debtToAssetRatio: { label: 'Debt to Asset Ratio', fmt: '%', desc: 'Proporsi aset yang dibiayai utang. Makin rendah makin aman.' },
  debtToEquityRatio: { label: 'Debt to Equity Ratio', fmt: 'x', desc: 'Total kewajiban dibagi ekuitas.' },
  equityMultiplier: { label: 'Equity Multiplier', fmt: 'x', desc: 'Total aset dibagi ekuitas (tingkat leverage).' },
  grossProfitMargin: { label: 'Gross Profit Margin', fmt: '%', desc: 'Laba kotor dibagi pendapatan.' },
  operatingMargin: { label: 'Operating Margin', fmt: '%', desc: 'Laba operasional dibagi pendapatan.' },
  netProfitMargin: { label: 'Net Profit Margin', fmt: '%', desc: 'Laba bersih dibagi pendapatan.' },
  roa: { label: 'Return on Assets (ROA)', fmt: '%', desc: 'Laba bersih dibagi total aset.' },
  roe: { label: 'Return on Equity (ROE)', fmt: '%', desc: 'Laba bersih dibagi total ekuitas.' }
};

function formatRatio(value, fmt) {
  if (value === null || value === undefined || isNaN(value)) return '–';
  if (fmt === '%') return (value * 100).toFixed(1) + '%';
  return value.toFixed(2) + 'x';
}

</script>
<script>
// ===== app.js =====
// =============================================================
// APP.JS - Inti aplikasi Integrida
// =============================================================

const state = {
  user: null,
  companies: [],
  view: 'dashboard',
  compareCompanyIds: [],
  comparePeriodType: 'tahunan',
  reportView: 'compare', // tab aktif di menu Report: 'compare' atau 'ratios'
  ratioCompanyId: null,
  ratioStatementId: null,
  chartInstances: {},
  unsubCompanies: null,   // listener realtime daftar perusahaan (aktif sepanjang sesi)
  unsubData: null,        // listener realtime data view yang sedang aktif (dashboard/compare/ratios)
  companiesGridStatements: [], // cache statements semua perusahaan untuk progres impor di grid Perusahaan
  importCompanyId: null,
  importType: 'bukuBesar', // jenis data yang sedang dipilih di halaman Impor Data
  companyDetailId: null,      // perusahaan yang sedang dilihat rinciannya
  companyDetailPeriodId: null, // periode (statementId) yang sedang dipilih di halaman rincian
  upgradeItems: [],           // daftar poin checklist Upgrade Aplikasi (menu Setting)
  upgradeShowDone: false,     // true = tampilkan juga poin yang sudah dicentang (biasanya auto-hide)
  upgradeExpanded: {},        // itemId -> true jika keterangan panjang sedang ditampilkan penuh
  reminders: [],              // daftar pengingat/catatan tugas bebas (menu Kalender)
  dayOffDates: [],             // daftar tanggal (yyyy-mm-dd) yang ditandai Libur/Cuti/Sakit — lihat DB.watchDayOffDates & isDayOff()
  unsubDayOff: null,           // listener realtime khusus dayOffDates (terpisah dari unsubData supaya tidak bentrok dgn listener reminders di menu Kalender)
  onlineHolidays: null,        // cache hari libur nasional dari API online: {tanggal: nama} (null = belum berhasil dimuat, pakai fallback statis ID_HOLIDAYS_2026)
  calendarCursor: (() => { const d = new Date(); return { year: d.getFullYear(), month: d.getMonth() }; })(), // bulan yang sedang ditampilkan di grid kalender
  calendarSelectedDate: (() => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; })() // tanggal (YYYY-MM-DD) yang sedang dipilih; dipakai sbg default tanggal saat menambah pengingat baru lewat tombol "+"
};

// =============================================================
// SYNC — indikator status sinkronisasi lintas perangkat
// =============================================================
const SYNC_META = {
  connecting: { dot: '#9aa3b2', label: 'Menghubungkan…', pulse: true },
  synced:     { dot: '#2F6FE4', label: 'Tersinkron',      pulse: false },
  syncing:    { dot: '#C08A3E', label: 'Menyinkronkan…',  pulse: true },
  offline:    { dot: '#B5453B', label: 'Offline',         pulse: false }
};

const Sync = {
  sources: {},          // key -> { pendingWrites, fromCache }
  status: 'connecting',
  lastSyncedAt: null,

  report(key, meta) { this.sources[key] = meta; this.recompute(); },
  clear(key) { delete this.sources[key]; this.recompute(); },
  reset() { this.sources = {}; this.status = 'connecting'; this.lastSyncedAt = null; renderSyncBadge(); },

  recompute() {
    const metas = Object.values(this.sources);
    if (!navigator.onLine) {
      this.status = 'offline';
    } else if (metas.some(m => m.pendingWrites)) {
      this.status = 'syncing';
    } else if (metas.length > 0 && metas.every(m => m.fromCache)) {
      // Semua listener masih menyajikan data dari cache lokal
      // (misal koneksi ke server Firestore belum berhasil).
      this.status = 'offline';
    } else if (metas.length > 0) {
      this.status = 'synced';
      this.lastSyncedAt = new Date();
    }
    renderSyncBadge();

};
