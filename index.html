        </select>
      </div>
    </div>
    <div id="ratio-content"></div>
  `;
  document.getElementById('ratio-company').addEventListener('change', (e) => {
    state.ratioCompanyId = e.target.value;
    renderRatios(rootId);
  });

  // Listener realtime: analisis rasio otomatis diperbarui saat ada
  // periode baru yang diimpor dari perangkat manapun.
  state.unsubData = DB.watchStatements(state.ratioCompanyId, (rawStatements, meta) => {
    Sync.report('statements', meta);
    if (state.view !== 'report' || state.reportView !== 'ratios') return;
    const statements = rawStatements.sort((a, b) => a.year - b.year || a.periodIndex - b.periodIndex);
    paintRatios(statements);
  }, (err) => toast('Gagal memuat data laporan: ' + err.message, 'error'));
}

function paintRatios(statements) {
  const content = document.getElementById('ratio-content');
  if (!content) return;
  if (statements.length === 0) {
    content.innerHTML = `<div class="card" style="color:var(--slate);margin-top:16px;">Belum ada data laporan keuangan untuk perusahaan ini.</div>`;
    return;
  }
  const latest = statements[statements.length - 1];
  const ratios = computeRatios(latest);

  function ratioGroup(title, groupKey, badgeClass) {
    return `<div class="section-block">
      <div class="section-title"><span class="badge ${badgeClass}">${title}</span></div>
      <div class="grid grid-3">
        ${Object.entries(ratios[groupKey]).map(([key, val]) => `
          <div class="card kpi-card">
            <div class="kpi-label">${RATIO_LABELS[key].label}</div>
            <div class="kpi-value">${formatRatio(val, RATIO_LABELS[key].fmt)}</div>
            <div class="ratio-note" style="margin-top:2px;">${RATIO_LABELS[key].desc}</div>
          </div>
        `).join('')}
      </div>
    </div>`;
  }

  content.innerHTML = `
    <div style="margin:14px 0;color:var(--slate);font-size:13px;">Data periode terbaru: <strong>${latest.periodLabel}</strong></div>
    ${ratioGroup('Likuiditas', 'likuiditas', 'teal')}
    ${ratioGroup('Solvabilitas', 'solvabilitas', 'gold')}
    ${ratioGroup('Profitabilitas', 'profitabilitas', 'danger')}
    <div class="section-block">
      <div class="section-title">Tren Rasio Utama Antar Periode</div>
      <div class="chart-box"><canvas id="ratio-trend"></canvas></div>
    </div>
  `;

  const trendLabels = statements.map(s => s.periodLabel);
  const trendData = statements.map(s => computeRatios(s));
  renderLineChart('ratio-trend', trendLabels, [
    { label: 'Current Ratio', data: trendData.map(r => r.likuiditas.currentRatio), color: '#2F6FE4' },
    { label: 'Debt to Equity', data: trendData.map(r => r.solvabilitas.debtToEquityRatio), color: '#C08A3E' },
    { label: 'Net Profit Margin', data: trendData.map(r => r.profitabilitas.netProfitMargin), color: '#B5453B' }
  ]);
}

// Merender ulang isi daftar checklist Upgrade Aplikasi saja (dipanggil
// setiap ada perubahan realtime, atau setelah aksi lokal seperti
// expand/collapse keterangan panjang & toggle tampilkan yang selesai),
// tanpa perlu menggambar ulang seluruh halaman Setting.
function renderUpgradeBody() {
  const body = document.getElementById('upgrade-body');
  if (!body) return; // pengguna sudah pindah dari menu Setting
  const items = state.upgradeItems;
  const total = items.length;
  const doneCount = items.filter(i => i.checked).length;
  const pct = total === 0 ? 0 : Math.round((doneCount / total) * 100);
  const visibleItems = items.filter(i => state.upgradeShowDone ? true : !i.checked);

  body.innerHTML = `
    <div class="upgrade-progress-wrap">
      <div class="upgrade-progress-bar"><div class="upgrade-progress-fill" style="width:${pct}%;"></div></div>
      <div class="upgrade-progress-label"><span>Progres upgrade</span><strong>${pct}% (${doneCount}/${total} selesai)</strong></div>
    </div>
    ${doneCount > 0 ? `<button class="upgrade-toggle-done" id="toggle-upgrade-done">${state.upgradeShowDone ? 'Sembunyikan poin yang sudah selesai' : `Tampilkan poin yang sudah selesai (${doneCount})`}</button>` : ''}
    <div class="upgrade-list" id="upgrade-list">
      ${visibleItems.length === 0
        ? `<div class="upgrade-empty">${total === 0 ? 'Belum ada poin upgrade. Klik "+ Tambah Poin" untuk menambahkan.' : 'Semua poin sudah selesai dicentang.'}</div>`
        : visibleItems.map(item => upgradeItemHTML(item)).join('')}
    </div>
  `;

  const toggleBtn = document.getElementById('toggle-upgrade-done');
  if (toggleBtn) toggleBtn.addEventListener('click', () => { state.upgradeShowDone = !state.upgradeShowDone; renderUpgradeBody(); });

  body.querySelectorAll('[data-upgrade-check]').forEach(cb => {
    cb.addEventListener('change', async () => {
      const id = cb.dataset.upgradeCheck;
      try {
        await DB.setUpgradeItemChecked(id, cb.checked);
      } catch (err) {
        toast('Gagal memperbarui status: ' + err.message, 'error');
      }
    });
  });

  body.querySelectorAll('[data-upgrade-more]').forEach(a => {
    a.addEventListener('click', () => {
      const id = a.dataset.upgradeMore;
      state.upgradeExpanded[id] = !state.upgradeExpanded[id];
      renderUpgradeBody();
    });
  });

  body.querySelectorAll('[data-upgrade-copy]').forEach(btn => {
    btn.addEventListener('click', () => {
      const item = items.find(i => i.id === btn.dataset.upgradeCopy);
      if (!item) return;
      const text = item.description ? `${item.title}\n\n${item.description}` : item.title;
      copyToClipboard(text);
    });
  });

  body.querySelectorAll('[data-upgrade-edit]').forEach(btn => {
    btn.addEventListener('click', () => {
      const item = items.find(i => i.id === btn.dataset.upgradeEdit);
      if (item) openUpgradeItemModal(item);
    });
  });

  body.querySelectorAll('[data-upgrade-delete]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const item = items.find(i => i.id === btn.dataset.upgradeDelete);
      if (!item) return;
      if (!confirm(`Hapus poin "${item.title}"?`)) return;

        await DB.deleteUpgradeItem(item.id);
        toast('Poin dihapus', 'success');
      } catch (err) {
        toast('Gagal menghapus poin: ' + err.message, 'error');
      }
    });
  });
}

// Keterangan boleh sangat panjang (>500 karakter) sehingga dipotong

// item kosong/undefined => mode tambah baru; item terisi => mode edit.
function openUpgradeItemModal(item) {
  const isEdit = !!item;
  const backdrop = el(`<div class="modal-backdrop"><div class="modal" style="width:520px;">
    <h3>${isEdit ? 'Edit Poin Upgrade' : 'Tambah Poin Upgrade'}</h3>
    <div class="modal-sub">Judul singkat dan keterangan rinci mengenai rencana/progres upgrade aplikasi. Keterangan tidak dibatasi panjangnya (boleh lebih dari 500 karakter).</div>
    <div class="field"><label>Judul</label><input type="text" id="upgrade-title-input" placeholder="Contoh: Tambah fitur ekspor PDF" value="${escapeHTML(item ? item.title : '')}"></div>
    <div class="field"><label>Keterangan</label><textarea id="upgrade-desc-input" rows="7" placeholder="Jelaskan detail poin ini...">${escapeHTML(item ? item.description : '')}</textarea></div>
    <div class="modal-actions">
      <button class="btn ghost" id="cancel-modal">Batal</button>
      <button class="btn primary" id="save-upgrade-item">Simpan</button>
    </div>
  </div></div>`);
  document.body.appendChild(backdrop);
  backdrop.querySelector('#cancel-modal').addEventListener('click', () => backdrop.remove());
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) backdrop.remove(); });
  backdrop.querySelector('#upgrade-title-input').focus();

    const title = backdrop.querySelector('#upgrade-title-input').value.trim();

        toast('Poin ditambahkan', 'success');

      backdrop.remove();
    } catch (err) {
      toast('Gagal menyimpan: ' + err.message, 'error');

  });
}

const CAL_MONTH_NAMES = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

// tiap tahun. Hasilnya disimpan di state.onlineHolidays sebagai cache
// sepanjang sesi. Kalau fetch gagal (mis. offline), idHolidayName() di
// atas otomatis jatuh balik ke daftar statis ID_HOLIDAYS_2026.
let holidayFetchPromise = null;
function fetchOnlineHolidays() {
  if (state.onlineHolidays) return Promise.resolve(state.onlineHolidays);

function dateKey(y, m, d) {
  return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}

// Apakah tanggal ini ditandai Libur/Cuti/Sakit (tidak masuk kerja) oleh
// pengguna sendiri lewat checkbox bundar di pojok kiri-atas sel kalender
// (lihat calCellHTML & wiring [data-cal-dayoff] di renderCalendarGrid).
// Dipakai sebagai salah satu kondisi "blokir" saat menghitung ulang
// alokasi tanggal jadwal Bulanan (monthlyDatesForMonth) dan Reminder
// Analisis (analysisSlotsForMonth) — sama seperti Minggu/libur nasional.
function isDayOff(dateKeyStr) {
  return state.dayOffDates.includes(dateKeyStr);
}

// Menentukan apakah sebuah pengingat "terjadi" pada tanggal tertentu,
// dengan mempertimbangkan pengaturan Ulangi (Harian/Mingguan/Bulanan/Hari
// Tertentu) serta rentang tanggal opsional (reminder.endDate, lihat
// "s.d. tgl lain" pada modal Pengingat). Pengingat tidak pernah muncul
// sebelum tanggal awalnya (reminder.date).
// "Pending" = pengingat yang secara eksplisit ditandai Pending oleh
// pengguna (checkbox Pending saat dibuat/diedit) — BUKAN sekadar
// "tanggalnya kosong", karena pengingat Analisis-only juga tidak punya
// tanggal tapi bukan Pending. Data lama (dibuat sebelum field `pending`
// eksplisit ini ada) belum punya field ini di Firestore, jadi jatuh
// balik ke aturan lama (!date) supaya data lama tetap muncul di daftar
// Pending Reminder seperti sebelumnya.
function isReminderPending(r) {
  if (r.pending !== undefined) return !!r.pending;
  return !r.date;
}

function occursOnDate(reminder, dateKeyStr) {
  if (!reminder.date || dateKeyStr < reminder.date) return false;
  // "Hentikan Pengulangan": kalau diisi, pengingat tidak pernah muncul
  // lagi SETELAH tanggal ini (tanggal repeatUntil itu sendiri masih
  // boleh muncul). Diset lewat tombol "Hentikan Pengulangan" di modal
  // edit — mis. tugas berulang yang sudah selesai per tanggal tertentu.
  if (reminder.repeatUntil && dateKeyStr > reminder.repeatUntil) return false;
  const repeat = reminder.repeat || 'none';
  const [by, bm, bd] = reminder.date.split('-').map(Number);
  const [ky, km, kd] = dateKeyStr.split('-').map(Number);
  const curDow = new Date(ky, km - 1, kd).getDay();

  // reminder.customDays (konvensi Date.getDay(), 0=Minggu...6=Sabtu):
  // untuk repeat "custom" ini WAJIB diisi (daftar hari yang dipilih).
  // Untuk repeat lain, ini dipakai sebagai FILTER OPSIONAL hari-dalam-
  // minggu ketika rentang tanggal (endDate) aktif — mis. rentang tgl 1-3
  // tiap bulan, tapi hanya muncul kalau jatuh di Senin-Jumat. Array
  // kosong = tidak ada filter (semua hari berlaku).
  const filterDays = Array.isArray(reminder.customDays) ? reminder.customDays : [];
  const passesWeekdayFilter = () => filterDays.length === 0 || filterDays.includes(curDow);

  const hasEndDate = !!reminder.endDate && reminder.endDate >= reminder.date;
  const [ey, em, ed] = hasEndDate ? reminder.endDate.split('-').map(Number) : [null, null, null];

  if (repeat === 'none') {
    if (hasEndDate) return dateKeyStr <= reminder.endDate && passesWeekdayFilter();
    return dateKeyStr === reminder.date;
  }
  if (repeat === 'daily') return passesWeekdayFilter();
  if (repeat === 'weekday') return curDow >= 1 && curDow <= 5;
  if (repeat === 'weekly') {
    if (hasEndDate) {
      const diffDays = Math.round((new Date(ky, km - 1, kd) - new Date(by, bm - 1, bd)) / 86400000);
      const spanDays = Math.round((new Date(ey, em - 1, ed) - new Date(by, bm - 1, bd)) / 86400000);
      const offset = ((diffDays % 7) + 7) % 7;
      return offset <= spanDays && passesWeekdayFilter();
    }
    const baseDow = new Date(by, bm - 1, bd).getDay();
    return baseDow === curDow;
  }
  if (repeat === 'weeklyCustom') {
    // "Mingguan, Hari Tertentu": berulang TIAP MINGGU pada hari (Senin/
    // Selasa/dst.) yang dicentang di reminder.customDays, TANPA terikat
    // pada hari-dalam-minggu tanggal awal (reminder.date) — beda dengan
    // repeat "Mingguan" biasa yang cuma mengulang di 1 hari yang sama
    // dgn tanggal awal. Cocok utk agenda tetap tiap minggu di hari
    // tertentu, mis. rapat tiap Sabtu.
    if (filterDays.length === 0) return false;
    return filterDays.includes(curDow);
  }
  if (repeat === 'monthly') {
    // Kalau tanggal awal (mis. 31) tidak ada di bulan tsb (mis.
    // Februari), dianggap jatuh di tanggal terakhir bulan itu.
    const daysInCurMonth = new Date(ky, km, 0).getDate();
    if (hasEndDate) {
      const spanDays = Math.max(0, ed - bd);
      const startDayEff = Math.min(bd, daysInCurMonth);
      const endDayEff = Math.min(bd + spanDays, daysInCurMonth);
      return kd >= startDayEff && kd <= endDayEff && passesWeekdayFilter();
    }
    const targetDay = Math.min(bd, daysInCurMonth);
    // "Geser jika Sabtu/Minggu": tiap hari (Sabtu dan/atau Minggu) bisa
    // ditandai terpisah sebagai hari yang harus dihindari. Kalau tanggal
    // target jatuh di salah satu hari yang ditandai, majukan tanggal
    // hari demi hari sampai ketemu hari yang TIDAK ditandai (mis. kalau
    // hanya Minggu yang ditandai: Sabtu tetap muncul apa adanya, tapi
    // Minggu digeser ke Senin; kalau keduanya ditandai: Sabtu digeser
    // ke Senin juga karena Minggu pun dihindari). Data lama yang masih
    // pakai field shiftWeekend (checkbox tunggal) diperlakukan sebagai
    // Sabtu & Minggu keduanya ditandai, demi kompatibilitas mundur.
    const legacyBoth = reminder.shiftWeekend && reminder.shiftSaturday === undefined && reminder.shiftSunday === undefined;
    const avoidSaturday = legacyBoth ? true : !!reminder.shiftSaturday;
    const avoidSunday = legacyBoth ? true : !!reminder.shiftSunday;
    if (avoidSaturday || avoidSunday) {
      const targetDate = new Date(ky, km - 1, targetDay);
      while ((avoidSaturday && targetDate.getDay() === 6) || (avoidSunday && targetDate.getDay() === 0)) {
        targetDate.setDate(targetDate.getDate() + 1);
      }
      return dateKeyStr === dateKey(targetDate.getFullYear(), targetDate.getMonth(), targetDate.getDate());
    }
    return kd === targetDay;
  }
  if (repeat === 'custom') {
    // "Bulanan, Hari Tertentu": berulang tiap bulan pada tanggal (hari-
    // di-bulan) yang SAMA dengan reminder.date (mengikuti aturan
    // penyesuaian akhir bulan seperti repeat "Bulanan" biasa), TAPI
    // hanya benar-benar muncul kalau tanggal itu jatuh di salah satu
    // hari (Senin/Selasa/dst.) yang dicentang di reminder.customDays.
    // Kalau bulan tsb tanggalnya tidak jatuh di hari yang dipilih,
    // pengingat DILEWATI bulan itu (tidak digeser ke tanggal lain).
    // Kalau "s.d. tgl lain" (endDate) diisi, targetDay di atas melebar
    // jadi RENTANG tanggal tiap bulan (sama seperti repeat "Bulanan"
    // dengan endDate), dan filter hari tetap berlaku per-hari di dalam
    // rentang tsb.
    if (filterDays.length === 0) return false;
    const daysInCurMonth = new Date(ky, km, 0).getDate();
    if (hasEndDate) {
      const spanDays = Math.max(0, ed - bd);
      const startDayEff = Math.min(bd, daysInCurMonth);
      const endDayEff = Math.min(bd + spanDays, daysInCurMonth);
      return kd >= startDayEff && kd <= endDayEff && filterDays.includes(curDow);
    }
    const targetDay = Math.min(bd, daysInCurMonth);
    if (kd !== targetDay) return false;
    return filterDays.includes(curDow);
  }
  return false;
}

// Reminder ber-tag "Analisis" tidak punya reminder.date (sengaja
// dikosongkan saat disimpan — lihat applyPendingState) karena tanggal
// kemunculannya dihitung ULANG tiap bulan oleh analysisSlotsForMonth()
// (round-robin ke ANALISIS_PRIORITY_DATES/ANALISIS_FALLBACK_DATES,
// menghindari Minggu/libur/bentrok). occursOnDate() sendiri tidak tahu
// apa-apa soal mekanisme ini, jadi dipetakan terpisah di sini supaya
// pengingat Analisis ikut muncul di sel kalender tanggal yang
// bersangkutan (sebelumnya cuma tampil di modal "Reminder Analisis").
function analisisDatesForMonth(year, month) {
  const { prioritySlots, standardSlots } = analysisSlotsForMonth(year, month);
  const map = new Map(); // reminder id -> dateKey kemunculannya bulan ini
  [...prioritySlots, ...standardSlots].forEach(slot => {
    slot.items.forEach(item => map.set(item.id, slot.key));
  });
  return map;
}

// Urutan tampil per-tanggal: reminder.orderOverrides adalah map
// { [dateKeyStr]: order } — dipakai supaya hasil drag & drop di satu sel
// kalender HANYA berlaku untuk tanggal itu, tidak ikut mengubah urutan
// pengingat yang sama di tanggal kemunculan lain (mis. pengingat
// berulang). Kalau tanggal ini belum pernah punya override sendiri,
// jatuh ke reminder.order (order lama/global, atau tak terurut =
// Infinity, ditaruh paling akhir).
// Status "selesai" pengingat berulang dibaca PER TANGGAL kemunculan dari
// map reminder.doneDates = { [dateKeyStr]: true } — lihat
// DB.setReminderDoneForDate(). Dipakai di sel kalender, jadwal Reminder
// Analisis, & PDF agenda, supaya mencentang selesai di satu tanggal tidak
// ikut menandai kemunculan yang sama di tanggal lain. Field `done` lama
// (boolean tunggal per dokumen) tetap dipakai HANYA untuk Pending
// Reminder (isReminderPending) & pengingat Analisis yang bulan ini gagal
// kebagian tanggal (unscheduled) — keduanya tidak punya satu tanggal
// kemunculan pasti untuk dijadikan kunci.
function isReminderDoneOnDate(item, dateKeyStr) {
  return !!(item.doneDates && item.doneDates[dateKeyStr]);
}

function reminderOrderForDate(item, dateKeyStr) {
  const overrides = item.orderOverrides;
  if (overrides && Object.prototype.hasOwnProperty.call(overrides, dateKeyStr)) {
    const v = overrides[dateKeyStr];
    return (v === null || v === undefined || v === '') ? Infinity : Number(v);
  }
  return (item.order === null || item.order === undefined || item.order === '') ? Infinity : Number(item.order);
}

// Pengingat berulang "Bulanan" / "Bulanan, Hari Tertentu" (TANPA rentang
// "s.d. tgl lain") yang tanggal kemunculan normalnya (hasil occursOnDate)
// jatuh di tanggal yang ditandai Libur/Cuti/Sakit (isDayOff) otomatis
// digeser ke tanggal lain yang masih kosong bulan ini — meniru cara
// Reminder Analisis dialokasikan ulang saat jatuh Minggu/libur nasional
// (lihat analysisSlotsForMonth). Dicari maju dulu dari tanggal asli
// (tanggal terdekat berikutnya yang kosong), lalu berputar dari awal
// bulan kalau mentok akhir bulan. Rentang tanggal (endDate) sengaja
// TIDAK digeser karena sudah berupa beberapa hari sekaligus, bukan 1
// tanggal tunggal — tetap tampil apa adanya di rentang aslinya.
function monthlyDatesForMonth(year, month) {
  const map = new Map(); // reminder id -> dateKeyStr kemunculannya bulan ini
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const monthlyItems = state.reminders.filter(r => {
    if (r.analisis) return false;
    const repeat = r.repeat || 'none';
    if (repeat !== 'monthly' && repeat !== 'custom') return false;
    if (r.endDate && r.endDate >= r.date) return false; // rentang tanggal: tidak digeser
    return true;
  });
  if (monthlyItems.length === 0) return map;

  const usedDates = new Set();
  monthlyItems.forEach(r => {
    let naiveDay = null;
    for (let d = 1; d <= daysInMonth; d++) {
      if (occursOnDate(r, dateKey(year, month, d))) { naiveDay = d; break; }
    }
    if (naiveDay == null) return; // repeat "custom" bisa saja tidak muncul sama sekali bulan ini
    const naiveKey = dateKey(year, month, naiveDay);
    if (!isDayOff(naiveKey) && !usedDates.has(naiveKey)) {
      usedDates.add(naiveKey);
      map.set(r.id, naiveKey);
      return;
    }
    let fallbackKey = null;
    for (let offset = 1; offset <= daysInMonth; offset++) {
      const d = ((naiveDay - 1 + offset) % daysInMonth) + 1;
      const key = dateKey(year, month, d);
      if (!isDayOff(key) && !usedDates.has(key)) { fallbackKey = key; break; }
    }
    const finalKey = fallbackKey || naiveKey; // seluruh bulan Libur/Cuti/Sakit: tampilkan apa adanya
    usedDates.add(finalKey);
    map.set(r.id, finalKey);
  });
  return map;
}

function remindersForDate(dateKeyStr) {
  const [ky, km] = dateKeyStr.split('-').map(Number);
  const analisisMap = analisisDatesForMonth(ky, km - 1);
  const monthlyMap = monthlyDatesForMonth(ky, km - 1);
  return state.reminders
    .filter(r => {
      if (r.analisis) return analisisMap.get(r.id) === dateKeyStr;
      if (monthlyMap.has(r.id)) return monthlyMap.get(r.id) === dateKeyStr;
      return occursOnDate(r, dateKeyStr);
    })
    .sort((a, b) => {
      const ao = reminderOrderForDate(a, dateKeyStr);
      const bo = reminderOrderForDate(b, dateKeyStr);
      if (ao !== bo) return ao - bo;
      return (a.time || '').localeCompare(b.time || '');
    });
}

const REPEAT_LABELS = { none: 'Tidak berulang', daily: 'Harian', weekday: 'Weekday (Senin–Jumat)', weekly: 'Mingguan', weeklyCustom: 'Mingguan, Hari Tertentu', monthly: 'Bulanan', custom: 'Bulanan, Hari Tertentu' };
// Label singkat hari berdasarkan konvensi Date.getDay() (0=Minggu...6=Sabtu),
// dipakai untuk menampilkan pilihan hari pada repeat "Bulanan, Hari Tertentu".
const CAL_DOW_BY_JSDOW = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
function repeatDisplayLabel(item) {
  const repeat = item.repeat || 'none';
  const hasEndDate = !!item.endDate && item.endDate >= item.date;
  const days = Array.isArray(item.customDays) ? [...item.customDays].sort((a, b) => a - b) : [];
  if (repeat === 'custom') {
    if (days.length === 0) return REPEAT_LABELS.custom;
    const bd = item.date ? Number(item.date.split('-')[2]) : null;
    let dayPart = bd ? ` (tgl ${bd})` : '';
    if (hasEndDate) {
      const ed = Number(item.endDate.split('-')[2]);
      dayPart = ` (tgl ${bd}-${ed})`;
    }
    return `${REPEAT_LABELS.custom}${dayPart} · ${days.map(d => CAL_DOW_BY_JSDOW[d]).join(', ')}`;
  }
  if (repeat === 'weeklyCustom') {
    if (days.length === 0) return REPEAT_LABELS.weeklyCustom;
    return `${REPEAT_LABELS.weeklyCustom} · ${days.map(d => CAL_DOW_BY_JSDOW[d]).join(', ')}`;
  }
  let label = REPEAT_LABELS[repeat] || REPEAT_LABELS.none;
  if (hasEndDate) {
    const [, , bd] = item.date.split('-').map(Number);
    const [, , ed] = item.endDate.split('-').map(Number);
    label += ` (tgl ${bd}-${ed})`;
  }
  if (days.length > 0) label += ` · ${days.map(d => CAL_DOW_BY_JSDOW[d]).join(', ')}`;
  if (repeat === 'monthly' && !hasEndDate) {
    const legacyBoth = item.shiftWeekend && item.shiftSaturday === undefined && item.shiftSunday === undefined;
    const avoidSaturday = legacyBoth ? true : !!item.shiftSaturday;
    const avoidSunday = legacyBoth ? true : !!item.shiftSunday;
    if (avoidSaturday && avoidSunday) label += ' · geser jika Sabtu/Minggu';
    else if (avoidSaturday) label += ' · geser jika Sabtu';
    else if (avoidSunday) label += ' · geser jika Minggu';
  }
  if (item.repeatUntil) label += ` · berhenti stlh ${formatDateID(item.repeatUntil)}`;
  return label;
}

// Memotong teks satu baris supaya pas dalam lebar tertentu, menambahkan
// "…" di akhir kalau kepanjangan — meniru perilaku CSS
// "white-space:nowrap;text-overflow:ellipsis" yang dipakai judul
// pengingat di sel kalender aplikasi (.cal-cell-reminder-title).
function pdfEllipsize(pdf, text, maxWidth) {
  if (pdf.getTextWidth(text) <= maxWidth) return text;
  let lo = 0, hi = text.length;
  while (lo < hi) {
    const mid = Math.ceil((lo + hi) / 2);
    const candidate = text.slice(0, mid) + '…';
    if (pdf.getTextWidth(candidate) <= maxWidth) lo = mid; else hi = mid - 1;
  }
  return lo > 0 ? text.slice(0, lo) + '…' : '…';
}

// Mengekspor jadwal agenda bulan yang sedang ditampilkan (state.calendarCursor)
// sebagai satu file PDF berupa GRID KALENDER — bukan daftar memanjang per
// tanggal seperti sebelumnya — supaya tampilannya sama seperti grid kalender
// di menu Kalender aplikasi (7 kolom Sen–Min, sel bulan sebelum/sesudah
// diredupkan, sel Sabtu/Minggu-libur nasional/Libur-Cuti-Sakit diberi warna
// latar sama seperti CSS .cal-cell, sel hari ini diberi bingkai teal, dan
// judul tiap pengingat dipotong satu baris dengan "…" sama seperti
// .cal-cell-reminder-title). Sudah termasuk hasil realokasi otomatis
// (Reminder Analisis & jadwal Bulanan yang digeser krn Minggu/libur
// nasional/Libur-Cuti-Sakit, lihat remindersForDate). Ditulis manual dgn
// teks+vektor jsPDF (bukan screenshot html2canvas) supaya hasilnya tajam.
async function exportCalendarAgendaPDF() {
  const btn = document.getElementById('cal-agenda-pdf-btn');
  if (btn) { btn.disabled = true; }
  try {
    const { year, month } = state.calendarCursor;
    // Pastikan status Minggu/libur nasional yang ditampilkan di PDF
    // sudah pakai data online terbaru (kalau berhasil dimuat).
    await fetchOnlineHolidays().catch(() => {});

    const { jsPDF } = window.jspdf;
    // Landscape supaya 7 kolom grid kalender cukup lega, sama semangatnya
    // dengan grid kalender aplikasi yang scroll ke samping di layar sempit.
    const pdf = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4' });
    const pageW = 841.89, pageH = 595.28;
    const margin = 26;
    const contentW = pageW - margin * 2;

    // Warna diambil dari CSS var tema terang aplikasi (lihat :root),
    // supaya nuansanya sama dengan tampilan kalender di layar.
    const INK = [22, 33, 58];         // --text
    const SLATE = [154, 163, 178];    // --slate-light
    const BORDER = [228, 230, 233];   // --border
    const DANGER = [181, 69, 59];     // --danger
    const DANGER_LIGHT = [251, 236, 235]; // --danger-light (Minggu/libur/Cuti-Sakit)
    const SUCCESS_LIGHT = [231, 245, 236]; // --success-light (Sabtu)
    const SURFACE = [250, 251, 251];  // --surface-2 (sel biasa)
    const TEAL = [47, 111, 228];      // --teal (bingkai hari ini)
    const monthLabel = `${CAL_MONTH_NAMES[month]} ${year}`;

    let y = margin;
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(15);
    pdf.setTextColor(...INK);
    pdf.text(`Agenda Bulanan — ${monthLabel}`, margin, y);
    y += 18;
    pdf.setDrawColor(...BORDER); pdf.setLineWidth(0.75);
    pdf.line(margin, y, pageW - margin, y);
    y += 16;

    // Baris header nama hari (Sen..Min), sama urutannya seperti CAL_DOW.
    const colW = contentW / 7;
    pdf.setFont('helvetica', 'bold'); pdf.setFontSize(9);
    pdf.setTextColor(...SLATE);
    CAL_DOW.forEach((d, i) => {
      pdf.text(d.toUpperCase(), margin + i * colW + colW / 2, y, { align: 'center' });
    });
    y += 12;

    // Susun daftar sel grid persis seperti renderCalendarGrid(): sel
    // pengisi dari bulan sebelumnya, sel bulan ini, lalu sel pengisi dari
    // bulan berikutnya sampai genap kelipatan 7.
    const firstDow = (new Date(year, month, 1).getDay() + 6) % 7; // Senin=0..Minggu=6
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const daysInPrevMonth = new Date(year, month, 0).getDate();
    const trailing = (7 - ((firstDow + daysInMonth) % 7)) % 7;

    const cellsData = [];
    for (let i = 0; i < firstDow; i++) {
      const d = daysInPrevMonth - firstDow + i + 1;
      const m = month === 0 ? 11 : month - 1;
      const yy = month === 0 ? year - 1 : year;
      cellsData.push({ y: yy, m, d, outside: true });
    }
    for (let d = 1; d <= daysInMonth; d++) cellsData.push({ y: year, m: month, d, outside: false });
    for (let d = 1; d <= trailing; d++) {
      const m = month === 11 ? 0 : month + 1;
      const yy = month === 11 ? year + 1 : year;
      cellsData.push({ y: yy, m, d, outside: true });
    }

    const rows = cellsData.length / 7;
    const gridTop = y;
    const rowH = (pageH - margin - gridTop) / rows;

    const today = new Date();
    const todayKey = dateKey(today.getFullYear(), today.getMonth(), today.getDate());

    cellsData.forEach((cell, idx) => {
      const col = idx % 7;
      const row = Math.floor(idx / 7);
      const cx = margin + col * colW;
      const cy = gridTop + row * rowH;
      const key = dateKey(cell.y, cell.m, cell.d);
      const dow = new Date(cell.y, cell.m, cell.d).getDay();
      const holidayName = !cell.outside ? idHolidayName(key) : null;
      const dayOff = !cell.outside && isDayOff(key);
      const isToday = !cell.outside && key === todayKey;

      let bg = SURFACE;
      if (cell.outside) bg = [255, 255, 255];
      else if (dow === 0 || holidayName || dayOff) bg = DANGER_LIGHT;
      else if (dow === 6) bg = SUCCESS_LIGHT;

      pdf.setFillColor(...bg);
      pdf.setDrawColor(...BORDER);
      pdf.setLineWidth(0.6);
      pdf.rect(cx, cy, colW, rowH, cell.outside ? 'S' : 'FD');
      if (isToday) {
        pdf.setDrawColor(...TEAL);
        pdf.setLineWidth(1.4);
        pdf.rect(cx + 0.7, cy + 0.7, colW - 1.4, rowH - 1.4, 'S');
      }

      if (cell.outside) {
        pdf.setFont('helvetica', 'normal'); pdf.setFontSize(8);
        pdf.setTextColor(...SLATE);
        pdf.text(String(cell.d), cx + colW / 2, cy + rowH / 2, { align: 'center' });
        return;
      }

      pdf.setFont('helvetica', isToday ? 'bold' : 'normal'); pdf.setFontSize(9.5);
      pdf.setTextColor(...((holidayName || dow === 0 || dayOff) ? DANGER : INK));
      pdf.text(String(cell.d), cx + 6, cy + 13);

      const items = remindersForDate(key);
      const lineH = 9.5;
      const padX = 5;
      const maxY = cy + rowH - 4;
      let ty = cy + 26;
      pdf.setFont('helvetica', 'normal'); pdf.setFontSize(7.3);
      let shown = 0;
      for (const item of items) {
        if (ty + lineH > maxY) break;
        const label = pdfEllipsize(pdf, (item.title || '(Tanpa judul)'), colW - padX * 2);
        pdf.setTextColor(...(isReminderDoneOnDate(item, key) ? SLATE : INK));
        pdf.text(`• ${label}`, cx + padX, ty);
        ty += lineH;
        shown++;
      }
      if (shown < items.length && ty <= maxY) {
        pdf.setFont('helvetica', 'italic'); pdf.setFontSize(6.8);
        pdf.setTextColor(...SLATE);
        pdf.text(`+${items.length - shown} lainnya`, cx + padX, ty);
      }
    });

    pdf.save(`Agenda-${CAL_MONTH_NAMES[month]}-${year}.pdf`);
  } catch (err) {
    toast('Gagal membuat PDF agenda: ' + err.message, 'error');
  } finally {
    if (btn) btn.disabled = false;
  }
}

  root.innerHTML = `
    <div style="max-width:1240px;margin:0 auto;">
      <div class="card" style="width:100%;">
        <div class="cal-header">
          <div class="cal-nav">
            <button id="cal-prev" title="Bulan sebelumnya">${icon('chevronLeft')}</button>
            <div class="cal-month-label" id="cal-month-label"></div>
            <button id="cal-next" title="Bulan berikutnya">${icon('chevronRight')}</button>
          </div>
          <div style="display:flex;align-items:center;gap:10px;">
            <button class="cal-pending-btn cal-agenda-btn" id="cal-agenda-pdf-btn" title="Download jadwal agenda bulan ini sebagai PDF">${icon('download')}<span>Unduh Agenda PDF</span></button>
            <button class="cal-pending-btn cal-analisis-btn" id="cal-analisis-btn">Reminder Analisis<span class="cal-pending-badge" id="cal-analisis-badge" style="display:none;"></span></button>
            <button class="cal-pending-btn" id="cal-pending-btn">Pending Reminder<span class="cal-pending-badge" id="cal-pending-badge" style="display:none;"></span></button>

        </div>
        <div class="cal-grid-scroll" id="cal-grid-scroll">
          <div class="cal-grid" id="cal-grid"></div>
        </div>
      </div>
    </div>
    <button class="cal-fab" id="add-reminder-btn" title="Tambah Pengingat">${icon('plus')}</button>
  `;
  document.getElementById('cal-prev').addEventListener('click', () => shiftCalendarMonth(-1));
  document.getElementById('cal-next').addEventListener('click', () => shiftCalendarMonth(1));
  document.getElementById('cal-pending-btn').addEventListener('click', () => openPendingRemindersModal());
  document.getElementById('cal-analisis-btn').addEventListener('click', () => openAnalisisScheduleModal());
  document.getElementById('cal-agenda-pdf-btn').addEventListener('click', () => exportCalendarAgendaPDF());
  document.getElementById('add-reminder-btn').addEventListener('click', () => openReminderModal(null, state.calendarSelectedDate));

  // Muat data hari libur online di latar belakang; kalau berhasil,
  // render ulang grid supaya highlight Minggu/libur ikut ter-update
  // dari sumber online (sebelumnya cuma pakai daftar statis).
  fetchOnlineHolidays().then((map) => {
    if (map && document.getElementById('cal-grid')) renderCalendarGrid();
  });

  document.getElementById('cal-dow-row').innerHTML = CAL_DOW.map(d => `<div class="cal-dow">${d}</div>`).join('');
  const calGridScroll = document.getElementById('cal-grid-scroll');
  const calDowRow = document.getElementById('cal-dow-row');
  calGridScroll.addEventListener('scroll', () => {
    calDowRow.style.transform = `translateX(-${calGridScroll.scrollLeft}px)`;
  });

  state.unsubData = DB.watchReminders(state.user.uid, (items) => {

  });

  state.unsubDayOff = DB.watchDayOffDates(state.user.uid, (dates) => {
    state.dayOffDates = dates;
    renderCalendarGrid();
  }, (err) => {
    toast('Gagal memuat data Libur/Cuti/Sakit: ' + err.message, 'error');
  });

  renderCalendarGrid();
}

function shiftCalendarMonth(delta) {
  let { year, month } = state.calendarCursor;
  month += delta;
  if (month < 0) { month = 11; year -= 1; }
  if (month > 11) { month = 0; year += 1; }
  state.calendarCursor = { year, month };
  renderCalendarGrid();
}

function renderCalendarGrid() {
  const grid = document.getElementById('cal-grid');
  if (!grid) return; // pengguna sudah pindah dari menu Kalender
  const { year, month } = state.calendarCursor;
  document.getElementById('cal-month-label').textContent = `${CAL_MONTH_NAMES[month]} ${year}`;

  const pendingCount = state.reminders.filter(r => isReminderPending(r) && !r.done).length;
  const badge = document.getElementById('cal-pending-badge');
  if (badge) { badge.style.display = pendingCount > 0 ? 'inline-flex' : 'none'; }

  const analisisDateMapForBadge = analisisDatesForMonth(year, month);
  const analisisCount = state.reminders.filter(r => {
    if (!r.analisis) return false;
    const occDate = analisisDateMapForBadge.get(r.id);
    return occDate ? !isReminderDoneOnDate(r, occDate) : true; // belum kebagian tanggal bulan ini juga dihitung belum selesai
  }).length;
  const analisisBadge = document.getElementById('cal-analisis-badge');
  if (analisisBadge) { analisisBadge.style.display = analisisCount > 0 ? 'inline-flex' : 'none'; }

  const remindersByDate = {}; // cache sederhana per tanggal supaya tidak menghitung ulang saat render grid

  const today = new Date();
  const todayKey = dateKey(today.getFullYear(), today.getMonth(), today.getDate());
  const firstDow = (new Date(year, month, 1).getDay() + 6) % 7; // geser: Senin=0 ... Minggu=6
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();

  let cells = '';

  // Sel tanggal bulan sebelumnya (pengisi awal grid)
  for (let i = 0; i < firstDow; i++) {
    const d = daysInPrevMonth - firstDow + i + 1;
    const m = month === 0 ? 11 : month - 1;
    const y = month === 0 ? year - 1 : year;
    cells += calCellHTML(y, m, d, true, remindersByDate, todayKey);
  }
  // Sel tanggal bulan ini
  for (let d = 1; d <= daysInMonth; d++) {
    cells += calCellHTML(year, month, d, false, remindersByDate, todayKey);
  }
  // Sel tanggal bulan berikutnya (pengisi akhir grid, sampai kelipatan 7)
  const totalSoFar = firstDow + daysInMonth;
  const trailing = (7 - (totalSoFar % 7)) % 7;
  for (let d = 1; d <= trailing; d++) {
    const m = month === 11 ? 0 : month + 1;
    const y = month === 11 ? year + 1 : year;
    cells += calCellHTML(y, m, d, true, remindersByDate, todayKey);
  }

  grid.innerHTML = cells;
  grid.querySelectorAll('[data-cal-date]').forEach(cell => {
    cell.addEventListener('click', (e) => {
      // Klik pada baris pengingat di dalam sel ditangani terpisah (lihat
      // di bawah) dan tidak boleh ikut memicu pemilihan tanggal ini.
      if (e.target.closest('[data-cal-reminder]')) return;
      const key = cell.dataset.calDate;
      state.calendarSelectedDate = key;
      const [y, m] = key.split('-').map(Number);
      state.calendarCursor = { year: y, month: m - 1 };
      renderCalendarGrid();
    });
  });
  // Drag & drop urutan pengingat di dalam sel kalender: menggantikan
  // fitur nomor urutan manual ("Urutan") yang dulu diketik lewat modal —
  // sekarang cukup tarik-geser ke atas/bawah antar pengingat pada
  // TANGGAL YANG SAMA (dragover menolak pengingat yang ditarik dari sel
  // tanggal lain). Hasilnya disimpan per-TANGGAL (reminder.orderOverrides,
  // lihat reminderOrderForDate) — bukan menimpa urutan global reminder —
  // supaya pengingat berulang yang digeser di satu tanggal TIDAK ikut
  // berubah urutannya di tanggal kemunculan lain. Pola drag-nya sendiri
  // meniru drag & drop kartu Perusahaan (fillCompanyGrid), hanya
  // sumbunya vertikal (atas/bawah) bukan horizontal. reminderDidDrag
  // menandai drag yang baru saja terjadi supaya 'click' sesudahnya (dari
  // mouseup di elemen yang sama) tidak ikut membuka modal edit.
  let reminderDragging = null;
  let reminderDidDrag = false;
  grid.querySelectorAll('.cal-cell-reminder').forEach(rowEl => {
    rowEl.addEventListener('dragstart', (e) => {
      reminderDragging = rowEl;
      reminderDidDrag = false;
      rowEl.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try { e.dataTransfer.setData('text/plain', rowEl.dataset.calReminder); } catch (err) { /* Safari lama */ }
    });
    rowEl.addEventListener('dragover', (e) => {
      if (!reminderDragging || reminderDragging === rowEl) return;
      const container = rowEl.closest('.cal-cell-reminders');
      // Hanya boleh disisipkan di dalam sel tanggal yang sama dengan
      // pengingat yang sedang ditarik — mencegah geser-antar-tanggal
      // yang tidak diinginkan (fitur ini cuma untuk urutan dalam 1 hari).
      if (!container || reminderDragging.closest('.cal-cell-reminders') !== container) return;
      e.preventDefault();
      reminderDidDrag = true;
      const rect = rowEl.getBoundingClientRect();
      const before = e.clientY < rect.top + rect.height / 2;
      if (before) container.insertBefore(reminderDragging, rowEl);
      else container.insertBefore(reminderDragging, rowEl.nextSibling);
    });
    rowEl.addEventListener('dragenter', (e) => e.preventDefault());
    rowEl.addEventListener('drop', (e) => e.preventDefault());
    rowEl.addEventListener('dragend', async () => {
      rowEl.classList.remove('dragging');
      const container = rowEl.closest('.cal-cell-reminders');
      reminderDragging = null;
      if (!container) return;
      const cellEl = container.closest('[data-cal-date]');
      const cellDateKey = cellEl ? cellEl.dataset.calDate : null;
      if (!cellDateKey) return;
      const orderedIds = [...container.querySelectorAll('.cal-cell-reminder[data-cal-reminder]')].map(el => el.dataset.calReminder);
      // Perbarui state lokal dulu (biar responsif) sebelum menyimpan ke
      // server, supaya render berikutnya dari listener realtime tidak
      // sempat mengembalikan urutan lama sekejap.
      orderedIds.forEach((id, idx) => {
        const it = state.reminders.find(x => x.id === id);
        if (it) { if (!it.orderOverrides) it.orderOverrides = {}; it.orderOverrides[cellDateKey] = idx; }
      });
      try {
        await DB.reorderRemindersForDate(cellDateKey, orderedIds);
      } catch (err) {
        toast('Gagal menyimpan urutan pengingat: ' + err.message, 'error');
      }
    });
  });

  grid.querySelectorAll('[data-cal-copy-date]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      copyToClipboard(dailyReportText(btn.dataset.calCopyDate));
    });
  });

  grid.querySelectorAll('[data-cal-reminder]').forEach(row => {
    row.addEventListener('click', (e) => {
      e.stopPropagation();
      if (reminderDidDrag) { reminderDidDrag = false; return; }
      if (e.target.closest('[data-cal-reminder-done]')) return;
      const item = state.reminders.find(r => r.id === row.dataset.calReminder);
      if (item) openReminderModal(item, null, row.dataset.calOccurrenceDate);
    });
  });
  grid.querySelectorAll('[data-cal-reminder-done]').forEach(checkbox => {
    checkbox.addEventListener('click', (e) => e.stopPropagation());
    checkbox.addEventListener('change', async (e) => {
      const id = checkbox.dataset.calReminderDone;
      const occurrenceDate = checkbox.closest('[data-cal-reminder]')?.dataset.calOccurrenceDate;
      try {
        await DB.setReminderDoneForDate(id, occurrenceDate, e.target.checked);
      } catch (err) {
        toast('Gagal memperbarui status: ' + err.message, 'error');
        e.target.checked = !e.target.checked;
      }
    });
  });

  // Checkbox "Libur/Cuti/Sakit" di pojok kiri-atas tiap sel — lihat
  // calCellHTML & DB.setDayOff. Konfirmasi dulu saat DICENTANG (bukan
  // saat dibatalkan) karena aksi ini memindahkan jadwal Bulanan &
  // Reminder Analisis tanggal tsb ke tanggal lain.
  grid.querySelectorAll('[data-cal-dayoff]').forEach(cb => {
    cb.addEventListener('click', (e) => e.stopPropagation());
    cb.addEventListener('change', async (e) => {
      const dateKeyStr = cb.dataset.calDayoff;
      const checked = e.target.checked;
      if (checked && !confirm(`Tandai ${formatDateID(dateKeyStr)} sebagai Libur/Cuti/Sakit (tidak masuk kerja)?\n\nJadwal Bulanan & Reminder Analisis pada tanggal ini akan otomatis dipindah ke tanggal lain yang masih kosong bulan ini.`)) {
        cb.checked = false;
        return;
      }
      try {
        await DB.setDayOff(state.user.uid, dateKeyStr, checked);
      } catch (err) {
        cb.checked = !checked;
        toast('Gagal memperbarui status Libur/Cuti/Sakit: ' + err.message, 'error');
      }
    });
  });
}

// Menampilkan ringkasan pengingat langsung di dalam sel kalender (nomor
// urut & judul saja, sekilas), tanpa daftar terpisah di bawah grid.
// Tinggi sel menyesuaikan otomatis mengikuti jumlah pengingat pada
// tanggal tsb (lihat CSS .cal-cell, sudah tidak dipaksa aspect-ratio 1/1).
function calCellHTML(y, m, d, outside, remindersByDate, todayKey) {
  const key = dateKey(y, m, d);
  if (!(key in remindersByDate)) remindersByDate[key] = remindersForDate(key);
  const items = remindersByDate[key];
  const dow = new Date(y, m, d).getDay(); // 0 = Minggu, 6 = Sabtu
  const holidayName = idHolidayName(key);
  const dayOff = !outside && isDayOff(key);
  const classes = ['cal-cell'];
  if (outside) classes.push('cal-outside');
  if (dow === 0 || holidayName) classes.push('cal-sunday-holiday');
  else if (dow === 6) classes.push('cal-saturday');
  if (dayOff) classes.push('cal-dayoff');
  if (key === todayKey) classes.push('cal-today');
  if (key === state.calendarSelectedDate) classes.push('cal-selected');
  const remindersHTML = (!outside && items.length > 0)
    ? `<div class="cal-cell-reminders">${items.map((item) => calCellReminderHTML(item, key)).join('')}</div>`
    : '';
  // Tombol "titik merah" di pojok kanan atas sel: menyalin ringkasan
  // pengingat tanggal ini sebagai teks "Daily Report" siap-tempel (lihat
  // dailyReportText()). Hanya muncul kalau tanggal itu punya pengingat.
  const copyBtnHTML = (!outside && items.length > 0)
    ? `<button class="cal-cell-copy-btn" data-cal-copy-date="${key}" title="Salin sebagai Daily Report">${icon('copy')}</button>`
    : '';
  // Checkbox bundar di pojok kiri-atas sel: menandai tanggal ini sebagai
  // Libur/Cuti/Sakit (tidak masuk kerja). Saat dicentang, background sel
  // berubah merah dan jadwal Bulanan & Reminder Analisis pada tanggal ini
  // otomatis dialokasikan ulang ke tanggal lain yang masih kosong bulan
  // ini (lihat monthlyDatesForMonth & analysisSlotsForMonth/isBlocked).
  const dayoffCheckHTML = outside ? '' : `<input type="checkbox" class="cal-cell-dayoff-check" data-cal-dayoff="${key}" ${dayOff ? 'checked' : ''} title="Tandai Libur/Cuti/Sakit (tidak masuk kerja) — jadwal Bulanan &amp; Reminder Analisis tanggal ini otomatis dipindah ke tanggal lain">`;
  return `<div class="${classes.join(' ')}" data-cal-date="${key}"${holidayName ? ` title="${escapeHTML(holidayName)}"` : ''}>
    ${dayoffCheckHTML}
    ${copyBtnHTML}

// Menyusun teks "Daily Report" siap-tempel dari seluruh pengingat pada
// satu tanggal (urutannya sama seperti tampilan di sel kalender, sudah
// termasuk hasil drag & drop per-tanggal — lihat remindersForDate()).
// Tiap pengingat dinomori dan JUDULNYA TIDAK IKUT DITULIS — baris
// bernomor langsung berisi KETERANGAN pengingat itu (baris pertamanya
// kalau keterangan berbaris-baris/bullet, mis. diketik dengan "- " per
// poin di form pengingat; baris-baris berikutnya ditaruh apa adanya di
// bawah baris bernomor, tanpa diberi nomor/awalan tambahan). Keterangan
// memang opsional — kalau kosong, dipakai judul sebagai gantinya supaya
// baris bernomor itu tidak kosong.
function dailyReportText(dateKeyStr) {
  const [y, m, d] = dateKeyStr.split('-');
  const items = remindersForDate(dateKeyStr);
  const lines = ['Daily Report', `${d}/${m}/${y}`, ''];
  items.forEach((item, idx) => {
    const desc = (item.description || '').trim();
    if (!desc) { lines.push(`${idx + 1}. ${item.title}`); return; }
    const descLines = desc.split('\n');
    lines.push(`${idx + 1}. ${descLines[0]}`);
    if (descLines.length > 1) lines.push(descLines.slice(1).join('\n'));
  });
  return lines.join('\n');
}

// Nomor urutan (dulu "1.", "2.", dst.) sudah dihapus dari tampilan —
// urutan sekarang diatur langsung dengan drag & drop antar pengingat di

// ---------- Reminder Analisis (jadwal otomatis berbasis tanggal tetap) ----------

// Tanggal implementasi Analisis Prioritas: item Analisis berprioritas
// disebar ke tanggal-tanggal ini, sesuai urutan daftarnya. Kalau salah
// satu tanggal ini jatuh di hari Minggu atau libur nasional/cuti
// bersama, jadwalnya otomatis dipindah ke salah satu Tanggal Cadangan
// di bawah (dipakai berurutan, hanya yang belum terpakai & bukan
// Minggu/libur).
const ANALISIS_PRIORITY_DATES = [4, 5, 6, 7, 8, 9, 10, 11, 13, 18, 19, 20, 21, 22, 23, 24, 25, 27];
// Tanggal Cadangan: dipakai sebagai (a) pengganti Tanggal Prioritas yang
// jatuh Minggu/libur, dan (b) slot Analisis Standar untuk tanggal yang
// masih tersisa (belum kebagian Analisis apa pun) — sehingga satu hari
// maksimal hanya punya satu Analisis (Prioritas ATAU Standar, tidak
// pernah dua-duanya).
const ANALISIS_FALLBACK_DATES = [12, 14, 15, 16, 17, 26, 28, 29, 30, 31];

function analysisSortByOrder(a, b) {
  const ao = (a.order === null || a.order === undefined || a.order === '') ? Infinity : Number(a.order);
  const bo = (b.order === null || b.order === undefined || b.order === '') ? Infinity : Number(b.order);
  if (ao !== bo) return ao - bo;
  return (a.createdAtMs || 0) - (b.createdAtMs || 0);
}

// Menghitung jadwal Reminder Analisis (Prioritas & Standar) utk satu
// bulan tertentu. Tiap pengingat Analisis punya tanggal tetap pilihan
// sendiri (reminder.analisisDay, berulang tiap bulan) — Prioritas
// memilih dari ANALISIS_PRIORITY_DATES, Standar dari
// ANALISIS_FALLBACK_DATES (lihat dropdown "Tanggal Analisis" di form
// pengingat). Kalau tanggal pilihannya jatuh Minggu/libur nasional,
// ATAU sudah dipakai pengingat Analisis lain bulan ini, otomatis
// digeser ke Tanggal Cadangan berikutnya yang masih kosong — jadi satu
// hari tidak pernah punya 2 Analisis. Pengingat lama dari sebelum fitur
// pilih-tanggal ini ada (belum punya analisisDay) tetap didukung:
// disebar round-robin ke sisa tanggal yang belum terpakai.
function analysisSlotsForMonth(year, month) {
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const exists = (d) => d >= 1 && d <= daysInMonth;
  const isBlocked = (d) => {
    const dow = new Date(year, month, d).getDay(); // 0=Minggu
    if (dow === 0) return true;
    const key = dateKey(year, month, d);
    if (idHolidayName(key)) return true;
    if (isDayOff(key)) return true;
    return false;
  };
  const toSlot = (d) => ({ key: dateKey(year, month, d), day: d, dow: new Date(year, month, d).getDay(), items: [] });

  const usedDates = new Set();
  const slotsByDay = new Map();
  const getSlot = (d) => {
    if (!slotsByDay.has(d)) slotsByDay.set(d, toSlot(d));
    return slotsByDay.get(d);
  };
  const nextFallback = () => {
    for (const d of ANALISIS_FALLBACK_DATES) {
      if (exists(d) && !isBlocked(d) && !usedDates.has(d)) return d;
    }
    return null; // tanggal cadangan sudah habis bulan ini
  };

  const priorityItems = state.reminders.filter(r => r.analisis && r.priority === 'priority').sort(analysisSortByOrder);
  const standardItems = state.reminders.filter(r => r.analisis && r.priority !== 'priority').sort(analysisSortByOrder);

  const prioritySlotList = [];
  const standardSlotList = [];
  const undatedPriority = [];
  const undatedStandard = [];
  // Pengingat Analisis yang GAGAL dapat tanggal sama sekali bulan ini —
  // krn tanggal pilihannya & seluruh tanggal cadangan sudah habis
  // (jatuh Minggu/libur nasional/Libur-Cuti-Sakit, atau sudah dipakai
  // pengingat Analisis lain). Ditandai terpisah di modal supaya
  // kelihatan jelas, bukan cuma hilang diam-diam dari jadwal.
  const unscheduledPriority = [];
  const unscheduledStandard = [];

  const placeDated = (item, slotList, undatedBucket, unscheduledBucket) => {
    const wanted = Number(item.analisisDay) || null;
    if (!wanted) { undatedBucket.push(item); return; }
    const d = (exists(wanted) && !isBlocked(wanted) && !usedDates.has(wanted)) ? wanted : nextFallback();
    if (d == null) { unscheduledBucket.push(item); return; } // tidak ada slot tersisa bulan ini utk item ini
    usedDates.add(d);
    const slot = getSlot(d);
    slot.items.push(item);
    if (!slotList.includes(slot)) slotList.push(slot);
  };
  priorityItems.forEach(item => placeDated(item, prioritySlotList, undatedPriority, unscheduledPriority));
  standardItems.forEach(item => placeDated(item, standardSlotList, undatedStandard, unscheduledStandard));

  // Sisa tanggal (gabungan daftar Prioritas + Cadangan) yang masih
  // tersedia & belum terpakai — dipakai utk pengingat lama tanpa
  // analisisDay, round-robin, Prioritas kebagian duluan.
  const leftover = Array.from(new Set([...ANALISIS_PRIORITY_DATES, ...ANALISIS_FALLBACK_DATES]))
    .filter(d => exists(d) && !isBlocked(d) && !usedDates.has(d))
    .sort((a, b) => a - b);
  if (leftover.length > 0) {
    const undatedAll = [
      ...undatedPriority.map(it => ({ it, slotList: prioritySlotList })),
      ...undatedStandard.map(it => ({ it, slotList: standardSlotList })),
    ];
    undatedAll.forEach((entry, i) => {
      const d = leftover[i % leftover.length];
      const slot = getSlot(d);
      slot.items.push(entry.it);
      if (!entry.slotList.includes(slot)) entry.slotList.push(slot);
    });
  } else {
    // Tidak ada tanggal cadangan tersisa sama sekali bulan ini — pengingat
    // lama tanpa tanggal pilihan (analisisDay) ikut tidak kebagian jadwal.
    unscheduledPriority.push(...undatedPriority);
    unscheduledStandard.push(...undatedStandard);
  }

  const sortSlots = (list) => list.slice().sort((a, b) => a.day - b.day);
  return {
    prioritySlots: sortSlots(prioritySlotList),
    standardSlots: sortSlots(standardSlotList),
    priorityCount: priorityItems.length,
    standardCount: standardItems.length,
    unscheduledPriority,
    unscheduledStandard,
  };
}

function openAnalisisScheduleModal() {
  const { year, month } = state.calendarCursor;
  const backdrop = el(`<div class="modal-backdrop"><div class="modal" style="width:560px;">
    <button class="modal-close" id="close-modal" title="Tutup">${icon('close')}</button>

      <span class="info-popover-wrap">
        <button type="button" class="info-icon-btn" id="analisis-schedule-info-btn" title="Keterangan">${icon('info')}</button>
        <div class="info-popover" id="analisis-schedule-info-popover"></div>
      </span>
    </h3>
    <div id="analisis-schedule-body"><div class="upgrade-empty">Memuat data hari libur…</div></div>
  </div></div>`);
  document.body.appendChild(backdrop);
  backdrop.querySelector('#close-modal').addEventListener('click', () => backdrop.remove());
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) backdrop.remove(); });

  const infoBtn = backdrop.querySelector('#analisis-schedule-info-btn');
  const infoPopover = backdrop.querySelector('#analisis-schedule-info-popover');
  infoBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    const isOpen = infoPopover.classList.toggle('is-open');
    if (isOpen) {
      const closeOnOutsideClick = (evt) => {
        if (!infoPopover.contains(evt.target) && evt.target !== infoBtn) {
          infoPopover.classList.remove('is-open');
          document.removeEventListener('click', closeOnOutsideClick);
        }
      };
      // Ditunda 1 tick supaya klik yang membuka popover ini sendiri
      // tidak langsung terhitung sebagai "klik di luar" dan menutupnya.
      setTimeout(() => document.addEventListener('click', closeOnOutsideClick), 0);
    }
  });

  fetchOnlineHolidays().finally(() => {
    if (!document.body.contains(backdrop)) return; // modal sudah ditutup sebelum data siap
    renderAnalisisScheduleBody(backdrop, year, month);
  });
}

function renderAnalisisScheduleBody(backdrop, year, month) {
  const body = backdrop.querySelector('#analisis-schedule-body');
  if (!body) return;
  const { prioritySlots, standardSlots, priorityCount, standardCount, unscheduledPriority, unscheduledStandard } = analysisSlotsForMonth(year, month);

  const usingFallback = !state.onlineHolidays;
  const infoPopover = backdrop.querySelector('#analisis-schedule-info-popover');
  if (infoPopover) {
    infoPopover.textContent = `Tiap pengingat Analisis berulang tiap bulan di tanggal pilihannya sendiri (Prioritas: ${ANALISIS_PRIORITY_DATES.join(', ')}; Standar: ${ANALISIS_FALLBACK_DATES.join(', ')}). Kalau tanggal itu jatuh Minggu/libur nasional, ditandai Libur/Cuti/Sakit, atau bentrok pengingat lain, otomatis dipindah ke tanggal cadangan berikutnya yang masih kosong — satu hari maksimal satu Analisis. Kalau seluruh tanggal cadangan bulan ini juga sudah habis/terpakai, pengingat itu ditandai "Tidak terjadwal bulan ini" alih-alih hilang diam-diam.${usingFallback ? ' Data hari libur online gagal dimuat, memakai daftar cadangan bawaan aplikasi.' : ''}`;
  }

  if (priorityCount === 0 && standardCount === 0) {
    body.innerHTML = `<div class="upgrade-empty">Belum ada pengingat yang ditandai "Analisis".</div>`;
    return;
  }

  const prioritySectionHTML = `<div class="analisis-tier-heading">Prioritas</div>${priorityCount > 0 ? (prioritySlots.length > 0 ? analisisScheduleTableHTML(year, month, prioritySlots) : `<div class="upgrade-empty" style="padding:8px 0;">Tidak ada slot tanggal Prioritas tersedia bulan ini.</div>`) : `<div class="upgrade-empty" style="padding:8px 0;">Tidak ada pengingat Analisis berprioritas.</div>`}${analisisUnscheduledHTML(unscheduledPriority)}`;
  const standardSectionHTML = `<div class="analisis-tier-heading">Standar</div>${standardCount > 0 ? (standardSlots.length > 0 ? analisisScheduleTableHTML(year, month, standardSlots) : `<div class="upgrade-empty" style="padding:8px 0;">Tidak ada slot tanggal Standar tersisa bulan ini.</div>`) : `<div class="upgrade-empty" style="padding:8px 0;">Tidak ada pengingat Analisis standar.</div>`}${analisisUnscheduledHTML(unscheduledStandard)}`;
  body.innerHTML = prioritySectionHTML + standardSectionHTML;

  body.querySelectorAll('[data-reminder-check]').forEach(cb => {
    cb.addEventListener('change', async () => {
      try {
        const occurrenceDate = cb.dataset.reminderCheckDate;
        if (occurrenceDate) {
          await DB.setReminderDoneForDate(cb.dataset.reminderCheck, occurrenceDate, cb.checked);
        } else {
          await DB.setReminderDone(cb.dataset.reminderCheck, cb.checked);
        }
      } catch (err) {
        toast('Gagal memperbarui status: ' + err.message, 'error');
      }
    });
  });
  body.querySelectorAll('[data-reminder-edit]').forEach(btn => {
    btn.addEventListener('click', () => {
      const item = state.reminders.find(r => r.id === btn.dataset.reminderEdit);
      if (item) { backdrop.remove(); openReminderModal(item); }
    });
  });
  body.querySelectorAll('[data-reminder-delete]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const item = state.reminders.find(r => r.id === btn.dataset.reminderDelete);
      if (!item) return;
      if (!confirm(`Hapus pengingat "${item.title}"?`)) return;
      try {
        await DB.deleteReminder(item.id);
        toast('Pengingat dihapus', 'success');
      } catch (err) {
        toast('Gagal menghapus: ' + err.message, 'error');
      }
    });
  });
}

function analisisScheduleTableHTML(year, month, workdays) {
  const rowsHTML = [];
  workdays.forEach(w => {
    if (!w.items.length) return;
    const dayName = CAL_DOW_BY_JSDOW[w.dow];
    rowsHTML.push(`<tr class="reminder-group-row"><td colspan="3">${dayName}, ${w.day} ${CAL_MONTH_NAMES[month]} ${year}</td></tr>`);
    w.items.forEach(item => rowsHTML.push(reminderRowHTML(item, w.key)));
  });
  return `
    <div class="table-wrap">
      <table class="reminder-table">
        <tbody>${rowsHTML.join('')}</tbody>
      </table>
    </div>
  `;
}

// Blok peringatan utk pengingat Analisis yang tidak kebagian tanggal sama
// sekali bulan ini (lihat unscheduledPriority/unscheduledStandard di
// analysisSlotsForMonth) — biasanya krn tanggal pilihan & seluruh tanggal
// cadangan sudah kejatah hari libur/Libur-Cuti-Sakit, atau sudah dipakai
// pengingat Analisis lain duluan. Ditampilkan terpisah & mencolok (bukan
// hilang diam-diam) supaya kelihatan perlu ditinjau manual.
function analisisUnscheduledHTML(items) {
  if (!items || items.length === 0) return '';
  const rowsHTML = [`<tr class="reminder-group-row analisis-unscheduled-row"><td colspan="3">⚠ Tidak terjadwal bulan ini (${items.length})</td></tr>`]
    .concat(items.map(item => reminderRowHTML(item)));
  return `
    <div class="table-wrap analisis-unscheduled-wrap">
      <table class="reminder-table">
        <tbody>${rowsHTML.join('')}</tbody>
      </table>
    </div>
    <div class="analisis-unscheduled-note">Tanggal pilihan &amp; seluruh tanggal cadangan bulan ini sudah kejatah hari libur/Libur-Cuti-Sakit atau dipakai pengingat Analisis lain. Pindahkan tanggal pilihannya, tandai ulang Libur/Cuti/Sakit, atau biarkan — otomatis dicoba lagi bulan depan.</div>
  `;
}

// occurrenceDate: tanggal kemunculan spesifik baris ini (dipakai jadwal
// Reminder Analisis, tiap item punya tanggal pasti bulan berjalan) —
// kalau diisi, status "selesai" dibaca/disimpan PER TANGGAL itu
// (isReminderDoneOnDate/setReminderDoneForDate). Kalau kosong (dipakai
// Pending Reminder & item Analisis yang gagal terjadwal bulan ini),
// tetap pakai field `done` global lama karena tidak ada satu tanggal
// kemunculan pasti untuk dijadikan kunci.
function reminderRowHTML(item, occurrenceDate) {
  const repeat = item.repeat || 'none';
  const hasEndDate = !!item.endDate && item.endDate >= item.date;
  const showRepeatBadge = repeat !== 'none' || hasEndDate;
  const isDone = occurrenceDate ? isReminderDoneOnDate(item, occurrenceDate) : !!item.done;
  const dateAttr = occurrenceDate ? ` data-reminder-check-date="${occurrenceDate}"` : '';
  return `
    <tr class="reminder-row${isDone ? ' reminder-row-done' : ''}">
      <td class="reminder-col-check"><input type="checkbox" data-reminder-check="${item.id}"${dateAttr} ${isDone ? 'checked' : ''} title="Tandai selesai"></td>
      <td class="reminder-col-body">
        <div class="reminder-item-title" style="${isDone ? 'text-decoration:line-through;color:var(--slate-light);' : ''}">${item.time ? `<span class="reminder-item-time">${escapeHTML(item.time)}</span> ` : ''}${escapeHTML(item.title)}${showRepeatBadge ? ` <span class="reminder-item-repeat">↻ ${repeatDisplayLabel(item)}</span>` : ''}</div>
        ${item.description ? `<div class="reminder-item-desc">${escapeHTML(item.description)}</div>` : ''}
      </td>
      <td class="reminder-col-actions">
        <div class="reminder-item-actions">
          <button data-reminder-edit="${item.id}" title="Edit pengingat">${icon('edit')}</button>
          <button class="danger-action" data-reminder-delete="${item.id}" title="Hapus pengingat">${icon('trash')}</button>
        </div>
      </td>
    </tr>
  `;
}
